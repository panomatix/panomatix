<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Road signs database viewer</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>Road signs</h1>
  <select id="categorySelect"></select>
  <label><input type="checkbox" id="onePerCell" checked> One sign per cell</label>
  <span id="count"></span>
</header>

<main>
  <div id="tableWrap">
    <table id="table"></table>
  </div>
</main>

<div id="modal" hidden>
  <div id="modalContent">
    <button id="modalClose">&times;</button>
    <div id="modalBody"></div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
