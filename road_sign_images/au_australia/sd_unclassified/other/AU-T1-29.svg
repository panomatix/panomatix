<svg width="123.85" height="41.214" version="1.1" viewBox="82.992 45.607 362.8 132.93" xmlns="http://www.w3.org/2000/svg"><style type="text/css">/*
 * Below are Cascading Style Sheet (CSS) definitions in use in this file,
 * which allow easily changing how countries are displayed.
 *
 */

/*
 * Circles around small countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.circlexx
{
   opacity:1;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * Smaller circles around French DOMs and Chinese SARs
 *
 * Change opacity to 1 to display all subnational circles.
 *
 */
.subxx
{
   opacity:1;
   stroke-width:0.3;
}

/*
 * Circles around small, unrecognized countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.unxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.3;
}

/*
 * Circles around small countries, but with no permanent residents 
 *
 * Change opacity to 1 to display all circles.
 *
 */
.noxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * land
 */
.landxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.5;
   fill-rule:evenodd;
}

/*
 * Styles for coastlines of islands with no borders
 */
.coastxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.3;
   fill-rule:evenodd;
}

/*
 * Styles for nations with limited recognition
 */
.limitxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Styles for nations with no permanent population.
 */
.antxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Ocean
 */
.oceanxx
{
   opacity: 1;
   color: #000000;
   fill:#ffffff;
   stroke:#000;
   stroke-width:0.5;
   stroke-miterlimit:1;
}

/*
 * Additional style rules
 *
 * The following are examples of colouring countries.  You can substitute these with your own styles to colour the countries on the map.
 *
 * Color a few countries:
 *
 * .gb, .au, .nc
 * {
 *    fill:       #ff0000;
 * }
 *
 * Color a few small country circles (and the countries):
 *
 * .ms, .ky
 * {
 *    opacity:    1;
 *    fill:       #ff0000;
 * }
 *
 */

/* Same-sex marriage */
.ar, .be, .ca, .dk, .es, .is, .nl, .no, .pt, .se, .za
{ fill: #002255; }

/* Civil unions etc. */
.ad, .at, .au, .bl, .br, .ch, .co, .cz, .de, .ec, .fi, .fr, .gb, .gf, .gl, .hr, .hu, .ie, .im, .je, .li, .lu, .mf, .nc, .nf, .nz, .pm, .re, .si, .uy, .wf
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.aw, .cw, .il, .sx, .mx
{ fill: #7fbcff; }

/* Legal but no recognition */
.ai, .al, .am, .as, .az, .ba, .bg, .bf, .by, .bj, .bm, .bo, .bs, .cd, .cg, .cf, .ci, .cl, .cn, .cr, .cu, .cv, .cy, .dj, .do, .ee, .fk, .fj, .fm, .fo, .ga, .ge, .gg, .gi, .gq, .gr, .gs, .gt, .gu, .gw, .hn, .ht, .id, .in, .iq, .it, .jo, .jp, .kg, .kh, .kp, .kr, .ky, .kz, .la, .lk, .lt, .lv, .mc, .md, .me, .mg, .mh, .mk, .ml, .mn, .mp, .mt, .ms, .mz, .ne, .ni, .np, .pa, .pe, .pf, .ph, .pl, .pn, .pr, .py, .ro, .rs, .ru, .rw, .sh, .sk, .sm, .sr, .st, .sv, .tc, .td, .th, .tj, .tk, .tl, .tr, .tw, .ua, .us, .va, .ve, .vg, .vi, .vn, .vu, .xk, .ps_west_bank
{ fill: #cccccc; }

/* Illegal, minimal penalty */
.bt, .lb, .lr
{ fill: #f9dc36; }

/* Illegal, large penalty */
.ag, .ao, .bh, .bi, .bn, .bw, .bz, .cm, .ck, .dm, .dz, .eg, .eh, .er, .et, .gd, .gh, .gm, .gn, .jm, .ke, .ki, .km, .kn, .kw, .lc, .ls, .ly, .ma, .mu, .mv, .mw, .my, .na, .ng, .nr, .nu, .om, .pg, .pw, .qa, .sb, .sc, .sg, .sn, .so, .ss, .sy, .sz, .tg, .tm, .tn, .to, .tt, .tv, .uz, .vc, .ws, .zm, .zw, .xc, .ps_gaza_strip
{ fill: #ec8028; }

/* Illegal, life imprisonment */
.bb, .bd, .gy, .mm, .pk, .sl, .tz, .ug
{ fill: #e73e21; }

/* Illegal, death penalty */
.ae, .af, .ir, .mr, .sa, .sd, .ye
{ fill: #8c201f; }

/* SUB-NATIONAL UNITS */

/* Same-sex marriage */
.br_al, .mx_dif, .us_ct, .us_dc, .us_ia, .us_ma, .us_md, .us_nh, .us_ny, .us_vt, .us_wa
{ fill: #002255; }

/* Civil unions etc. */
.mx_coa, .uk_je, .us_ca, .us_co, .us_de, .us_hi, .us_il, .us_me, .us_nj, .us_nv, .us_or, .us_ri, .us_wi, .ve_l
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.bq
{ fill: #7fbcff; }

/* Illegal, large penalty */
.id_ac
{ fill: #ec8028; }

/* Illegal, death penalty */
.ng_sharia, .so_shabaab
{ fill: #8c201f; }</style><path d="m64.654 178.54h399.48v-132.93h-399.48v132.93z" fill="#000" fill-rule="nonzero"/><path d="m69.783 173.24h388.55v-122.38h-388.55v122.38z" fill="#fee011" fill-rule="nonzero"/><path d="m85.095 67.511h17.538c5.1606 0 9.6076 4.5518 9.6076 9.4988 0 2.2416-1.0321 5.6202-3.2375 7.0072 2.6327 2.0642 4.447 5.7291 4.447 9.144 0 5.2292-5.7654 9.9261-10.817 9.9261h-17.538v-35.576zm6.1202 13.732h10.458c2.2416 0 4.5518-1.9554 4.5518-4.0196 0-1.3869-1.4232-3.5237-3.5923-3.5237h-11.418v7.5434zm0 15.655h12.131c1.8143 0 3.9471-1.9231 3.9471-4.697 0-2.2416-3.0601-5.0155-5.3017-5.0155h-10.777v9.7124" fill="#000" fill-rule="evenodd"/><path d="m124.48 67.511h17.111c6.3701 0 10.781 5.1243 10.781 10.603 0 3.6286-2.3465 8.2852-6.1565 9.9221l6.6201 15.05h-6.6201l-6.3298-13.909h-9.3214v13.909h-6.0839v-35.576zm6.0839 6.0839v9.535h11.027c2.4553 0 4.6244-2.2416 4.6244-4.7333 0-1.6732-1.3869-4.8018-4.6244-4.8018h-11.027" fill="#000" fill-rule="evenodd"/><path d="m163.25 103.08h6.119v-35.576h-6.119v35.576z" fill="#000" fill-rule="nonzero"/><path d="m182.93 67.511h11.386c10.849 0 16.97 8.644 16.97 17.965 0 9.2165-6.0476 17.611-16.01 17.611h-12.345v-35.576zm6.1202 29.387h6.5072c5.9428 0 9.7487-5.9791 9.7487-11.422 0-6.0113-4.0559-11.777-10.172-11.777h-6.0839v23.199" fill="#000" fill-rule="evenodd"/><path d="m240.45 78.111c-1.4595-2.919-3.556-5.0155-7.3297-5.0155-5.9387 0-8.2167 6.475-8.2167 10.745 0 8.5029 2.5964 13.873 8.253 13.873 3.1649 0 7.6119-2.4553 7.6119-6.1565h-5.975v-6.2935h12.345v6.4024c0 3.0964-3.9511 12.103-14.018 12.103-10.531 0-14.337-9.3294-14.337-19.86 0-9.4625 5.9428-17.111 14.337-17.111 5.5154 0 11.099 3.806 13.022 9.0714l-5.6928 2.2416" fill="#000" fill-rule="evenodd"/><path d="m257.99 67.511h25.509v6.1887h-19.352v7.0797h10.458v6.1927h-10.458v9.9261h19.993v6.1887h-26.15v-35.576" fill="#000" fill-rule="evenodd"/><path d="m291.65 67.511h6.2613l4.0196 21.453 5.2654-21.453h6.0476l5.6202 21.667 3.8785-21.667h6.1564l-6.3338 35.576h-6.6886l-5.5154-22.308