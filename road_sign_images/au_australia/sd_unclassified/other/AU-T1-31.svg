<svg width="92.512" height="123.35" version="1.1" viewBox="82.992 45.607 270.99 397.85" xmlns="http://www.w3.org/2000/svg"><style type="text/css">/*
 * Below are Cascading Style Sheet (CSS) definitions in use in this file,
 * which allow easily changing how countries are displayed.
 *
 */

/*
 * Circles around small countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.circlexx
{
   opacity:1;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * Smaller circles around French DOMs and Chinese SARs
 *
 * Change opacity to 1 to display all subnational circles.
 *
 */
.subxx
{
   opacity:1;
   stroke-width:0.3;
}

/*
 * Circles around small, unrecognized countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.unxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.3;
}

/*
 * Circles around small countries, but with no permanent residents 
 *
 * Change opacity to 1 to display all circles.
 *
 */
.noxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * land
 */
.landxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.5;
   fill-rule:evenodd;
}

/*
 * Styles for coastlines of islands with no borders
 */
.coastxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.3;
   fill-rule:evenodd;
}

/*
 * Styles for nations with limited recognition
 */
.limitxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Styles for nations with no permanent population.
 */
.antxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Ocean
 */
.oceanxx
{
   opacity: 1;
   color: #000000;
   fill:#ffffff;
   stroke:#000;
   stroke-width:0.5;
   stroke-miterlimit:1;
}

/*
 * Additional style rules
 *
 * The following are examples of colouring countries.  You can substitute these with your own styles to colour the countries on the map.
 *
 * Color a few countries:
 *
 * .gb, .au, .nc
 * {
 *    fill:       #ff0000;
 * }
 *
 * Color a few small country circles (and the countries):
 *
 * .ms, .ky
 * {
 *    opacity:    1;
 *    fill:       #ff0000;
 * }
 *
 */

/* Same-sex marriage */
.ar, .be, .ca, .dk, .es, .is, .nl, .no, .pt, .se, .za
{ fill: #002255; }

/* Civil unions etc. */
.ad, .at, .au, .bl, .br, .ch, .co, .cz, .de, .ec, .fi, .fr, .gb, .gf, .gl, .hr, .hu, .ie, .im, .je, .li, .lu, .mf, .nc, .nf, .nz, .pm, .re, .si, .uy, .wf
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.aw, .cw, .il, .sx, .mx
{ fill: #7fbcff; }

/* Legal but no recognition */
.ai, .al, .am, .as, .az, .ba, .bg, .bf, .by, .bj, .bm, .bo, .bs, .cd, .cg, .cf, .ci, .cl, .cn, .cr, .cu, .cv, .cy, .dj, .do, .ee, .fk, .fj, .fm, .fo, .ga, .ge, .gg, .gi, .gq, .gr, .gs, .gt, .gu, .gw, .hn, .ht, .id, .in, .iq, .it, .jo, .jp, .kg, .kh, .kp, .kr, .ky, .kz, .la, .lk, .lt, .lv, .mc, .md, .me, .mg, .mh, .mk, .ml, .mn, .mp, .mt, .ms, .mz, .ne, .ni, .np, .pa, .pe, .pf, .ph, .pl, .pn, .pr, .py, .ro, .rs, .ru, .rw, .sh, .sk, .sm, .sr, .st, .sv, .tc, .td, .th, .tj, .tk, .tl, .tr, .tw, .ua, .us, .va, .ve, .vg, .vi, .vn, .vu, .xk, .ps_west_bank
{ fill: #cccccc; }

/* Illegal, minimal penalty */
.bt, .lb, .lr
{ fill: #f9dc36; }

/* Illegal, large penalty */
.ag, .ao, .bh, .bi, .bn, .bw, .bz, .cm, .ck, .dm, .dz, .eg, .eh, .er, .et, .gd, .gh, .gm, .gn, .jm, .ke, .ki, .km, .kn, .kw, .lc, .ls, .ly, .ma, .mu, .mv, .mw, .my, .na, .ng, .nr, .nu, .om, .pg, .pw, .qa, .sb, .sc, .sg, .sn, .so, .ss, .sy, .sz, .tg, .tm, .tn, .to, .tt, .tv, .uz, .vc, .ws, .zm, .zw, .xc, .ps_gaza_strip
{ fill: #ec8028; }

/* Illegal, life imprisonment */
.bb, .bd, .gy, .mm, .pk, .sl, .tz, .ug
{ fill: #e73e21; }

/* Illegal, death penalty */
.ae, .af, .ir, .mr, .sa, .sd, .ye
{ fill: #8c201f; }

/* SUB-NATIONAL UNITS */

/* Same-sex marriage */
.br_al, .mx_dif, .us_ct, .us_dc, .us_ia, .us_ma, .us_md, .us_nh, .us_ny, .us_vt, .us_wa
{ fill: #002255; }

/* Civil unions etc. */
.mx_coa, .uk_je, .us_ca, .us_co, .us_de, .us_hi, .us_il, .us_me, .us_nj, .us_nv, .us_or, .us_ri, .us_wi, .ve_l
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.bq
{ fill: #7fbcff; }

/* Illegal, large penalty */
.id_ac
{ fill: #ec8028; }

/* Illegal, death penalty */
.ng_sharia, .so_shabaab
{ fill: #8c201f; }</style><path d="m69.295 443.46h298.39v-397.85h-298.39v397.85z" fill="#000" fill-rule="nonzero"/><path d="m77.584 435.17h281.81v-381.27h-281.81v381.27z" fill="#fee011" fill-rule="nonzero"/><path d="m102.39 98.072h28.706c10.68 0 18.082 8.5916 18.082 17.784 0 6.0879-3.939 13.905-10.325 16.651l11.099 25.243h-11.099l-10.624-23.336h-15.635v23.336h-10.204v-59.678zm10.204 10.204v15.994h18.502c4.1164 0 7.757-3.7616 7.757-7.9385 0-2.802-2.3263-8.0554-7.757-8.0554h-18.502" fill="#000" fill-rule="evenodd"/><path d="m183.01 148.56c9.6681 0 14.563-9.3093 14.563-20.646 0-11.402-5.1324-20.711-14.563-20.711-9.4302 0-14.563 9.3093-14.563 20.711 0 11.337 4.8945 20.646 14.563 20.646zm0 10.333c-16.47 0-24.706-13.914-24.706-30.98 0-17.07 8.6521-31.032 24.706-31.032 16.054 0 24.706 13.962 24.706 31.032 0 17.066-8.2368 30.98-24.706 30.98" fill="#000" fill-rule="evenodd"/><path d="m240.54 98.072h9.9664l25.065 59.678h-11.22l-5.7291-13.905h-25.9l-5.85 13.905h-10.978l24.646-59.678zm-3.7576 35.507h17.542l-8.7126-21.187-8.8295 21.187" fill="#000" fill-rule="evenodd"/><path d="m287.02 98.072h19.098c18.199 0 28.464 14.502 28.464 30.137 0 15.458-10.144 29.54-26.855 29.54h-20.707v-59.678zm10.265 49.292h10.922c9.9664 0 16.349-10.023 16.349-19.155 0-10.087-6.8015-19.751-17.066-19.751h-10.204v38.906" fill="#000" fill-rule="evenodd"/><path d="m98.775 215.89h10.503l6.7451 35.983 8.8295-35.983h10.148l9.4262 36.342 6.5072-36.342h10.321l-10.62 59.678h-11.22l-9.2488-37.418-9.4302 37.418h-10.922l-11.039-59.678" fill="#000" fill-rule="evenodd"/><path d="m194.14 266.37c9.6681 0 14.563-9.3093 14.563-20.646 0-11.402-5.1324-20.711-14.563-20.711s-14.563 9.3093-14.563 20.711c0 11.337 4.8945 20.646 14.563 20.646zm0 10.333c-16.47 0-24.706-13.914-24.706-30.98 0-17.07 8.6521-31.032 24.706-31.032 16.054 0 24.706 13.962 24.706 31.032 0 17.066-8.2368 30.98-24.706 30.98" fill="#000" fill-rule="evenodd"/><path d="m230.54 215.89h28.706c10.68 0 18.082 8.5916 18.082 17.784 0 6.0879-3.939 13.905-10.325 16.651l11.099 25.243h-11.099l-10.624-23.336h-15.635v23.336h-10.204v-59.678zm10.204 10.204v15.994h18.502c4.1164 0 7.757-3.7616 7.757-7.9385 0-2.8021-2.3263-8.0554-7.757-8.0554h-18.502" fill="#000" fill-rule="evenodd"/><path d="m289.74 215.89h10.027v26.734l20.945-26.734h13.01l-15.276 19.751 19.751 39.926h-11.281l-15.337-30.972-11.813 14.321v16.651h-10.027v-59.678" fill="#000" fill-rule="evenodd"/><path d="m109.37 332.5-20.171 59.617h9.9664l5.4307-16.828h19.094l5.7896 16.828h9.6681l-20.409-59.617h-9.3697zm10.801 33.48h-12.172l5.967-17.784 6.2048 17.784" fill="#000" fill-rule="evenodd"/><path d="m149.47 332.5h9.1883v23.63h21.546v-23.63h9.3697v59.678h-9.3697v-26.138h-21.546v26.138h-9.1883v-59.678" fill="#000" fill-rule="evenodd"/><path d="m203.36 332.5h34.193v9.5471h-24.944v14.684h17.425v9.3093h-17.425v16.828h27.154v9.3093h-36.402v-59.678" fill="#000" fill-rule="evenodd"/><path d="m267.63 332.5-20.171 59.617h9.9664l5.4308-16.828h19.094l5.7896 16.828h9.6681l-20.409-59.617h-9.3697zm10.801 33.48h-12.172l5.967-17.784 6.2048 17.784" fill="#000" fill-rule="evenodd"/><path d="m307.74 332.5h16.708c14.744 0 23.396 12.889 23.396 30.972 0 13.01-8.0554 28.706-23.396 28.706h-16.708v-59.678zm9.4867 50.01h6.866c11.16 0 14.498-12.889 14.498-19.038 0-8.4142-2.802-21.662-14.498-21.662h-6.866v40.7" fill="#000" fill-rule="evenodd"/></svg>
