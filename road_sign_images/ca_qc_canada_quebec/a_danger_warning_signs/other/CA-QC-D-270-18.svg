<svg width="245.54" height="245.43" version="1.1" viewBox="82.992 45.607 719.26 791.62" xmlns="http://www.w3.org/2000/svg"><style type="text/css">/*
 * Below are Cascading Style Sheet (CSS) definitions in use in this file,
 * which allow easily changing how countries are displayed.
 *
 */

/*
 * Circles around small countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.circlexx
{
   opacity:1;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * Smaller circles around French DOMs and Chinese SARs
 *
 * Change opacity to 1 to display all subnational circles.
 *
 */
.subxx
{
   opacity:1;
   stroke-width:0.3;
}

/*
 * Circles around small, unrecognized countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.unxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.3;
}

/*
 * Circles around small countries, but with no permanent residents 
 *
 * Change opacity to 1 to display all circles.
 *
 */
.noxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * land
 */
.landxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.5;
   fill-rule:evenodd;
}

/*
 * Styles for coastlines of islands with no borders
 */
.coastxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.3;
   fill-rule:evenodd;
}

/*
 * Styles for nations with limited recognition
 */
.limitxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Styles for nations with no permanent population.
 */
.antxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Ocean
 */
.oceanxx
{
   opacity: 1;
   color: #000000;
   fill:#ffffff;
   stroke:#000;
   stroke-width:0.5;
   stroke-miterlimit:1;
}

/*
 * Additional style rules
 *
 * The following are examples of colouring countries.  You can substitute these with your own styles to colour the countries on the map.
 *
 * Color a few countries:
 *
 * .gb, .au, .nc
 * {
 *    fill:       #ff0000;
 * }
 *
 * Color a few small country circles (and the countries):
 *
 * .ms, .ky
 * {
 *    opacity:    1;
 *    fill:       #ff0000;
 * }
 *
 */

/* Same-sex marriage */
.ar, .be, .ca, .dk, .es, .is, .nl, .no, .pt, .se, .za
{ fill: #002255; }

/* Civil unions etc. */
.ad, .at, .au, .bl, .br, .ch, .co, .cz, .de, .ec, .fi, .fr, .gb, .gf, .gl, .hr, .hu, .ie, .il, .im, .je, .li, .lu, .mf, .nc, .nf, .nz, .pm, .re, .si, .uy, .wf
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.aw, .cw, .sx, .mx
{ fill: #7fbcff; }

/* Legal but no recognition */
.ai, .al, .am, .as, .az, .ba, .bg, .bf, .by, .bj, .bm, .bo, .bs, .cd, .cg, .cf, .ci, .cl, .cn, .cr, .cu, .cv, .cy, .dj, .do, .ee, .fk, .fj, .fm, .fo, .ga, .ge, .gg, .gi, .gq, .gr, .gs, .gt, .gu, .gw, .hn, .ht, .id, .in, .iq, .it, .jo, .jp, .kg, .kh, .kp, .kr, .ky, .kz, .la, .lk, .lt, .lv, .mc, .md, .me, .mg, .mh, .mk, .ml, .mn, .mp, .mt, .ms, .mz, .ne, .ni, .np, .pa, .pe, .pf, .ph, .pl, .pn, .pr, .py, .ro, .rs, .ru, .rw, .sh, .sk, .sm, .sr, .st, .sv, .tc, .td, .th, .tj, .tk, .tl, .tr, .tw, .ua, .us, .va, .ve, .vg, .vi, .vn, .vu, .xk, .ps_west_bank
{ fill: #cccccc; }

/* Illegal, minimal penalty */
.bt, .lb, .lr
{ fill: #f9dc36; }

/* Illegal, large penalty */
.ag, .ao, .bh, .bi, .bn, .bw, .bz, .cm, .ck, .dm, .dz, .eg, .eh, .er, .et, .gd, .gh, .gm, .gn, .jm, .ke, .ki, .km, .kn, .kw, .lc, .ls, .ly, .ma, .mu, .mv, .mw, .my, .na, .ng, .nr, .nu, .om, .pg, .pw, .qa, .sb, .sc, .sg, .sn, .so, .ss, .sy, .sz, .tg, .tm, .tn, .to, .tt, .tv, .uz, .vc, .ws, .zm, .zw, .xc, .ps_gaza_strip
{ fill: #ec8028; }

/* Illegal, life imprisonment */
.bb, .bd, .gy, .mm, .pk, .sl, .tz, .ug
{ fill: #e73e21; }

/* Illegal, death penalty */
.ae, .af, .ir, .mr, .sa, .sd, .ye
{ fill: #8c201f; }

/* SUB-NATIONAL UNITS */

/* Same-sex marriage */
.br_al, .mx_dif, .us_ct, .us_dc, .us_ia, .us_ma, .us_md, .us_nh, .us_ny, .us_vt, .us_wa
{ fill: #002255; }

/* Civil unions etc. */
.mx_coa, .uk_je, .us_ca, .us_co, .us_de, .us_hi, .us_il, .us_me, .us_nj, .us_nv, .us_or, .us_ri, .us_wi, .ve_l
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.bq
{ fill: #7fbcff; }

/* Illegal, large penalty */
.id_ac
{ fill: #ec8028; }

/* Illegal, death penalty */
.ng_sharia, .so_shabaab
{ fill: #8c201f; }</style><path d="m829.36 419.88c11.511 11.509 11.414 32.549 0 43.955l-364.52 364.52c-11.003 11.035-33.06 10.886-43.95 0l-364.52-364.52c-12.115-12.115-12.115-31.836 0-43.955l364.52-364.52c12.146-12.146 31.839-12.146 43.95 0l364.52 364.52z" fill="#ffd520" fill-rule="evenodd"/><path d="m824.84 424.46c9.6197 9.6342 9.6197 25.165 0 34.767l-364.55 364.59c-9.5709 9.5713-25.196 9.6197-34.818 0l-364.52-364.54c-9.6029-9.5862-9.6029-25.244 0-34.831l364.56-364.55c9.587-9.6068 25.212-9.5556 34.783 0.0158l364.55 364.55z" fill="#000" fill-rule="evenodd"/><path d="m816.77 432.53c5.1566 5.1542 5.1566 13.454 0 18.658l-364.55 364.55c-5.128 5.1364-13.506 5.1364-18.664 0l-364.55-364.55c-5.1224-5.1256-5.1224-13.504 0-18.658l364.55-364.55c5.126-5.1735 13.536-5.142 18.664 0l364.55 364.55z" fill="#ffd520" fill-rule="evenodd"/><path d="m517.15 280.09c-11.809 8.3312-20.477 21.072-22.554 35.494l43.772-0.0197-21.219-35.474zm-50.538 35.502 14.595 0.11008c2.1933-19.926 13.438-37.136 29.532-47.396l-14.159-24.344-29.968 71.63zm97.919-40.38c-11.68-4.5438-24.876-4.7683-37.088-0.0476l24.844 43.03c2.286 3.6733-0.72571 9.2798-5.0114 8.7013l-52.844 0.0158c2.1288 26.293 24.182 47.027 51.026 47.027 28.254 0 51.199-22.958 51.199-51.2 0-21.509-13.309-39.955-32.125-47.526zm-211.53-2.0671c-11.744-2.8823-24.312-1.772-34.864 3.6064-16.592 8.461-28.258 24.698-28.706 46.097-0.61443 28.195 22.938 51.196 51.196 51.196 28.258 0 51.2-22.938 51.2-51.196 0-20.123-11.052-37.412-28.872-45.936l-17.414 47.905c-0.98051 3.0436-4.2998 4.6655-7.3115 3.5592-2.9492-1.0986-4.4454-4.3664-3.323-7.3192l18.095-47.912zm192.28 114.35c34.879 0 64.653-28.096 64.653-64.649 0-35.687-28.968-64.653-64.653-64.653-8.8779 0-17.32 1.7913-25.005 5.0276l-18.252-32.254 2.8666-6.4294c9.4746-0.52775 17.756-8.284 18.816-17.607h-49.425c-3.8987-0.0313-3.8987 4.1224-1.274 4.9296l20.671 9.7919-3.8664 9.0714h-110.1c2.4174-10.249-2.8194-21.655-12.261-26.261-1.8187-0.89746-1.0982-4.4764 1.8703-4.1894l23.053 2.2759 3.8193-10.316-27.226-3.075c