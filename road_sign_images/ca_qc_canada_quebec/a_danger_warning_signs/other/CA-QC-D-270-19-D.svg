<svg width="246.28" height="246.35" version="1.1" viewBox="82.992 45.607 721.41 794.58" xmlns="http://www.w3.org/2000/svg"><style type="text/css">/*
 * Below are Cascading Style Sheet (CSS) definitions in use in this file,
 * which allow easily changing how countries are displayed.
 *
 */

/*
 * Circles around small countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.circlexx
{
   opacity:1;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * Smaller circles around French DOMs and Chinese SARs
 *
 * Change opacity to 1 to display all subnational circles.
 *
 */
.subxx
{
   opacity:1;
   stroke-width:0.3;
}

/*
 * Circles around small, unrecognized countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.unxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.3;
}

/*
 * Circles around small countries, but with no permanent residents 
 *
 * Change opacity to 1 to display all circles.
 *
 */
.noxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * land
 */
.landxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.5;
   fill-rule:evenodd;
}

/*
 * Styles for coastlines of islands with no borders
 */
.coastxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.3;
   fill-rule:evenodd;
}

/*
 * Styles for nations with limited recognition
 */
.limitxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Styles for nations with no permanent population.
 */
.antxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Ocean
 */
.oceanxx
{
   opacity: 1;
   color: #000000;
   fill:#ffffff;
   stroke:#000;
   stroke-width:0.5;
   stroke-miterlimit:1;
}

/*
 * Additional style rules
 *
 * The following are examples of colouring countries.  You can substitute these with your own styles to colour the countries on the map.
 *
 * Color a few countries:
 *
 * .gb, .au, .nc
 * {
 *    fill:       #ff0000;
 * }
 *
 * Color a few small country circles (and the countries):
 *
 * .ms, .ky
 * {
 *    opacity:    1;
 *    fill:       #ff0000;
 * }
 *
 */

/* Same-sex marriage */
.ar, .be, .ca, .dk, .es, .is, .nl, .no, .pt, .se, .za
{ fill: #002255; }

/* Civil unions etc. */
.ad, .at, .au, .bl, .br, .ch, .co, .cz, .de, .ec, .fi, .fr, .gb, .gf, .gl, .hr, .hu, .ie, .il, .im, .je, .li, .lu, .mf, .nc, .nf, .nz, .pm, .re, .si, .uy, .wf
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.aw, .cw, .sx, .mx
{ fill: #7fbcff; }

/* Legal but no recognition */
.ai, .al, .am, .as, .az, .ba, .bg, .bf, .by, .bj, .bm, .bo, .bs, .cd, .cg, .cf, .ci, .cl, .cn, .cr, .cu, .cv, .cy, .dj, .do, .ee, .fk, .fj, .fm, .fo, .ga, .ge, .gg, .gi, .gq, .gr, .gs, .gt, .gu, .gw, .hn, .ht, .id, .in, .iq, .it, .jo, .jp, .kg, .kh, .kp, .kr, .ky, .kz, .la, .lk, .lt, .lv, .mc, .md, .me, .mg, .mh, .mk, .ml, .mn, .mp, .mt, .ms, .mz, .ne, .ni, .np, .pa, .pe, .pf, .ph, .pl, .pn, .pr, .py, .ro, .rs, .ru, .rw, .sh, .sk, .sm, .sr, .st, .sv, .tc, .td, .th, .tj, .tk, .tl, .tr, .tw, .ua, .us, .va, .ve, .vg, .vi, .vn, .vu, .xk, .ps_west_bank
{ fill: #cccccc; }

/* Illegal, minimal penalty */
.bt, .lb, .lr
{ fill: #f9dc36; }

/* Illegal, large penalty */
.ag, .ao, .bh, .bi, .bn, .bw, .bz, .cm, .ck, .dm, .dz, .eg, .eh, .er, .et, .gd, .gh, .gm, .gn, .jm, .ke, .ki, .km, .kn, .kw, .lc, .ls, .ly, .ma, .mu, .mv, .mw, .my, .na, .ng, .nr, .nu, .om, .pg, .pw, .qa, .sb, .sc, .sg, .sn, .so, .ss, .sy, .sz, .tg, .tm, .tn, .to, .tt, .tv, .uz, .vc, .ws, .zm, .zw, .xc, .ps_gaza_strip
{ fill: #ec8028; }

/* Illegal, life imprisonment */
.bb, .bd, .gy, .mm, .pk, .sl, .tz, .ug
{ fill: #e73e21; }

/* Illegal, death penalty */
.ae, .af, .ir, .mr, .sa, .sd, .ye
{ fill: #8c201f; }

/* SUB-NATIONAL UNITS */

/* Same-sex marriage */
.br_al, .mx_dif, .us_ct, .us_dc, .us_ia, .us_ma, .us_md, .us_nh, .us_ny, .us_vt, .us_wa
{ fill: #002255; }

/* Civil unions etc. */
.mx_coa, .uk_je, .us_ca, .us_co, .us_de, .us_hi, .us_il, .us_me, .us_nj, .us_nv, .us_or, .us_ri, .us_wi, .ve_l
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.bq
{ fill: #7fbcff; }

/* Illegal, large penalty */
.id_ac
{ fill: #ec8028; }

/* Illegal, death penalty */
.ng_sharia, .so_shabaab
{ fill: #8c201f; }</style><path d="m831.24 420.23c12.031 12.028 11.914 33.645 0.0161 45.542l-364.54 364.54c-12.228 12.228-33.223 12.394-45.562 0.0161l-364.54-364.54c-12.583-12.567-12.583-32.995 0-45.559l364.54-364.58c12.599-12.564 32.995-12.516 45.562 0.0512l364.52 364.53z" fill="#ffd520" fill-rule="evenodd"/><path d="m825.87 425.61c9.6197 9.6346 9.6197 25.168 0 34.767l-364.56 364.59c-9.5689 9.5713-25.196 9.6197-34.814 0l-364.52-364.54c-9.6068-9.5866-9.6068-25.244 0-34.831l364.55-364.56c9.587-9.6029 25.214-9.5517 34.783 0.0197l364.56 364.55z" fill="#000" fill-rule="evenodd"/><path d="m817.8 433.68c5.1566 5.1538 5.1566 13.452 0 18.657l-364.55 364.55c-5.124 5.1405-13.504 5.1405-18.658 0l-364.55-364.55c-5.1263-5.1243-5.1263-13.503 0-18.657l364.55-364.55c5.1223-5.1735 13.534-5.142 18.658 0l364.55 364.55z" fill="#ffd520" fill-rule="evenodd"/><path d="m520.8 269.91c-11.809 8.3271-20.477 21.068-22.554 35.49l43.772-0.0158-21.219-35.474zm-50.538 35.498 14.595 0.1145c2.1933-19.93 13.438-37.136 29.532-47.397l-14.159-24.344-29.968 71.626zm97.919-40.089c-11.684-4.5438-24.876-4.7679-37.088-0.0472l24.844 43.03c2.286 3.6737-0.72571 9.2843-5.0114 8.7013l-52.844 0.0158c2.1247 26.293 24.182 47.027 51.022 47.027 28.258 0 51.203-22.954 51.203-51.2 0-21.509-13.309-39.955-32.125-47.526zm-211.53-2.3545c-11.745-2.8859-24.313-1.772-34.864 3.6064-16.591 8.4574-28.258 24.698-28.706 46.094-0.61404 28.194 22.939 51.2 51.196 51.2 28.258 0 51.2-22.943 51.2-51.2 0-20.12-11.052-37.408-28.872-45.932l-17.414 47.9c-0.98052 3.0436-4.2994 4.6696-7.3116 3.5592-2.9528-1.0942-4.445-4.3664-3.323-7.3152l18.096-47.912zm192.28 114.35c34.879 0 64.653-28.096 64.653-64.653 0-35.683-28.968-64.65-64.653-64.65-8.8779 0-17.32 1.7877-25.005 5.0239l-18.252-32.254 2.8666-6.4294c9.4746-0.52775 17.756-8.28 18.816-17.607h-49.425c-3.9027-0.0316-3.9027 4.1261-1.274 4.9332l20.671 9.7919-3.8664 9.0714h-110.1c2.4174-10.249-2.819-21.655-12.26-26.261-1.8191-0.9015-1.0986-4.4764 1.8703-4.189l23.052 2.2719 3.8193-10.312-27.226-3.078