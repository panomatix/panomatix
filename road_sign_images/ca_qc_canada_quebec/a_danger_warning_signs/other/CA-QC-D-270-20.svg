<svg width="178.35" height="177.51" version="1.1" viewBox="82.992 45.607 522.44 572.55" xmlns="http://www.w3.org/2000/svg"><style type="text/css">/*
 * Below are Cascading Style Sheet (CSS) definitions in use in this file,
 * which allow easily changing how countries are displayed.
 *
 */

/*
 * Circles around small countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.circlexx
{
   opacity:1;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * Smaller circles around French DOMs and Chinese SARs
 *
 * Change opacity to 1 to display all subnational circles.
 *
 */
.subxx
{
   opacity:1;
   stroke-width:0.3;
}

/*
 * Circles around small, unrecognized countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.unxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.3;
}

/*
 * Circles around small countries, but with no permanent residents 
 *
 * Change opacity to 1 to display all circles.
 *
 */
.noxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * land
 */
.landxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.5;
   fill-rule:evenodd;
}

/*
 * Styles for coastlines of islands with no borders
 */
.coastxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.3;
   fill-rule:evenodd;
}

/*
 * Styles for nations with limited recognition
 */
.limitxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Styles for nations with no permanent population.
 */
.antxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Ocean
 */
.oceanxx
{
   opacity: 1;
   color: #000000;
   fill:#ffffff;
   stroke:#000;
   stroke-width:0.5;
   stroke-miterlimit:1;
}

/*
 * Additional style rules
 *
 * The following are examples of colouring countries.  You can substitute these with your own styles to colour the countries on the map.
 *
 * Color a few countries:
 *
 * .gb, .au, .nc
 * {
 *    fill:       #ff0000;
 * }
 *
 * Color a few small country circles (and the countries):
 *
 * .ms, .ky
 * {
 *    opacity:    1;
 *    fill:       #ff0000;
 * }
 *
 */

/* Same-sex marriage */
.ar, .be, .ca, .dk, .es, .is, .nl, .no, .pt, .se, .za
{ fill: #002255; }

/* Civil unions etc. */
.ad, .at, .au, .bl, .br, .ch, .co, .cz, .de, .ec, .fi, .fr, .gb, .gf, .gl, .hr, .hu, .ie, .il, .im, .je, .li, .lu, .mf, .nc, .nf, .nz, .pm, .re, .si, .uy, .wf
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.aw, .cw, .sx, .mx
{ fill: #7fbcff; }

/* Legal but no recognition */
.ai, .al, .am, .as, .az, .ba, .bg, .bf, .by, .bj, .bm, .bo, .bs, .cd, .cg, .cf, .ci, .cl, .cn, .cr, .cu, .cv, .cy, .dj, .do, .ee, .fk, .fj, .fm, .fo, .ga, .ge, .gg, .gi, .gq, .gr, .gs, .gt, .gu, .gw, .hn, .ht, .id, .in, .iq, .it, .jo, .jp, .kg, .kh, .kp, .kr, .ky, .kz, .la, .lk, .lt, .lv, .mc, .md, .me, .mg, .mh, .mk, .ml, .mn, .mp, .mt, .ms, .mz, .ne, .ni, .np, .pa, .pe, .pf, .ph, .pl, .pn, .pr, .py, .ro, .rs, .ru, .rw, .sh, .sk, .sm, .sr, .st, .sv, .tc, .td, .th, .tj, .tk, .tl, .tr, .tw, .ua, .us, .va, .ve, .vg, .vi, .vn, .vu, .xk, .ps_west_bank
{ fill: #cccccc; }

/* Illegal, minimal penalty */
.bt, .lb, .lr
{ fill: #f9dc36; }

/* Illegal, large penalty */
.ag, .ao, .bh, .bi, .bn, .bw, .bz, .cm, .ck, .dm, .dz, .eg, .eh, .er, .et, .gd, .gh, .gm, .gn, .jm, .ke, .ki, .km, .kn, .kw, .lc, .ls, .ly, .ma, .mu, .mv, .mw, .my, .na, .ng, .nr, .nu, .om, .pg, .pw, .qa, .sb, .sc, .sg, .sn, .so, .ss, .sy, .sz, .tg, .tm, .tn, .to, .tt, .tv, .uz, .vc, .ws, .zm, .zw, .xc, .ps_gaza_strip
{ fill: #ec8028; }

/* Illegal, life imprisonment */
.bb, .bd, .gy, .mm, .pk, .sl, .tz, .ug
{ fill: #e73e21; }

/* Illegal, death penalty */
.ae, .af, .ir, .mr, .sa, .sd, .ye
{ fill: #8c201f; }

/* SUB-NATIONAL UNITS */

/* Same-sex marriage */
.br_al, .mx_dif, .us_ct, .us_dc, .us_ia, .us_ma, .us_md, .us_nh, .us_ny, .us_vt, .us_wa
{ fill: #002255; }

/* Civil unions etc. */
.mx_coa, .uk_je, .us_ca, .us_co, .us_de, .us_hi, .us_il, .us_me, .us_nj, .us_nv, .us_or, .us_ri, .us_wi, .ve_l
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.bq
{ fill: #7fbcff; }

/* Illegal, large penalty */
.id_ac
{ fill: #ec8028; }

/* Illegal, death penalty */
.ng_sharia, .so_shabaab
{ fill: #8c201f; }</style><path d="m331.9 612.53c6.8136 6.6362 17.816 6.6362 24.634 0l269.55-268.51c6.8136-6.6382 6.8136-17.643 0-24.281l-269.55-268.51c-6.8177-6.6382-17.82-6.6382-24.634 0l-269.55 268.51c-6.8177 6.6378-6.8177 17.642 0 24.281l269.55 268.51z" fill="#ffd520" fill-rule="evenodd"/><path d="m335.91 608.51c2.2739 2.2699 5.0679 3.4955 8.386 3.4955 3.1448 0 5.9387-1.2256 8.2126-3.4955l269.55-268.33c2.4432-2.2719 3.4915-5.0671 3.4915-8.3864 0-3.1419-1.0482-5.9371-3.4915-8.209l-269.55-268.33c-2.2739-2.2678-5.0679-3.4924-8.2126-3.4924-3.3181 0-6.1121 1.2245-8.386 3.4924l-269.55 268.33c-2.4473 2.2719-3.4915 5.0671-3.4915 8.209 0 3.3193 1.0442 6.1145 3.4915 8.3864l269.55 268.33z" fill="#000" fill-rule="evenodd"/><path d="m341.68 602.74c0.70152 0.7015 1.5764 1.0522 2.6206 1.0522 0.87489 0 1.7457-0.3507 2.4473-1.0522l269.55-268.51c0.69749-0.52372 1.0482-1.3978 1.0482-2.2678 0-1.0515-0.35076-1.9256-1.0482-2.4493l-269.55-268.5c-0.70152-0.70084-1.5724-1.0512-2.4473-1.0512-1.0442 0-1.9191 0.3504-2.4432 1.0512l-269.73 268.5c-0.70152 0.52372-1.0523 1.3978-1.0523 2.4493 0 0.87005 0.35076 1.7441 1.0523 2.2678l269.55 268.51z" fill="#ffd520" fill-rule="evenodd"/><path d="m399.33 216.32 15.192 25.328h-31.266c1.395-10.308 7.6885-19.391 16.075-25.328zm-36.342 25.328 21.489-51.184 10.132 17.469c-11.527 7.3349-19.566 19.564-21.134 33.892l-10.487-0.1774zm70.229-28.647c13.454 5.2408 23.062 18.517 23.062 33.888 0 20.092-16.421 36.514-36.689 36.514-19.215 0-35.112-14.851-36.685-33.542h37.91c3.1407 0.34673 5.2412-3.6693 3.6648-6.2915l-17.816-30.746c8.7327-3.3189 18.167-3.1419 26.553 0.17701zm-151.81-1.5748-12.926 34.065c-0.69749 2.0985 0.35076 4.5438 2.4473 5.2445 2.0965 0.87005 4.5397-0.35036 5.2372-2.4489l12.406-34.238c12.752 6.1145 20.788 18.344 20.788 32.84 0 20.092-16.421 36.514-36.685 36.514-20.268 0-37.213-16.422-36.862-36.514 0.35076-15.371 8.7368-26.903 20.614-33.017 7.6885-3.843 16.599-4.5397 24.981-2.4452zm16.248-20.788 0.70152-1.9215h78.437l-21.138 51.011-58-49.09zm121.94 