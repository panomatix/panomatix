<svg width="245.71" height="245.7" version="1.1" viewBox="82.992 45.607 719.75 792.48" xmlns="http://www.w3.org/2000/svg"><style type="text/css">/*
 * Below are Cascading Style Sheet (CSS) definitions in use in this file,
 * which allow easily changing how countries are displayed.
 *
 */

/*
 * Circles around small countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.circlexx
{
   opacity:1;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * Smaller circles around French DOMs and Chinese SARs
 *
 * Change opacity to 1 to display all subnational circles.
 *
 */
.subxx
{
   opacity:1;
   stroke-width:0.3;
}

/*
 * Circles around small, unrecognized countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.unxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.3;
}

/*
 * Circles around small countries, but with no permanent residents 
 *
 * Change opacity to 1 to display all circles.
 *
 */
.noxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * land
 */
.landxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.5;
   fill-rule:evenodd;
}

/*
 * Styles for coastlines of islands with no borders
 */
.coastxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.3;
   fill-rule:evenodd;
}

/*
 * Styles for nations with limited recognition
 */
.limitxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Styles for nations with no permanent population.
 */
.antxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Ocean
 */
.oceanxx
{
   opacity: 1;
   color: #000000;
   fill:#ffffff;
   stroke:#000;
   stroke-width:0.5;
   stroke-miterlimit:1;
}

/*
 * Additional style rules
 *
 * The following are examples of colouring countries.  You can substitute these with your own styles to colour the countries on the map.
 *
 * Color a few countries:
 *
 * .gb, .au, .nc
 * {
 *    fill:       #ff0000;
 * }
 *
 * Color a few small country circles (and the countries):
 *
 * .ms, .ky
 * {
 *    opacity:    1;
 *    fill:       #ff0000;
 * }
 *
 */

/* Same-sex marriage */
.ar, .be, .ca, .dk, .es, .is, .nl, .no, .pt, .se, .za
{ fill: #002255; }

/* Civil unions etc. */
.ad, .at, .au, .bl, .br, .ch, .co, .cz, .de, .ec, .fi, .fr, .gb, .gf, .gl, .hr, .hu, .ie, .il, .im, .je, .li, .lu, .mf, .nc, .nf, .nz, .pm, .re, .si, .uy, .wf
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.aw, .cw, .sx, .mx
{ fill: #7fbcff; }

/* Legal but no recognition */
.ai, .al, .am, .as, .az, .ba, .bg, .bf, .by, .bj, .bm, .bo, .bs, .cd, .cg, .cf, .ci, .cl, .cn, .cr, .cu, .cv, .cy, .dj, .do, .ee, .fk, .fj, .fm, .fo, .ga, .ge, .gg, .gi, .gq, .gr, .gs, .gt, .gu, .gw, .hn, .ht, .id, .in, .iq, .it, .jo, .jp, .kg, .kh, .kp, .kr, .ky, .kz, .la, .lk, .lt, .lv, .mc, .md, .me, .mg, .mh, .mk, .ml, .mn, .mp, .mt, .ms, .mz, .ne, .ni, .np, .pa, .pe, .pf, .ph, .pl, .pn, .pr, .py, .ro, .rs, .ru, .rw, .sh, .sk, .sm, .sr, .st, .sv, .tc, .td, .th, .tj, .tk, .tl, .tr, .tw, .ua, .us, .va, .ve, .vg, .vi, .vn, .vu, .xk, .ps_west_bank
{ fill: #cccccc; }

/* Illegal, minimal penalty */
.bt, .lb, .lr
{ fill: #f9dc36; }

/* Illegal, large penalty */
.ag, .ao, .bh, .bi, .bn, .bw, .bz, .cm, .ck, .dm, .dz, .eg, .eh, .er, .et, .gd, .gh, .gm, .gn, .jm, .ke, .ki, .km, .kn, .kw, .lc, .ls, .ly, .ma, .mu, .mv, .mw, .my, .na, .ng, .nr, .nu, .om, .pg, .pw, .qa, .sb, .sc, .sg, .sn, .so, .ss, .sy, .sz, .tg, .tm, .tn, .to, .tt, .tv, .uz, .vc, .ws, .zm, .zw, .xc, .ps_gaza_strip
{ fill: #ec8028; }

/* Illegal, life imprisonment */
.bb, .bd, .gy, .mm, .pk, .sl, .tz, .ug
{ fill: #e73e21; }

/* Illegal, death penalty */
.ae, .af, .ir, .mr, .sa, .sd, .ye
{ fill: #8c201f; }

/* SUB-NATIONAL UNITS */

/* Same-sex marriage */
.br_al, .mx_dif, .us_ct, .us_dc, .us_ia, .us_ma, .us_md, .us_nh, .us_ny, .us_vt, .us_wa
{ fill: #002255; }

/* Civil unions etc. */
.mx_coa, .uk_je, .us_ca, .us_co, .us_de, .us_hi, .us_il, .us_me, .us_nj, .us_nv, .us_or, .us_ri, .us_wi, .ve_l
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.bq
{ fill: #7fbcff; }

/* Illegal, large penalty */
.id_ac
{ fill: #ec8028; }

/* Illegal, death penalty */
.ng_sharia, .so_shabaab
{ fill: #8c201f; }</style><path d="m464.84 828.33 364.52-364.52c12.15-12.119 12.15-31.799 0-43.95l-364.52-364.52c-12.115-12.115-31.835-12.115-43.951 0l-364.52 364.52c-12.148 12.15-12.148 31.831 0 43.95l364.52 364.52c12.152 12.152 31.804 12.152 43.951 0z" fill="#ffd520" fill-rule="evenodd"/><path d="m460.26 823.81c-9.6221 9.6237-25.157 9.6237-34.779 0l-364.56-364.56c-9.5955-9.5935-9.6237-25.18 0-34.806l364.53-364.53c9.5983-9.5951 25.237-9.5951 34.835 0l364.53 364.53c9.6265 9.6266 9.595 25.213 0 34.806l-364.56 364.56z" fill="#000" fill-rule="evenodd"/><path d="m452.21 815.73 364.53-364.55c5.1224-5.1203 5.146-13.5 0-18.654l-364.55-364.56c-5.1421-5.1224-13.528-5.1224-18.646 0l-364.55 364.56c-5.1445 5.1538-5.1445 13.533 0 18.654l364.55 364.55c5.1413 5.1566 13.504 5.1566 18.646 0h0.0226z" fill="#ffd520" fill-rule="evenodd"/><path d="m480.31 428.14c-5.3509 0.16933-10.623-2.13-14.131-6.1855l-55.644-87.505 1.2498 141.94 58.993 143.61c5.7251 11.337 0.50036 25.17-11.288 29.895-11.166 4.4752-23.833-1.0039-28.223-12.164l-98.624-231.29-0.37495-88.214-17.522 30.769-0.0403 65.724c0.33463 8.4848-6.4346 15.509-14.925 15.552-8.4021 0.0394-15.216-6.8588-15.046-15.26l0.33464-79.186 44.692-67.354c4.6365-6.729 13.333-10.201 21.324-8.5283l47.574 8.1147c5.8541 1.0434 11.16 4.595 14.385 9.5717l81.233 127.81c2.2126 5.1852 1.9647 11.292-0.83899 16.225l107.36 201.05c1.9215 3.435 0.63016 7.7409-2.8424 9.535-3.3862 1.7578-7.528 0.4193-9.2802-2.9714l-108.37-201.14z" fill="#000" fill-rule="evenodd"/><path d="m329.83 637.53c-11.958 27.883-53.433 10.156-41.261-17.772l44.192-101.6 0.66524-93.275 43.603 102.35-47.199 110.3z" fill="#000" fill-rule="evenodd"/><path d="m388.58 178.98c19.751 0 35.802 16.056 35.802 35.801 0 19.749-16.05 35.805-35.802 35.805-19.747 0-35.798-16.056-35.798-35.805 0-19.745 16.05-35.801 35.798-35.801z" fill="#000" fill-rule="evenodd"/></svg>
