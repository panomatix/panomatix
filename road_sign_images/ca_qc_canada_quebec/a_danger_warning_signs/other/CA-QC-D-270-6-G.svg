<svg width="245.71" height="245.7" version="1.1" viewBox="82.992 45.607 719.75 792.48" xmlns="http://www.w3.org/2000/svg"><style type="text/css">/*
 * Below are Cascading Style Sheet (CSS) definitions in use in this file,
 * which allow easily changing how countries are displayed.
 *
 */

/*
 * Circles around small countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.circlexx
{
   opacity:1;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * Smaller circles around French DOMs and Chinese SARs
 *
 * Change opacity to 1 to display all subnational circles.
 *
 */
.subxx
{
   opacity:1;
   stroke-width:0.3;
}

/*
 * Circles around small, unrecognized countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.unxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.3;
}

/*
 * Circles around small countries, but with no permanent residents 
 *
 * Change opacity to 1 to display all circles.
 *
 */
.noxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * land
 */
.landxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.5;
   fill-rule:evenodd;
}

/*
 * Styles for coastlines of islands with no borders
 */
.coastxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.3;
   fill-rule:evenodd;
}

/*
 * Styles for nations with limited recognition
 */
.limitxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Styles for nations with no permanent population.
 */
.antxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Ocean
 */
.oceanxx
{
   opacity: 1;
   color: #000000;
   fill:#ffffff;
   stroke:#000;
   stroke-width:0.5;
   stroke-miterlimit:1;
}

/*
 * Additional style rules
 *
 * The following are examples of colouring countries.  You can substitute these with your own styles to colour the countries on the map.
 *
 * Color a few countries:
 *
 * .gb, .au, .nc
 * {
 *    fill:       #ff0000;
 * }
 *
 * Color a few small country circles (and the countries):
 *
 * .ms, .ky
 * {
 *    opacity:    1;
 *    fill:       #ff0000;
 * }
 *
 */

/* Same-sex marriage */
.ar, .be, .ca, .dk, .es, .is, .nl, .no, .pt, .se, .za
{ fill: #002255; }

/* Civil unions etc. */
.ad, .at, .au, .bl, .br, .ch, .co, .cz, .de, .ec, .fi, .fr, .gb, .gf, .gl, .hr, .hu, .ie, .il, .im, .je, .li, .lu, .mf, .nc, .nf, .nz, .pm, .re, .si, .uy, .wf
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.aw, .cw, .sx, .mx
{ fill: #7fbcff; }

/* Legal but no recognition */
.ai, .al, .am, .as, .az, .ba, .bg, .bf, .by, .bj, .bm, .bo, .bs, .cd, .cg, .cf, .ci, .cl, .cn, .cr, .cu, .cv, .cy, .dj, .do, .ee, .fk, .fj, .fm, .fo, .ga, .ge, .gg, .gi, .gq, .gr, .gs, .gt, .gu, .gw, .hn, .ht, .id, .in, .iq, .it, .jo, .jp, .kg, .kh, .kp, .kr, .ky, .kz, .la, .lk, .lt, .lv, .mc, .md, .me, .mg, .mh, .mk, .ml, .mn, .mp, .mt, .ms, .mz, .ne, .ni, .np, .pa, .pe, .pf, .ph, .pl, .pn, .pr, .py, .ro, .rs, .ru, .rw, .sh, .sk, .sm, .sr, .st, .sv, .tc, .td, .th, .tj, .tk, .tl, .tr, .tw, .ua, .us, .va, .ve, .vg, .vi, .vn, .vu, .xk, .ps_west_bank
{ fill: #cccccc; }

/* Illegal, minimal penalty */
.bt, .lb, .lr
{ fill: #f9dc36; }

/* Illegal, large penalty */
.ag, .ao, .bh, .bi, .bn, .bw, .bz, .cm, .ck, .dm, .dz, .eg, .eh, .er, .et, .gd, .gh, .gm, .gn, .jm, .ke, .ki, .km, .kn, .kw, .lc, .ls, .ly, .ma, .mu, .mv, .mw, .my, .na, .ng, .nr, .nu, .om, .pg, .pw, .qa, .sb, .sc, .sg, .sn, .so, .ss, .sy, .sz, .tg, .tm, .tn, .to, .tt, .tv, .uz, .vc, .ws, .zm, .zw, .xc, .ps_gaza_strip
{ fill: #ec8028; }

/* Illegal, life imprisonment */
.bb, .bd, .gy, .mm, .pk, .sl, .tz, .ug
{ fill: #e73e21; }

/* Illegal, death penalty */
.ae, .af, .ir, .mr, .sa, .sd, .ye
{ fill: #8c201f; }

/* SUB-NATIONAL UNITS */

/* Same-sex marriage */
.br_al, .mx_dif, .us_ct, .us_dc, .us_ia, .us_ma, .us_md, .us_nh, .us_ny, .us_vt, .us_wa
{ fill: #002255; }

/* Civil unions etc. */
.mx_coa, .uk_je, .us_ca, .us_co, .us_de, .us_hi, .us_il, .us_me, .us_nj, .us_nv, .us_or, .us_ri, .us_wi, .ve_l
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.bq
{ fill: #7fbcff; }

/* Illegal, large penalty */
.id_ac
{ fill: #ec8028; }

/* Illegal, death penalty */
.ng_sharia, .so_shabaab
{ fill: #8c201f; }</style><path d="m464.84 828.33 364.52-364.52c12.15-12.119 12.15-31.799 0-43.95l-364.52-364.52c-12.115-12.115-31.835-12.115-43.951 0l-364.52 364.52c-12.148 12.15-12.148 31.831 0 43.95l364.52 364.52c12.152 12.152 31.804 12.152 43.951 0z" fill="#ffd520" fill-rule="evenodd"/><path d="m460.26 823.81c-9.6221 9.6237-25.157 9.6237-34.779 0l-364.56-364.56c-9.5955-9.5935-9.6237-25.18 0-34.806l364.53-364.53c9.5983-9.5951 25.237-9.5951 34.835 0l364.53 364.53c9.6265 9.6266 9.595 25.213 0 34.806l-364.56 364.56z" fill="#000" fill-rule="evenodd"/><path d="m452.21 815.73 364.53-364.55c5.1224-5.1203 5.146-13.5 0-18.654l-364.55-364.56c-5.1421-5.1224-13.528-5.1224-18.646 0l-364.55 364.56c-5.1445 5.1538-5.1445 13.533 0 18.654l364.55 364.55c5.1413 5.1566 13.504 5.1566 18.646 0h0.0226z" fill="#ffd520" fill-rule="evenodd"/><path d="m346.49 643.59c-32.758 0-60.73-26.388-60.73-60.738 0-33.524 27.21-60.73 60.73-60.73 8.3336 0 16.276 1.6732 23.497 4.7252l17.143-30.307-2.7013-6.0436c-8.894-0.49591-16.671-7.7812-17.679-16.542h46.433c3.6729-0.0194 3.6729 3.8785 1.2015 4.6405l-19.417 9.1964 3.6366 8.5231h103.43c-2.2719-9.6318 2.642-20.34 11.509-24.674 1.7167-0.84666 1.0354-4.2091-1.7522-3.939l-21.659 2.1489-3.5907-9.6963 25.58-2.8908c10.379-1.1732 18.71 15.494 7.2603 22.84-6.6185 4.2494-8.8904 9.7366-6.7245 15.696l10.418 28.444c14.461-3.935 29.998-2.4513 43.117 4.2777 19.639 10.063 33.482 30.363 33.545 54.332 0.10241 33.508-27.21 60.738-60.736 60.738-33.521 0-60.732-27.21-60.732-60.738 0-24.465 14.505-45.587 35.38-55.198l-3.4254-8.6078-75.128 63.516c-3.4673 2.9916-8.0836 4.5196-12.627 4.1124l-15.369 0.0564c-1.9997 31.726-28.387 56.86-60.609 56.86zm159.66-134.47-0.88214-2.5319h-102.73l27.529 67.06 76.085-64.528zm-177.55 29.23c-17.671 7.112-30.178 24.44-30.178 44.647 0 26.541 21.558 48.095 48.095 48.095 25.218 0 45.934-19.469 47.933-44.176l-49.647-0.0194c-4.0277 0.55638-6.8418-4.7212-4.701-8.1683l23.332-40.414c-11.462-4.4349-23.864-4.2293-34.834 0.0365zm198.72-2.1852 17.005 45.01c