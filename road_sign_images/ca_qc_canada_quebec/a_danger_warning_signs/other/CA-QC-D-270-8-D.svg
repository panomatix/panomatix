<svg width="245.71" height="245.7" version="1.1" viewBox="82.992 45.607 719.75 792.48" xmlns="http://www.w3.org/2000/svg"><style type="text/css">/*
 * Below are Cascading Style Sheet (CSS) definitions in use in this file,
 * which allow easily changing how countries are displayed.
 *
 */

/*
 * Circles around small countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.circlexx
{
   opacity:1;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * Smaller circles around French DOMs and Chinese SARs
 *
 * Change opacity to 1 to display all subnational circles.
 *
 */
.subxx
{
   opacity:1;
   stroke-width:0.3;
}

/*
 * Circles around small, unrecognized countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.unxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.3;
}

/*
 * Circles around small countries, but with no permanent residents 
 *
 * Change opacity to 1 to display all circles.
 *
 */
.noxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * land
 */
.landxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.5;
   fill-rule:evenodd;
}

/*
 * Styles for coastlines of islands with no borders
 */
.coastxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.3;
   fill-rule:evenodd;
}

/*
 * Styles for nations with limited recognition
 */
.limitxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Styles for nations with no permanent population.
 */
.antxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Ocean
 */
.oceanxx
{
   opacity: 1;
   color: #000000;
   fill:#ffffff;
   stroke:#000;
   stroke-width:0.5;
   stroke-miterlimit:1;
}

/*
 * Additional style rules
 *
 * The following are examples of colouring countries.  You can substitute these with your own styles to colour the countries on the map.
 *
 * Color a few countries:
 *
 * .gb, .au, .nc
 * {
 *    fill:       #ff0000;
 * }
 *
 * Color a few small country circles (and the countries):
 *
 * .ms, .ky
 * {
 *    opacity:    1;
 *    fill:       #ff0000;
 * }
 *
 */

/* Same-sex marriage */
.ar, .be, .ca, .dk, .es, .is, .nl, .no, .pt, .se, .za
{ fill: #002255; }

/* Civil unions etc. */
.ad, .at, .au, .bl, .br, .ch, .co, .cz, .de, .ec, .fi, .fr, .gb, .gf, .gl, .hr, .hu, .ie, .il, .im, .je, .li, .lu, .mf, .nc, .nf, .nz, .pm, .re, .si, .uy, .wf
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.aw, .cw, .sx, .mx
{ fill: #7fbcff; }

/* Legal but no recognition */
.ai, .al, .am, .as, .az, .ba, .bg, .bf, .by, .bj, .bm, .bo, .bs, .cd, .cg, .cf, .ci, .cl, .cn, .cr, .cu, .cv, .cy, .dj, .do, .ee, .fk, .fj, .fm, .fo, .ga, .ge, .gg, .gi, .gq, .gr, .gs, .gt, .gu, .gw, .hn, .ht, .id, .in, .iq, .it, .jo, .jp, .kg, .kh, .kp, .kr, .ky, .kz, .la, .lk, .lt, .lv, .mc, .md, .me, .mg, .mh, .mk, .ml, .mn, .mp, .mt, .ms, .mz, .ne, .ni, .np, .pa, .pe, .pf, .ph, .pl, .pn, .pr, .py, .ro, .rs, .ru, .rw, .sh, .sk, .sm, .sr, .st, .sv, .tc, .td, .th, .tj, .tk, .tl, .tr, .tw, .ua, .us, .va, .ve, .vg, .vi, .vn, .vu, .xk, .ps_west_bank
{ fill: #cccccc; }

/* Illegal, minimal penalty */
.bt, .lb, .lr
{ fill: #f9dc36; }

/* Illegal, large penalty */
.ag, .ao, .bh, .bi, .bn, .bw, .bz, .cm, .ck, .dm, .dz, .eg, .eh, .er, .et, .gd, .gh, .gm, .gn, .jm, .ke, .ki, .km, .kn, .kw, .lc, .ls, .ly, .ma, .mu, .mv, .mw, .my, .na, .ng, .nr, .nu, .om, .pg, .pw, .qa, .sb, .sc, .sg, .sn, .so, .ss, .sy, .sz, .tg, .tm, .tn, .to, .tt, .tv, .uz, .vc, .ws, .zm, .zw, .xc, .ps_gaza_strip
{ fill: #ec8028; }

/* Illegal, life imprisonment */
.bb, .bd, .gy, .mm, .pk, .sl, .tz, .ug
{ fill: #e73e21; }

/* Illegal, death penalty */
.ae, .af, .ir, .mr, .sa, .sd, .ye
{ fill: #8c201f; }

/* SUB-NATIONAL UNITS */

/* Same-sex marriage */
.br_al, .mx_dif, .us_ct, .us_dc, .us_ia, .us_ma, .us_md, .us_nh, .us_ny, .us_vt, .us_wa
{ fill: #002255; }

/* Civil unions etc. */
.mx_coa, .uk_je, .us_ca, .us_co, .us_de, .us_hi, .us_il, .us_me, .us_nj, .us_nv, .us_or, .us_ri, .us_wi, .ve_l
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.bq
{ fill: #7fbcff; }

/* Illegal, large penalty */
.id_ac
{ fill: #ec8028; }

/* Illegal, death penalty */
.ng_sharia, .so_shabaab
{ fill: #8c201f; }</style><path d="m420.89 828.33-364.52-364.52c-12.15-12.119-12.15-31.799 0-43.95l364.52-364.52c12.115-12.115 31.835-12.115 43.951 0l364.52 364.52c12.148 12.15 12.148 31.831 0 43.95l-364.52 364.52c-12.152 12.152-31.804 12.152-43.951 0z" fill="#ffd520" fill-rule="evenodd"/><path d="m425.47 823.81c9.6221 9.6237 25.157 9.6237 34.779 0l364.56-364.56c9.5955-9.5935 9.6237-25.18 0-34.806l-364.53-364.53c-9.5983-9.5951-25.237-9.5951-34.835 0l-364.53 364.53c-9.6265 9.6266-9.595 25.213 0 34.806l364.56 364.56z" fill="#000" fill-rule="evenodd"/><path d="m433.52 815.73-364.53-364.55c-5.1224-5.1203-5.146-13.5 0-18.654l364.55-364.56c5.1421-5.1223 13.528-5.1223 18.646 0l364.55 364.56c5.1445 5.1538 5.1445 13.533 0 18.654l-364.55 364.55c-5.1413 5.1566-13.504 5.1566-18.646 0h-0.0226z" fill="#ffd520" fill-rule="evenodd"/><path d="m461.34 502.2 0.0323-10.692-29.834 0.0323-85.54-115.51c-3.3782-5.5279-10.792-7.9296-16.741-5.5594l-14.103 4.1616 31.006-111.02c1.0398-3.768 3.5753-4.8744 7.7054-4.8744l41.628-0.0313c8.5791-0.0313 8.1892-11.245 0.25964-11.213l-48.133 0.0313c-5.2009 0-7.4095 3.7721-8.4807 7.2132l-24.8 77.713-19.663-0.0313 0.0313 48.522-50.081 15.237c-7.1462 2.1461-3.9648 13.426 2.8936 12.19l80.375-14.56c10.107-1.8542 12.316-0.0322 20.119 9.6858l79.201 98.704h34.125zm33.774-40.68 34.419-53.918c3.6406-6.5988 11.115-10.658 18.655-10.008h59.637l57.818 46.148c3.1165 3.4451 9.2569-2.3743 6.0113-5.6892l-51.448-56.062c-5.5557-6.8862-14.692-10.559-23.465-9.4572l-9.914 0.22836c-2.3102 0.1932-4.3865-1.9526-4.189-4.2559l-1.145-16.966c-0.28642-4.6502-4.8421-8.3509-9.4504-7.6071l-106.77 17.714v32.53h41.632l-17.901 64.775c-1.2418 3.3463 4.58 5.7855 6.1081 2.5682zm-247.46-2.1288c-0.53139 0.80232-1.0591 1.5966-1.5905 2.3948l1.4921 1.0241c3.3822 2.3182 0.79546 7.2974-2.4884 6.1323l-2.5513-0.89101c-1.7913 3.5157-3.2834 7.1966-4.4764 11.007l1.988 1.0281c4.5752 2.3545 1.6929 7.1362-1.3897 6.4992l-2.4255-0.49591c-0.79506 3.818-1.2954 7.7288-1.4922 11.744l2.1892 0.39511c3.5475 0.4959 3