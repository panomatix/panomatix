<svg width="245.26" height="245.26" version="1.1" viewBox="82.992 45.607 718.42 791.05" xmlns="http://www.w3.org/2000/svg"><style type="text/css">/*
 * Below are Cascading Style Sheet (CSS) definitions in use in this file,
 * which allow easily changing how countries are displayed.
 *
 */

/*
 * Circles around small countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.circlexx
{
   opacity:1;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * Smaller circles around French DOMs and Chinese SARs
 *
 * Change opacity to 1 to display all subnational circles.
 *
 */
.subxx
{
   opacity:1;
   stroke-width:0.3;
}

/*
 * Circles around small, unrecognized countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.unxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.3;
}

/*
 * Circles around small countries, but with no permanent residents 
 *
 * Change opacity to 1 to display all circles.
 *
 */
.noxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * land
 */
.landxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.5;
   fill-rule:evenodd;
}

/*
 * Styles for coastlines of islands with no borders
 */
.coastxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.3;
   fill-rule:evenodd;
}

/*
 * Styles for nations with limited recognition
 */
.limitxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Styles for nations with no permanent population.
 */
.antxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Ocean
 */
.oceanxx
{
   opacity: 1;
   color: #000000;
   fill:#ffffff;
   stroke:#000;
   stroke-width:0.5;
   stroke-miterlimit:1;
}

/*
 * Additional style rules
 *
 * The following are examples of colouring countries.  You can substitute these with your own styles to colour the countries on the map.
 *
 * Color a few countries:
 *
 * .gb, .au, .nc
 * {
 *    fill:       #ff0000;
 * }
 *
 * Color a few small country circles (and the countries):
 *
 * .ms, .ky
 * {
 *    opacity:    1;
 *    fill:       #ff0000;
 * }
 *
 */

/* Same-sex marriage */
.ar, .be, .ca, .dk, .es, .is, .nl, .no, .pt, .se, .za
{ fill: #002255; }

/* Civil unions etc. */
.ad, .at, .au, .bl, .br, .ch, .co, .cz, .de, .ec, .fi, .fr, .gb, .gf, .gl, .hr, .hu, .ie, .il, .im, .je, .li, .lu, .mf, .nc, .nf, .nz, .pm, .re, .si, .uy, .wf
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.aw, .cw, .sx, .mx
{ fill: #7fbcff; }

/* Legal but no recognition */
.ai, .al, .am, .as, .az, .ba, .bg, .bf, .by, .bj, .bm, .bo, .bs, .cd, .cg, .cf, .ci, .cl, .cn, .cr, .cu, .cv, .cy, .dj, .do, .ee, .fk, .fj, .fm, .fo, .ga, .ge, .gg, .gi, .gq, .gr, .gs, .gt, .gu, .gw, .hn, .ht, .id, .in, .iq, .it, .jo, .jp, .kg, .kh, .kp, .kr, .ky, .kz, .la, .lk, .lt, .lv, .mc, .md, .me, .mg, .mh, .mk, .ml, .mn, .mp, .mt, .ms, .mz, .ne, .ni, .np, .pa, .pe, .pf, .ph, .pl, .pn, .pr, .py, .ro, .rs, .ru, .rw, .sh, .sk, .sm, .sr, .st, .sv, .tc, .td, .th, .tj, .tk, .tl, .tr, .tw, .ua, .us, .va, .ve, .vg, .vi, .vn, .vu, .xk, .ps_west_bank
{ fill: #cccccc; }

/* Illegal, minimal penalty */
.bt, .lb, .lr
{ fill: #f9dc36; }

/* Illegal, large penalty */
.ag, .ao, .bh, .bi, .bn, .bw, .bz, .cm, .ck, .dm, .dz, .eg, .eh, .er, .et, .gd, .gh, .gm, .gn, .jm, .ke, .ki, .km, .kn, .kw, .lc, .ls, .ly, .ma, .mu, .mv, .mw, .my, .na, .ng, .nr, .nu, .om, .pg, .pw, .qa, .sb, .sc, .sg, .sn, .so, .ss, .sy, .sz, .tg, .tm, .tn, .to, .tt, .tv, .uz, .vc, .ws, .zm, .zw, .xc, .ps_gaza_strip
{ fill: #ec8028; }

/* Illegal, life imprisonment */
.bb, .bd, .gy, .mm, .pk, .sl, .tz, .ug
{ fill: #e73e21; }

/* Illegal, death penalty */
.ae, .af, .ir, .mr, .sa, .sd, .ye
{ fill: #8c201f; }

/* SUB-NATIONAL UNITS */

/* Same-sex marriage */
.br_al, .mx_dif, .us_ct, .us_dc, .us_ia, .us_ma, .us_md, .us_nh, .us_ny, .us_vt, .us_wa
{ fill: #002255; }

/* Civil unions etc. */
.mx_coa, .uk_je, .us_ca, .us_co, .us_de, .us_hi, .us_il, .us_me, .us_nj, .us_nv, .us_or, .us_ri, .us_wi, .ve_l
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.bq
{ fill: #7fbcff; }

/* Illegal, large penalty */
.id_ac
{ fill: #ec8028; }

/* Illegal, death penalty */
.ng_sharia, .so_shabaab
{ fill: #8c201f; }</style><path d="m420.78 827.12-364.56-364.57c-11.835-11.829-11.863-30.993 0-42.852l364.56-364.57c11.832-11.831 31.023-11.831 42.856 0l364.57 364.57c11.857 11.859 11.833 31.023 0 42.852l-364.57 364.57c-11.861 11.857-30.998 11.857-42.856 0z" fill="#000" fill-rule="evenodd"/><path d="m623.92 395.77 45.43-45.428-45.43-45.401-45.434 45.401 45.434 45.428z" fill="#ffd520" fill-rule="evenodd"/><path d="m442.2 304.91 45.431-45.428-45.431-45.396-45.428 45.396 45.428 45.428z" fill="#ffd520" fill-rule="evenodd"/><path d="m714.78 486.63 45.434-45.432-45.434-45.396-45.426 45.396 45.426 45.432z" fill="#ffd520" fill-rule="evenodd"/><path d="m351.34 668.34 45.432-45.426-45.432-45.397-45.428 45.397 45.428 45.426z" fill="#ffd520" fill-rule="evenodd"/><path d="m533.06 214.05 44.72-44.719-45.397-45.428-44.752 44.719 45.43 45.428z" fill="#ffd520" fill-rule="evenodd"/><path d="m714.78 395.77 44.756-44.751-45.43-45.432-44.752 44.755 45.426 45.428z" fill="#ffd520" fill-rule="evenodd"/><path d="m215.73 260.16 44.751 44.751 45.432-45.428-44.751-44.751-45.432 45.428z" fill="#ffd520" fill-rule="evenodd"/><path d="m124.87 351.02 44.755 44.751 45.428-45.428-44.751-44.755-45.432 45.432z" fill="#ffd520" fill-rule="evenodd"/><path d="m623.92 304.91 44.752-44.751-45.43-45.428-44.756 44.751 45.434 45.428z" fill="#ffd520" fill-rule="evenodd"/><path d="m306.59 169.3 44.751 44.751 45.432-45.428-44.755-44.751-45.428 45.428z" fill="#ffd520" fill-rule="evenodd"/><path d="m623.22 667.54 45.417-45.421-44.768-44.756-45.389 45.413 44.74 44.764z" fill="#ffd520" fill-rule="evenodd"/><path d="m714.05 576.73 45.421-45.417-44.764-44.768-45.417 45.421 44.76 44.764z" fill="#ffd520" fill-rule="evenodd"/><path d="m215.83 622.17 45.416 45.417 44.759-44.768-45.416-45.417-44.758 44.768z" fill="#ffd520" fill-rule="evenodd"/><path d="m306.63 712.98 45.42 45.417 44.763-44.756-45.416-45.421-44.766 44.76z" fill="#ffd520" fill-rule="evenodd"/><path d="m532.39 758.39 45.417-45.417-44.764-44.76-45.421 45.421 44.