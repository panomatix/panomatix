<svg width="245.71" height="245.7" version="1.1" viewBox="82.992 45.607 719.75 792.48" xmlns="http://www.w3.org/2000/svg"><style type="text/css">/*
 * Below are Cascading Style Sheet (CSS) definitions in use in this file,
 * which allow easily changing how countries are displayed.
 *
 */

/*
 * Circles around small countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.circlexx
{
   opacity:1;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * Smaller circles around French DOMs and Chinese SARs
 *
 * Change opacity to 1 to display all subnational circles.
 *
 */
.subxx
{
   opacity:1;
   stroke-width:0.3;
}

/*
 * Circles around small, unrecognized countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.unxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.3;
}

/*
 * Circles around small countries, but with no permanent residents 
 *
 * Change opacity to 1 to display all circles.
 *
 */
.noxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * land
 */
.landxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.5;
   fill-rule:evenodd;
}

/*
 * Styles for coastlines of islands with no borders
 */
.coastxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.3;
   fill-rule:evenodd;
}

/*
 * Styles for nations with limited recognition
 */
.limitxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Styles for nations with no permanent population.
 */
.antxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Ocean
 */
.oceanxx
{
   opacity: 1;
   color: #000000;
   fill:#ffffff;
   stroke:#000;
   stroke-width:0.5;
   stroke-miterlimit:1;
}

/*
 * Additional style rules
 *
 * The following are examples of colouring countries.  You can substitute these with your own styles to colour the countries on the map.
 *
 * Color a few countries:
 *
 * .gb, .au, .nc
 * {
 *    fill:       #ff0000;
 * }
 *
 * Color a few small country circles (and the countries):
 *
 * .ms, .ky
 * {
 *    opacity:    1;
 *    fill:       #ff0000;
 * }
 *
 */

/* Same-sex marriage */
.ar, .be, .ca, .dk, .es, .is, .nl, .no, .pt, .se, .za
{ fill: #002255; }

/* Civil unions etc. */
.ad, .at, .au, .bl, .br, .ch, .co, .cz, .de, .ec, .fi, .fr, .gb, .gf, .gl, .hr, .hu, .ie, .il, .im, .je, .li, .lu, .mf, .nc, .nf, .nz, .pm, .re, .si, .uy, .wf
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.aw, .cw, .sx, .mx
{ fill: #7fbcff; }

/* Legal but no recognition */
.ai, .al, .am, .as, .az, .ba, .bg, .bf, .by, .bj, .bm, .bo, .bs, .cd, .cg, .cf, .ci, .cl, .cn, .cr, .cu, .cv, .cy, .dj, .do, .ee, .fk, .fj, .fm, .fo, .ga, .ge, .gg, .gi, .gq, .gr, .gs, .gt, .gu, .gw, .hn, .ht, .id, .in, .iq, .it, .jo, .jp, .kg, .kh, .kp, .kr, .ky, .kz, .la, .lk, .lt, .lv, .mc, .md, .me, .mg, .mh, .mk, .ml, .mn, .mp, .mt, .ms, .mz, .ne, .ni, .np, .pa, .pe, .pf, .ph, .pl, .pn, .pr, .py, .ro, .rs, .ru, .rw, .sh, .sk, .sm, .sr, .st, .sv, .tc, .td, .th, .tj, .tk, .tl, .tr, .tw, .ua, .us, .va, .ve, .vg, .vi, .vn, .vu, .xk, .ps_west_bank
{ fill: #cccccc; }

/* Illegal, minimal penalty */
.bt, .lb, .lr
{ fill: #f9dc36; }

/* Illegal, large penalty */
.ag, .ao, .bh, .bi, .bn, .bw, .bz, .cm, .ck, .dm, .dz, .eg, .eh, .er, .et, .gd, .gh, .gm, .gn, .jm, .ke, .ki, .km, .kn, .kw, .lc, .ls, .ly, .ma, .mu, .mv, .mw, .my, .na, .ng, .nr, .nu, .om, .pg, .pw, .qa, .sb, .sc, .sg, .sn, .so, .ss, .sy, .sz, .tg, .tm, .tn, .to, .tt, .tv, .uz, .vc, .ws, .zm, .zw, .xc, .ps_gaza_strip
{ fill: #ec8028; }

/* Illegal, life imprisonment */
.bb, .bd, .gy, .mm, .pk, .sl, .tz, .ug
{ fill: #e73e21; }

/* Illegal, death penalty */
.ae, .af, .ir, .mr, .sa, .sd, .ye
{ fill: #8c201f; }

/* SUB-NATIONAL UNITS */

/* Same-sex marriage */
.br_al, .mx_dif, .us_ct, .us_dc, .us_ia, .us_ma, .us_md, .us_nh, .us_ny, .us_vt, .us_wa
{ fill: #002255; }

/* Civil unions etc. */
.mx_coa, .uk_je, .us_ca, .us_co, .us_de, .us_hi, .us_il, .us_me, .us_nj, .us_nv, .us_or, .us_ri, .us_wi, .ve_l
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.bq
{ fill: #7fbcff; }

/* Illegal, large penalty */
.id_ac
{ fill: #ec8028; }

/* Illegal, death penalty */
.ng_sharia, .so_shabaab
{ fill: #8c201f; }</style><path d="m420.89 828.33-364.52-364.52c-12.15-12.119-12.15-31.8 0-43.95l364.52-364.52c12.115-12.115 31.835-12.115 43.951 0l364.52 364.52c12.148 12.15 12.148 31.83 0 43.95l-364.52 364.52c-12.152 12.152-31.804 12.152-43.951 0z" fill="#ffd520" fill-rule="evenodd"/><path d="m425.47 823.81c9.6221 9.6237 25.157 9.6237 34.779 0l364.56-364.56c9.5955-9.5935 9.6238-25.18 0-34.806l-364.53-364.53c-9.5983-9.5951-25.237-9.5951-34.835 0l-364.53 364.53c-9.6266 9.6266-9.5951 25.213 0 34.806l364.56 364.56z" fill="#000" fill-rule="evenodd"/><path d="m433.52 815.73-364.53-364.55c-5.1223-5.1203-5.1459-13.5 0-18.654l364.55-364.56c5.1421-5.1224 13.528-5.1224 18.646 0l364.55 364.56c5.1445 5.1538 5.1445 13.533 0 18.654l-364.55 364.55c-5.1413 5.1565-13.504 5.1565-18.646 0h-0.023z" fill="#ffd520" fill-rule="evenodd"/><path d="m378.88 390.64 168.94 42.113-7.3257 29.347c-0.2499 1.1934 0 2.4351 0.6572 3.4995 0.6975 1.0724 1.8506 1.8949 3.1689 2.1046l22.924 5.7976c1.1168 0.1655 2.3101-0.077 3.2576-0.65721 1.0281-0.6128 1.8546-1.6449 2.1812-2.8383l7.1603-28.934 28.448 7.0378c1.4837 0.2864 3.0037-0.044 4.2011-0.9072 0.9878-0.65721 1.7659-1.6462 2.1812-2.8391l5.4347-22.521c0.077-1.2756-0.2945-2.5948-1.0321-3.6616-0.9071-1.3192-2.2658-2.1812-3.7898-2.4686l12.232-51.586-7.0837-10.249-2.8021-71.422c-16.667-8.7287-33.834-16.426-51.493-22.97-16.304-6.0085-32.98-11.158-49.852-15.19l-22.437-5.642c-16.425-4.1539-33.016-7.3668-49.77-9.5911-18.643-2.5122-37.416-3.7838-56.232-3.8705l-35.978 61.712-11.072 5.7606-13.422 51.29c-1.4804-0.4882-3.0907-0.3701-4.528 0.3742-1.1535 0.5749-2.1025 1.5631-2.6339 2.7561l-5.8037 22.438c-0.1258 1.2326 0.079 2.4687 0.6576 3.4964 0.6184 1.4018 1.8546 2.3464 3.2524 2.7996l28.443 7.1261-7.3272 28.935c-0.2049 1.197 0.043 2.5118 0.6575 3.5435 0.5395 0.9882 1.4841 1.6853 2.5553 2.0554l22.974 5.6811c1.2325 0.37011 2.6298 0.2048 3.7837-0.3701 1.0709-0.6181 1.8937-1.6062 2.2207-2.7993l7.2483-29.352z" fill="#000" fill-rule="evenodd"/><path d="m222.25 584.31 112.