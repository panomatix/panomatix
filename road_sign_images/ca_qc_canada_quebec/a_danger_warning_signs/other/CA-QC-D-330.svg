<svg width="245.71" height="245.7" version="1.1" viewBox="82.992 45.607 719.75 792.48" xmlns="http://www.w3.org/2000/svg"><style type="text/css">/*
 * Below are Cascading Style Sheet (CSS) definitions in use in this file,
 * which allow easily changing how countries are displayed.
 *
 */

/*
 * Circles around small countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.circlexx
{
   opacity:1;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * Smaller circles around French DOMs and Chinese SARs
 *
 * Change opacity to 1 to display all subnational circles.
 *
 */
.subxx
{
   opacity:1;
   stroke-width:0.3;
}

/*
 * Circles around small, unrecognized countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.unxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.3;
}

/*
 * Circles around small countries, but with no permanent residents 
 *
 * Change opacity to 1 to display all circles.
 *
 */
.noxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * land
 */
.landxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.5;
   fill-rule:evenodd;
}

/*
 * Styles for coastlines of islands with no borders
 */
.coastxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.3;
   fill-rule:evenodd;
}

/*
 * Styles for nations with limited recognition
 */
.limitxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Styles for nations with no permanent population.
 */
.antxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Ocean
 */
.oceanxx
{
   opacity: 1;
   color: #000000;
   fill:#ffffff;
   stroke:#000;
   stroke-width:0.5;
   stroke-miterlimit:1;
}

/*
 * Additional style rules
 *
 * The following are examples of colouring countries.  You can substitute these with your own styles to colour the countries on the map.
 *
 * Color a few countries:
 *
 * .gb, .au, .nc
 * {
 *    fill:       #ff0000;
 * }
 *
 * Color a few small country circles (and the countries):
 *
 * .ms, .ky
 * {
 *    opacity:    1;
 *    fill:       #ff0000;
 * }
 *
 */

/* Same-sex marriage */
.ar, .be, .ca, .dk, .es, .is, .nl, .no, .pt, .se, .za
{ fill: #002255; }

/* Civil unions etc. */
.ad, .at, .au, .bl, .br, .ch, .co, .cz, .de, .ec, .fi, .fr, .gb, .gf, .gl, .hr, .hu, .ie, .il, .im, .je, .li, .lu, .mf, .nc, .nf, .nz, .pm, .re, .si, .uy, .wf
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.aw, .cw, .sx, .mx
{ fill: #7fbcff; }

/* Legal but no recognition */
.ai, .al, .am, .as, .az, .ba, .bg, .bf, .by, .bj, .bm, .bo, .bs, .cd, .cg, .cf, .ci, .cl, .cn, .cr, .cu, .cv, .cy, .dj, .do, .ee, .fk, .fj, .fm, .fo, .ga, .ge, .gg, .gi, .gq, .gr, .gs, .gt, .gu, .gw, .hn, .ht, .id, .in, .iq, .it, .jo, .jp, .kg, .kh, .kp, .kr, .ky, .kz, .la, .lk, .lt, .lv, .mc, .md, .me, .mg, .mh, .mk, .ml, .mn, .mp, .mt, .ms, .mz, .ne, .ni, .np, .pa, .pe, .pf, .ph, .pl, .pn, .pr, .py, .ro, .rs, .ru, .rw, .sh, .sk, .sm, .sr, .st, .sv, .tc, .td, .th, .tj, .tk, .tl, .tr, .tw, .ua, .us, .va, .ve, .vg, .vi, .vn, .vu, .xk, .ps_west_bank
{ fill: #cccccc; }

/* Illegal, minimal penalty */
.bt, .lb, .lr
{ fill: #f9dc36; }

/* Illegal, large penalty */
.ag, .ao, .bh, .bi, .bn, .bw, .bz, .cm, .ck, .dm, .dz, .eg, .eh, .er, .et, .gd, .gh, .gm, .gn, .jm, .ke, .ki, .km, .kn, .kw, .lc, .ls, .ly, .ma, .mu, .mv, .mw, .my, .na, .ng, .nr, .nu, .om, .pg, .pw, .qa, .sb, .sc, .sg, .sn, .so, .ss, .sy, .sz, .tg, .tm, .tn, .to, .tt, .tv, .uz, .vc, .ws, .zm, .zw, .xc, .ps_gaza_strip
{ fill: #ec8028; }

/* Illegal, life imprisonment */
.bb, .bd, .gy, .mm, .pk, .sl, .tz, .ug
{ fill: #e73e21; }

/* Illegal, death penalty */
.ae, .af, .ir, .mr, .sa, .sd, .ye
{ fill: #8c201f; }

/* SUB-NATIONAL UNITS */

/* Same-sex marriage */
.br_al, .mx_dif, .us_ct, .us_dc, .us_ia, .us_ma, .us_md, .us_nh, .us_ny, .us_vt, .us_wa
{ fill: #002255; }

/* Civil unions etc. */
.mx_coa, .uk_je, .us_ca, .us_co, .us_de, .us_hi, .us_il, .us_me, .us_nj, .us_nv, .us_or, .us_ri, .us_wi, .ve_l
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.bq
{ fill: #7fbcff; }

/* Illegal, large penalty */
.id_ac
{ fill: #ec8028; }

/* Illegal, death penalty */
.ng_sharia, .so_shabaab
{ fill: #8c201f; }</style><path d="m420.89 828.33-364.52-364.52c-12.15-12.119-12.15-31.799 0-43.95l364.52-364.52c12.115-12.115 31.835-12.115 43.951 0l364.52 364.52c12.148 12.15 12.148 31.831 0 43.95l-364.52 364.52c-12.152 12.152-31.804 12.152-43.951 0z" fill="#ffd520" fill-rule="evenodd"/><path d="m425.47 823.81c9.6221 9.6237 25.157 9.6237 34.779 0l364.56-364.56c9.5955-9.5935 9.6238-25.18 0-34.806l-364.53-364.53c-9.5983-9.5951-25.237-9.5951-34.835 0l-364.53 364.53c-9.6265 9.6266-9.595 25.213 0 34.806l364.56 364.56z" fill="#000" fill-rule="evenodd"/><path d="m433.52 815.73-364.53-364.55c-5.1224-5.1203-5.146-13.5 0-18.654l364.55-364.56c5.1421-5.1224 13.528-5.1224 18.646 0l364.55 364.56c5.1445 5.1538 5.1445 13.533 0 18.654l-364.55 364.55c-5.1413 5.1566-13.504 5.1566-18.646 0h-0.0226z" fill="#ffd520" fill-rule="evenodd"/><path d="m299.76 543.09c6.5044 2.3465 13.17 4.1043 19.989 5.2614 6.1065 1.0321 12.269 1.5925 18.434 1.657h36.982v170.03h135.37v-169.76h22.808c8.2933 0 16.554-0.96762 24.626-2.9069 8.257-1.9997 16.272-4.9792 23.811-8.9182 5.0074-2.5964 9.7665-5.6646 14.205-9.1722 4.1607-3.2818 8.0433-6.9144 11.547-10.886 3.5358-4.0035 7.5434-7.5393 11.986-10.511 4.6002-3.0682 9.5754-5.5114 14.833-7.2612l10.478-3.6326c10.519-3.2173 20.247-8.5997 28.605-15.772 9.7245-8.3538 17.332-18.925 22.122-30.851 2.3142-6.5709 3.7172-13.449 4.1607-20.43 0.43946-7.1346-0.12482-14.3-1.6893-21.277-1.1289-7.7288-3.9471-15.146-8.2288-21.686-5.0397-7.6934-12.023-13.985-20.183-18.241-3.1931-1.6893-6.4145-3.2206-9.7326-4.63-2.9714-1.2522-5.979-2.4098-9.0109-3.4415-2.6287-0.87408-5.3259-1.63-8.0151-2.2521-3.1246-0.72047-6.2855-1.2518-9.4786-1.626-4.322-0.50396-8.6682-0.84626-13.018-1.0628-3.5318-0.19314-7.1039-0.252-10.64-0.252h-15.639c-8.5126 0.0274-16.995-0.72087-25.381-2.2521-6.3822-1.1575-12.672-2.7875-18.836-4.8195l-11.019-4.1337c-4.5962-1.8115-9.2609-3.4689-14.014-4.8824-4.4793-1.3426-9.015-2.5001-13.579-3.4685v-171.75h-135.05v169.56h-16.958c-7.1934-0.24796-14.39-0.46848-21.619-0.68902-7