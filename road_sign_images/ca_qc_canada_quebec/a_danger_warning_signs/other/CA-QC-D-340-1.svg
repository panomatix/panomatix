<svg width="245.65" height="245.65" version="1.1" viewBox="82.992 45.607 719.57 792.32" xmlns="http://www.w3.org/2000/svg"><style type="text/css">/*
 * Below are Cascading Style Sheet (CSS) definitions in use in this file,
 * which allow easily changing how countries are displayed.
 *
 */

/*
 * Circles around small countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.circlexx
{
   opacity:1;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * Smaller circles around French DOMs and Chinese SARs
 *
 * Change opacity to 1 to display all subnational circles.
 *
 */
.subxx
{
   opacity:1;
   stroke-width:0.3;
}

/*
 * Circles around small, unrecognized countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.unxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.3;
}

/*
 * Circles around small countries, but with no permanent residents 
 *
 * Change opacity to 1 to display all circles.
 *
 */
.noxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * land
 */
.landxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.5;
   fill-rule:evenodd;
}

/*
 * Styles for coastlines of islands with no borders
 */
.coastxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.3;
   fill-rule:evenodd;
}

/*
 * Styles for nations with limited recognition
 */
.limitxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Styles for nations with no permanent population.
 */
.antxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Ocean
 */
.oceanxx
{
   opacity: 1;
   color: #000000;
   fill:#ffffff;
   stroke:#000;
   stroke-width:0.5;
   stroke-miterlimit:1;
}

/*
 * Additional style rules
 *
 * The following are examples of colouring countries.  You can substitute these with your own styles to colour the countries on the map.
 *
 * Color a few countries:
 *
 * .gb, .au, .nc
 * {
 *    fill:       #ff0000;
 * }
 *
 * Color a few small country circles (and the countries):
 *
 * .ms, .ky
 * {
 *    opacity:    1;
 *    fill:       #ff0000;
 * }
 *
 */

/* Same-sex marriage */
.ar, .be, .ca, .dk, .es, .is, .nl, .no, .pt, .se, .za
{ fill: #002255; }

/* Civil unions etc. */
.ad, .at, .au, .bl, .br, .ch, .co, .cz, .de, .ec, .fi, .fr, .gb, .gf, .gl, .hr, .hu, .ie, .il, .im, .je, .li, .lu, .mf, .nc, .nf, .nz, .pm, .re, .si, .uy, .wf
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.aw, .cw, .sx, .mx
{ fill: #7fbcff; }

/* Legal but no recognition */
.ai, .al, .am, .as, .az, .ba, .bg, .bf, .by, .bj, .bm, .bo, .bs, .cd, .cg, .cf, .ci, .cl, .cn, .cr, .cu, .cv, .cy, .dj, .do, .ee, .fk, .fj, .fm, .fo, .ga, .ge, .gg, .gi, .gq, .gr, .gs, .gt, .gu, .gw, .hn, .ht, .id, .in, .iq, .it, .jo, .jp, .kg, .kh, .kp, .kr, .ky, .kz, .la, .lk, .lt, .lv, .mc, .md, .me, .mg, .mh, .mk, .ml, .mn, .mp, .mt, .ms, .mz, .ne, .ni, .np, .pa, .pe, .pf, .ph, .pl, .pn, .pr, .py, .ro, .rs, .ru, .rw, .sh, .sk, .sm, .sr, .st, .sv, .tc, .td, .th, .tj, .tk, .tl, .tr, .tw, .ua, .us, .va, .ve, .vg, .vi, .vn, .vu, .xk, .ps_west_bank
{ fill: #cccccc; }

/* Illegal, minimal penalty */
.bt, .lb, .lr
{ fill: #f9dc36; }

/* Illegal, large penalty */
.ag, .ao, .bh, .bi, .bn, .bw, .bz, .cm, .ck, .dm, .dz, .eg, .eh, .er, .et, .gd, .gh, .gm, .gn, .jm, .ke, .ki, .km, .kn, .kw, .lc, .ls, .ly, .ma, .mu, .mv, .mw, .my, .na, .ng, .nr, .nu, .om, .pg, .pw, .qa, .sb, .sc, .sg, .sn, .so, .ss, .sy, .sz, .tg, .tm, .tn, .to, .tt, .tv, .uz, .vc, .ws, .zm, .zw, .xc, .ps_gaza_strip
{ fill: #ec8028; }

/* Illegal, life imprisonment */
.bb, .bd, .gy, .mm, .pk, .sl, .tz, .ug
{ fill: #e73e21; }

/* Illegal, death penalty */
.ae, .af, .ir, .mr, .sa, .sd, .ye
{ fill: #8c201f; }

/* SUB-NATIONAL UNITS */

/* Same-sex marriage */
.br_al, .mx_dif, .us_ct, .us_dc, .us_ia, .us_ma, .us_md, .us_nh, .us_ny, .us_vt, .us_wa
{ fill: #002255; }

/* Civil unions etc. */
.mx_coa, .uk_je, .us_ca, .us_co, .us_de, .us_hi, .us_il, .us_me, .us_nj, .us_nv, .us_or, .us_ri, .us_wi, .ve_l
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.bq
{ fill: #7fbcff; }

/* Illegal, large penalty */
.id_ac
{ fill: #ec8028; }

/* Illegal, death penalty */
.ng_sharia, .so_shabaab
{ fill: #8c201f; }</style><path d="m421.01 828.13-364.6-364.6c-12.19-12.192-12.19-31.349 0-43.542l364.6-364.6c12.19-12.194 31.35-12.194 43.542 0l364.6 364.6c12.188 12.194 12.188 31.35 0 43.542l-364.6 364.6c-12.192 12.192-31.353 12.192-43.542 0z" fill="#ffd520" fill-rule="evenodd"/><path d="m425.65 823.49c9.5794 9.5794 24.675 9.5794 34.255 0l364.6-364.6c9.5794-9.579 9.5794-24.672 0-34.543l-364.6-364.31c-9.5802-9.5793-24.676-9.5793-34.543 0l-364.31 364.31c-9.5793 9.8709-9.5793 24.964 0 34.543l364.6 364.6z" fill="#000" fill-rule="evenodd"/><path d="m433.49 815.36-364.31-364.31c-5.2247-5.2251-5.2247-13.35 0-18.579l364.31-364.6c5.2247-4.9334 13.351-4.9334 18.577 0l364.31 364.6c5.2251 5.2284 5.2251 13.353 0 18.579l-364.31 364.31c-5.2263 5.2251-13.353 5.2251-18.577 0z" fill="#ffd520" fill-rule="evenodd"/><path d="m490.09 731.76h21.191v-579.7h-21.191v10.162h1.7417l-1.7417 1.449v13.064l11.321-11.319v45.282l-11.321-11.32v13.064l5.5114 5.5122-5.5114 5.2284v13.06l11.321-11.319v45.282l-11.321-11.319v13.064l5.8057 5.5162-5.8057 5.5162v12.772l11.321-11.324v45.286l-11.321-11.324v13.064l5.5114 5.5162-5.5114 5.2247v13.355l11.321-11.324v44.995l-11.321-11.319v13.06l5.5114 5.5158-5.5114 5.2247v13.064l11.321-11.32v44.992l-11.321-11.029v12.771l1.4514 1.1611h-1.4514v280.42zm-17.417 0h17.417v-280.42h-17.417v280.42zm17.417-579.7h-17.417v10.162h17.417v-10.162zm0 11.611v13.064l-11.321 11.319 11.321 11.324v13.064l-17.417-17.71v-13.351l17.417-17.71zm0 59.511v13.06l-11.031 11.324 11.031 11.319v13.064l-17.417-17.709v-13.351l17.417-17.706zm0 59.799v12.772l-11.321 11.32 11.321 11.319v13.064l-17.417-17.706v-13.064l17.417-17.706zm0 59.216v13.355l-11.031 11.028 11.031 11.324v13.06l-17.417-17.415v-13.646l17.417-17.706zm0 59.507v13.064l-11.321 11.319 11.321 11.324v12.771l-17.417-17.417v-13.351l17.417-17.71zm-32.512 330.05h15.095v-280.42h-15.095v280.42zm15.095-579.7h-15.095v10.162h15.095v-10.162zm0 29.321v13.351h-0.29028l-14.805 14.804v-13.06l8.1239-8.4219-8.1239-8.1264v-13.064l14.805 14.804 0.29028-0.287