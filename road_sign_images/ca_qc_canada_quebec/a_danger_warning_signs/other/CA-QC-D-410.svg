<svg width="245.71" height="245.7" version="1.1" viewBox="82.992 45.607 719.75 792.48" xmlns="http://www.w3.org/2000/svg"><style type="text/css">/*
 * Below are Cascading Style Sheet (CSS) definitions in use in this file,
 * which allow easily changing how countries are displayed.
 *
 */

/*
 * Circles around small countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.circlexx
{
   opacity:1;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * Smaller circles around French DOMs and Chinese SARs
 *
 * Change opacity to 1 to display all subnational circles.
 *
 */
.subxx
{
   opacity:1;
   stroke-width:0.3;
}

/*
 * Circles around small, unrecognized countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.unxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.3;
}

/*
 * Circles around small countries, but with no permanent residents 
 *
 * Change opacity to 1 to display all circles.
 *
 */
.noxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * land
 */
.landxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.5;
   fill-rule:evenodd;
}

/*
 * Styles for coastlines of islands with no borders
 */
.coastxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.3;
   fill-rule:evenodd;
}

/*
 * Styles for nations with limited recognition
 */
.limitxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Styles for nations with no permanent population.
 */
.antxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Ocean
 */
.oceanxx
{
   opacity: 1;
   color: #000000;
   fill:#ffffff;
   stroke:#000;
   stroke-width:0.5;
   stroke-miterlimit:1;
}

/*
 * Additional style rules
 *
 * The following are examples of colouring countries.  You can substitute these with your own styles to colour the countries on the map.
 *
 * Color a few countries:
 *
 * .gb, .au, .nc
 * {
 *    fill:       #ff0000;
 * }
 *
 * Color a few small country circles (and the countries):
 *
 * .ms, .ky
 * {
 *    opacity:    1;
 *    fill:       #ff0000;
 * }
 *
 */

/* Same-sex marriage */
.ar, .be, .ca, .dk, .es, .is, .nl, .no, .pt, .se, .za
{ fill: #002255; }

/* Civil unions etc. */
.ad, .at, .au, .bl, .br, .ch, .co, .cz, .de, .ec, .fi, .fr, .gb, .gf, .gl, .hr, .hu, .ie, .il, .im, .je, .li, .lu, .mf, .nc, .nf, .nz, .pm, .re, .si, .uy, .wf
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.aw, .cw, .sx, .mx
{ fill: #7fbcff; }

/* Legal but no recognition */
.ai, .al, .am, .as, .az, .ba, .bg, .bf, .by, .bj, .bm, .bo, .bs, .cd, .cg, .cf, .ci, .cl, .cn, .cr, .cu, .cv, .cy, .dj, .do, .ee, .fk, .fj, .fm, .fo, .ga, .ge, .gg, .gi, .gq, .gr, .gs, .gt, .gu, .gw, .hn, .ht, .id, .in, .iq, .it, .jo, .jp, .kg, .kh, .kp, .kr, .ky, .kz, .la, .lk, .lt, .lv, .mc, .md, .me, .mg, .mh, .mk, .ml, .mn, .mp, .mt, .ms, .mz, .ne, .ni, .np, .pa, .pe, .pf, .ph, .pl, .pn, .pr, .py, .ro, .rs, .ru, .rw, .sh, .sk, .sm, .sr, .st, .sv, .tc, .td, .th, .tj, .tk, .tl, .tr, .tw, .ua, .us, .va, .ve, .vg, .vi, .vn, .vu, .xk, .ps_west_bank
{ fill: #cccccc; }

/* Illegal, minimal penalty */
.bt, .lb, .lr
{ fill: #f9dc36; }

/* Illegal, large penalty */
.ag, .ao, .bh, .bi, .bn, .bw, .bz, .cm, .ck, .dm, .dz, .eg, .eh, .er, .et, .gd, .gh, .gm, .gn, .jm, .ke, .ki, .km, .kn, .kw, .lc, .ls, .ly, .ma, .mu, .mv, .mw, .my, .na, .ng, .nr, .nu, .om, .pg, .pw, .qa, .sb, .sc, .sg, .sn, .so, .ss, .sy, .sz, .tg, .tm, .tn, .to, .tt, .tv, .uz, .vc, .ws, .zm, .zw, .xc, .ps_gaza_strip
{ fill: #ec8028; }

/* Illegal, life imprisonment */
.bb, .bd, .gy, .mm, .pk, .sl, .tz, .ug
{ fill: #e73e21; }

/* Illegal, death penalty */
.ae, .af, .ir, .mr, .sa, .sd, .ye
{ fill: #8c201f; }

/* SUB-NATIONAL UNITS */

/* Same-sex marriage */
.br_al, .mx_dif, .us_ct, .us_dc, .us_ia, .us_ma, .us_md, .us_nh, .us_ny, .us_vt, .us_wa
{ fill: #002255; }

/* Civil unions etc. */
.mx_coa, .uk_je, .us_ca, .us_co, .us_de, .us_hi, .us_il, .us_me, .us_nj, .us_nv, .us_or, .us_ri, .us_wi, .ve_l
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.bq
{ fill: #7fbcff; }

/* Illegal, large penalty */
.id_ac
{ fill: #ec8028; }

/* Illegal, death penalty */
.ng_sharia, .so_shabaab
{ fill: #8c201f; }</style><path d="m420.89 828.33-364.52-364.52c-12.15-12.119-12.15-31.799 0-43.95l364.52-364.52c12.115-12.115 31.835-12.115 43.951 0l364.52 364.52c12.148 12.15 12.148 31.831 0 43.95l-364.52 364.52c-12.152 12.152-31.804 12.152-43.951 0z" fill="#ffd520" fill-rule="evenodd"/><path d="m425.47 823.81c9.6221 9.6237 25.157 9.6237 34.779 0l364.56-364.56c9.5955-9.5935 9.6238-25.18 0-34.806l-364.53-364.53c-9.5983-9.5951-25.237-9.5951-34.835 0l-364.53 364.53c-9.6265 9.6266-9.595 25.213 0 34.806l364.56 364.56z" fill="#000" fill-rule="evenodd"/><path d="m65.174 440.74c0.2638-2.9964 1.5158-5.9295 3.8152-8.2171l364.55-364.56c5.1421-5.1224 13.528-5.1224 18.646 0l364.55 364.56c2.2981 2.2876 3.556 5.2207 3.814 8.2171h-211.75v108.49c-8.0715 4.4792-9.144 17.917-22.412 18.203-16.087 0.22964-11.543-19.816-28.807-19.655-15.365 0.0361-12.748 19.884-28.391 19.755-16.2-0.26222-12.619-20.009-29.02-19.755-16.716 0.28609-13.53 19.784-29.125 19.461-10.942-0.25416-13.607-9.3456-17.236-13.337-3.4229-3.8987-7.1321-6.2855-11.861-6.2169h-0.3935c-1.3547 0.12901-7.1539 0.21771-11.489 6.2169-3.9729 5.5114-6.0871 13.821-17.237 13.53-15.438-0.3548-13.796-19.465-28.97-19.747-16.166-0.35479-11.886 19.586-28.809 19.848-17.162 0.29028-12.044-18.691-29.415-19.755-15.017-1.0321-12.847 19.3-29.253 19.594-12.981 0.16127-12.509-12.926-20.997-17.853v-108.78h-210.21z" fill="#ffd520" fill-rule="evenodd"/><path d="m433.52 815.73-229.6-229.61c1.6732-0.70555 3.7088-1.0966 6.2444-1.1571 15.643-0.16127 11.776 20.364 28.86 19.909 16.615-0.32254 11.599-19.199 28.494-19.683 16.8-0.51606 14.134 20.715 28.864 19.784 18.391-1.1571 12.41-19.364 29.202-19.755 15.466-0.25416 12.068 19.461 29.411 19.917 15.308 0.32254 11.623-20.171 28.812-19.917 16.556 0.16127 12.848 19.461 28.915 19.816 11.832 0.13288 14.261-10.728 19.612-15.978 4.2874-4.1608 9.3508-3.7374 9.4572-3.8664v-0.10063c4.6498-0.0645 9.0911 2.3223 11.78 6.0274 4.443 6.1565 9.6116 14.018 17.345 13.627 16.796-0.76602 12.067-19.526 29.149-19.719 15.748-0.129