<svg width="241.56" height="241.56" version="1.1" viewBox="82.992 45.607 707.58 779.11" xmlns="http://www.w3.org/2000/svg"><style type="text/css">/*
 * Below are Cascading Style Sheet (CSS) definitions in use in this file,
 * which allow easily changing how countries are displayed.
 *
 */

/*
 * Circles around small countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.circlexx
{
   opacity:1;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * Smaller circles around French DOMs and Chinese SARs
 *
 * Change opacity to 1 to display all subnational circles.
 *
 */
.subxx
{
   opacity:1;
   stroke-width:0.3;
}

/*
 * Circles around small, unrecognized countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.unxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.3;
}

/*
 * Circles around small countries, but with no permanent residents 
 *
 * Change opacity to 1 to display all circles.
 *
 */
.noxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * land
 */
.landxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.5;
   fill-rule:evenodd;
}

/*
 * Styles for coastlines of islands with no borders
 */
.coastxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.3;
   fill-rule:evenodd;
}

/*
 * Styles for nations with limited recognition
 */
.limitxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Styles for nations with no permanent population.
 */
.antxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Ocean
 */
.oceanxx
{
   opacity: 1;
   color: #000000;
   fill:#ffffff;
   stroke:#000;
   stroke-width:0.5;
   stroke-miterlimit:1;
}

/*
 * Additional style rules
 *
 * The following are examples of colouring countries.  You can substitute these with your own styles to colour the countries on the map.
 *
 * Color a few countries:
 *
 * .gb, .au, .nc
 * {
 *    fill:       #ff0000;
 * }
 *
 * Color a few small country circles (and the countries):
 *
 * .ms, .ky
 * {
 *    opacity:    1;
 *    fill:       #ff0000;
 * }
 *
 */

/* Same-sex marriage */
.ar, .be, .ca, .dk, .es, .is, .nl, .no, .pt, .se, .za
{ fill: #002255; }

/* Civil unions etc. */
.ad, .at, .au, .bl, .br, .ch, .co, .cz, .de, .ec, .fi, .fr, .gb, .gf, .gl, .hr, .hu, .ie, .il, .im, .je, .li, .lu, .mf, .nc, .nf, .nz, .pm, .re, .si, .uy, .wf
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.aw, .cw, .sx, .mx
{ fill: #7fbcff; }

/* Legal but no recognition */
.ai, .al, .am, .as, .az, .ba, .bg, .bf, .by, .bj, .bm, .bo, .bs, .cd, .cg, .cf, .ci, .cl, .cn, .cr, .cu, .cv, .cy, .dj, .do, .ee, .fk, .fj, .fm, .fo, .ga, .ge, .gg, .gi, .gq, .gr, .gs, .gt, .gu, .gw, .hn, .ht, .id, .in, .iq, .it, .jo, .jp, .kg, .kh, .kp, .kr, .ky, .kz, .la, .lk, .lt, .lv, .mc, .md, .me, .mg, .mh, .mk, .ml, .mn, .mp, .mt, .ms, .mz, .ne, .ni, .np, .pa, .pe, .pf, .ph, .pl, .pn, .pr, .py, .ro, .rs, .ru, .rw, .sh, .sk, .sm, .sr, .st, .sv, .tc, .td, .th, .tj, .tk, .tl, .tr, .tw, .ua, .us, .va, .ve, .vg, .vi, .vn, .vu, .xk, .ps_west_bank
{ fill: #cccccc; }

/* Illegal, minimal penalty */
.bt, .lb, .lr
{ fill: #f9dc36; }

/* Illegal, large penalty */
.ag, .ao, .bh, .bi, .bn, .bw, .bz, .cm, .ck, .dm, .dz, .eg, .eh, .er, .et, .gd, .gh, .gm, .gn, .jm, .ke, .ki, .km, .kn, .kw, .lc, .ls, .ly, .ma, .mu, .mv, .mw, .my, .na, .ng, .nr, .nu, .om, .pg, .pw, .qa, .sb, .sc, .sg, .sn, .so, .ss, .sy, .sz, .tg, .tm, .tn, .to, .tt, .tv, .uz, .vc, .ws, .zm, .zw, .xc, .ps_gaza_strip
{ fill: #ec8028; }

/* Illegal, life imprisonment */
.bb, .bd, .gy, .mm, .pk, .sl, .tz, .ug
{ fill: #e73e21; }

/* Illegal, death penalty */
.ae, .af, .ir, .mr, .sa, .sd, .ye
{ fill: #8c201f; }

/* SUB-NATIONAL UNITS */

/* Same-sex marriage */
.br_al, .mx_dif, .us_ct, .us_dc, .us_ia, .us_ma, .us_md, .us_nh, .us_ny, .us_vt, .us_wa
{ fill: #002255; }

/* Civil unions etc. */
.mx_coa, .uk_je, .us_ca, .us_co, .us_de, .us_hi, .us_il, .us_me, .us_nj, .us_nv, .us_or, .us_ri, .us_wi, .ve_l
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.bq
{ fill: #7fbcff; }

/* Illegal, large penalty */
.id_ac
{ fill: #ec8028; }

/* Illegal, death penalty */
.ng_sharia, .so_shabaab
{ fill: #8c201f; }</style><path d="m403.62 810.33-341.99-341.97c-18.328-18.328-18.351-48.07-0.0236-66.397l341.99-341.96c18.3-18.328 48.046-18.328 66.378 0l341.98 342.01c18.328 18.331 18.304 48.022 0 66.35l-341.98 341.97c-18.332 18.328-48.026 18.328-66.354 0z" fill="#ffd520" fill-rule="evenodd"/><path d="m409.33 804.62c15.182 15.184 39.75 15.184 54.932 0l341.97-341.97c15.184-15.18 15.184-39.75 0-54.94l-341.97-341.96c-15.182-15.186-39.75-15.186-54.932 0l-341.96 341.96c-15.186 15.19-15.186 39.76 0 54.94l341.96 341.97z" fill="#000" fill-rule="evenodd"/><path d="m419.43 794.51-341.99-341.97c-9.5754-9.5742-9.5754-25.146 0-34.725l341.99-342.01c9.5754-9.5793 25.143-9.5282 34.717 0.0472l341.97 341.96c9.5996 9.5794 9.5996 25.151 0.0226 34.725l-341.99 341.97c-9.5738 9.5754-25.142 9.5754-34.717 0z" fill="#ffd520" fill-rule="evenodd"/><path d="m308.59 658.08 131.98-61.464 18.835 12.861-130.04 69.35 108.09 107.94 351.15-351.27-578.61 124.09 98.608 98.487z" fill="#000" fill-rule="evenodd"/><path d="m488.46 480.35c3.7132-0.82247 5.1243-4.6889 5.9146-8.011l23.602-98.063c23.541-5.315 46.353-13.654 67.894-24.722 18.445-9.4846 35.781-20.875 51.839-34.14 3.6124-5.4844 3.7737-12.544 0.49187-18.257-3.6165-6.1698-10.636-9.5516-17.695-8.532-3.6116 0.51969-7.2603 0.59065-10.832 0.19675-4.072-0.42898-8.1118-1.445-11.95-2.9569-6.3097-0.7874-12.676-0.35802-18.877 1.1184-7.4869 1.8699-14.518 5.2836-20.558 10.079l-72.418 27.147-242.16-42.774c-4.5276-0.79143-9.7483-0.39753-12.768 3.3467l-8.867 11.099 128.07 48.586 27.935 22.226-47.341 18.351-36.668-26.686c-1.5474-1.807-3.5157-3.252-5.7835-4.2051-2.2602-0.92125-4.7562-1.2797-7.2841-1.0156l-11.26 2.6892 6.0395 32.667-47.046-11.229c-3.4137-1.016-7.0596-0.29544-9.8511 1.9054-2.5594 1.9687-4.0712 5.0199-4.2011 8.2368l52.133 35.427c-2.0671 0.72448-3.2169 2.8899-2.7246 5.0199 0.65758 2.6299 3.7088 2.8899 6.0395 2.7287l8.9654-0.42936 24.427 21.7c2.5589 2.036 6.0395 2.79 9.2879 1.9675 3.1222-0.75393 5.8154-2.8867 7.2249-5.8097l0.68902-19.5 108.83-20.651 28