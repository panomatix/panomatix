<svg width="241.56" height="241.56" version="1.1" viewBox="82.992 45.607 707.58 779.11" xmlns="http://www.w3.org/2000/svg"><style type="text/css">/*
 * Below are Cascading Style Sheet (CSS) definitions in use in this file,
 * which allow easily changing how countries are displayed.
 *
 */

/*
 * Circles around small countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.circlexx
{
   opacity:1;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * Smaller circles around French DOMs and Chinese SARs
 *
 * Change opacity to 1 to display all subnational circles.
 *
 */
.subxx
{
   opacity:1;
   stroke-width:0.3;
}

/*
 * Circles around small, unrecognized countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.unxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.3;
}

/*
 * Circles around small countries, but with no permanent residents 
 *
 * Change opacity to 1 to display all circles.
 *
 */
.noxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * land
 */
.landxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.5;
   fill-rule:evenodd;
}

/*
 * Styles for coastlines of islands with no borders
 */
.coastxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.3;
   fill-rule:evenodd;
}

/*
 * Styles for nations with limited recognition
 */
.limitxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Styles for nations with no permanent population.
 */
.antxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Ocean
 */
.oceanxx
{
   opacity: 1;
   color: #000000;
   fill:#ffffff;
   stroke:#000;
   stroke-width:0.5;
   stroke-miterlimit:1;
}

/*
 * Additional style rules
 *
 * The following are examples of colouring countries.  You can substitute these with your own styles to colour the countries on the map.
 *
 * Color a few countries:
 *
 * .gb, .au, .nc
 * {
 *    fill:       #ff0000;
 * }
 *
 * Color a few small country circles (and the countries):
 *
 * .ms, .ky
 * {
 *    opacity:    1;
 *    fill:       #ff0000;
 * }
 *
 */

/* Same-sex marriage */
.ar, .be, .ca, .dk, .es, .is, .nl, .no, .pt, .se, .za
{ fill: #002255; }

/* Civil unions etc. */
.ad, .at, .au, .bl, .br, .ch, .co, .cz, .de, .ec, .fi, .fr, .gb, .gf, .gl, .hr, .hu, .ie, .il, .im, .je, .li, .lu, .mf, .nc, .nf, .nz, .pm, .re, .si, .uy, .wf
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.aw, .cw, .sx, .mx
{ fill: #7fbcff; }

/* Legal but no recognition */
.ai, .al, .am, .as, .az, .ba, .bg, .bf, .by, .bj, .bm, .bo, .bs, .cd, .cg, .cf, .ci, .cl, .cn, .cr, .cu, .cv, .cy, .dj, .do, .ee, .fk, .fj, .fm, .fo, .ga, .ge, .gg, .gi, .gq, .gr, .gs, .gt, .gu, .gw, .hn, .ht, .id, .in, .iq, .it, .jo, .jp, .kg, .kh, .kp, .kr, .ky, .kz, .la, .lk, .lt, .lv, .mc, .md, .me, .mg, .mh, .mk, .ml, .mn, .mp, .mt, .ms, .mz, .ne, .ni, .np, .pa, .pe, .pf, .ph, .pl, .pn, .pr, .py, .ro, .rs, .ru, .rw, .sh, .sk, .sm, .sr, .st, .sv, .tc, .td, .th, .tj, .tk, .tl, .tr, .tw, .ua, .us, .va, .ve, .vg, .vi, .vn, .vu, .xk, .ps_west_bank
{ fill: #cccccc; }

/* Illegal, minimal penalty */
.bt, .lb, .lr
{ fill: #f9dc36; }

/* Illegal, large penalty */
.ag, .ao, .bh, .bi, .bn, .bw, .bz, .cm, .ck, .dm, .dz, .eg, .eh, .er, .et, .gd, .gh, .gm, .gn, .jm, .ke, .ki, .km, .kn, .kw, .lc, .ls, .ly, .ma, .mu, .mv, .mw, .my, .na, .ng, .nr, .nu, .om, .pg, .pw, .qa, .sb, .sc, .sg, .sn, .so, .ss, .sy, .sz, .tg, .tm, .tn, .to, .tt, .tv, .uz, .vc, .ws, .zm, .zw, .xc, .ps_gaza_strip
{ fill: #ec8028; }

/* Illegal, life imprisonment */
.bb, .bd, .gy, .mm, .pk, .sl, .tz, .ug
{ fill: #e73e21; }

/* Illegal, death penalty */
.ae, .af, .ir, .mr, .sa, .sd, .ye
{ fill: #8c201f; }

/* SUB-NATIONAL UNITS */

/* Same-sex marriage */
.br_al, .mx_dif, .us_ct, .us_dc, .us_ia, .us_ma, .us_md, .us_nh, .us_ny, .us_vt, .us_wa
{ fill: #002255; }

/* Civil unions etc. */
.mx_coa, .uk_je, .us_ca, .us_co, .us_de, .us_hi, .us_il, .us_me, .us_nj, .us_nv, .us_or, .us_ri, .us_wi, .ve_l
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.bq
{ fill: #7fbcff; }

/* Illegal, large penalty */
.id_ac
{ fill: #ec8028; }

/* Illegal, death penalty */
.ng_sharia, .so_shabaab
{ fill: #8c201f; }</style><path d="m403.62 810.33-341.99-341.97c-18.328-18.328-18.351-48.07-0.0236-66.397l341.99-341.96c18.3-18.328 48.046-18.328 66.378 0l341.98 342.01c18.328 18.331 18.304 48.022 0 66.35l-341.98 341.97c-18.332 18.328-48.026 18.328-66.354 0z" fill="#ffd520" fill-rule="evenodd"/><path d="m409.33 804.62c15.182 15.184 39.75 15.184 54.932 0l341.97-341.97c15.184-15.18 15.184-39.75 0-54.94l-341.97-341.96c-15.182-15.186-39.75-15.186-54.932 0l-341.96 341.96c-15.186 15.19-15.186 39.76 0 54.94l341.96 341.97z" fill="#000" fill-rule="evenodd"/><path d="m419.43 794.51-341.99-341.97c-9.5754-9.5742-9.5754-25.146 0-34.725l341.99-342.01c9.5754-9.5793 25.144-9.5281 34.717 0.04721l341.97 341.96c9.5996 9.5794 9.5996 25.151 0.0226 34.725l-341.99 341.97c-9.5737 9.5754-25.142 9.5754-34.717 0z" fill="#ffd520" fill-rule="evenodd"/><path d="m308.59 658.08 131.98-61.464 18.835 12.861-130.04 69.35 108.09 107.94 351.15-351.27-578.61 124.09 98.608 98.487z" fill="#000" fill-rule="evenodd"/><path d="m501.22 439.79 10.063-2.1969 17.34-4.2168 49.703-14.536 15.171-4.7522 9.8536-3.4689 12.373-4.3268c3.8302-1.3466 5.6001-2.1614 9.4665-3.8979 0.85069-0.42897 1.6611-0.96074 2.5884-1.4212l3.9309 5.815 1.6651-1.0273 6.3822 11.626c-0.38705 0.2519-0.81441 0.49629-1.1289 0.77973-5.713 4.3978-6.8418 12.623-2.4473 18.434 4.4268 5.7089 12.692 6.8781 18.469 2.4094 5.6041-4.3898 6.737-12.689 2.3747-18.398-2.161-2.7956-5.1445-4.5006-8.2247-4.9651l0.53219-14.709-8.0836-4.0753 0.81844-4.5393c0.6733-0.42533 1.4514-1.0632 2.3021-1.4176l2.5884-1.811 2.2296-1.9804 1.4917-1.776-1.6288-6.0279 7.7288-9.8902c0.56444-0.74426 1.5603-2.1223 1.0966-4.4293l-0.6733-2.5868c-1.0281-3.1931-4.0761-3.7959-6.2048-4.4337-4.3583-1.4172-8.8658-2.0904-13.434-2.6613-7.3378-1.1301-15.671-2.3388-23.154-2.1223l-19.002 0.21287-18.042 0.24797-20.666 0.24797-21.876-7.6619c-7.5877-2.6932-13.119-3.3661-19.425-1.9094l-17.159 3.9688-31.411 8.4017-73.705 19.745-30.451 10.068-85.119 16.383-3.8664-0.0745-5.138-1.7365-3.508-1.878-69.343-4