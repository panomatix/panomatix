<svg width="241.56" height="241.56" version="1.1" viewBox="82.992 45.607 707.58 779.11" xmlns="http://www.w3.org/2000/svg"><style type="text/css">/*
 * Below are Cascading Style Sheet (CSS) definitions in use in this file,
 * which allow easily changing how countries are displayed.
 *
 */

/*
 * Circles around small countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.circlexx
{
   opacity:1;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * Smaller circles around French DOMs and Chinese SARs
 *
 * Change opacity to 1 to display all subnational circles.
 *
 */
.subxx
{
   opacity:1;
   stroke-width:0.3;
}

/*
 * Circles around small, unrecognized countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.unxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.3;
}

/*
 * Circles around small countries, but with no permanent residents 
 *
 * Change opacity to 1 to display all circles.
 *
 */
.noxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * land
 */
.landxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.5;
   fill-rule:evenodd;
}

/*
 * Styles for coastlines of islands with no borders
 */
.coastxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.3;
   fill-rule:evenodd;
}

/*
 * Styles for nations with limited recognition
 */
.limitxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Styles for nations with no permanent population.
 */
.antxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Ocean
 */
.oceanxx
{
   opacity: 1;
   color: #000000;
   fill:#ffffff;
   stroke:#000;
   stroke-width:0.5;
   stroke-miterlimit:1;
}

/*
 * Additional style rules
 *
 * The following are examples of colouring countries.  You can substitute these with your own styles to colour the countries on the map.
 *
 * Color a few countries:
 *
 * .gb, .au, .nc
 * {
 *    fill:       #ff0000;
 * }
 *
 * Color a few small country circles (and the countries):
 *
 * .ms, .ky
 * {
 *    opacity:    1;
 *    fill:       #ff0000;
 * }
 *
 */

/* Same-sex marriage */
.ar, .be, .ca, .dk, .es, .is, .nl, .no, .pt, .se, .za
{ fill: #002255; }

/* Civil unions etc. */
.ad, .at, .au, .bl, .br, .ch, .co, .cz, .de, .ec, .fi, .fr, .gb, .gf, .gl, .hr, .hu, .ie, .il, .im, .je, .li, .lu, .mf, .nc, .nf, .nz, .pm, .re, .si, .uy, .wf
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.aw, .cw, .sx, .mx
{ fill: #7fbcff; }

/* Legal but no recognition */
.ai, .al, .am, .as, .az, .ba, .bg, .bf, .by, .bj, .bm, .bo, .bs, .cd, .cg, .cf, .ci, .cl, .cn, .cr, .cu, .cv, .cy, .dj, .do, .ee, .fk, .fj, .fm, .fo, .ga, .ge, .gg, .gi, .gq, .gr, .gs, .gt, .gu, .gw, .hn, .ht, .id, .in, .iq, .it, .jo, .jp, .kg, .kh, .kp, .kr, .ky, .kz, .la, .lk, .lt, .lv, .mc, .md, .me, .mg, .mh, .mk, .ml, .mn, .mp, .mt, .ms, .mz, .ne, .ni, .np, .pa, .pe, .pf, .ph, .pl, .pn, .pr, .py, .ro, .rs, .ru, .rw, .sh, .sk, .sm, .sr, .st, .sv, .tc, .td, .th, .tj, .tk, .tl, .tr, .tw, .ua, .us, .va, .ve, .vg, .vi, .vn, .vu, .xk, .ps_west_bank
{ fill: #cccccc; }

/* Illegal, minimal penalty */
.bt, .lb, .lr
{ fill: #f9dc36; }

/* Illegal, large penalty */
.ag, .ao, .bh, .bi, .bn, .bw, .bz, .cm, .ck, .dm, .dz, .eg, .eh, .er, .et, .gd, .gh, .gm, .gn, .jm, .ke, .ki, .km, .kn, .kw, .lc, .ls, .ly, .ma, .mu, .mv, .mw, .my, .na, .ng, .nr, .nu, .om, .pg, .pw, .qa, .sb, .sc, .sg, .sn, .so, .ss, .sy, .sz, .tg, .tm, .tn, .to, .tt, .tv, .uz, .vc, .ws, .zm, .zw, .xc, .ps_gaza_strip
{ fill: #ec8028; }

/* Illegal, life imprisonment */
.bb, .bd, .gy, .mm, .pk, .sl, .tz, .ug
{ fill: #e73e21; }

/* Illegal, death penalty */
.ae, .af, .ir, .mr, .sa, .sd, .ye
{ fill: #8c201f; }

/* SUB-NATIONAL UNITS */

/* Same-sex marriage */
.br_al, .mx_dif, .us_ct, .us_dc, .us_ia, .us_ma, .us_md, .us_nh, .us_ny, .us_vt, .us_wa
{ fill: #002255; }

/* Civil unions etc. */
.mx_coa, .uk_je, .us_ca, .us_co, .us_de, .us_hi, .us_il, .us_me, .us_nj, .us_nv, .us_or, .us_ri, .us_wi, .ve_l
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.bq
{ fill: #7fbcff; }

/* Illegal, large penalty */
.id_ac
{ fill: #ec8028; }

/* Illegal, death penalty */
.ng_sharia, .so_shabaab
{ fill: #8c201f; }</style><path d="m403.62 810.33-341.99-341.97c-18.328-18.328-18.351-48.07-0.0236-66.397l341.99-341.96c18.3-18.328 48.046-18.328 66.378 0l341.98 342.01c18.328 18.331 18.304 48.022 0 66.35l-341.98 341.97c-18.332 18.328-48.026 18.328-66.354 0z" fill="#ffd520" fill-rule="evenodd"/><path d="m409.33 804.62c15.182 15.184 39.75 15.184 54.932 0l341.97-341.97c15.184-15.18 15.184-39.75 0-54.94l-341.97-341.96c-15.182-15.186-39.75-15.186-54.932 0l-341.96 341.96c-15.186 15.19-15.186 39.76 0 54.94l341.96 341.97z" fill="#000" fill-rule="evenodd"/><path d="m419.43 794.51-341.99-341.97c-9.5754-9.5742-9.5754-25.146 0-34.725l341.99-342.01c9.5754-9.5793 25.143-9.5282 34.717 0.0472l341.97 341.96c9.5996 9.5794 9.5996 25.151 0.0226 34.725l-341.99 341.97c-9.5737 9.5754-25.142 9.5754-34.717 0z" fill="#ffd520" fill-rule="evenodd"/><path d="m308.59 658.08 131.98-61.464 18.835 12.861-130.04 69.35 108.09 107.94 351.15-351.27-578.61 124.09 98.608 98.487z" fill="#000" fill-rule="evenodd"/><path d="m608.15 310.03-0.51606 0.0629-2.7174 0.57492-0.29448-1.63-8.4912-2.7085-55.993 8.5477-25.501-14.355c-1.391-2.5198-3.3786-4.8151-5.6928-6.764-1.7619-1.3385-3.6366-2.5198-5.6202-3.4451-0.62895 0.0355-1.2136 0-1.8344-0.0943-0.58863 0-1.2498-0.0319-1.8748-0.0669l-59.414 17.04c-0.76764-0.0313-1.5433 0.252-2.1299 0.82691-0.58664 0.48018-0.95675 1.118-1.1027 1.9135l-13.556 20.45c-21.127 13.142-44.199 23.127-68.303 29.541-23.588 6.2798-48.168 9.1226-72.563 8.3235-5.4767-0.66564-10.583-2.5198-15.174-5.6146-4.3349-2.8387-8.1223-6.7918-10.804-11.418l-22.56-39.046c-0.256-0.79909-0.84263-1.5357-1.7598-1.9489-0.69709-0.35035-1.5474-0.53944-2.394-0.252l-29.387 8.8351c-1.0317 0.53944-1.878 1.4333-2.5001 2.4255-0.70111 1.303-0.95673 2.8347-0.73619 4.2087l10.032 78.378c1.9844 4.5002 5.288 8.2606 9.477 10.942 4.8155 2.9371 10.548 4.1184 16.241 3.256l210.05-22.588 25.055 32.159-96.63 20.284-54.007 14.292 2.5001 14.45 166.95-11.321 1.7659 2.1005 88.101-19.042c19.179-2.4279 37.516-9.2826 53.647-19.905 13.962