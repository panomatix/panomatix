<svg width="242.14" height="242.15" version="1.1" viewBox="82.992 45.607 709.3 781.03" xmlns="http://www.w3.org/2000/svg"><style type="text/css">/*
 * Below are Cascading Style Sheet (CSS) definitions in use in this file,
 * which allow easily changing how countries are displayed.
 *
 */

/*
 * Circles around small countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.circlexx
{
   opacity:1;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * Smaller circles around French DOMs and Chinese SARs
 *
 * Change opacity to 1 to display all subnational circles.
 *
 */
.subxx
{
   opacity:1;
   stroke-width:0.3;
}

/*
 * Circles around small, unrecognized countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.unxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.3;
}

/*
 * Circles around small countries, but with no permanent residents 
 *
 * Change opacity to 1 to display all circles.
 *
 */
.noxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * land
 */
.landxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.5;
   fill-rule:evenodd;
}

/*
 * Styles for coastlines of islands with no borders
 */
.coastxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.3;
   fill-rule:evenodd;
}

/*
 * Styles for nations with limited recognition
 */
.limitxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Styles for nations with no permanent population.
 */
.antxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Ocean
 */
.oceanxx
{
   opacity: 1;
   color: #000000;
   fill:#ffffff;
   stroke:#000;
   stroke-width:0.5;
   stroke-miterlimit:1;
}

/*
 * Additional style rules
 *
 * The following are examples of colouring countries.  You can substitute these with your own styles to colour the countries on the map.
 *
 * Color a few countries:
 *
 * .gb, .au, .nc
 * {
 *    fill:       #ff0000;
 * }
 *
 * Color a few small country circles (and the countries):
 *
 * .ms, .ky
 * {
 *    opacity:    1;
 *    fill:       #ff0000;
 * }
 *
 */

/* Same-sex marriage */
.ar, .be, .ca, .dk, .es, .is, .nl, .no, .pt, .se, .za
{ fill: #002255; }

/* Civil unions etc. */
.ad, .at, .au, .bl, .br, .ch, .co, .cz, .de, .ec, .fi, .fr, .gb, .gf, .gl, .hr, .hu, .ie, .il, .im, .je, .li, .lu, .mf, .nc, .nf, .nz, .pm, .re, .si, .uy, .wf
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.aw, .cw, .sx, .mx
{ fill: #7fbcff; }

/* Legal but no recognition */
.ai, .al, .am, .as, .az, .ba, .bg, .bf, .by, .bj, .bm, .bo, .bs, .cd, .cg, .cf, .ci, .cl, .cn, .cr, .cu, .cv, .cy, .dj, .do, .ee, .fk, .fj, .fm, .fo, .ga, .ge, .gg, .gi, .gq, .gr, .gs, .gt, .gu, .gw, .hn, .ht, .id, .in, .iq, .it, .jo, .jp, .kg, .kh, .kp, .kr, .ky, .kz, .la, .lk, .lt, .lv, .mc, .md, .me, .mg, .mh, .mk, .ml, .mn, .mp, .mt, .ms, .mz, .ne, .ni, .np, .pa, .pe, .pf, .ph, .pl, .pn, .pr, .py, .ro, .rs, .ru, .rw, .sh, .sk, .sm, .sr, .st, .sv, .tc, .td, .th, .tj, .tk, .tl, .tr, .tw, .ua, .us, .va, .ve, .vg, .vi, .vn, .vu, .xk, .ps_west_bank
{ fill: #cccccc; }

/* Illegal, minimal penalty */
.bt, .lb, .lr
{ fill: #f9dc36; }

/* Illegal, large penalty */
.ag, .ao, .bh, .bi, .bn, .bw, .bz, .cm, .ck, .dm, .dz, .eg, .eh, .er, .et, .gd, .gh, .gm, .gn, .jm, .ke, .ki, .km, .kn, .kw, .lc, .ls, .ly, .ma, .mu, .mv, .mw, .my, .na, .ng, .nr, .nu, .om, .pg, .pw, .qa, .sb, .sc, .sg, .sn, .so, .ss, .sy, .sz, .tg, .tm, .tn, .to, .tt, .tv, .uz, .vc, .ws, .zm, .zw, .xc, .ps_gaza_strip
{ fill: #ec8028; }

/* Illegal, life imprisonment */
.bb, .bd, .gy, .mm, .pk, .sl, .tz, .ug
{ fill: #e73e21; }

/* Illegal, death penalty */
.ae, .af, .ir, .mr, .sa, .sd, .ye
{ fill: #8c201f; }

/* SUB-NATIONAL UNITS */

/* Same-sex marriage */
.br_al, .mx_dif, .us_ct, .us_dc, .us_ia, .us_ma, .us_md, .us_nh, .us_ny, .us_vt, .us_wa
{ fill: #002255; }

/* Civil unions etc. */
.mx_coa, .uk_je, .us_ca, .us_co, .us_de, .us_hi, .us_il, .us_me, .us_nj, .us_nv, .us_or, .us_ri, .us_wi, .ve_l
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.bq
{ fill: #7fbcff; }

/* Illegal, large penalty */
.id_ac
{ fill: #ec8028; }

/* Illegal, death penalty */
.ng_sharia, .so_shabaab
{ fill: #8c201f; }</style><path d="m403.49 811.83c18.883 18.885 49.411 18.885 68.296 0l341.56-341.56c18.836-18.885 18.881-49.46 0.0226-68.304l-341.58-341.55c-18.836-18.883-49.46-18.883-68.296 0l-341.6 341.55c-18.84 18.891-18.788 49.468 0.0473 68.304l341.56 341.56z" fill="#ffd520" fill-rule="evenodd"/><path d="m410.21 805.11c15.166 15.171 39.702 15.171 54.873 0l341.55-341.55c15.163-15.168 15.163-39.704 0-54.87l-341.55-341.56c-15.171-15.166-39.707-15.166-54.873 0l-341.55 341.56c-15.17 15.166-15.17 39.702 0 54.87l341.55 341.55z" fill="#000" fill-rule="evenodd"/><path d="m420.3 795.01c9.5633 9.5633 25.116 9.5633 34.679 0l341.58-341.55c9.5673-9.5633 9.5673-25.115-0.0526-34.679l-341.55-341.56c-9.5633-9.5635-25.092-9.6148-34.655-0.0473l-341.6 341.6c-9.5635 9.5637-9.5399 25.116 0.0276 34.679l341.58 341.55z" fill="#ffd520" fill-rule="evenodd"/><path d="m437.06 111.96-116.77 106.26c-3.4451 2.6892-3.9688 7.7054-1.1773 11.064 1.9804 2.3703 5.1735 3.3387 8.1264 2.492l85.198-22.281 0.13385 67.271 24.486-0.13386 24.482 0.13386 0.13288-67.271 85.203 22.281c2.9512 0.84666 6.1444-0.12176 8.1239-2.492 2.79-3.3584 2.2658-8.3747-1.1732-11.064l-116.77-106.26zm-103.34 287.29c-13.225-0.0355-24.076 10.78-24.076 24.076 0 13.296 10.851 24.108 24.076 24.071 13.221 0.0364 24.072-10.775 24.072-24.071 0-13.296-10.851-24.112-24.072-24.076zm187.23-0.0129c-13.293 0-24.082 10.82-24.082 24.088 0 13.292 10.789 24.108 24.082 24.084 13.293 0.0226 24.09-10.791 24.09-24.084 0-13.268-10.797-24.088-24.09-24.088zm-81.626-32.671-0.0258-31.758-48.578 0.0277-35.029 31.73h83.635zm59.427-0.77571-12.055-31.703-37.878 0.0593-0.0322 31.671 49.965-0.0274zm117.12 57.243-3.9874-15.934-1.778-0.0258-7.9465-35.388-59.391-5.1538-38.297-40.018-116.36 0.1653-43.782 40.073-52.377 4.4922-27.517 4.0438-3.7406 32.033-1.3857 1.5551 2.0514 14.911 40.872 0.29932c-0.11047-17.068 13.607-31.037 30.679-31.258 17.399-0.2203 31.864 13.387 31.73 30.844h125.17c-0.19352-17.403 13.825-31.592 31.198-31.616 17.353-0.0322 31.399 14.044 31.343 31