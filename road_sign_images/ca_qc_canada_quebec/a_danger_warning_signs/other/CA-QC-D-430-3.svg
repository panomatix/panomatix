<svg width="242.14" height="242.15" version="1.1" viewBox="82.992 45.607 709.3 781.03" xmlns="http://www.w3.org/2000/svg"><style type="text/css">/*
 * Below are Cascading Style Sheet (CSS) definitions in use in this file,
 * which allow easily changing how countries are displayed.
 *
 */

/*
 * Circles around small countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.circlexx
{
   opacity:1;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * Smaller circles around French DOMs and Chinese SARs
 *
 * Change opacity to 1 to display all subnational circles.
 *
 */
.subxx
{
   opacity:1;
   stroke-width:0.3;
}

/*
 * Circles around small, unrecognized countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.unxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.3;
}

/*
 * Circles around small countries, but with no permanent residents 
 *
 * Change opacity to 1 to display all circles.
 *
 */
.noxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * land
 */
.landxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.5;
   fill-rule:evenodd;
}

/*
 * Styles for coastlines of islands with no borders
 */
.coastxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.3;
   fill-rule:evenodd;
}

/*
 * Styles for nations with limited recognition
 */
.limitxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Styles for nations with no permanent population.
 */
.antxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Ocean
 */
.oceanxx
{
   opacity: 1;
   color: #000000;
   fill:#ffffff;
   stroke:#000;
   stroke-width:0.5;
   stroke-miterlimit:1;
}

/*
 * Additional style rules
 *
 * The following are examples of colouring countries.  You can substitute these with your own styles to colour the countries on the map.
 *
 * Color a few countries:
 *
 * .gb, .au, .nc
 * {
 *    fill:       #ff0000;
 * }
 *
 * Color a few small country circles (and the countries):
 *
 * .ms, .ky
 * {
 *    opacity:    1;
 *    fill:       #ff0000;
 * }
 *
 */

/* Same-sex marriage */
.ar, .be, .ca, .dk, .es, .is, .nl, .no, .pt, .se, .za
{ fill: #002255; }

/* Civil unions etc. */
.ad, .at, .au, .bl, .br, .ch, .co, .cz, .de, .ec, .fi, .fr, .gb, .gf, .gl, .hr, .hu, .ie, .il, .im, .je, .li, .lu, .mf, .nc, .nf, .nz, .pm, .re, .si, .uy, .wf
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.aw, .cw, .sx, .mx
{ fill: #7fbcff; }

/* Legal but no recognition */
.ai, .al, .am, .as, .az, .ba, .bg, .bf, .by, .bj, .bm, .bo, .bs, .cd, .cg, .cf, .ci, .cl, .cn, .cr, .cu, .cv, .cy, .dj, .do, .ee, .fk, .fj, .fm, .fo, .ga, .ge, .gg, .gi, .gq, .gr, .gs, .gt, .gu, .gw, .hn, .ht, .id, .in, .iq, .it, .jo, .jp, .kg, .kh, .kp, .kr, .ky, .kz, .la, .lk, .lt, .lv, .mc, .md, .me, .mg, .mh, .mk, .ml, .mn, .mp, .mt, .ms, .mz, .ne, .ni, .np, .pa, .pe, .pf, .ph, .pl, .pn, .pr, .py, .ro, .rs, .ru, .rw, .sh, .sk, .sm, .sr, .st, .sv, .tc, .td, .th, .tj, .tk, .tl, .tr, .tw, .ua, .us, .va, .ve, .vg, .vi, .vn, .vu, .xk, .ps_west_bank
{ fill: #cccccc; }

/* Illegal, minimal penalty */
.bt, .lb, .lr
{ fill: #f9dc36; }

/* Illegal, large penalty */
.ag, .ao, .bh, .bi, .bn, .bw, .bz, .cm, .ck, .dm, .dz, .eg, .eh, .er, .et, .gd, .gh, .gm, .gn, .jm, .ke, .ki, .km, .kn, .kw, .lc, .ls, .ly, .ma, .mu, .mv, .mw, .my, .na, .ng, .nr, .nu, .om, .pg, .pw, .qa, .sb, .sc, .sg, .sn, .so, .ss, .sy, .sz, .tg, .tm, .tn, .to, .tt, .tv, .uz, .vc, .ws, .zm, .zw, .xc, .ps_gaza_strip
{ fill: #ec8028; }

/* Illegal, life imprisonment */
.bb, .bd, .gy, .mm, .pk, .sl, .tz, .ug
{ fill: #e73e21; }

/* Illegal, death penalty */
.ae, .af, .ir, .mr, .sa, .sd, .ye
{ fill: #8c201f; }

/* SUB-NATIONAL UNITS */

/* Same-sex marriage */
.br_al, .mx_dif, .us_ct, .us_dc, .us_ia, .us_ma, .us_md, .us_nh, .us_ny, .us_vt, .us_wa
{ fill: #002255; }

/* Civil unions etc. */
.mx_coa, .uk_je, .us_ca, .us_co, .us_de, .us_hi, .us_il, .us_me, .us_nj, .us_nv, .us_or, .us_ri, .us_wi, .ve_l
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.bq
{ fill: #7fbcff; }

/* Illegal, large penalty */
.id_ac
{ fill: #ec8028; }

/* Illegal, death penalty */
.ng_sharia, .so_shabaab
{ fill: #8c201f; }</style><path d="m403.5 811.82c18.883 18.885 49.412 18.885 68.296 0l341.55-341.56c18.84-18.885 18.889-49.46 0.029-68.3l-341.58-341.55c-18.836-18.887-49.46-18.887-68.296 0l-341.61 341.55c-18.836 18.887-18.788 49.464 0.0472 68.3l341.56 341.56z" fill="#ffd520" fill-rule="evenodd"/><path d="m410.2 805.1c15.17 15.171 39.707 15.171 54.873 0l341.55-341.55c15.167-15.166 15.167-39.704 0-54.87l-341.55-341.56c-15.166-15.166-39.703-15.166-54.873 0l-341.55 341.56c-15.166 15.166-15.166 39.704 0 54.87l341.55 341.55z" fill="#000" fill-rule="evenodd"/><path d="m420.3 795.01c9.5633 9.5633 25.116 9.5633 34.68 0l341.57-341.55c9.5713-9.5649 9.5713-25.117-0.0445-34.681l-341.55-341.56c-9.5641-9.5636-25.093-9.6148-34.656-0.0472l-341.6 341.6c-9.5675 9.5637-9.5439 25.116 0.0236 34.681l341.58 341.55z" fill="#ffd520" fill-rule="evenodd"/><path d="m469.86 592.56 21.61-33.854c2.286-4.1608 6.9789-6.6927 11.712-6.2855h37.447l36.302 28.976c1.9594 2.165 5.8138-1.4877 3.7737-3.5882l-32.302-35.181c-3.4874-4.326-9.2246-6.6362-14.732-5.9387l-6.229 0.12095c-1.4434 0.14514-2.7496-1.2216-2.6287-2.6529l-0.71361-10.652c-0.18546-2.9149-3.0198-5.2412-5.9387-4.7736l-67.032 11.12v20.425h26.138l-11.244 40.672c-0.77409 2.1005 2.8787 3.6326 3.8382 1.6127zm-155.69-1.1168c-0.31083 0.50397-0.64548 0.99987-0.99987 1.5038l0.96036 0.64508c2.1223 1.4554 0.50034 4.58-1.5631 3.8503l-1.6022-0.56041c-1.1261 2.2054-2.0594 4.5196-2.8113 6.9104l1.2523 0.64911c2.8702 1.4756 1.0591 4.4712-0.87811 4.0801l-1.5159-0.31448c-0.50397 2.3948-0.81482 4.8542-0.94101 7.374l1.374 0.24997c2.2288 0.31028 2.0594 4.1648-0.1653 4.2898l-1.1652 0.0361c0.12579 2.3989 0.43704 4.7736 0.93698 7.0596l1.4135-0.14095c2.4134-0.35479 3.1024 4.0358 0.62573 4.3906l-0.83054 0.29448c0.83054 2.54 1.8506 4.9752 3.079 7.3055l1.0591-0.35076c1.8147-1.4595 4.2519 2.2255 2.1654 3.3302l-0.99624 0.77006c1.3978 2.0804 2.9371 4.1003 4.6421 5.9549 0.33463-0.33464 0.76764-0.5201 1.1261-0.81038 1.6417-1.4998 4.4333 0.91117 3.0827 2.6166l-0.99987 1.3385c1.85