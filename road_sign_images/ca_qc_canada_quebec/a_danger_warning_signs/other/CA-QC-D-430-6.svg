<svg width="242.44" height="242.44" version="1.1" viewBox="82.992 45.607 710.16 781.97" xmlns="http://www.w3.org/2000/svg"><style type="text/css">/*
 * Below are Cascading Style Sheet (CSS) definitions in use in this file,
 * which allow easily changing how countries are displayed.
 *
 */

/*
 * Circles around small countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.circlexx
{
   opacity:1;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * Smaller circles around French DOMs and Chinese SARs
 *
 * Change opacity to 1 to display all subnational circles.
 *
 */
.subxx
{
   opacity:1;
   stroke-width:0.3;
}

/*
 * Circles around small, unrecognized countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.unxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.3;
}

/*
 * Circles around small countries, but with no permanent residents 
 *
 * Change opacity to 1 to display all circles.
 *
 */
.noxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * land
 */
.landxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.5;
   fill-rule:evenodd;
}

/*
 * Styles for coastlines of islands with no borders
 */
.coastxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.3;
   fill-rule:evenodd;
}

/*
 * Styles for nations with limited recognition
 */
.limitxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Styles for nations with no permanent population.
 */
.antxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Ocean
 */
.oceanxx
{
   opacity: 1;
   color: #000000;
   fill:#ffffff;
   stroke:#000;
   stroke-width:0.5;
   stroke-miterlimit:1;
}

/*
 * Additional style rules
 *
 * The following are examples of colouring countries.  You can substitute these with your own styles to colour the countries on the map.
 *
 * Color a few countries:
 *
 * .gb, .au, .nc
 * {
 *    fill:       #ff0000;
 * }
 *
 * Color a few small country circles (and the countries):
 *
 * .ms, .ky
 * {
 *    opacity:    1;
 *    fill:       #ff0000;
 * }
 *
 */

/* Same-sex marriage */
.ar, .be, .ca, .dk, .es, .is, .nl, .no, .pt, .se, .za
{ fill: #002255; }

/* Civil unions etc. */
.ad, .at, .au, .bl, .br, .ch, .co, .cz, .de, .ec, .fi, .fr, .gb, .gf, .gl, .hr, .hu, .ie, .il, .im, .je, .li, .lu, .mf, .nc, .nf, .nz, .pm, .re, .si, .uy, .wf
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.aw, .cw, .sx, .mx
{ fill: #7fbcff; }

/* Legal but no recognition */
.ai, .al, .am, .as, .az, .ba, .bg, .bf, .by, .bj, .bm, .bo, .bs, .cd, .cg, .cf, .ci, .cl, .cn, .cr, .cu, .cv, .cy, .dj, .do, .ee, .fk, .fj, .fm, .fo, .ga, .ge, .gg, .gi, .gq, .gr, .gs, .gt, .gu, .gw, .hn, .ht, .id, .in, .iq, .it, .jo, .jp, .kg, .kh, .kp, .kr, .ky, .kz, .la, .lk, .lt, .lv, .mc, .md, .me, .mg, .mh, .mk, .ml, .mn, .mp, .mt, .ms, .mz, .ne, .ni, .np, .pa, .pe, .pf, .ph, .pl, .pn, .pr, .py, .ro, .rs, .ru, .rw, .sh, .sk, .sm, .sr, .st, .sv, .tc, .td, .th, .tj, .tk, .tl, .tr, .tw, .ua, .us, .va, .ve, .vg, .vi, .vn, .vu, .xk, .ps_west_bank
{ fill: #cccccc; }

/* Illegal, minimal penalty */
.bt, .lb, .lr
{ fill: #f9dc36; }

/* Illegal, large penalty */
.ag, .ao, .bh, .bi, .bn, .bw, .bz, .cm, .ck, .dm, .dz, .eg, .eh, .er, .et, .gd, .gh, .gm, .gn, .jm, .ke, .ki, .km, .kn, .kw, .lc, .ls, .ly, .ma, .mu, .mv, .mw, .my, .na, .ng, .nr, .nu, .om, .pg, .pw, .qa, .sb, .sc, .sg, .sn, .so, .ss, .sy, .sz, .tg, .tm, .tn, .to, .tt, .tv, .uz, .vc, .ws, .zm, .zw, .xc, .ps_gaza_strip
{ fill: #ec8028; }

/* Illegal, life imprisonment */
.bb, .bd, .gy, .mm, .pk, .sl, .tz, .ug
{ fill: #e73e21; }

/* Illegal, death penalty */
.ae, .af, .ir, .mr, .sa, .sd, .ye
{ fill: #8c201f; }

/* SUB-NATIONAL UNITS */

/* Same-sex marriage */
.br_al, .mx_dif, .us_ct, .us_dc, .us_ia, .us_ma, .us_md, .us_nh, .us_ny, .us_vt, .us_wa
{ fill: #002255; }

/* Civil unions etc. */
.mx_coa, .uk_je, .us_ca, .us_co, .us_de, .us_hi, .us_il, .us_me, .us_nj, .us_nv, .us_or, .us_ri, .us_wi, .ve_l
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.bq
{ fill: #7fbcff; }

/* Illegal, large penalty */
.id_ac
{ fill: #ec8028; }

/* Illegal, death penalty */
.ng_sharia, .so_shabaab
{ fill: #8c201f; }</style><path d="m403.88 812.74c18.914 18.913 49.47 18.913 68.387 0l341.96-341.96c18.885-18.909 18.909-49.524 0.0226-68.383l-341.99-341.96c-18.864-18.907-49.524-18.907-68.387 0l-341.99 341.96c-18.883 18.907-18.859 49.523 0.0236 68.383l341.96 341.96z" fill="#ffd520" fill-rule="evenodd"/><path d="m410.61 806.02c15.186 15.188 39.754 15.188 54.937 0l341.96-341.96c15.188-15.185 15.188-39.754 0-54.94l-341.96-341.96c-15.183-15.182-39.75-15.182-54.937 0l-341.96 341.96c-15.186 15.186-15.186 39.756 0 54.94l341.96 341.96z" fill="#000" fill-rule="evenodd"/><path d="m420.71 795.91c9.5754 9.5754 25.147 9.5754 34.722 0l341.99-341.96c9.5754-9.5774 9.5754-25.145-0.0226-34.725l-341.97-341.96c-9.5754-9.5754-25.147-9.6226-34.722-0.0473l-341.99 342.01c-9.5714 9.5798-9.5714 25.148 0 34.725l341.99 341.96z" fill="#ffd520" fill-rule="evenodd"/><path d="m438.08 111.55-116.91 106.39c-3.4451 2.6892-3.9725 7.7091-1.1773 11.076 1.9768 2.3702 5.1776 3.3387 8.1384 2.4844l85.296-22.304 0.13805 67.362 24.513-0.14553 24.511 0.14553 0.13708-67.362 85.295 22.304c2.9633 0.85433 6.1605-0.11411 8.1401-2.4844 2.794-3.3665 2.2658-8.3864-1.1773-11.076l-116.91-106.39zm-140.5 428.84 89.914-57.08c4.1656-2.3303 9.8628-0.7378 12.229 3.3705l50.402 93.946h-158.88v-27.178c0.0746-2.4795 0.68096-4.9187 1.7598-7.1523 1.0986-2.2739 2.6497-4.2777 4.5792-5.9065zm-26.124 42.091c0.24394-2.4594 3.6495-2.2174 4.0668 0.0929 2.9335 15.409 15.958 28.295 31.589 29.847h89.423v16.107h-88.816c-21.804-2.6851-38.518-23.602-36.262-46.046zm178.81-25.545c-3.1246-7.0233 2.5602-15.897 10.2-16.05l97.092-0.16933 18.586-11.148 21.328 0.13321 6.9834 5.4146-0.11289 40.898c-0.34269 2.7376-2.7819 4.9752-5.5279 5.0921h-135.76l-12.793-24.17zm-32.802 64.733-14.536-26.722c-0.51161-0.94745-0.24384-4.072 3.256-4.0519h189.68v18.473c-0.24577 10.144-8.8779 19.094-19.022 19.719h-146.28c-3.9725 0-11.375-4.2777-13.095-7.4184zm-211.33-181.72c-0.19313 7.9558 6.0436 14.536 13.977 14.802 7.9808 0.29029 14.701-5.975 14.965-13.932 0.26771-8.0002-