<svg width="242.44" height="242.44" version="1.1" viewBox="82.992 45.607 710.17 781.96" xmlns="http://www.w3.org/2000/svg"><style type="text/css">/*
 * Below are Cascading Style Sheet (CSS) definitions in use in this file,
 * which allow easily changing how countries are displayed.
 *
 */

/*
 * Circles around small countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.circlexx
{
   opacity:1;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * Smaller circles around French DOMs and Chinese SARs
 *
 * Change opacity to 1 to display all subnational circles.
 *
 */
.subxx
{
   opacity:1;
   stroke-width:0.3;
}

/*
 * Circles around small, unrecognized countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.unxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.3;
}

/*
 * Circles around small countries, but with no permanent residents 
 *
 * Change opacity to 1 to display all circles.
 *
 */
.noxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * land
 */
.landxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.5;
   fill-rule:evenodd;
}

/*
 * Styles for coastlines of islands with no borders
 */
.coastxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.3;
   fill-rule:evenodd;
}

/*
 * Styles for nations with limited recognition
 */
.limitxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Styles for nations with no permanent population.
 */
.antxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Ocean
 */
.oceanxx
{
   opacity: 1;
   color: #000000;
   fill:#ffffff;
   stroke:#000;
   stroke-width:0.5;
   stroke-miterlimit:1;
}

/*
 * Additional style rules
 *
 * The following are examples of colouring countries.  You can substitute these with your own styles to colour the countries on the map.
 *
 * Color a few countries:
 *
 * .gb, .au, .nc
 * {
 *    fill:       #ff0000;
 * }
 *
 * Color a few small country circles (and the countries):
 *
 * .ms, .ky
 * {
 *    opacity:    1;
 *    fill:       #ff0000;
 * }
 *
 */

/* Same-sex marriage */
.ar, .be, .ca, .dk, .es, .is, .nl, .no, .pt, .se, .za
{ fill: #002255; }

/* Civil unions etc. */
.ad, .at, .au, .bl, .br, .ch, .co, .cz, .de, .ec, .fi, .fr, .gb, .gf, .gl, .hr, .hu, .ie, .il, .im, .je, .li, .lu, .mf, .nc, .nf, .nz, .pm, .re, .si, .uy, .wf
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.aw, .cw, .sx, .mx
{ fill: #7fbcff; }

/* Legal but no recognition */
.ai, .al, .am, .as, .az, .ba, .bg, .bf, .by, .bj, .bm, .bo, .bs, .cd, .cg, .cf, .ci, .cl, .cn, .cr, .cu, .cv, .cy, .dj, .do, .ee, .fk, .fj, .fm, .fo, .ga, .ge, .gg, .gi, .gq, .gr, .gs, .gt, .gu, .gw, .hn, .ht, .id, .in, .iq, .it, .jo, .jp, .kg, .kh, .kp, .kr, .ky, .kz, .la, .lk, .lt, .lv, .mc, .md, .me, .mg, .mh, .mk, .ml, .mn, .mp, .mt, .ms, .mz, .ne, .ni, .np, .pa, .pe, .pf, .ph, .pl, .pn, .pr, .py, .ro, .rs, .ru, .rw, .sh, .sk, .sm, .sr, .st, .sv, .tc, .td, .th, .tj, .tk, .tl, .tr, .tw, .ua, .us, .va, .ve, .vg, .vi, .vn, .vu, .xk, .ps_west_bank
{ fill: #cccccc; }

/* Illegal, minimal penalty */
.bt, .lb, .lr
{ fill: #f9dc36; }

/* Illegal, large penalty */
.ag, .ao, .bh, .bi, .bn, .bw, .bz, .cm, .ck, .dm, .dz, .eg, .eh, .er, .et, .gd, .gh, .gm, .gn, .jm, .ke, .ki, .km, .kn, .kw, .lc, .ls, .ly, .ma, .mu, .mv, .mw, .my, .na, .ng, .nr, .nu, .om, .pg, .pw, .qa, .sb, .sc, .sg, .sn, .so, .ss, .sy, .sz, .tg, .tm, .tn, .to, .tt, .tv, .uz, .vc, .ws, .zm, .zw, .xc, .ps_gaza_strip
{ fill: #ec8028; }

/* Illegal, life imprisonment */
.bb, .bd, .gy, .mm, .pk, .sl, .tz, .ug
{ fill: #e73e21; }

/* Illegal, death penalty */
.ae, .af, .ir, .mr, .sa, .sd, .ye
{ fill: #8c201f; }

/* SUB-NATIONAL UNITS */

/* Same-sex marriage */
.br_al, .mx_dif, .us_ct, .us_dc, .us_ia, .us_ma, .us_md, .us_nh, .us_ny, .us_vt, .us_wa
{ fill: #002255; }

/* Civil unions etc. */
.mx_coa, .uk_je, .us_ca, .us_co, .us_de, .us_hi, .us_il, .us_me, .us_nj, .us_nv, .us_or, .us_ri, .us_wi, .ve_l
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.bq
{ fill: #7fbcff; }

/* Illegal, large penalty */
.id_ac
{ fill: #ec8028; }

/* Illegal, death penalty */
.ng_sharia, .so_shabaab
{ fill: #8c201f; }</style><path d="m403.88 812.74c18.91 18.913 49.474 18.913 68.387 0l341.96-341.96c18.889-18.909 18.913-49.52 0.029-68.383l-341.99-341.96c-18.868-18.911-49.524-18.911-68.387 0l-341.99 341.96c-18.887 18.91-18.859 49.523 0.0236 68.383l341.96 341.96z" fill="#ffd520" fill-rule="evenodd"/><path d="m410.61 806.02c15.182 15.188 39.749 15.188 54.937 0l341.96-341.96c15.192-15.182 15.192-39.75 0-54.94l-341.96-341.96c-15.188-15.186-39.755-15.186-54.937 0l-341.96 341.96c-15.186 15.19-15.186 39.758 0 54.94l341.96 341.96z" fill="#000" fill-rule="evenodd"/><path d="m420.71 795.92c9.5754 9.5754 25.147 9.5754 34.722 0l341.98-341.96c9.5754-9.5762 9.5754-25.148-0.0193-34.727l-341.96-341.96c-9.5746-9.5754-25.146-9.6226-34.722-0.0473l-341.99 342.01c-9.5754 9.5794-9.5754 25.151 0 34.727l341.99 341.97z" fill="#ffd520" fill-rule="evenodd"/><path d="m320.51 331.38c-15.017 0-27.25 12.261-27.25 27.301 0 15.044 12.233 27.301 27.25 27.301 15.021 0 27.253-12.256 27.253-27.301 0-15.04-12.233-27.301-27.253-27.301zm212.2 0.0277c-15.042 0-27.275 12.256-27.275 27.273 0 15.044 12.232 27.301 27.275 27.301 15.042 0 27.275-12.256 27.275-27.301 0-15.017-12.232-27.273-27.275-27.273zm-92.965-37.026-0.0226-35.931-54.987 0.0274-39.656 35.904h94.667zm67.856-0.21652-13.664-35.833-42.869 0.0232-0.0523 35.857 56.585-0.0472zm132.23 64.224-4.5292-18.037-2.0038-0.0232-8.9908-40.069-67.229-5.8271-43.353-45.314-131.74 0.1931-49.57 45.361-59.295 5.0788-31.144 4.595-4.2289 36.246-1.5748 1.7679 2.3231 16.875 46.282 0.33867c-0.14594-19.32 15.402-35.136 34.722-35.376 19.71-0.24432 36.077 15.162 35.907 34.919h141.7c-0.22158-19.686 15.671-35.766 35.33-35.789 19.635-0.0512 35.544 15.887 35.471 35.522l71.916-0.46043zm-361.12 142.82 101.94-64.711c4.7208-2.642 11.182-0.8386 13.863 3.8193l57.134 106.51h-180.12v-30.81c0.0867-2.8101 0.77167-5.5759 1.9961-8.1118 1.2442-2.5722 3.004-4.8461 5.1892-6.6927zm-29.317 47.897c0.2798-2.79 4.1422-2.5118 4.6107 0.10869 3.327 17.461 18.088 32.072 35.813 33.834h101.38v18.256h-10