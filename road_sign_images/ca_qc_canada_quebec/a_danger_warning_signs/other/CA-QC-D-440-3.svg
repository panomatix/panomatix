<svg width="242.43" height="242.44" version="1.1" viewBox="82.992 45.607 710.15 781.97" xmlns="http://www.w3.org/2000/svg"><style type="text/css">/*
 * Below are Cascading Style Sheet (CSS) definitions in use in this file,
 * which allow easily changing how countries are displayed.
 *
 */

/*
 * Circles around small countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.circlexx
{
   opacity:1;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * Smaller circles around French DOMs and Chinese SARs
 *
 * Change opacity to 1 to display all subnational circles.
 *
 */
.subxx
{
   opacity:1;
   stroke-width:0.3;
}

/*
 * Circles around small, unrecognized countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.unxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.3;
}

/*
 * Circles around small countries, but with no permanent residents 
 *
 * Change opacity to 1 to display all circles.
 *
 */
.noxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * land
 */
.landxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.5;
   fill-rule:evenodd;
}

/*
 * Styles for coastlines of islands with no borders
 */
.coastxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.3;
   fill-rule:evenodd;
}

/*
 * Styles for nations with limited recognition
 */
.limitxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Styles for nations with no permanent population.
 */
.antxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Ocean
 */
.oceanxx
{
   opacity: 1;
   color: #000000;
   fill:#ffffff;
   stroke:#000;
   stroke-width:0.5;
   stroke-miterlimit:1;
}

/*
 * Additional style rules
 *
 * The following are examples of colouring countries.  You can substitute these with your own styles to colour the countries on the map.
 *
 * Color a few countries:
 *
 * .gb, .au, .nc
 * {
 *    fill:       #ff0000;
 * }
 *
 * Color a few small country circles (and the countries):
 *
 * .ms, .ky
 * {
 *    opacity:    1;
 *    fill:       #ff0000;
 * }
 *
 */

/* Same-sex marriage */
.ar, .be, .ca, .dk, .es, .is, .nl, .no, .pt, .se, .za
{ fill: #002255; }

/* Civil unions etc. */
.ad, .at, .au, .bl, .br, .ch, .co, .cz, .de, .ec, .fi, .fr, .gb, .gf, .gl, .hr, .hu, .ie, .il, .im, .je, .li, .lu, .mf, .nc, .nf, .nz, .pm, .re, .si, .uy, .wf
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.aw, .cw, .sx, .mx
{ fill: #7fbcff; }

/* Legal but no recognition */
.ai, .al, .am, .as, .az, .ba, .bg, .bf, .by, .bj, .bm, .bo, .bs, .cd, .cg, .cf, .ci, .cl, .cn, .cr, .cu, .cv, .cy, .dj, .do, .ee, .fk, .fj, .fm, .fo, .ga, .ge, .gg, .gi, .gq, .gr, .gs, .gt, .gu, .gw, .hn, .ht, .id, .in, .iq, .it, .jo, .jp, .kg, .kh, .kp, .kr, .ky, .kz, .la, .lk, .lt, .lv, .mc, .md, .me, .mg, .mh, .mk, .ml, .mn, .mp, .mt, .ms, .mz, .ne, .ni, .np, .pa, .pe, .pf, .ph, .pl, .pn, .pr, .py, .ro, .rs, .ru, .rw, .sh, .sk, .sm, .sr, .st, .sv, .tc, .td, .th, .tj, .tk, .tl, .tr, .tw, .ua, .us, .va, .ve, .vg, .vi, .vn, .vu, .xk, .ps_west_bank
{ fill: #cccccc; }

/* Illegal, minimal penalty */
.bt, .lb, .lr
{ fill: #f9dc36; }

/* Illegal, large penalty */
.ag, .ao, .bh, .bi, .bn, .bw, .bz, .cm, .ck, .dm, .dz, .eg, .eh, .er, .et, .gd, .gh, .gm, .gn, .jm, .ke, .ki, .km, .kn, .kw, .lc, .ls, .ly, .ma, .mu, .mv, .mw, .my, .na, .ng, .nr, .nu, .om, .pg, .pw, .qa, .sb, .sc, .sg, .sn, .so, .ss, .sy, .sz, .tg, .tm, .tn, .to, .tt, .tv, .uz, .vc, .ws, .zm, .zw, .xc, .ps_gaza_strip
{ fill: #ec8028; }

/* Illegal, life imprisonment */
.bb, .bd, .gy, .mm, .pk, .sl, .tz, .ug
{ fill: #e73e21; }

/* Illegal, death penalty */
.ae, .af, .ir, .mr, .sa, .sd, .ye
{ fill: #8c201f; }

/* SUB-NATIONAL UNITS */

/* Same-sex marriage */
.br_al, .mx_dif, .us_ct, .us_dc, .us_ia, .us_ma, .us_md, .us_nh, .us_ny, .us_vt, .us_wa
{ fill: #002255; }

/* Civil unions etc. */
.mx_coa, .uk_je, .us_ca, .us_co, .us_de, .us_hi, .us_il, .us_me, .us_nj, .us_nv, .us_or, .us_ri, .us_wi, .ve_l
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.bq
{ fill: #7fbcff; }

/* Illegal, large penalty */
.id_ac
{ fill: #ec8028; }

/* Illegal, death penalty */
.ng_sharia, .so_shabaab
{ fill: #8c201f; }</style><path d="m403.88 812.74c18.91 18.917 49.47 18.917 68.387 0l341.96-341.96c18.864-18.909 18.909-49.52 0.0226-68.383l-341.98-341.96c-18.868-18.911-49.524-18.911-68.387 0l-342.01 341.96c-18.863 18.91-18.812 49.523 0.0472 68.383l341.96 341.96z" fill="#ffd520" fill-rule="evenodd"/><path d="m410.31 806.02c15.182 15.192 39.751 15.192 54.936 0l341.97-341.96c15.184-15.188 15.184-39.754 0-54.94l-341.97-341.96c-15.185-15.186-39.754-15.186-54.936 0l-341.96 341.96c-15.186 15.186-15.186 39.753 0 54.94l341.96 341.96z" fill="#000" fill-rule="evenodd"/><path d="m420.42 795.91c9.5754 9.5754 25.147 9.5754 34.724 0l341.99-341.96c9.5713-9.5749 9.5713-25.143-0.0526-34.722l-341.96-341.96c-9.5726-9.5754-25.121-9.6226-34.696-0.0472l-342.01 342.01c-9.5754 9.5794-9.5517 25.147 0.0236 34.722l341.99 341.96z" fill="#ffd520" fill-rule="evenodd"/><path d="m320.21 331.72c-14.973-0.0512-27.253 12.206-27.253 27.25 0 15.04 12.28 27.297 27.253 27.25 14.969 0.0471 27.25-12.209 27.25-27.25 0-15.044-12.28-27.301-27.25-27.25zm212.49-0.31489c-15.042 0-27.275 12.256-27.275 27.273 0 15.044 12.232 27.3 27.275 27.273 15.042 0.0258 27.275-12.229 27.275-27.273 0-15.017-12.232-27.273-27.275-27.273zm-92.963-37.026-0.0226-35.931-54.988 0.0274-39.656 35.904h94.667zm67.853-0.21649-13.66-35.88-42.869 0.071-0.0526 35.856 56.581-0.0472zm132.23 64.516-4.524-18.037-2.0038-0.0232-8.9908-40.069-67.225-5.8311-43.353-45.31-131.74 0.19311-49.57 45.361-59.295 5.0792-31.144 4.5909-4.2285 36.25-1.5748 1.7679 2.3227 16.875 46.278 0.33866c-0.1415-19.32 15.406-35.136 34.727-35.38 19.71-0.24029 36.077 15.166 35.908 34.919h141.7c-0.22191-19.706 15.667-35.762 35.326-35.789 19.639-0.0471 35.548 15.891 35.471 35.526l71.914-0.46042zm-163.14 204.07 25.968-40.668c2.7335-5.0074 8.3699-8.0514 14.075-7.5474h44.978l43.623 34.794c2.3465 2.6166 6.987-1.7861 4.5236-4.3019l-38.809-42.265c-4.1849-5.2009-11.075-7.9828-17.707-7.1362l-7.4668 0.14515c-1.7457 0.16933-3.3181-1.4756-3.173-3.1931l-0.84263-12.793c-0.21352-3.5036-3.628