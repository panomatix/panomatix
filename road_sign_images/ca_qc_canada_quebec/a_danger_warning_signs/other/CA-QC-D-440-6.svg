<svg width="242.44" height="242.44" version="1.1" viewBox="82.992 45.607 710.17 781.97" xmlns="http://www.w3.org/2000/svg"><style type="text/css">/*
 * Below are Cascading Style Sheet (CSS) definitions in use in this file,
 * which allow easily changing how countries are displayed.
 *
 */

/*
 * Circles around small countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.circlexx
{
   opacity:1;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * Smaller circles around French DOMs and Chinese SARs
 *
 * Change opacity to 1 to display all subnational circles.
 *
 */
.subxx
{
   opacity:1;
   stroke-width:0.3;
}

/*
 * Circles around small, unrecognized countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.unxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.3;
}

/*
 * Circles around small countries, but with no permanent residents 
 *
 * Change opacity to 1 to display all circles.
 *
 */
.noxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * land
 */
.landxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.5;
   fill-rule:evenodd;
}

/*
 * Styles for coastlines of islands with no borders
 */
.coastxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.3;
   fill-rule:evenodd;
}

/*
 * Styles for nations with limited recognition
 */
.limitxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Styles for nations with no permanent population.
 */
.antxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Ocean
 */
.oceanxx
{
   opacity: 1;
   color: #000000;
   fill:#ffffff;
   stroke:#000;
   stroke-width:0.5;
   stroke-miterlimit:1;
}

/*
 * Additional style rules
 *
 * The following are examples of colouring countries.  You can substitute these with your own styles to colour the countries on the map.
 *
 * Color a few countries:
 *
 * .gb, .au, .nc
 * {
 *    fill:       #ff0000;
 * }
 *
 * Color a few small country circles (and the countries):
 *
 * .ms, .ky
 * {
 *    opacity:    1;
 *    fill:       #ff0000;
 * }
 *
 */

/* Same-sex marriage */
.ar, .be, .ca, .dk, .es, .is, .nl, .no, .pt, .se, .za
{ fill: #002255; }

/* Civil unions etc. */
.ad, .at, .au, .bl, .br, .ch, .co, .cz, .de, .ec, .fi, .fr, .gb, .gf, .gl, .hr, .hu, .ie, .il, .im, .je, .li, .lu, .mf, .nc, .nf, .nz, .pm, .re, .si, .uy, .wf
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.aw, .cw, .sx, .mx
{ fill: #7fbcff; }

/* Legal but no recognition */
.ai, .al, .am, .as, .az, .ba, .bg, .bf, .by, .bj, .bm, .bo, .bs, .cd, .cg, .cf, .ci, .cl, .cn, .cr, .cu, .cv, .cy, .dj, .do, .ee, .fk, .fj, .fm, .fo, .ga, .ge, .gg, .gi, .gq, .gr, .gs, .gt, .gu, .gw, .hn, .ht, .id, .in, .iq, .it, .jo, .jp, .kg, .kh, .kp, .kr, .ky, .kz, .la, .lk, .lt, .lv, .mc, .md, .me, .mg, .mh, .mk, .ml, .mn, .mp, .mt, .ms, .mz, .ne, .ni, .np, .pa, .pe, .pf, .ph, .pl, .pn, .pr, .py, .ro, .rs, .ru, .rw, .sh, .sk, .sm, .sr, .st, .sv, .tc, .td, .th, .tj, .tk, .tl, .tr, .tw, .ua, .us, .va, .ve, .vg, .vi, .vn, .vu, .xk, .ps_west_bank
{ fill: #cccccc; }

/* Illegal, minimal penalty */
.bt, .lb, .lr
{ fill: #f9dc36; }

/* Illegal, large penalty */
.ag, .ao, .bh, .bi, .bn, .bw, .bz, .cm, .ck, .dm, .dz, .eg, .eh, .er, .et, .gd, .gh, .gm, .gn, .jm, .ke, .ki, .km, .kn, .kw, .lc, .ls, .ly, .ma, .mu, .mv, .mw, .my, .na, .ng, .nr, .nu, .om, .pg, .pw, .qa, .sb, .sc, .sg, .sn, .so, .ss, .sy, .sz, .tg, .tm, .tn, .to, .tt, .tv, .uz, .vc, .ws, .zm, .zw, .xc, .ps_gaza_strip
{ fill: #ec8028; }

/* Illegal, life imprisonment */
.bb, .bd, .gy, .mm, .pk, .sl, .tz, .ug
{ fill: #e73e21; }

/* Illegal, death penalty */
.ae, .af, .ir, .mr, .sa, .sd, .ye
{ fill: #8c201f; }

/* SUB-NATIONAL UNITS */

/* Same-sex marriage */
.br_al, .mx_dif, .us_ct, .us_dc, .us_ia, .us_ma, .us_md, .us_nh, .us_ny, .us_vt, .us_wa
{ fill: #002255; }

/* Civil unions etc. */
.mx_coa, .uk_je, .us_ca, .us_co, .us_de, .us_hi, .us_il, .us_me, .us_nj, .us_nv, .us_or, .us_ri, .us_wi, .ve_l
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.bq
{ fill: #7fbcff; }

/* Illegal, large penalty */
.id_ac
{ fill: #ec8028; }

/* Illegal, death penalty */
.ng_sharia, .so_shabaab
{ fill: #8c201f; }</style><path d="m403.88 812.74c18.91 18.917 49.47 18.917 68.387 0l341.96-341.96c18.889-18.909 18.913-49.52 0.0258-68.383l-341.99-341.96c-18.868-18.911-49.524-18.911-68.387 0l-341.99 341.96c-18.887 18.91-18.863 49.523 0.0236 68.383l341.96 341.96z" fill="#ffd520" fill-rule="evenodd"/><path d="m410.6 806.02c15.186 15.192 39.754 15.192 54.94 0l341.96-341.96c15.192-15.187 15.192-39.755 0-54.941l-341.96-341.96c-15.187-15.186-39.754-15.186-54.94 0l-341.96 341.96c-15.19 15.186-15.19 39.754 0 54.941l341.96 341.96z" fill="#000" fill-rule="evenodd"/><path d="m420.72 795.91c9.5754 9.5754 25.143 9.5754 34.719 0l341.99-341.96c9.5754-9.5754 9.5754-25.143-0.0226-34.722l-341.97-341.96c-9.5758-9.5754-25.143-9.6226-34.719-0.0473l-341.99 342.01c-9.5754 9.579-9.5754 25.147 0 34.722l341.99 341.96z" fill="#ffd520" fill-rule="evenodd"/><path d="m416.59 602.23-15.253-28.045c-0.53944-0.99181-0.25964-4.2696 3.4177-4.2454h199.06v19.381c-0.26222 10.644-9.3173 20.042-19.965 20.695h-153.51c-4.1696 0-11.938-4.4833-13.745-7.7853zm34.543-67.923c-3.2778-7.37 2.6851-16.687 10.704-16.849l101.89-0.17739 19.506-11.696 22.384 0.13707 7.3297 5.6807-0.12095 42.922c-0.35882 2.8787-2.919 5.2211-5.8017 5.3461h-142.47l-13.43-25.364zm-187.81 26.992c0.256-2.5803 3.835-2.3182 4.268 0.10063 3.079 16.167 16.745 29.698 33.148 31.323h93.852v16.901h-93.214c-22.879-2.8222-40.416-24.767-38.053-48.324zm27.285-44.414 94.363-59.903c4.3704-2.4432 10.347-0.77006 12.832 3.5358l52.892 98.596h-166.74v-28.524c0.0746-2.6005 0.7124-5.1606 1.8465-7.5071 1.1494-2.3787 2.7795-4.4873 4.8034-6.1968zm-107.99-114.08c-0.19314 7.953 6.0436 14.532 13.981 14.8 7.9768 0.29125 14.698-5.977 14.965-13.93 0.26368-8.0046-5.9964-14.729-14.001-14.969-8.0554-0.24416-14.725 6.071-14.946 14.099zm98.699 0c-0.19314 7.953 6.0436 14.532 13.977 14.8 7.9804 0.29125 14.701-5.977 14.965-13.93 0.26771-8.0046-5.9964-14.729-13.997-14.969-8.0558-0.24416-14.729 6.071-14.946 14.099zm36.577 0c-0.19271 7.953 6.0436 14.532 13.977 14.8 7.9768 0.29125 1