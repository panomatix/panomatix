<svg width="242.44" height="242.44" version="1.1" viewBox="82.992 45.607 710.16 781.96" xmlns="http://www.w3.org/2000/svg"><style type="text/css">/*
 * Below are Cascading Style Sheet (CSS) definitions in use in this file,
 * which allow easily changing how countries are displayed.
 *
 */

/*
 * Circles around small countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.circlexx
{
   opacity:1;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * Smaller circles around French DOMs and Chinese SARs
 *
 * Change opacity to 1 to display all subnational circles.
 *
 */
.subxx
{
   opacity:1;
   stroke-width:0.3;
}

/*
 * Circles around small, unrecognized countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.unxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.3;
}

/*
 * Circles around small countries, but with no permanent residents 
 *
 * Change opacity to 1 to display all circles.
 *
 */
.noxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * land
 */
.landxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.5;
   fill-rule:evenodd;
}

/*
 * Styles for coastlines of islands with no borders
 */
.coastxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.3;
   fill-rule:evenodd;
}

/*
 * Styles for nations with limited recognition
 */
.limitxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Styles for nations with no permanent population.
 */
.antxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Ocean
 */
.oceanxx
{
   opacity: 1;
   color: #000000;
   fill:#ffffff;
   stroke:#000;
   stroke-width:0.5;
   stroke-miterlimit:1;
}

/*
 * Additional style rules
 *
 * The following are examples of colouring countries.  You can substitute these with your own styles to colour the countries on the map.
 *
 * Color a few countries:
 *
 * .gb, .au, .nc
 * {
 *    fill:       #ff0000;
 * }
 *
 * Color a few small country circles (and the countries):
 *
 * .ms, .ky
 * {
 *    opacity:    1;
 *    fill:       #ff0000;
 * }
 *
 */

/* Same-sex marriage */
.ar, .be, .ca, .dk, .es, .is, .nl, .no, .pt, .se, .za
{ fill: #002255; }

/* Civil unions etc. */
.ad, .at, .au, .bl, .br, .ch, .co, .cz, .de, .ec, .fi, .fr, .gb, .gf, .gl, .hr, .hu, .ie, .il, .im, .je, .li, .lu, .mf, .nc, .nf, .nz, .pm, .re, .si, .uy, .wf
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.aw, .cw, .sx, .mx
{ fill: #7fbcff; }

/* Legal but no recognition */
.ai, .al, .am, .as, .az, .ba, .bg, .bf, .by, .bj, .bm, .bo, .bs, .cd, .cg, .cf, .ci, .cl, .cn, .cr, .cu, .cv, .cy, .dj, .do, .ee, .fk, .fj, .fm, .fo, .ga, .ge, .gg, .gi, .gq, .gr, .gs, .gt, .gu, .gw, .hn, .ht, .id, .in, .iq, .it, .jo, .jp, .kg, .kh, .kp, .kr, .ky, .kz, .la, .lk, .lt, .lv, .mc, .md, .me, .mg, .mh, .mk, .ml, .mn, .mp, .mt, .ms, .mz, .ne, .ni, .np, .pa, .pe, .pf, .ph, .pl, .pn, .pr, .py, .ro, .rs, .ru, .rw, .sh, .sk, .sm, .sr, .st, .sv, .tc, .td, .th, .tj, .tk, .tl, .tr, .tw, .ua, .us, .va, .ve, .vg, .vi, .vn, .vu, .xk, .ps_west_bank
{ fill: #cccccc; }

/* Illegal, minimal penalty */
.bt, .lb, .lr
{ fill: #f9dc36; }

/* Illegal, large penalty */
.ag, .ao, .bh, .bi, .bn, .bw, .bz, .cm, .ck, .dm, .dz, .eg, .eh, .er, .et, .gd, .gh, .gm, .gn, .jm, .ke, .ki, .km, .kn, .kw, .lc, .ls, .ly, .ma, .mu, .mv, .mw, .my, .na, .ng, .nr, .nu, .om, .pg, .pw, .qa, .sb, .sc, .sg, .sn, .so, .ss, .sy, .sz, .tg, .tm, .tn, .to, .tt, .tv, .uz, .vc, .ws, .zm, .zw, .xc, .ps_gaza_strip
{ fill: #ec8028; }

/* Illegal, life imprisonment */
.bb, .bd, .gy, .mm, .pk, .sl, .tz, .ug
{ fill: #e73e21; }

/* Illegal, death penalty */
.ae, .af, .ir, .mr, .sa, .sd, .ye
{ fill: #8c201f; }

/* SUB-NATIONAL UNITS */

/* Same-sex marriage */
.br_al, .mx_dif, .us_ct, .us_dc, .us_ia, .us_ma, .us_md, .us_nh, .us_ny, .us_vt, .us_wa
{ fill: #002255; }

/* Civil unions etc. */
.mx_coa, .uk_je, .us_ca, .us_co, .us_de, .us_hi, .us_il, .us_me, .us_nj, .us_nv, .us_or, .us_ri, .us_wi, .ve_l
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.bq
{ fill: #7fbcff; }

/* Illegal, large penalty */
.id_ac
{ fill: #ec8028; }

/* Illegal, death penalty */
.ng_sharia, .so_shabaab
{ fill: #8c201f; }</style><path d="m403.88 812.74c18.914 18.913 49.47 18.913 68.387 0l341.96-341.96c18.881-18.909 18.905-49.52 0.0226-68.379l-341.99-341.96c-18.864-18.911-49.524-18.911-68.387 0l-341.99 341.96c-18.883 18.907-18.859 49.519 0.0236 68.379l341.96 341.96z" fill="#ffd520" fill-rule="evenodd"/><path d="m410.61 806.02c15.182 15.188 39.754 15.188 54.936 0l341.96-341.96c15.188-15.181 15.188-39.75 0-54.936l-341.96-341.96c-15.182-15.186-39.754-15.186-54.936 0l-341.96 341.96c-15.186 15.186-15.186 39.755 0 54.936l341.96 341.96z" fill="#000" fill-rule="evenodd"/><path d="m420.71 795.92c9.5754 9.5754 25.147 9.5754 34.724 0l341.99-341.96c9.5754-9.577 9.5754-25.145-0.0258-34.724l-341.96-341.96c-9.5766-9.5754-25.148-9.6226-34.724-0.0473l-341.99 342.01c-9.5754 9.5798-9.5754 25.148 0 34.724l341.99 341.96z" fill="#ffd520" fill-rule="evenodd"/><path d="m182.62 402.8c-0.19272 7.9534 6.0436 14.536 13.977 14.8 7.9768 0.29157 14.702-5.9766 14.965-13.93 0.26771-8.0042-5.9964-14.729-13.997-14.969-8.0558-0.23997-14.73 6.0714-14.946 14.099zm98.695 0c-0.19272 7.9534 6.0436 14.536 13.981 14.8 7.9768 0.29157 14.698-5.9766 14.965-13.93 0.26367-8.0042-5.9964-14.729-14.001-14.969-8.0554-0.23997-14.725 6.0714-14.946 14.099zm36.577 0c-0.19313 7.9534 6.0436 14.536 13.977 14.8 7.9808 0.29157 14.702-5.9766 14.965-13.93 0.26771-8.0042-5.9924-14.729-13.997-14.969-8.0554-0.23997-14.729 6.0714-14.946 14.099zm118.73 0c-0.19255 7.9534 6.0436 14.536 13.979 14.8 7.9748 0.29157 14.7-5.9766 14.962-13.93 0.27029-8.0042-5.9952-14.729-13.994-14.969-8.0566-0.23997-14.73 6.0714-14.947 14.099zm38.024 0c-0.18965 7.9534 6.0436 14.536 13.978 14.8 7.9828 0.29157 14.704-5.9766 14.97-13.93 0.26222-8.0042-5.9952-14.729-14.002-14.969-8.0554-0.23997-14.728 6.0714-14.946 14.099zm38.318 0c-0.19352 7.9534 6.0436 14.536 13.982 14.8 7.9788 0.29157 14.7-5.9766 14.966-13.93 0.2619-8.0042-5.9952-14.729-14.002-14.969-8.0554-0.23997-14.724 6.0714-14.946 14.099zm43.16-59.83v-7.8824l94.527-1.0906c1.0845-1.2797 1.6933-2.9492 1.6