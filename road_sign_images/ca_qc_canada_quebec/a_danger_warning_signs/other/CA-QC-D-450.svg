<svg width="330.25" height="330.25" version="1.1" viewBox="82.992 45.607 967.38 1065.2" xmlns="http://www.w3.org/2000/svg"><style type="text/css">/*
 * Below are Cascading Style Sheet (CSS) definitions in use in this file,
 * which allow easily changing how countries are displayed.
 *
 */

/*
 * Circles around small countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.circlexx
{
   opacity:1;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * Smaller circles around French DOMs and Chinese SARs
 *
 * Change opacity to 1 to display all subnational circles.
 *
 */
.subxx
{
   opacity:1;
   stroke-width:0.3;
}

/*
 * Circles around small, unrecognized countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.unxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.3;
}

/*
 * Circles around small countries, but with no permanent residents 
 *
 * Change opacity to 1 to display all circles.
 *
 */
.noxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * land
 */
.landxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.5;
   fill-rule:evenodd;
}

/*
 * Styles for coastlines of islands with no borders
 */
.coastxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.3;
   fill-rule:evenodd;
}

/*
 * Styles for nations with limited recognition
 */
.limitxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Styles for nations with no permanent population.
 */
.antxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Ocean
 */
.oceanxx
{
   opacity: 1;
   color: #000000;
   fill:#ffffff;
   stroke:#000;
   stroke-width:0.5;
   stroke-miterlimit:1;
}

/*
 * Additional style rules
 *
 * The following are examples of colouring countries.  You can substitute these with your own styles to colour the countries on the map.
 *
 * Color a few countries:
 *
 * .gb, .au, .nc
 * {
 *    fill:       #ff0000;
 * }
 *
 * Color a few small country circles (and the countries):
 *
 * .ms, .ky
 * {
 *    opacity:    1;
 *    fill:       #ff0000;
 * }
 *
 */

/* Same-sex marriage */
.ar, .be, .ca, .dk, .es, .is, .nl, .no, .pt, .se, .za
{ fill: #002255; }

/* Civil unions etc. */
.ad, .at, .au, .bl, .br, .ch, .co, .cz, .de, .ec, .fi, .fr, .gb, .gf, .gl, .hr, .hu, .ie, .il, .im, .je, .li, .lu, .mf, .nc, .nf, .nz, .pm, .re, .si, .uy, .wf
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.aw, .cw, .sx, .mx
{ fill: #7fbcff; }

/* Legal but no recognition */
.ai, .al, .am, .as, .az, .ba, .bg, .bf, .by, .bj, .bm, .bo, .bs, .cd, .cg, .cf, .ci, .cl, .cn, .cr, .cu, .cv, .cy, .dj, .do, .ee, .fk, .fj, .fm, .fo, .ga, .ge, .gg, .gi, .gq, .gr, .gs, .gt, .gu, .gw, .hn, .ht, .id, .in, .iq, .it, .jo, .jp, .kg, .kh, .kp, .kr, .ky, .kz, .la, .lk, .lt, .lv, .mc, .md, .me, .mg, .mh, .mk, .ml, .mn, .mp, .mt, .ms, .mz, .ne, .ni, .np, .pa, .pe, .pf, .ph, .pl, .pn, .pr, .py, .ro, .rs, .ru, .rw, .sh, .sk, .sm, .sr, .st, .sv, .tc, .td, .th, .tj, .tk, .tl, .tr, .tw, .ua, .us, .va, .ve, .vg, .vi, .vn, .vu, .xk, .ps_west_bank
{ fill: #cccccc; }

/* Illegal, minimal penalty */
.bt, .lb, .lr
{ fill: #f9dc36; }

/* Illegal, large penalty */
.ag, .ao, .bh, .bi, .bn, .bw, .bz, .cm, .ck, .dm, .dz, .eg, .eh, .er, .et, .gd, .gh, .gm, .gn, .jm, .ke, .ki, .km, .kn, .kw, .lc, .ls, .ly, .ma, .mu, .mv, .mw, .my, .na, .ng, .nr, .nu, .om, .pg, .pw, .qa, .sb, .sc, .sg, .sn, .so, .ss, .sy, .sz, .tg, .tm, .tn, .to, .tt, .tv, .uz, .vc, .ws, .zm, .zw, .xc, .ps_gaza_strip
{ fill: #ec8028; }

/* Illegal, life imprisonment */
.bb, .bd, .gy, .mm, .pk, .sl, .tz, .ug
{ fill: #e73e21; }

/* Illegal, death penalty */
.ae, .af, .ir, .mr, .sa, .sd, .ye
{ fill: #8c201f; }

/* SUB-NATIONAL UNITS */

/* Same-sex marriage */
.br_al, .mx_dif, .us_ct, .us_dc, .us_ia, .us_ma, .us_md, .us_nh, .us_ny, .us_vt, .us_wa
{ fill: #002255; }

/* Civil unions etc. */
.mx_coa, .uk_je, .us_ca, .us_co, .us_de, .us_hi, .us_il, .us_me, .us_nj, .us_nv, .us_or, .us_ri, .us_wi, .ve_l
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.bq
{ fill: #7fbcff; }

/* Illegal, large penalty */
.id_ac
{ fill: #ec8028; }

/* Illegal, death penalty */
.ng_sharia, .so_shabaab
{ fill: #8c201f; }</style><path d="m544.97 1101.1-501.24-501.2c-11.953-11.99-12.016-31.464-0.0315-43.454l501.24-501.25c11.986-11.989 31.516-11.942 43.498 0.0473l501.21 501.2c11.982 11.99 11.954 31.464 0 43.454l-501.24 501.25c-11.982 11.986-31.415 11.942-43.434 0v-0.048z" fill="#ffd520" fill-rule="evenodd"/><path d="m551.11 1095.1c8.6198 8.6037 22.541 8.6037 31.165 0l501.25-501.25c8.6279-8.6077 8.6601-22.626 0.04-31.222l-501.26-501.26c-8.6198-8.6029-22.638-8.6029-31.23 0l-501.26 501.26c-8.6186 8.5956-8.5871 22.566 0.0394 31.169l501.25 501.3z" fill="#000" fill-rule="evenodd"/><path d="m561.87 1084.3-501.27-501.25c-2.6694-2.6569-2.7009-7.0072 0-9.7124l501.24-501.26c2.669-2.6576 7.0394-2.6104 9.7084 0.0473l501.24 501.26c2.669 2.6609 2.669 7.0112 0 9.6681l-501.24 501.25c-2.7013 2.6569-7.0072 2.6569-9.7084 0h0.029z" fill="#ffd520" fill-rule="evenodd"/><path d="m374.31 838.51v-418.89c0-17.257 13.981-31.269 31.254-31.269h322.23c17.256 0 31.27 14.012 31.27 31.269v418.89c0 17.272-14.014 31.254-31.27 31.254h-322.23c-17.273 0-31.254-13.982-31.254-31.254z" fill="#fff" fill-rule="evenodd"/><path d="m379.69 838.49c0 14.305 11.587 25.892 25.891 25.892h322.22c14.288 0 25.876-11.587 25.876-25.892v-418.88c0-14.288-11.587-25.875-25.876-25.875h-322.22c-14.304 0-25.891 11.587-25.891 25.875v418.88z" fill="#000" fill-rule="evenodd"/><path d="m389.21 838.49v-418.88c0-9.0242 7.3269-16.355 16.367-16.355h322.22c9.023 0 16.349 7.3309 16.349 16.355v418.88c0 9.0432-7.3257 16.369-16.349 16.369h-322.22c-9.04 0-16.367-7.3257-16.367-16.369z" fill="#fff" fill-rule="evenodd"/><path d="m566.69 147.02-153.69 139.87c-4.5317 3.5318-5.2207 10.139-1.5474 14.556 2.6065 3.1222 6.8076 4.3938 10.697 3.2718l112.14-29.328 0.1774 88.56 32.226-0.19272 32.226 0.19272 0.17739-88.56 112.13 29.328c3.8946 1.122 8.0957-0.14956 10.7-3.2718 3.6729-4.4176 2.9835-11.024-1.5482-14.556l-153.69-139.87z" fill="#000" fill-rule="evenodd"/><path d="m650.65 451.19c-46.373-46.365-121.55-46.365-167.92 0-46.365 46.373-46.365 121.54 0 16