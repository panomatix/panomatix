<svg width="177.57" height="177.57" version="1.1" viewBox="82.992 45.607 520.14 572.72" xmlns="http://www.w3.org/2000/svg"><style type="text/css">/*
 * Below are Cascading Style Sheet (CSS) definitions in use in this file,
 * which allow easily changing how countries are displayed.
 *
 */

/*
 * Circles around small countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.circlexx
{
   opacity:1;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * Smaller circles around French DOMs and Chinese SARs
 *
 * Change opacity to 1 to display all subnational circles.
 *
 */
.subxx
{
   opacity:1;
   stroke-width:0.3;
}

/*
 * Circles around small, unrecognized countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.unxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.3;
}

/*
 * Circles around small countries, but with no permanent residents 
 *
 * Change opacity to 1 to display all circles.
 *
 */
.noxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * land
 */
.landxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.5;
   fill-rule:evenodd;
}

/*
 * Styles for coastlines of islands with no borders
 */
.coastxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.3;
   fill-rule:evenodd;
}

/*
 * Styles for nations with limited recognition
 */
.limitxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Styles for nations with no permanent population.
 */
.antxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Ocean
 */
.oceanxx
{
   opacity: 1;
   color: #000000;
   fill:#ffffff;
   stroke:#000;
   stroke-width:0.5;
   stroke-miterlimit:1;
}

/*
 * Additional style rules
 *
 * The following are examples of colouring countries.  You can substitute these with your own styles to colour the countries on the map.
 *
 * Color a few countries:
 *
 * .gb, .au, .nc
 * {
 *    fill:       #ff0000;
 * }
 *
 * Color a few small country circles (and the countries):
 *
 * .ms, .ky
 * {
 *    opacity:    1;
 *    fill:       #ff0000;
 * }
 *
 */

/* Same-sex marriage */
.ar, .be, .ca, .dk, .es, .is, .nl, .no, .pt, .se, .za
{ fill: #002255; }

/* Civil unions etc. */
.ad, .at, .au, .bl, .br, .ch, .co, .cz, .de, .ec, .fi, .fr, .gb, .gf, .gl, .hr, .hu, .ie, .il, .im, .je, .li, .lu, .mf, .nc, .nf, .nz, .pm, .re, .si, .uy, .wf
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.aw, .cw, .sx, .mx
{ fill: #7fbcff; }

/* Legal but no recognition */
.ai, .al, .am, .as, .az, .ba, .bg, .bf, .by, .bj, .bm, .bo, .bs, .cd, .cg, .cf, .ci, .cl, .cn, .cr, .cu, .cv, .cy, .dj, .do, .ee, .fk, .fj, .fm, .fo, .ga, .ge, .gg, .gi, .gq, .gr, .gs, .gt, .gu, .gw, .hn, .ht, .id, .in, .iq, .it, .jo, .jp, .kg, .kh, .kp, .kr, .ky, .kz, .la, .lk, .lt, .lv, .mc, .md, .me, .mg, .mh, .mk, .ml, .mn, .mp, .mt, .ms, .mz, .ne, .ni, .np, .pa, .pe, .pf, .ph, .pl, .pn, .pr, .py, .ro, .rs, .ru, .rw, .sh, .sk, .sm, .sr, .st, .sv, .tc, .td, .th, .tj, .tk, .tl, .tr, .tw, .ua, .us, .va, .ve, .vg, .vi, .vn, .vu, .xk, .ps_west_bank
{ fill: #cccccc; }

/* Illegal, minimal penalty */
.bt, .lb, .lr
{ fill: #f9dc36; }

/* Illegal, large penalty */
.ag, .ao, .bh, .bi, .bn, .bw, .bz, .cm, .ck, .dm, .dz, .eg, .eh, .er, .et, .gd, .gh, .gm, .gn, .jm, .ke, .ki, .km, .kn, .kw, .lc, .ls, .ly, .ma, .mu, .mv, .mw, .my, .na, .ng, .nr, .nu, .om, .pg, .pw, .qa, .sb, .sc, .sg, .sn, .so, .ss, .sy, .sz, .tg, .tm, .tn, .to, .tt, .tv, .uz, .vc, .ws, .zm, .zw, .xc, .ps_gaza_strip
{ fill: #ec8028; }

/* Illegal, life imprisonment */
.bb, .bd, .gy, .mm, .pk, .sl, .tz, .ug
{ fill: #e73e21; }

/* Illegal, death penalty */
.ae, .af, .ir, .mr, .sa, .sd, .ye
{ fill: #8c201f; }

/* SUB-NATIONAL UNITS */

/* Same-sex marriage */
.br_al, .mx_dif, .us_ct, .us_dc, .us_ia, .us_ma, .us_md, .us_nh, .us_ny, .us_vt, .us_wa
{ fill: #002255; }

/* Civil unions etc. */
.mx_coa, .uk_je, .us_ca, .us_co, .us_de, .us_hi, .us_il, .us_me, .us_nj, .us_nv, .us_or, .us_ri, .us_wi, .ve_l
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.bq
{ fill: #7fbcff; }

/* Illegal, large penalty */
.id_ac
{ fill: #ec8028; }

/* Illegal, death penalty */
.ng_sharia, .so_shabaab
{ fill: #8c201f; }</style><path d="m62.4 319.76c-6.737 6.7366-6.737 17.674 0 24.411l268.46 268.45c6.741 6.741 17.667 6.733 24.408-6e-3l268.46-268.46c6.737-6.7366 6.737-17.659 0-24.395l-268.46-268.46c-6.7411-6.7366-17.667-6.7445-24.408-4e-3l-268.46 268.46z" fill="#ffd520" fill-rule="evenodd"/><path d="m66.327 323.67c-2.29 2.2876-3.435 5.0554-3.435 8.2997 0 3.2443 1.145 6.0081 3.435 8.2997l268.46 268.45c2.286 2.2941 5.0518 3.4391 8.2933 3.435 3.2415 0 6.0113-1.145 8.3013-3.4391l268.45-268.45c2.29-2.2912 3.435-5.0594 3.435-8.2957 0-3.2403-1.145-6.0045-3.435-8.2957l-268.45-268.46c-2.29-2.2915-5.0598-3.4372-8.3013-3.4372-3.2415-4e-3 -6.0073 1.1418-8.2933 3.4294l-268.46 268.46z" fill="#000" fill-rule="evenodd"/><path d="m72.189 329.52c-0.6733 0.67329-1.012 1.4881-1.012 2.4448s0.33867 1.7719 1.012 2.4412l268.46 268.46c0.6733 0.66927 1.4837 1.0039 2.4352 1.0039 0.95551 0 1.7699-0.33867 2.4473-1.012l268.46-268.46c0.6733-0.6733 1.0079-1.4845 1.0079-2.4372s-0.33463-1.7639-1.0079-2.4372l-268.46-268.46c-0.67734-0.67721-1.4918-1.0158-2.4473-1.0158-0.95149 0-1.7619 0.33862-2.4352 1.0079l-268.46 268.46z" fill="#ffd520" fill-rule="evenodd"/><path d="m337.8 254.19-74.019 15.749 25.033-34.636 42.986-9.1815 5.9992 28.069zm-103.12 62.736h-6.8741c2.8343-9.3705 10.511-17.076 20.751-19.352 14.671-3.3504 29.407 5.0711 33.403 19.352h-6.4387c-3.7092-10.016-14.28-16.135-24.977-13.824-7.6119 1.5986-13.401 6.9926-15.865 13.824zm156.14-74.315-44.24 9.406-5.9146-28.041 33.528-7.0946 16.627 25.73zm-99.241 74.335 101.68-21.615c-3.3988-15.359 6.3419-30.569 21.699-33.821 15.337-3.323 30.399 6.5125 33.653 21.844l56.146-12.304-6.5516-13.331-1.5159 0.29512-13.724-29.864-53.553 6.6382-41.434-28.226-102.97 22.056-31.254 43.719-45.514 13.804-23.61 8.7839 2.0562 22.021h-45.067v13.268h46.482l2.9311 8.1973 36.265-7.4293c-0.0564-0.23261-0.11288-0.50034-0.17336-0.76804h7.0192c3.056 11.044 14.208 17.973 25.485 15.564 8.2489-1.7598 14.393-7.9534 16.474-15.564h264.9v-13.268h-249.42z" fill="#000" fill-rule="evenodd"