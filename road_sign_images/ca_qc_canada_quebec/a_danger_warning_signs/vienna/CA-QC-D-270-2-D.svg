<svg width="246.15" height="246.14" version="1.1" viewBox="82.992 45.607 721.04 793.91" xmlns="http://www.w3.org/2000/svg"><style type="text/css">/*
 * Below are Cascading Style Sheet (CSS) definitions in use in this file,
 * which allow easily changing how countries are displayed.
 *
 */

/*
 * Circles around small countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.circlexx
{
   opacity:1;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * Smaller circles around French DOMs and Chinese SARs
 *
 * Change opacity to 1 to display all subnational circles.
 *
 */
.subxx
{
   opacity:1;
   stroke-width:0.3;
}

/*
 * Circles around small, unrecognized countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.unxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.3;
}

/*
 * Circles around small countries, but with no permanent residents 
 *
 * Change opacity to 1 to display all circles.
 *
 */
.noxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * land
 */
.landxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.5;
   fill-rule:evenodd;
}

/*
 * Styles for coastlines of islands with no borders
 */
.coastxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.3;
   fill-rule:evenodd;
}

/*
 * Styles for nations with limited recognition
 */
.limitxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Styles for nations with no permanent population.
 */
.antxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Ocean
 */
.oceanxx
{
   opacity: 1;
   color: #000000;
   fill:#ffffff;
   stroke:#000;
   stroke-width:0.5;
   stroke-miterlimit:1;
}

/*
 * Additional style rules
 *
 * The following are examples of colouring countries.  You can substitute these with your own styles to colour the countries on the map.
 *
 * Color a few countries:
 *
 * .gb, .au, .nc
 * {
 *    fill:       #ff0000;
 * }
 *
 * Color a few small country circles (and the countries):
 *
 * .ms, .ky
 * {
 *    opacity:    1;
 *    fill:       #ff0000;
 * }
 *
 */

/* Same-sex marriage */
.ar, .be, .ca, .dk, .es, .is, .nl, .no, .pt, .se, .za
{ fill: #002255; }

/* Civil unions etc. */
.ad, .at, .au, .bl, .br, .ch, .co, .cz, .de, .ec, .fi, .fr, .gb, .gf, .gl, .hr, .hu, .ie, .il, .im, .je, .li, .lu, .mf, .nc, .nf, .nz, .pm, .re, .si, .uy, .wf
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.aw, .cw, .sx, .mx
{ fill: #7fbcff; }

/* Legal but no recognition */
.ai, .al, .am, .as, .az, .ba, .bg, .bf, .by, .bj, .bm, .bo, .bs, .cd, .cg, .cf, .ci, .cl, .cn, .cr, .cu, .cv, .cy, .dj, .do, .ee, .fk, .fj, .fm, .fo, .ga, .ge, .gg, .gi, .gq, .gr, .gs, .gt, .gu, .gw, .hn, .ht, .id, .in, .iq, .it, .jo, .jp, .kg, .kh, .kp, .kr, .ky, .kz, .la, .lk, .lt, .lv, .mc, .md, .me, .mg, .mh, .mk, .ml, .mn, .mp, .mt, .ms, .mz, .ne, .ni, .np, .pa, .pe, .pf, .ph, .pl, .pn, .pr, .py, .ro, .rs, .ru, .rw, .sh, .sk, .sm, .sr, .st, .sv, .tc, .td, .th, .tj, .tk, .tl, .tr, .tw, .ua, .us, .va, .ve, .vg, .vi, .vn, .vu, .xk, .ps_west_bank
{ fill: #cccccc; }

/* Illegal, minimal penalty */
.bt, .lb, .lr
{ fill: #f9dc36; }

/* Illegal, large penalty */
.ag, .ao, .bh, .bi, .bn, .bw, .bz, .cm, .ck, .dm, .dz, .eg, .eh, .er, .et, .gd, .gh, .gm, .gn, .jm, .ke, .ki, .km, .kn, .kw, .lc, .ls, .ly, .ma, .mu, .mv, .mw, .my, .na, .ng, .nr, .nu, .om, .pg, .pw, .qa, .sb, .sc, .sg, .sn, .so, .ss, .sy, .sz, .tg, .tm, .tn, .to, .tt, .tv, .uz, .vc, .ws, .zm, .zw, .xc, .ps_gaza_strip
{ fill: #ec8028; }

/* Illegal, life imprisonment */
.bb, .bd, .gy, .mm, .pk, .sl, .tz, .ug
{ fill: #e73e21; }

/* Illegal, death penalty */
.ae, .af, .ir, .mr, .sa, .sd, .ye
{ fill: #8c201f; }

/* SUB-NATIONAL UNITS */

/* Same-sex marriage */
.br_al, .mx_dif, .us_ct, .us_dc, .us_ia, .us_ma, .us_md, .us_nh, .us_ny, .us_vt, .us_wa
{ fill: #002255; }

/* Civil unions etc. */
.mx_coa, .uk_je, .us_ca, .us_co, .us_de, .us_hi, .us_il, .us_me, .us_nj, .us_nv, .us_or, .us_ri, .us_wi, .ve_l
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.bq
{ fill: #7fbcff; }

/* Illegal, large penalty */
.id_ac
{ fill: #ec8028; }

/* Illegal, death penalty */
.ng_sharia, .so_shabaab
{ fill: #8c201f; }</style><path d="m421.5 829.74-365.18-365.18c-12.166-12.14-12.166-31.857 0-44.031l365.18-365.18c12.135-12.138 31.892-12.138 44.028 0l365.18 365.18c12.164 12.174 12.164 31.891 0 44.031l-365.18 365.18c-12.172 12.172-31.858 12.172-44.028 0z" fill="#ffd520" fill-rule="evenodd"/><path d="m426.09 825.21c9.6463 9.6399 25.205 9.6399 34.852 0l365.21-365.22c9.6116-9.6105 9.6399-25.229 0-34.867l-365.19-365.19c-9.6108-9.6187-25.289-9.6187-34.899 0l-365.19 365.19c-9.6423 9.6382-9.6148 25.256 0 34.867l365.21 365.22z" fill="#000" fill-rule="evenodd"/><path d="m434.17 817.12-365.21-365.21c-5.1302-5.1324-5.1578-13.524 0-18.685l365.21-365.21c5.1264-5.1341 13.524-5.1341 18.678 0l365.21 365.21c5.1526 5.1614 5.1526 13.553 0 18.685l-365.21 365.21c-5.1534 5.1606-13.524 5.1606-18.678 0z" fill="#ffd520" fill-rule="evenodd"/><path d="m326.53 633.95c-5.1856 10.325-0.99221 22.892 9.327 27.948 10.024 4.9691 22.206 1.0362 27.517-8.773l122.32-222.14 0.30222-111.27 34.125 55.33-18.53 42.463c-3.5882 8.0756 0.0403 17.536 8.1199 21.123 8.2046 3.7128 17.925-0.21642 21.296-8.5948l27.557-63.193-70.233-98.698c-1.5119-1.9884-3.3262-3.6737-5.4469-4.9256-2.6771-1.5986-5.7452-2.461-8.8496-2.5476l-54.295 2.2876c-3.2875 0.17337-6.3508 1.2954-8.9456 3.2367-1.9409 1.4724-3.5354 3.3701-4.6615 5.5751l-52.566 83.45-46.479 38.656c-6.5242 5.7916-7.2998 15.773-1.6853 22.505 5.571 6.654 15.422 7.78 22.289 2.5082l48.511-40.518 29.887-43.278-0.47616 149.01-79.087 149.84z" fill="#000" fill-rule="evenodd"/><path d="m438.87 535.54 88.632 122.11c7.3861 9.7648 21.469 11.277 30.71 3.2455 8.3336-7.2571 9.7205-19.699 3.1085-28.553l-75.801-104.74 0.0361-78.659-46.686 86.602z" fill="#000" fill-rule="evenodd"/><path d="m438.29 165.8c-21.505 0-39.006 17.607-39.057 39.113 0.0513 21.505 17.552 39.006 39.057 39.057 21.454 0 39.113-17.552 39.113-39.057s-17.659-39.113-39.113-39.113z" fill="#000" fill-rule="evenodd"/></svg>
