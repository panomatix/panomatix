<svg width="245.71" height="245.7" version="1.1" viewBox="82.992 45.607 719.75 792.48" xmlns="http://www.w3.org/2000/svg"><style type="text/css">/*
 * Below are Cascading Style Sheet (CSS) definitions in use in this file,
 * which allow easily changing how countries are displayed.
 *
 */

/*
 * Circles around small countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.circlexx
{
   opacity:1;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * Smaller circles around French DOMs and Chinese SARs
 *
 * Change opacity to 1 to display all subnational circles.
 *
 */
.subxx
{
   opacity:1;
   stroke-width:0.3;
}

/*
 * Circles around small, unrecognized countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.unxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.3;
}

/*
 * Circles around small countries, but with no permanent residents 
 *
 * Change opacity to 1 to display all circles.
 *
 */
.noxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * land
 */
.landxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.5;
   fill-rule:evenodd;
}

/*
 * Styles for coastlines of islands with no borders
 */
.coastxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.3;
   fill-rule:evenodd;
}

/*
 * Styles for nations with limited recognition
 */
.limitxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Styles for nations with no permanent population.
 */
.antxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Ocean
 */
.oceanxx
{
   opacity: 1;
   color: #000000;
   fill:#ffffff;
   stroke:#000;
   stroke-width:0.5;
   stroke-miterlimit:1;
}

/*
 * Additional style rules
 *
 * The following are examples of colouring countries.  You can substitute these with your own styles to colour the countries on the map.
 *
 * Color a few countries:
 *
 * .gb, .au, .nc
 * {
 *    fill:       #ff0000;
 * }
 *
 * Color a few small country circles (and the countries):
 *
 * .ms, .ky
 * {
 *    opacity:    1;
 *    fill:       #ff0000;
 * }
 *
 */

/* Same-sex marriage */
.ar, .be, .ca, .dk, .es, .is, .nl, .no, .pt, .se, .za
{ fill: #002255; }

/* Civil unions etc. */
.ad, .at, .au, .bl, .br, .ch, .co, .cz, .de, .ec, .fi, .fr, .gb, .gf, .gl, .hr, .hu, .ie, .il, .im, .je, .li, .lu, .mf, .nc, .nf, .nz, .pm, .re, .si, .uy, .wf
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.aw, .cw, .sx, .mx
{ fill: #7fbcff; }

/* Legal but no recognition */
.ai, .al, .am, .as, .az, .ba, .bg, .bf, .by, .bj, .bm, .bo, .bs, .cd, .cg, .cf, .ci, .cl, .cn, .cr, .cu, .cv, .cy, .dj, .do, .ee, .fk, .fj, .fm, .fo, .ga, .ge, .gg, .gi, .gq, .gr, .gs, .gt, .gu, .gw, .hn, .ht, .id, .in, .iq, .it, .jo, .jp, .kg, .kh, .kp, .kr, .ky, .kz, .la, .lk, .lt, .lv, .mc, .md, .me, .mg, .mh, .mk, .ml, .mn, .mp, .mt, .ms, .mz, .ne, .ni, .np, .pa, .pe, .pf, .ph, .pl, .pn, .pr, .py, .ro, .rs, .ru, .rw, .sh, .sk, .sm, .sr, .st, .sv, .tc, .td, .th, .tj, .tk, .tl, .tr, .tw, .ua, .us, .va, .ve, .vg, .vi, .vn, .vu, .xk, .ps_west_bank
{ fill: #cccccc; }

/* Illegal, minimal penalty */
.bt, .lb, .lr
{ fill: #f9dc36; }

/* Illegal, large penalty */
.ag, .ao, .bh, .bi, .bn, .bw, .bz, .cm, .ck, .dm, .dz, .eg, .eh, .er, .et, .gd, .gh, .gm, .gn, .jm, .ke, .ki, .km, .kn, .kw, .lc, .ls, .ly, .ma, .mu, .mv, .mw, .my, .na, .ng, .nr, .nu, .om, .pg, .pw, .qa, .sb, .sc, .sg, .sn, .so, .ss, .sy, .sz, .tg, .tm, .tn, .to, .tt, .tv, .uz, .vc, .ws, .zm, .zw, .xc, .ps_gaza_strip
{ fill: #ec8028; }

/* Illegal, life imprisonment */
.bb, .bd, .gy, .mm, .pk, .sl, .tz, .ug
{ fill: #e73e21; }

/* Illegal, death penalty */
.ae, .af, .ir, .mr, .sa, .sd, .ye
{ fill: #8c201f; }

/* SUB-NATIONAL UNITS */

/* Same-sex marriage */
.br_al, .mx_dif, .us_ct, .us_dc, .us_ia, .us_ma, .us_md, .us_nh, .us_ny, .us_vt, .us_wa
{ fill: #002255; }

/* Civil unions etc. */
.mx_coa, .uk_je, .us_ca, .us_co, .us_de, .us_hi, .us_il, .us_me, .us_nj, .us_nv, .us_or, .us_ri, .us_wi, .ve_l
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.bq
{ fill: #7fbcff; }

/* Illegal, large penalty */
.id_ac
{ fill: #ec8028; }

/* Illegal, death penalty */
.ng_sharia, .so_shabaab
{ fill: #8c201f; }</style><path d="m420.89 828.33-364.52-364.52c-12.15-12.119-12.15-31.799 0-43.95l364.52-364.52c12.115-12.115 31.835-12.115 43.951 0l364.52 364.52c12.148 12.15 12.148 31.831 0 43.95l-364.52 364.52c-12.152 12.152-31.804 12.152-43.951 0z" fill="#ffd520" fill-rule="evenodd"/><path d="m425.47 823.81c9.6221 9.6237 25.157 9.6237 34.779 0l364.56-364.56c9.5955-9.5935 9.6237-25.18 0-34.806l-364.53-364.53c-9.5983-9.5951-25.237-9.5951-34.835 0l-364.53 364.53c-9.6265 9.6266-9.595 25.213 0 34.806l364.56 364.56z" fill="#000" fill-rule="evenodd"/><path d="m433.54 815.73-364.55-364.55c-5.1224-5.1203-5.146-13.5 0-18.654l364.55-364.56c5.1183-5.1224 13.505-5.1224 18.646 0l364.55 364.56c5.1445 5.1538 5.1445 13.533 0 18.654l-364.55 364.55c-5.1413 5.1566-13.504 5.1566-18.646 0z" fill="#ffd520" fill-rule="evenodd"/><path d="m499.18 445.55 54.892 78.233c3.31 4.1164 7.7651 7.112 12.821 8.6481l81.026 22.126c10.732 3.1327 21.884-3.4834 24.186-14.426 2.2941-10.559-4.572-20.913-15.196-22.937l-75.067-19.195-84.65-152.46 35.342 10.733 31.883 57.988c3.5197 8.2917 13.381 11.812 21.364 7.6659 7.7732-4.0438 10.632-13.662 6.3056-21.293l-35.58-64.401c-2.2981-5.4021-7.1079-9.5834-12.789-11.186l-76.95-21.013c-6.5798-0.66161-13.276 0.62572-19.09 3.6576l-25.927 17.706c-4.6026 3.1694-7.9848 8.1892-9.1343 13.765l-10.627 47.255-65.972 7.3861c-8.9533 0.5237-15.851 8.1187-15.54 17.111 0.35035 9.8628 9.1657 17.182 18.887 15.788l75.52-8.8545c7.528-1.2918 14.076-6.7918 16.623-14.08l5.2602-19.757 28.262 35.616-67.115 34.955c-3.5201 2.0562-6.6266 4.7373-9.2367 7.8054l-60.677 78.409c-6.0242 8.0836-4.595 19.481 3.2439 25.819 8.1187 6.5919 20.072 5.2654 26.557-2.927l55.861-72.761 85.515-45.374z" fill="#000" fill-rule="evenodd"/><path d="m227.77 442.18c-22.643 0-41.16 18.422-41.211 41.108 0.0508 22.691 18.568 41.212 41.211 41.212 22.643 0 41.16-18.522 41.207-41.212-0.0472-22.687-18.564-41.108-41.207-41.108z" fill="#000" fill-rule="evenodd"/><path d="m405.42 247.19c-16.966 0.0706-30.801 13.839-30.801 30.