<svg width="180.44" height="180.44" version="1.1" viewBox="82.992 45.607 528.56 581.99" xmlns="http://www.w3.org/2000/svg"><style type="text/css">/*
 * Below are Cascading Style Sheet (CSS) definitions in use in this file,
 * which allow easily changing how countries are displayed.
 *
 */

/*
 * Circles around small countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.circlexx
{
   opacity:1;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * Smaller circles around French DOMs and Chinese SARs
 *
 * Change opacity to 1 to display all subnational circles.
 *
 */
.subxx
{
   opacity:1;
   stroke-width:0.3;
}

/*
 * Circles around small, unrecognized countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.unxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.3;
}

/*
 * Circles around small countries, but with no permanent residents 
 *
 * Change opacity to 1 to display all circles.
 *
 */
.noxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * land
 */
.landxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.5;
   fill-rule:evenodd;
}

/*
 * Styles for coastlines of islands with no borders
 */
.coastxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.3;
   fill-rule:evenodd;
}

/*
 * Styles for nations with limited recognition
 */
.limitxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Styles for nations with no permanent population.
 */
.antxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Ocean
 */
.oceanxx
{
   opacity: 1;
   color: #000000;
   fill:#ffffff;
   stroke:#000;
   stroke-width:0.5;
   stroke-miterlimit:1;
}

/*
 * Additional style rules
 *
 * The following are examples of colouring countries.  You can substitute these with your own styles to colour the countries on the map.
 *
 * Color a few countries:
 *
 * .gb, .au, .nc
 * {
 *    fill:       #ff0000;
 * }
 *
 * Color a few small country circles (and the countries):
 *
 * .ms, .ky
 * {
 *    opacity:    1;
 *    fill:       #ff0000;
 * }
 *
 */

/* Same-sex marriage */
.ar, .be, .ca, .dk, .es, .is, .nl, .no, .pt, .se, .za
{ fill: #002255; }

/* Civil unions etc. */
.ad, .at, .au, .bl, .br, .ch, .co, .cz, .de, .ec, .fi, .fr, .gb, .gf, .gl, .hr, .hu, .ie, .il, .im, .je, .li, .lu, .mf, .nc, .nf, .nz, .pm, .re, .si, .uy, .wf
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.aw, .cw, .sx, .mx
{ fill: #7fbcff; }

/* Legal but no recognition */
.ai, .al, .am, .as, .az, .ba, .bg, .bf, .by, .bj, .bm, .bo, .bs, .cd, .cg, .cf, .ci, .cl, .cn, .cr, .cu, .cv, .cy, .dj, .do, .ee, .fk, .fj, .fm, .fo, .ga, .ge, .gg, .gi, .gq, .gr, .gs, .gt, .gu, .gw, .hn, .ht, .id, .in, .iq, .it, .jo, .jp, .kg, .kh, .kp, .kr, .ky, .kz, .la, .lk, .lt, .lv, .mc, .md, .me, .mg, .mh, .mk, .ml, .mn, .mp, .mt, .ms, .mz, .ne, .ni, .np, .pa, .pe, .pf, .ph, .pl, .pn, .pr, .py, .ro, .rs, .ru, .rw, .sh, .sk, .sm, .sr, .st, .sv, .tc, .td, .th, .tj, .tk, .tl, .tr, .tw, .ua, .us, .va, .ve, .vg, .vi, .vn, .vu, .xk, .ps_west_bank
{ fill: #cccccc; }

/* Illegal, minimal penalty */
.bt, .lb, .lr
{ fill: #f9dc36; }

/* Illegal, large penalty */
.ag, .ao, .bh, .bi, .bn, .bw, .bz, .cm, .ck, .dm, .dz, .eg, .eh, .er, .et, .gd, .gh, .gm, .gn, .jm, .ke, .ki, .km, .kn, .kw, .lc, .ls, .ly, .ma, .mu, .mv, .mw, .my, .na, .ng, .nr, .nu, .om, .pg, .pw, .qa, .sb, .sc, .sg, .sn, .so, .ss, .sy, .sz, .tg, .tm, .tn, .to, .tt, .tv, .uz, .vc, .ws, .zm, .zw, .xc, .ps_gaza_strip
{ fill: #ec8028; }

/* Illegal, life imprisonment */
.bb, .bd, .gy, .mm, .pk, .sl, .tz, .ug
{ fill: #e73e21; }

/* Illegal, death penalty */
.ae, .af, .ir, .mr, .sa, .sd, .ye
{ fill: #8c201f; }

/* SUB-NATIONAL UNITS */

/* Same-sex marriage */
.br_al, .mx_dif, .us_ct, .us_dc, .us_ia, .us_ma, .us_md, .us_nh, .us_ny, .us_vt, .us_wa
{ fill: #002255; }

/* Civil unions etc. */
.mx_coa, .uk_je, .us_ca, .us_co, .us_de, .us_hi, .us_il, .us_me, .us_nj, .us_nv, .us_or, .us_ri, .us_wi, .ve_l
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.bq
{ fill: #7fbcff; }

/* Illegal, large penalty */
.id_ac
{ fill: #ec8028; }

/* Illegal, death penalty */
.ng_sharia, .so_shabaab
{ fill: #8c201f; }</style><path d="m58.534 582.96c0 23.4 18.981 42.382 42.384 42.382h492.69c23.404 0 42.406-18.981 42.406-42.382v-492.7c0-23.399-19.002-42.4-42.406-42.4h-492.69c-23.403 0-42.384 19.001-42.384 42.4v492.7z" fill="#fff" fill-rule="evenodd" stroke="#000" stroke-miterlimit="4" stroke-width="2.5803"/><path d="m68.692 582.97c0 17.796 14.422 32.218 32.218 32.218h492.7c17.776 0 32.214-14.422 32.214-32.218v-492.71c0-17.78-14.438-32.218-32.214-32.218h-492.7c-17.796 0-32.218 14.438-32.218 32.218v492.71z" fill="#003f87" fill-rule="evenodd"/><path d="m108.9 428.68v-20.186h18.773c3.6068 0 8.4848 4.5119 8.4848 9.906 0 5.7363-4.2837 9.9926-8.8073 10.28h-18.45zm-12.532 47.834h12.323v-35.314h15.273l12.891 35.314h13.402l-13.808-37.684c8.4098-4.6538 12.229-11.261 12.229-19.915 0-12.276-8.8432-22.229-23.214-22.938h-29.096v80.537zm84.225-16.224-0.57855-0.96762c-1.3547-2.3505-4.1853-10.277-4.1853-23.151 0-17.883 4.3268-23.407 4.957-24.297 2.3703-3.2363 6.5278-5.4134 10.733-5.4134 6.5713 0 13.721 3.5471 15.418 23.269l0.32294 6.5241c-0.64588 18.943-4.4018 23.713-6.4141 25.648-2.5118 2.4311-6.075 3.8664-9.6028 3.8664-4.3506 0-8.6029-2.3223-10.65-5.4791zm-8.1856 9.6681 0.85473 0.88295c3.7717 3.9632 11.244 7.3015 18.21 7.3015 7.3902 0 15.497-3.8987 20.411-10.329 3.0432-3.9632 7.5869-14.099 7.5869-31.559 0-17.064-4.3152-27.372-7.0753-31.175-5.0239-7.0438-12.595-10.926-21.068-10.926-7.2168 0-14.115 3.079-18.836 8.3784-4.1575 4.6736-9.0359 14.261-9.0359 32.994 0 20.978 4.7486 29.695 8.9533 34.432zm62.11-73.981 0.12621 58.387c0.8898 12.805 12.603 23.973 26.537 23.973 14.84 0 26.73-11.184 27.324-26.638v-55.69h-12.371v55.501c0 7.6038-6.7406 14.341-14.521 14.341-4.7522 0-9.5318-2.4029-12.198-6.3661-1.5434-2.286-2.3662-4.6889-2.492-8.3296v-55.177h-12.406zm82.296 80.537h12.721v-69.229h18.08v-11.308h-48.995v11.39h18.194v69.147zm42.255 0h49.235v-12.712h-36.538v-22.602h23.23v-12.568h-23.344v-20.009h33.947v-12.646h-46.53v80.537zm128.69-12.68v-55.341h11.438c5.7049 0 11.587 3.3661 15.038 12.97