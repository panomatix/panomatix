<svg width="180.44" height="180.44" version="1.1" viewBox="82.992 45.607 528.56 581.99" xmlns="http://www.w3.org/2000/svg"><style type="text/css">/*
 * Below are Cascading Style Sheet (CSS) definitions in use in this file,
 * which allow easily changing how countries are displayed.
 *
 */

/*
 * Circles around small countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.circlexx
{
   opacity:1;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * Smaller circles around French DOMs and Chinese SARs
 *
 * Change opacity to 1 to display all subnational circles.
 *
 */
.subxx
{
   opacity:1;
   stroke-width:0.3;
}

/*
 * Circles around small, unrecognized countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.unxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.3;
}

/*
 * Circles around small countries, but with no permanent residents 
 *
 * Change opacity to 1 to display all circles.
 *
 */
.noxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * land
 */
.landxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.5;
   fill-rule:evenodd;
}

/*
 * Styles for coastlines of islands with no borders
 */
.coastxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.3;
   fill-rule:evenodd;
}

/*
 * Styles for nations with limited recognition
 */
.limitxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Styles for nations with no permanent population.
 */
.antxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Ocean
 */
.oceanxx
{
   opacity: 1;
   color: #000000;
   fill:#ffffff;
   stroke:#000;
   stroke-width:0.5;
   stroke-miterlimit:1;
}

/*
 * Additional style rules
 *
 * The following are examples of colouring countries.  You can substitute these with your own styles to colour the countries on the map.
 *
 * Color a few countries:
 *
 * .gb, .au, .nc
 * {
 *    fill:       #ff0000;
 * }
 *
 * Color a few small country circles (and the countries):
 *
 * .ms, .ky
 * {
 *    opacity:    1;
 *    fill:       #ff0000;
 * }
 *
 */

/* Same-sex marriage */
.ar, .be, .ca, .dk, .es, .is, .nl, .no, .pt, .se, .za
{ fill: #002255; }

/* Civil unions etc. */
.ad, .at, .au, .bl, .br, .ch, .co, .cz, .de, .ec, .fi, .fr, .gb, .gf, .gl, .hr, .hu, .ie, .il, .im, .je, .li, .lu, .mf, .nc, .nf, .nz, .pm, .re, .si, .uy, .wf
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.aw, .cw, .sx, .mx
{ fill: #7fbcff; }

/* Legal but no recognition */
.ai, .al, .am, .as, .az, .ba, .bg, .bf, .by, .bj, .bm, .bo, .bs, .cd, .cg, .cf, .ci, .cl, .cn, .cr, .cu, .cv, .cy, .dj, .do, .ee, .fk, .fj, .fm, .fo, .ga, .ge, .gg, .gi, .gq, .gr, .gs, .gt, .gu, .gw, .hn, .ht, .id, .in, .iq, .it, .jo, .jp, .kg, .kh, .kp, .kr, .ky, .kz, .la, .lk, .lt, .lv, .mc, .md, .me, .mg, .mh, .mk, .ml, .mn, .mp, .mt, .ms, .mz, .ne, .ni, .np, .pa, .pe, .pf, .ph, .pl, .pn, .pr, .py, .ro, .rs, .ru, .rw, .sh, .sk, .sm, .sr, .st, .sv, .tc, .td, .th, .tj, .tk, .tl, .tr, .tw, .ua, .us, .va, .ve, .vg, .vi, .vn, .vu, .xk, .ps_west_bank
{ fill: #cccccc; }

/* Illegal, minimal penalty */
.bt, .lb, .lr
{ fill: #f9dc36; }

/* Illegal, large penalty */
.ag, .ao, .bh, .bi, .bn, .bw, .bz, .cm, .ck, .dm, .dz, .eg, .eh, .er, .et, .gd, .gh, .gm, .gn, .jm, .ke, .ki, .km, .kn, .kw, .lc, .ls, .ly, .ma, .mu, .mv, .mw, .my, .na, .ng, .nr, .nu, .om, .pg, .pw, .qa, .sb, .sc, .sg, .sn, .so, .ss, .sy, .sz, .tg, .tm, .tn, .to, .tt, .tv, .uz, .vc, .ws, .zm, .zw, .xc, .ps_gaza_strip
{ fill: #ec8028; }

/* Illegal, life imprisonment */
.bb, .bd, .gy, .mm, .pk, .sl, .tz, .ug
{ fill: #e73e21; }

/* Illegal, death penalty */
.ae, .af, .ir, .mr, .sa, .sd, .ye
{ fill: #8c201f; }

/* SUB-NATIONAL UNITS */

/* Same-sex marriage */
.br_al, .mx_dif, .us_ct, .us_dc, .us_ia, .us_ma, .us_md, .us_nh, .us_ny, .us_vt, .us_wa
{ fill: #002255; }

/* Civil unions etc. */
.mx_coa, .uk_je, .us_ca, .us_co, .us_de, .us_hi, .us_il, .us_me, .us_nj, .us_nv, .us_or, .us_ri, .us_wi, .ve_l
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.bq
{ fill: #7fbcff; }

/* Illegal, large penalty */
.id_ac
{ fill: #ec8028; }

/* Illegal, death penalty */
.ng_sharia, .so_shabaab
{ fill: #8c201f; }</style><path d="m58.534 582.95c0 23.408 18.977 42.386 42.384 42.386h492.69c23.408 0 42.402-18.977 42.402-42.386v-492.69c0-23.407-18.993-42.4-42.402-42.4h-492.69c-23.407 0-42.384 18.993-42.384 42.4v492.69z" fill="#fff" fill-rule="evenodd" stroke="#000" stroke-miterlimit="4" stroke-width="2.5803"/><path d="m68.68 582.97c0 17.8 14.422 32.222 32.222 32.222h492.7c17.784 0 32.222-14.422 32.222-32.222v-492.7c0-17.785-14.438-32.222-32.222-32.222h-492.7c-17.8 0-32.222 14.438-32.222 32.222v492.7z" fill="#003f87" fill-rule="evenodd"/><path d="m394.58 506.71h17.099l6.9495 9.8011h-14.938l-9.1109-9.8011zm4.4571-181.47v10.977l-133.69 71.237-133.87-71.185v-10.977l98.907-26.167 18.312-217.69 16.654-14.828 16.474 14.78 18.658 217.75 98.561 26.1zm-128.87-10.977 26.864-15.123-19.107-216.92-11.792-10.642 4.4212 10.642-0.0116 6.4845-0.37415 225.56zm122.88 15.442-94.71-25.805-28.218 15.737-0.0158 78.359 122.66-64.665 0.28384-3.6261zm-125.49-10.103-8e-3 -5.3308-30.84-13.942v5.3545l30.848 13.918zm-31.38-192.86c-4.1301-2.8899-10.15-7.1027-12.615-8.3392-4.5986-2.2953-9.7882-3.0512-14.501-5.0711-0.508-0.21652-19.793 1.012-26.096 2.9726l-8.1933 2.6106h-2.9016c-0.64951 0-5.5594-6.0948-8.2642-9.2052l-9.0637-6.9654-5.9452-4.1301-12.973-6.2367c-2.3981-1.2321-9.3552-3.1141-20.954-5.5082-9.5713-2.0276-38.601-5.5002-43.747-3.6851v6.4021c0-2.0239 27.143 1.6337 28.88 1.8502l7.7643 0.65395c4.2011 0.36205 21.092 4.1301 29.576 8.0477 0.29151 0.14553 13.048 7.3194 13.194 7.394l6.0162 4.6381c4.7167 3.6382 7.7365 9.0992 12.615 12.544 1.2361 0.87005 2.8307 1.0156 4.7877 0.5076l8.3348-2.2481c14.355-3.8426 22.911-5.2166 25.521-4.0591l13.989 5.2916c4.268 1.6179 6.8745 5.713 10.587 8.1933 1.3309 0.88577 6.5084 2.9452 11.564 3.5161l0.99221-6.1972c-4.2523-0.32294-5.5831-0.88618-8.5674-2.9766zm71.602 20.226 13.993 5.2957c4.264 1.6179 6.8705 5.713 10.587 8.1933 1.7365 1.1615 16.095 5.2916 18.41 3.9136l4.8586-1.453c11.745-1.2281 25.738 0.65355 42.05 5.4412l7.7603 2.319c0.87005 0.26003 5.0671 0.083 1.