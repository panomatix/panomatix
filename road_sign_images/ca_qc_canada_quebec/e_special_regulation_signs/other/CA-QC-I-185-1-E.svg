<svg width="181.22" height="181.22" version="1.1" viewBox="82.992 45.607 530.84 584.5" xmlns="http://www.w3.org/2000/svg"><style type="text/css">/*
 * Below are Cascading Style Sheet (CSS) definitions in use in this file,
 * which allow easily changing how countries are displayed.
 *
 */

/*
 * Circles around small countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.circlexx
{
   opacity:1;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * Smaller circles around French DOMs and Chinese SARs
 *
 * Change opacity to 1 to display all subnational circles.
 *
 */
.subxx
{
   opacity:1;
   stroke-width:0.3;
}

/*
 * Circles around small, unrecognized countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.unxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.3;
}

/*
 * Circles around small countries, but with no permanent residents 
 *
 * Change opacity to 1 to display all circles.
 *
 */
.noxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * land
 */
.landxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.5;
   fill-rule:evenodd;
}

/*
 * Styles for coastlines of islands with no borders
 */
.coastxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.3;
   fill-rule:evenodd;
}

/*
 * Styles for nations with limited recognition
 */
.limitxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Styles for nations with no permanent population.
 */
.antxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Ocean
 */
.oceanxx
{
   opacity: 1;
   color: #000000;
   fill:#ffffff;
   stroke:#000;
   stroke-width:0.5;
   stroke-miterlimit:1;
}

/*
 * Additional style rules
 *
 * The following are examples of colouring countries.  You can substitute these with your own styles to colour the countries on the map.
 *
 * Color a few countries:
 *
 * .gb, .au, .nc
 * {
 *    fill:       #ff0000;
 * }
 *
 * Color a few small country circles (and the countries):
 *
 * .ms, .ky
 * {
 *    opacity:    1;
 *    fill:       #ff0000;
 * }
 *
 */

/* Same-sex marriage */
.ar, .be, .ca, .dk, .es, .is, .nl, .no, .pt, .se, .za
{ fill: #002255; }

/* Civil unions etc. */
.ad, .at, .au, .bl, .br, .ch, .co, .cz, .de, .ec, .fi, .fr, .gb, .gf, .gl, .hr, .hu, .ie, .il, .im, .je, .li, .lu, .mf, .nc, .nf, .nz, .pm, .re, .si, .uy, .wf
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.aw, .cw, .sx, .mx
{ fill: #7fbcff; }

/* Legal but no recognition */
.ai, .al, .am, .as, .az, .ba, .bg, .bf, .by, .bj, .bm, .bo, .bs, .cd, .cg, .cf, .ci, .cl, .cn, .cr, .cu, .cv, .cy, .dj, .do, .ee, .fk, .fj, .fm, .fo, .ga, .ge, .gg, .gi, .gq, .gr, .gs, .gt, .gu, .gw, .hn, .ht, .id, .in, .iq, .it, .jo, .jp, .kg, .kh, .kp, .kr, .ky, .kz, .la, .lk, .lt, .lv, .mc, .md, .me, .mg, .mh, .mk, .ml, .mn, .mp, .mt, .ms, .mz, .ne, .ni, .np, .pa, .pe, .pf, .ph, .pl, .pn, .pr, .py, .ro, .rs, .ru, .rw, .sh, .sk, .sm, .sr, .st, .sv, .tc, .td, .th, .tj, .tk, .tl, .tr, .tw, .ua, .us, .va, .ve, .vg, .vi, .vn, .vu, .xk, .ps_west_bank
{ fill: #cccccc; }

/* Illegal, minimal penalty */
.bt, .lb, .lr
{ fill: #f9dc36; }

/* Illegal, large penalty */
.ag, .ao, .bh, .bi, .bn, .bw, .bz, .cm, .ck, .dm, .dz, .eg, .eh, .er, .et, .gd, .gh, .gm, .gn, .jm, .ke, .ki, .km, .kn, .kw, .lc, .ls, .ly, .ma, .mu, .mv, .mw, .my, .na, .ng, .nr, .nu, .om, .pg, .pw, .qa, .sb, .sc, .sg, .sn, .so, .ss, .sy, .sz, .tg, .tm, .tn, .to, .tt, .tv, .uz, .vc, .ws, .zm, .zw, .xc, .ps_gaza_strip
{ fill: #ec8028; }

/* Illegal, life imprisonment */
.bb, .bd, .gy, .mm, .pk, .sl, .tz, .ug
{ fill: #e73e21; }

/* Illegal, death penalty */
.ae, .af, .ir, .mr, .sa, .sd, .ye
{ fill: #8c201f; }

/* SUB-NATIONAL UNITS */

/* Same-sex marriage */
.br_al, .mx_dif, .us_ct, .us_dc, .us_ia, .us_ma, .us_md, .us_nh, .us_ny, .us_vt, .us_wa
{ fill: #002255; }

/* Civil unions etc. */
.mx_coa, .uk_je, .us_ca, .us_co, .us_de, .us_hi, .us_il, .us_me, .us_nj, .us_nv, .us_or, .us_ri, .us_wi, .ve_l
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.bq
{ fill: #7fbcff; }

/* Illegal, large penalty */
.id_ac
{ fill: #ec8028; }

/* Illegal, death penalty */
.ng_sharia, .so_shabaab
{ fill: #8c201f; }</style><path d="m58.418 584.22c0 24.11 19.529 43.635 43.637 43.635h492.7c24.09 0 43.656-19.526 43.656-43.635v-492.7c0-24.088-19.566-43.652-43.656-43.652h-492.7c-24.108 0-43.637 19.564-43.637 43.652v492.7z" fill="#fff" fill-rule="evenodd" stroke="#000" stroke-miterlimit="4" stroke-width="2.5803"/><path d="m69.829 584.23c0 17.792 14.422 32.218 32.218 32.218h492.7c17.776 0 32.218-14.426 32.218-32.218v-492.71c0-17.777-14.442-32.215-32.218-32.215h-492.7c-17.796 0-32.218 14.438-32.218 32.215v492.71z" fill="#003f87" fill-rule="evenodd"/><path d="m342.53 263.34-7.7639 1.0789c-2.2957 0-4.2446-1.882-4.2446-4.1773 0-2.2993 1.7994-3.831 4.1539-4.1656l7.9022-1.0946c2.2993 0 4.1341 1.882 4.1341 4.1813 0 2.2953-1.882 3.8624-4.1817 4.1773zm183.58 1.3268c1.4595 0.24029 2.669 0.48461 4.1285 0.72853l3.3423 0.26771 3.4874-0.75595c5.1284-3.6536 7.3095-9.5044-1.6974-18.521-9.2609-9.0166-21.703-11.457-32.173-15.355l-56.798-21.202c-0.97245-0.48824-12.674 0.97246-12.674 0.97246-5.8468 0.97648-12.418 1.4647-15.596 0.73216l-18.21-2.1812-22.482-2.6932s-21.934-0.0116-33.144 0.48824c-1.9489 0-33.636 1.9489-48.259 2.4372-7.0789 0.24432-23.651-10.725-29.502-10.725-7.5438 0-20.485 9.5044-27.529 9.2601-10.237 0-20.726-7.7954-18.032-18.764l2.5158-5.3864 4.7917-3.146c4.622-1.4607 9.4963 0.24433 14.138 1.2208l20.962 1.2164c7.9022-0.97245 15.064-3.3975 21.19-7.7958 3.8979-2.4372 7.8349-4.9332 10.981-8.532 7.5083-8.5634 8.9573-10.237 8.9573-11.882 0-2.4412-1.9844-4.4256-4.4216-4.4256l-8.6936 2.4174c-2.6694 0.72853-5.3622 1.4607-7.7994 0l-15.6-5.3626c-5.5908-0.73217-11.197-0.73217-16.804-1.4643l-8.7722-1.9489c-2.3662-0.7878-4.78-2.3783-7.2998-3.654-2.2166-1.2204-4.6655-1.4647-7.0789-1.4647-0.73256 0-1.7086 0.48824-2.4372 0-1.9606-1.9489-3.1693-4.8744-5.3743-6.579l-6.2093-3.2403-6.2089-5.2916-12.442-15.355-4.7131-5.2683-8.1933-4.9647c-2.9254-1.4647-3.8979-4.8744-4.8744-7.7998-0.6733-1.9175-0.68499-4.1575-1.4724-5.7364-0.66161-1.7521-2.3702-2.9923-4.343-2.9923-1.9135 0-3.5632 1.1615-4.271