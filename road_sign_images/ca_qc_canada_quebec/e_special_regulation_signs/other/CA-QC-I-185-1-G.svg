<svg width="180.44" height="180.44" version="1.1" viewBox="82.992 45.607 528.56 581.99" xmlns="http://www.w3.org/2000/svg"><style type="text/css">/*
 * Below are Cascading Style Sheet (CSS) definitions in use in this file,
 * which allow easily changing how countries are displayed.
 *
 */

/*
 * Circles around small countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.circlexx
{
   opacity:1;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * Smaller circles around French DOMs and Chinese SARs
 *
 * Change opacity to 1 to display all subnational circles.
 *
 */
.subxx
{
   opacity:1;
   stroke-width:0.3;
}

/*
 * Circles around small, unrecognized countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.unxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.3;
}

/*
 * Circles around small countries, but with no permanent residents 
 *
 * Change opacity to 1 to display all circles.
 *
 */
.noxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * land
 */
.landxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.5;
   fill-rule:evenodd;
}

/*
 * Styles for coastlines of islands with no borders
 */
.coastxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.3;
   fill-rule:evenodd;
}

/*
 * Styles for nations with limited recognition
 */
.limitxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Styles for nations with no permanent population.
 */
.antxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Ocean
 */
.oceanxx
{
   opacity: 1;
   color: #000000;
   fill:#ffffff;
   stroke:#000;
   stroke-width:0.5;
   stroke-miterlimit:1;
}

/*
 * Additional style rules
 *
 * The following are examples of colouring countries.  You can substitute these with your own styles to colour the countries on the map.
 *
 * Color a few countries:
 *
 * .gb, .au, .nc
 * {
 *    fill:       #ff0000;
 * }
 *
 * Color a few small country circles (and the countries):
 *
 * .ms, .ky
 * {
 *    opacity:    1;
 *    fill:       #ff0000;
 * }
 *
 */

/* Same-sex marriage */
.ar, .be, .ca, .dk, .es, .is, .nl, .no, .pt, .se, .za
{ fill: #002255; }

/* Civil unions etc. */
.ad, .at, .au, .bl, .br, .ch, .co, .cz, .de, .ec, .fi, .fr, .gb, .gf, .gl, .hr, .hu, .ie, .il, .im, .je, .li, .lu, .mf, .nc, .nf, .nz, .pm, .re, .si, .uy, .wf
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.aw, .cw, .sx, .mx
{ fill: #7fbcff; }

/* Legal but no recognition */
.ai, .al, .am, .as, .az, .ba, .bg, .bf, .by, .bj, .bm, .bo, .bs, .cd, .cg, .cf, .ci, .cl, .cn, .cr, .cu, .cv, .cy, .dj, .do, .ee, .fk, .fj, .fm, .fo, .ga, .ge, .gg, .gi, .gq, .gr, .gs, .gt, .gu, .gw, .hn, .ht, .id, .in, .iq, .it, .jo, .jp, .kg, .kh, .kp, .kr, .ky, .kz, .la, .lk, .lt, .lv, .mc, .md, .me, .mg, .mh, .mk, .ml, .mn, .mp, .mt, .ms, .mz, .ne, .ni, .np, .pa, .pe, .pf, .ph, .pl, .pn, .pr, .py, .ro, .rs, .ru, .rw, .sh, .sk, .sm, .sr, .st, .sv, .tc, .td, .th, .tj, .tk, .tl, .tr, .tw, .ua, .us, .va, .ve, .vg, .vi, .vn, .vu, .xk, .ps_west_bank
{ fill: #cccccc; }

/* Illegal, minimal penalty */
.bt, .lb, .lr
{ fill: #f9dc36; }

/* Illegal, large penalty */
.ag, .ao, .bh, .bi, .bn, .bw, .bz, .cm, .ck, .dm, .dz, .eg, .eh, .er, .et, .gd, .gh, .gm, .gn, .jm, .ke, .ki, .km, .kn, .kw, .lc, .ls, .ly, .ma, .mu, .mv, .mw, .my, .na, .ng, .nr, .nu, .om, .pg, .pw, .qa, .sb, .sc, .sg, .sn, .so, .ss, .sy, .sz, .tg, .tm, .tn, .to, .tt, .tv, .uz, .vc, .ws, .zm, .zw, .xc, .ps_gaza_strip
{ fill: #ec8028; }

/* Illegal, life imprisonment */
.bb, .bd, .gy, .mm, .pk, .sl, .tz, .ug
{ fill: #e73e21; }

/* Illegal, death penalty */
.ae, .af, .ir, .mr, .sa, .sd, .ye
{ fill: #8c201f; }

/* SUB-NATIONAL UNITS */

/* Same-sex marriage */
.br_al, .mx_dif, .us_ct, .us_dc, .us_ia, .us_ma, .us_md, .us_nh, .us_ny, .us_vt, .us_wa
{ fill: #002255; }

/* Civil unions etc. */
.mx_coa, .uk_je, .us_ca, .us_co, .us_de, .us_hi, .us_il, .us_me, .us_nj, .us_nv, .us_or, .us_ri, .us_wi, .ve_l
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.bq
{ fill: #7fbcff; }

/* Illegal, large penalty */
.id_ac
{ fill: #ec8028; }

/* Illegal, death penalty */
.ng_sharia, .so_shabaab
{ fill: #8c201f; }</style><path d="m58.534 582.96c0 23.4 18.977 42.382 42.38 42.382h492.69c23.4 0 42.402-18.981 42.402-42.382v-492.7c0-23.399-19.002-42.4-42.402-42.4h-492.69c-23.403 0-42.38 19.001-42.38 42.4v492.7z" fill="#fff" fill-rule="evenodd" stroke="#000" stroke-miterlimit="4" stroke-width="2.5803"/><path d="m68.688 582.97c0 17.796 14.422 32.218 32.218 32.218h492.7c17.78 0 32.218-14.422 32.218-32.218v-492.7c0-17.781-14.438-32.218-32.218-32.218h-492.7c-17.796 0-32.218 14.438-32.218 32.218v492.7z" fill="#003f87" fill-rule="evenodd"/><path d="m389.36 261.45c16.95 0 30.738 13.788 30.738 30.738 0 16.95-13.788 30.738-30.738 30.738-16.95 0-30.738-13.788-30.738-30.738 0-16.95 13.788-30.738 30.738-30.738zm-68.508 0c16.95 0 30.738 13.788 30.738 30.738 0 16.95-13.788 30.738-30.738 30.738s-30.738-13.788-30.738-30.738c0-16.95 13.788-30.738 30.738-30.738zm101.31-58.637c16.95 0 30.738 13.788 30.738 30.738 0 16.95-13.789 30.738-30.738 30.738-16.95 0-30.738-13.789-30.738-30.738 0-16.95 13.788-30.738 30.738-30.738zm-67.055 0c16.95 0 30.738 13.788 30.738 30.738 0 16.95-13.788 30.738-30.738 30.738s-30.738-13.789-30.738-30.738c0-16.95 13.788-30.738 30.738-30.738zm-67.055 0c16.95 0 30.738 13.788 30.738 30.738 0 16.95-13.788 30.738-30.738 30.738-16.95 0-30.738-13.789-30.738-30.738 0-16.95 13.789-30.738 30.738-30.738zm67.055 117.27c16.95 0 30.738 13.792 30.738 30.742 0 16.946-13.788 30.738-30.738 30.738s-30.738-13.792-30.738-30.738c0-16.95 13.788-30.742 30.738-30.742zm-13.044-210.51c0.41729-2.0748 0.64145-4.2204 0.64145-6.3585 0-6.6382-1.2873-12.713-4.7994-17.855-12.713 15.277-21.556 35.707-21.556 57.129 0 23.651 8.4296 45.436 23.572 61.287-10.154-9.2802-26.651-14.997-41.506-14.997-27.852 0-51.149 20.072-56.287 46.428-0.29109-2.3505-0.50396-4.6381-0.50396-6.9257 0-27.919 22.868-50.778 50.786-50.778 6.3625 0 11.646 1.0591 17.139 3.075-5.2836-11.083-8.2171-23.36-8.2171-36.443 0-30.644 15.517-61.141 39.94-75.847 3 5.4885 5.7835 15.43 5.7835 22.068 0 6.9926-1.7086 13.647-4.9921 19.218zm-