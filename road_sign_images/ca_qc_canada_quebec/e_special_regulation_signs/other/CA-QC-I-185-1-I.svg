<svg width="180.68" height="180.86" version="1.1" viewBox="82.992 45.607 529.26 583.34" xmlns="http://www.w3.org/2000/svg"><style type="text/css">/*
 * Below are Cascading Style Sheet (CSS) definitions in use in this file,
 * which allow easily changing how countries are displayed.
 *
 */

/*
 * Circles around small countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.circlexx
{
   opacity:1;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * Smaller circles around French DOMs and Chinese SARs
 *
 * Change opacity to 1 to display all subnational circles.
 *
 */
.subxx
{
   opacity:1;
   stroke-width:0.3;
}

/*
 * Circles around small, unrecognized countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.unxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.3;
}

/*
 * Circles around small countries, but with no permanent residents 
 *
 * Change opacity to 1 to display all circles.
 *
 */
.noxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * land
 */
.landxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.5;
   fill-rule:evenodd;
}

/*
 * Styles for coastlines of islands with no borders
 */
.coastxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.3;
   fill-rule:evenodd;
}

/*
 * Styles for nations with limited recognition
 */
.limitxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Styles for nations with no permanent population.
 */
.antxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Ocean
 */
.oceanxx
{
   opacity: 1;
   color: #000000;
   fill:#ffffff;
   stroke:#000;
   stroke-width:0.5;
   stroke-miterlimit:1;
}

/*
 * Additional style rules
 *
 * The following are examples of colouring countries.  You can substitute these with your own styles to colour the countries on the map.
 *
 * Color a few countries:
 *
 * .gb, .au, .nc
 * {
 *    fill:       #ff0000;
 * }
 *
 * Color a few small country circles (and the countries):
 *
 * .ms, .ky
 * {
 *    opacity:    1;
 *    fill:       #ff0000;
 * }
 *
 */

/* Same-sex marriage */
.ar, .be, .ca, .dk, .es, .is, .nl, .no, .pt, .se, .za
{ fill: #002255; }

/* Civil unions etc. */
.ad, .at, .au, .bl, .br, .ch, .co, .cz, .de, .ec, .fi, .fr, .gb, .gf, .gl, .hr, .hu, .ie, .il, .im, .je, .li, .lu, .mf, .nc, .nf, .nz, .pm, .re, .si, .uy, .wf
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.aw, .cw, .sx, .mx
{ fill: #7fbcff; }

/* Legal but no recognition */
.ai, .al, .am, .as, .az, .ba, .bg, .bf, .by, .bj, .bm, .bo, .bs, .cd, .cg, .cf, .ci, .cl, .cn, .cr, .cu, .cv, .cy, .dj, .do, .ee, .fk, .fj, .fm, .fo, .ga, .ge, .gg, .gi, .gq, .gr, .gs, .gt, .gu, .gw, .hn, .ht, .id, .in, .iq, .it, .jo, .jp, .kg, .kh, .kp, .kr, .ky, .kz, .la, .lk, .lt, .lv, .mc, .md, .me, .mg, .mh, .mk, .ml, .mn, .mp, .mt, .ms, .mz, .ne, .ni, .np, .pa, .pe, .pf, .ph, .pl, .pn, .pr, .py, .ro, .rs, .ru, .rw, .sh, .sk, .sm, .sr, .st, .sv, .tc, .td, .th, .tj, .tk, .tl, .tr, .tw, .ua, .us, .va, .ve, .vg, .vi, .vn, .vu, .xk, .ps_west_bank
{ fill: #cccccc; }

/* Illegal, minimal penalty */
.bt, .lb, .lr
{ fill: #f9dc36; }

/* Illegal, large penalty */
.ag, .ao, .bh, .bi, .bn, .bw, .bz, .cm, .ck, .dm, .dz, .eg, .eh, .er, .et, .gd, .gh, .gm, .gn, .jm, .ke, .ki, .km, .kn, .kw, .lc, .ls, .ly, .ma, .mu, .mv, .mw, .my, .na, .ng, .nr, .nu, .om, .pg, .pw, .qa, .sb, .sc, .sg, .sn, .so, .ss, .sy, .sz, .tg, .tm, .tn, .to, .tt, .tv, .uz, .vc, .ws, .zm, .zw, .xc, .ps_gaza_strip
{ fill: #ec8028; }

/* Illegal, life imprisonment */
.bb, .bd, .gy, .mm, .pk, .sl, .tz, .ug
{ fill: #e73e21; }

/* Illegal, death penalty */
.ae, .af, .ir, .mr, .sa, .sd, .ye
{ fill: #8c201f; }

/* SUB-NATIONAL UNITS */

/* Same-sex marriage */
.br_al, .mx_dif, .us_ct, .us_dc, .us_ia, .us_ma, .us_md, .us_nh, .us_ny, .us_vt, .us_wa
{ fill: #002255; }

/* Civil unions etc. */
.mx_coa, .uk_je, .us_ca, .us_co, .us_de, .us_hi, .us_il, .us_me, .us_nj, .us_nv, .us_or, .us_ri, .us_wi, .ve_l
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.bq
{ fill: #7fbcff; }

/* Illegal, large penalty */
.id_ac
{ fill: #ec8028; }

/* Illegal, death penalty */
.ng_sharia, .so_shabaab
{ fill: #8c201f; }</style><path d="m58.498 603.18c0 13.063 10.449 23.513 23.222 23.513h531.51c13.063 0 23.513-10.45 23.513-23.513v-531.8c0-13.06-10.45-23.513-23.513-23.513h-531.51c-12.772 0-23.222 10.453-23.222 23.513v531.8z" fill="#fff" fill-rule="evenodd" stroke="#000" stroke-miterlimit="4" stroke-width="2.5803"/><path d="m69.239 603.18c0 6.9668 5.5161 12.482 12.481 12.482h531.51c6.9669 0 12.482-5.5154 12.482-12.482v-531.8c0-6.6736-5.5154-12.481-12.482-12.481h-531.51c-6.965 0-12.481 5.8074-12.481 12.481v531.8z" fill="#003f87" fill-rule="evenodd"/><path d="m118.3 550.93v30.48l-1.7441 4.3543-16.836-41.801v41.801h-11.319v-72.281h11.319l16.836 41.511 1.7441-4.064zm0-422.95v33.675c-10.741 12.481-26.415 20.028-37.734 31.931-2.9057 2.9016-4.6499 4.9332-6.0988 8.4178-1.1615 2.6101-2.0316 6.3858-3.7719 10.158v-40.928l15.966-11.611 6.6776-4.9373c9.8667-6.6733 16.832-17.997 24.962-26.706zm-12.772 310.31v-17.997h12.772v-11.319h-24.383v72.571h11.611v-31.931h12.772v-11.323h-12.772zm12.772 143.11v-30.48l15.096-37.737h11.319v72.571h-11.319v-41.801l-15.096 37.447zm62.122-69.668v11.027c-3.1931 0.29415-6.6774 2.036-8.7089 4.9348-0.58299 0.58057-4.3547 5.8097-4.3547 21.775 0 11.611 2.6106 18.864 3.7717 20.9l0.58299 0.86682c1.7401 2.6126 5.2247 4.6486 8.7089 4.9389v11.031c-5.8073-0.29029-12.194-3.1931-15.387-6.6766l-0.87004-0.5846c-3.7717-4.3502-7.8353-12.192-7.8353-31.056 0-16.837 4.351-25.545 8.1268-29.609 4.0632-4.6446 9.8664-7.2571 15.965-7.5474zm0-104.5v11.319c-3.7717 0-7.8389 1.7401-9.8705 4.6458-0.58259 0.87004-4.6462 5.8037-4.6462 22.06 0 11.611 2.6146 18.578 3.7761 20.61l0.57855 0.87085c2.0316 2.9028 6.0948 4.9348 9.8709 4.9348h0.29109v11.321c-6.3859 0-13.355-3.1931-16.835-6.6766l-0.87408-0.87085c-3.7721-4.064-8.4142-11.902-8.4142-30.772 0-16.836 4.6421-25.545 8.4142-29.896 4.3543-4.6458 11.032-7.5474 17.709-7.5474zm0-77.8v36.868c-4.0672-3.7757-7.5474-7.8389-12.194-11.032l-4.6417-5.5162c-13.355-11.028 5.2247-17.127 16.835-20.32zm0-193.33v34.833c-2.9057-3.7721-5.2284-7.8393-8.