<svg width="324.69" height="324.69" version="1.1" viewBox="82.992 45.607 951.11 1047.3" xmlns="http://www.w3.org/2000/svg"><style type="text/css">/*
 * Below are Cascading Style Sheet (CSS) definitions in use in this file,
 * which allow easily changing how countries are displayed.
 *
 */

/*
 * Circles around small countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.circlexx
{
   opacity:1;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * Smaller circles around French DOMs and Chinese SARs
 *
 * Change opacity to 1 to display all subnational circles.
 *
 */
.subxx
{
   opacity:1;
   stroke-width:0.3;
}

/*
 * Circles around small, unrecognized countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.unxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.3;
}

/*
 * Circles around small countries, but with no permanent residents 
 *
 * Change opacity to 1 to display all circles.
 *
 */
.noxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * land
 */
.landxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.5;
   fill-rule:evenodd;
}

/*
 * Styles for coastlines of islands with no borders
 */
.coastxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.3;
   fill-rule:evenodd;
}

/*
 * Styles for nations with limited recognition
 */
.limitxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Styles for nations with no permanent population.
 */
.antxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Ocean
 */
.oceanxx
{
   opacity: 1;
   color: #000000;
   fill:#ffffff;
   stroke:#000;
   stroke-width:0.5;
   stroke-miterlimit:1;
}

/*
 * Additional style rules
 *
 * The following are examples of colouring countries.  You can substitute these with your own styles to colour the countries on the map.
 *
 * Color a few countries:
 *
 * .gb, .au, .nc
 * {
 *    fill:       #ff0000;
 * }
 *
 * Color a few small country circles (and the countries):
 *
 * .ms, .ky
 * {
 *    opacity:    1;
 *    fill:       #ff0000;
 * }
 *
 */

/* Same-sex marriage */
.ar, .be, .ca, .dk, .es, .is, .nl, .no, .pt, .se, .za
{ fill: #002255; }

/* Civil unions etc. */
.ad, .at, .au, .bl, .br, .ch, .co, .cz, .de, .ec, .fi, .fr, .gb, .gf, .gl, .hr, .hu, .ie, .il, .im, .je, .li, .lu, .mf, .nc, .nf, .nz, .pm, .re, .si, .uy, .wf
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.aw, .cw, .sx, .mx
{ fill: #7fbcff; }

/* Legal but no recognition */
.ai, .al, .am, .as, .az, .ba, .bg, .bf, .by, .bj, .bm, .bo, .bs, .cd, .cg, .cf, .ci, .cl, .cn, .cr, .cu, .cv, .cy, .dj, .do, .ee, .fk, .fj, .fm, .fo, .ga, .ge, .gg, .gi, .gq, .gr, .gs, .gt, .gu, .gw, .hn, .ht, .id, .in, .iq, .it, .jo, .jp, .kg, .kh, .kp, .kr, .ky, .kz, .la, .lk, .lt, .lv, .mc, .md, .me, .mg, .mh, .mk, .ml, .mn, .mp, .mt, .ms, .mz, .ne, .ni, .np, .pa, .pe, .pf, .ph, .pl, .pn, .pr, .py, .ro, .rs, .ru, .rw, .sh, .sk, .sm, .sr, .st, .sv, .tc, .td, .th, .tj, .tk, .tl, .tr, .tw, .ua, .us, .va, .ve, .vg, .vi, .vn, .vu, .xk, .ps_west_bank
{ fill: #cccccc; }

/* Illegal, minimal penalty */
.bt, .lb, .lr
{ fill: #f9dc36; }

/* Illegal, large penalty */
.ag, .ao, .bh, .bi, .bn, .bw, .bz, .cm, .ck, .dm, .dz, .eg, .eh, .er, .et, .gd, .gh, .gm, .gn, .jm, .ke, .ki, .km, .kn, .kw, .lc, .ls, .ly, .ma, .mu, .mv, .mw, .my, .na, .ng, .nr, .nu, .om, .pg, .pw, .qa, .sb, .sc, .sg, .sn, .so, .ss, .sy, .sz, .tg, .tm, .tn, .to, .tt, .tv, .uz, .vc, .ws, .zm, .zw, .xc, .ps_gaza_strip
{ fill: #ec8028; }

/* Illegal, life imprisonment */
.bb, .bd, .gy, .mm, .pk, .sl, .tz, .ug
{ fill: #e73e21; }

/* Illegal, death penalty */
.ae, .af, .ir, .mr, .sa, .sd, .ye
{ fill: #8c201f; }

/* SUB-NATIONAL UNITS */

/* Same-sex marriage */
.br_al, .mx_dif, .us_ct, .us_dc, .us_ia, .us_ma, .us_md, .us_nh, .us_ny, .us_vt, .us_wa
{ fill: #002255; }

/* Civil unions etc. */
.mx_coa, .uk_je, .us_ca, .us_co, .us_de, .us_hi, .us_il, .us_me, .us_nj, .us_nv, .us_or, .us_ri, .us_wi, .ve_l
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.bq
{ fill: #7fbcff; }

/* Illegal, large penalty */
.id_ac
{ fill: #ec8028; }

/* Illegal, death penalty */
.ng_sharia, .so_shabaab
{ fill: #8c201f; }</style><path d="m37.176 1033.7c0 7.7208 1.4843 15.107 4.4648 22.158 2.882 6.8096 6.9492 12.837 12.198 18.094 5.2523 5.2453 11.28 9.3093 18.088 12.192 7.0517 2.9794 14.438 4.4671 22.159 4.4671h928.91c7.7248 0 15.111-1.4877 22.158-4.4671 6.8055-2.8827 12.841-6.9467 18.09-12.192 5.2534-5.2573 9.3174-11.285 12.196-18.094 2.9795-7.0515 4.4712-14.438 4.4712-22.158v-928.91c0-7.7248-1.4917-15.111-4.4712-22.159-2.8786-6.8075-6.9426-12.839-12.196-18.088-5.2493-5.2562-11.285-9.3195-18.09-12.198-7.0475-2.9805-14.434-4.4727-22.158-4.4727h-928.91c-7.7208 0-15.107 1.4922-22.159 4.4727-6.8075 2.8781-12.835 6.9414-18.088 12.198-5.2483 5.2483-9.3155 11.28-12.198 18.088-2.9805 7.0479-4.4648 14.434-4.4648 22.159v928.91z" fill="#fff" fill-rule="evenodd" stroke="#000" stroke-miterlimit="4" stroke-width="2.5803"/><path d="m56.583 1033.7c0 20.699 16.777 37.475 37.475 37.475h928.91c20.699 0 37.475-16.776 37.475-37.475v-928.91c0-20.698-16.776-37.474-37.475-37.474h-928.91c-20.698 0-37.475 16.777-37.475 37.474v928.91z" fill="#003f87" fill-rule="evenodd"/><path d="m113.85 740.53v-36.342h33.817c6.5044 0 15.3 8.0957 15.3 17.853 0 10.366-7.6897 17.998-15.879 18.49h-33.238zm-22.553 86.215h22.206v-63.629h27.49l23.222 63.629h24.183l-24.911-67.927c15.158-8.3618 22.037-20.263 22.037-35.85 0-22.114-15.938-40.059-41.829-41.366h-52.397v145.14zm143.81-29.23-1.0156-1.7417c-2.4686-4.2414-7.5752-18.518-7.5752-41.745 0-32.222 7.8034-42.148 8.965-43.744 4.2091-5.8662 11.757-9.785 19.304-9.785 11.847 0 24.734 6.3863 27.781 41.918l0.58298 11.757c-1.1341 34.165-7.926 42.765-11.528 46.244-4.528 4.3825-10.969 6.995-17.328 6.995-7.8074 0-15.473-4.2091-19.186-9.8979zm-14.721 17.417 1.5119 1.5966c6.7955 7.1402 20.261 13.147 32.801 13.147 13.328 0 27.927-7.0233 36.805-18.606 5.4888-7.1402 13.647-25.396 13.647-56.868 0-30.77-7.78-49.316-12.713-56.198-9.0871-12.623-22.73-19.679-37.971-19.679-13.036 0-25.458 5.5719-33.935 15.127-7.516 8.4142-16.284 25.686-16.284 59.444 0 37.797 8.5634 53.529 16.139 62.03