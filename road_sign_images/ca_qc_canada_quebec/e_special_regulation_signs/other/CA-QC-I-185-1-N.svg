<svg width="355.73" height="355.73" version="1.1" viewBox="82.992 45.607 1042 1147.4" xmlns="http://www.w3.org/2000/svg"><style type="text/css">/*
 * Below are Cascading Style Sheet (CSS) definitions in use in this file,
 * which allow easily changing how countries are displayed.
 *
 */

/*
 * Circles around small countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.circlexx
{
   opacity:1;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * Smaller circles around French DOMs and Chinese SARs
 *
 * Change opacity to 1 to display all subnational circles.
 *
 */
.subxx
{
   opacity:1;
   stroke-width:0.3;
}

/*
 * Circles around small, unrecognized countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.unxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.3;
}

/*
 * Circles around small countries, but with no permanent residents 
 *
 * Change opacity to 1 to display all circles.
 *
 */
.noxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * land
 */
.landxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.5;
   fill-rule:evenodd;
}

/*
 * Styles for coastlines of islands with no borders
 */
.coastxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.3;
   fill-rule:evenodd;
}

/*
 * Styles for nations with limited recognition
 */
.limitxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Styles for nations with no permanent population.
 */
.antxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Ocean
 */
.oceanxx
{
   opacity: 1;
   color: #000000;
   fill:#ffffff;
   stroke:#000;
   stroke-width:0.5;
   stroke-miterlimit:1;
}

/*
 * Additional style rules
 *
 * The following are examples of colouring countries.  You can substitute these with your own styles to colour the countries on the map.
 *
 * Color a few countries:
 *
 * .gb, .au, .nc
 * {
 *    fill:       #ff0000;
 * }
 *
 * Color a few small country circles (and the countries):
 *
 * .ms, .ky
 * {
 *    opacity:    1;
 *    fill:       #ff0000;
 * }
 *
 */

/* Same-sex marriage */
.ar, .be, .ca, .dk, .es, .is, .nl, .no, .pt, .se, .za
{ fill: #002255; }

/* Civil unions etc. */
.ad, .at, .au, .bl, .br, .ch, .co, .cz, .de, .ec, .fi, .fr, .gb, .gf, .gl, .hr, .hu, .ie, .il, .im, .je, .li, .lu, .mf, .nc, .nf, .nz, .pm, .re, .si, .uy, .wf
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.aw, .cw, .sx, .mx
{ fill: #7fbcff; }

/* Legal but no recognition */
.ai, .al, .am, .as, .az, .ba, .bg, .bf, .by, .bj, .bm, .bo, .bs, .cd, .cg, .cf, .ci, .cl, .cn, .cr, .cu, .cv, .cy, .dj, .do, .ee, .fk, .fj, .fm, .fo, .ga, .ge, .gg, .gi, .gq, .gr, .gs, .gt, .gu, .gw, .hn, .ht, .id, .in, .iq, .it, .jo, .jp, .kg, .kh, .kp, .kr, .ky, .kz, .la, .lk, .lt, .lv, .mc, .md, .me, .mg, .mh, .mk, .ml, .mn, .mp, .mt, .ms, .mz, .ne, .ni, .np, .pa, .pe, .pf, .ph, .pl, .pn, .pr, .py, .ro, .rs, .ru, .rw, .sh, .sk, .sm, .sr, .st, .sv, .tc, .td, .th, .tj, .tk, .tl, .tr, .tw, .ua, .us, .va, .ve, .vg, .vi, .vn, .vu, .xk, .ps_west_bank
{ fill: #cccccc; }

/* Illegal, minimal penalty */
.bt, .lb, .lr
{ fill: #f9dc36; }

/* Illegal, large penalty */
.ag, .ao, .bh, .bi, .bn, .bw, .bz, .cm, .ck, .dm, .dz, .eg, .eh, .er, .et, .gd, .gh, .gm, .gn, .jm, .ke, .ki, .km, .kn, .kw, .lc, .ls, .ly, .ma, .mu, .mv, .mw, .my, .na, .ng, .nr, .nu, .om, .pg, .pw, .qa, .sb, .sc, .sg, .sn, .so, .ss, .sy, .sz, .tg, .tm, .tn, .to, .tt, .tv, .uz, .vc, .ws, .zm, .zw, .xc, .ps_gaza_strip
{ fill: #ec8028; }

/* Illegal, life imprisonment */
.bb, .bd, .gy, .mm, .pk, .sl, .tz, .ug
{ fill: #e73e21; }

/* Illegal, death penalty */
.ae, .af, .ir, .mr, .sa, .sd, .ye
{ fill: #8c201f; }

/* SUB-NATIONAL UNITS */

/* Same-sex marriage */
.br_al, .mx_dif, .us_ct, .us_dc, .us_ia, .us_ma, .us_md, .us_nh, .us_ny, .us_vt, .us_wa
{ fill: #002255; }

/* Civil unions etc. */
.mx_coa, .uk_je, .us_ca, .us_co, .us_de, .us_hi, .us_il, .us_me, .us_nj, .us_nv, .us_or, .us_ri, .us_wi, .ve_l
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.bq
{ fill: #7fbcff; }

/* Illegal, large penalty */
.id_ac
{ fill: #ec8028; }

/* Illegal, death penalty */
.ng_sharia, .so_shabaab
{ fill: #8c201f; }</style><path d="m32.581 1095.5c0 52.586 42.675 95.262 95.265 95.262h952.38c52.59 0 95.213-42.676 95.213-95.262v-952.38c0-52.59-42.623-95.214-95.213-95.214h-952.38c-52.59 0-95.265 42.624-95.265 95.214v952.38z" fill="#fff" fill-rule="evenodd" stroke="#000" stroke-miterlimit="4" stroke-width="2.5803"/><path d="m61.027 1095.6c0 18.401 6.52 34.116 19.549 47.147 13.024 13.022 28.742 19.542 47.148 19.542h952.37c18.401 0 34.1-6.5153 47.119-19.534 13.01-13.031 19.526-28.746 19.526-47.155v-952.37c0-18.406-6.5073-34.116-19.518-47.129-13.014-13.009-28.722-19.517-47.127-19.517h-952.37c-18.415 0-34.132 6.5083-47.156 19.525-13.028 13.013-19.54 28.723-19.54 47.121v952.37z" fill="#003f87" fill-rule="evenodd"/><path d="m107.26 924.09h25.064v-56.698h38.364l23.128 56.654h27.139l-25.399-62.028c14.324-8.1239 22.785-23.078 22.785-38.172 0-14.704-7.5438-28.206-19.159-35.657-6.1419-3.9148-15.528-7.0636-28.494-7.0636h-63.378l-0.0512 142.97zm195.46-23.364c-17.127 0-34.494-12.627-34.494-48.478 0-35.467 18.726-47.849 34.057-47.849 13.453 0 34.258 9.7205 34.258 48.042 0 35.024-18.052 48.284-33.821 48.284zm-1.016 25.202c7.2051 0 14.367-1.403 21.096-4.0156 13.107-5.2695 23.509-14.611 31.108-30.476 3.9648-8.3255 7.595-22.691 7.595-38.463 0-17.034-3.8233-31.738-7.4023-39.285-7.4019-15.772-17.513-24.823-31.202-30.145-6.5318-2.5158-13.505-3.9148-20.564-3.9148-15.34 0-30.478 6.5758-41.026 17.8-5.0792 5.4227-8.7089 12.002-11.615 18.82-3.433 8.0352-6.4806 21.529-6.4806 35.802 0 15.482 3.1931 29.222 6.2879 36.431 6.6774 15.772 17.273 26.368 29.707 32.226 7.4962 3.435 15.871 5.2211 22.497 5.2211zm80.072-144.56v88.871c0 32.129 23.269 55.686 56.745 55.686 18.244 0 31.746-6.0919 41.515-16.208 9.1399-9.4342 15.433-23.509 15.433-42.188v-86.356l-25.013 0.19353v85.436c0 15.143-4.9348 23.852-12.676 29.803-5.5154 4.2575-12.289 6.5838-19.159 6.5838-8.1739 0-16.017-3.1448-21.675-8.515-4.4018-4.1648-7.7917-9.9181-9.5282-19.743-0.68097-3.7253-0.68097-7.4506-0.72813-11.22l-0.14579-82.344h-24.769zm166.