<svg width="178.53" height="45.465" version="1.1" viewBox="82.992 45.607 522.97 146.64" xmlns="http://www.w3.org/2000/svg"><style type="text/css">/*
 * Below are Cascading Style Sheet (CSS) definitions in use in this file,
 * which allow easily changing how countries are displayed.
 *
 */

/*
 * Circles around small countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.circlexx
{
   opacity:1;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * Smaller circles around French DOMs and Chinese SARs
 *
 * Change opacity to 1 to display all subnational circles.
 *
 */
.subxx
{
   opacity:1;
   stroke-width:0.3;
}

/*
 * Circles around small, unrecognized countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.unxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.3;
}

/*
 * Circles around small countries, but with no permanent residents 
 *
 * Change opacity to 1 to display all circles.
 *
 */
.noxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * land
 */
.landxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.5;
   fill-rule:evenodd;
}

/*
 * Styles for coastlines of islands with no borders
 */
.coastxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.3;
   fill-rule:evenodd;
}

/*
 * Styles for nations with limited recognition
 */
.limitxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Styles for nations with no permanent population.
 */
.antxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Ocean
 */
.oceanxx
{
   opacity: 1;
   color: #000000;
   fill:#ffffff;
   stroke:#000;
   stroke-width:0.5;
   stroke-miterlimit:1;
}

/*
 * Additional style rules
 *
 * The following are examples of colouring countries.  You can substitute these with your own styles to colour the countries on the map.
 *
 * Color a few countries:
 *
 * .gb, .au, .nc
 * {
 *    fill:       #ff0000;
 * }
 *
 * Color a few small country circles (and the countries):
 *
 * .ms, .ky
 * {
 *    opacity:    1;
 *    fill:       #ff0000;
 * }
 *
 */

/* Same-sex marriage */
.ar, .be, .ca, .dk, .es, .is, .nl, .no, .pt, .se, .za
{ fill: #002255; }

/* Civil unions etc. */
.ad, .at, .au, .bl, .br, .ch, .co, .cz, .de, .ec, .fi, .fr, .gb, .gf, .gl, .hr, .hu, .ie, .il, .im, .je, .li, .lu, .mf, .nc, .nf, .nz, .pm, .re, .si, .uy, .wf
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.aw, .cw, .sx, .mx
{ fill: #7fbcff; }

/* Legal but no recognition */
.ai, .al, .am, .as, .az, .ba, .bg, .bf, .by, .bj, .bm, .bo, .bs, .cd, .cg, .cf, .ci, .cl, .cn, .cr, .cu, .cv, .cy, .dj, .do, .ee, .fk, .fj, .fm, .fo, .ga, .ge, .gg, .gi, .gq, .gr, .gs, .gt, .gu, .gw, .hn, .ht, .id, .in, .iq, .it, .jo, .jp, .kg, .kh, .kp, .kr, .ky, .kz, .la, .lk, .lt, .lv, .mc, .md, .me, .mg, .mh, .mk, .ml, .mn, .mp, .mt, .ms, .mz, .ne, .ni, .np, .pa, .pe, .pf, .ph, .pl, .pn, .pr, .py, .ro, .rs, .ru, .rw, .sh, .sk, .sm, .sr, .st, .sv, .tc, .td, .th, .tj, .tk, .tl, .tr, .tw, .ua, .us, .va, .ve, .vg, .vi, .vn, .vu, .xk, .ps_west_bank
{ fill: #cccccc; }

/* Illegal, minimal penalty */
.bt, .lb, .lr
{ fill: #f9dc36; }

/* Illegal, large penalty */
.ag, .ao, .bh, .bi, .bn, .bw, .bz, .cm, .ck, .dm, .dz, .eg, .eh, .er, .et, .gd, .gh, .gm, .gn, .jm, .ke, .ki, .km, .kn, .kw, .lc, .ls, .ly, .ma, .mu, .mv, .mw, .my, .na, .ng, .nr, .nu, .om, .pg, .pw, .qa, .sb, .sc, .sg, .sn, .so, .ss, .sy, .sz, .tg, .tm, .tn, .to, .tt, .tv, .uz, .vc, .ws, .zm, .zw, .xc, .ps_gaza_strip
{ fill: #ec8028; }

/* Illegal, life imprisonment */
.bb, .bd, .gy, .mm, .pk, .sl, .tz, .ug
{ fill: #e73e21; }

/* Illegal, death penalty */
.ae, .af, .ir, .mr, .sa, .sd, .ye
{ fill: #8c201f; }

/* SUB-NATIONAL UNITS */

/* Same-sex marriage */
.br_al, .mx_dif, .us_ct, .us_dc, .us_ia, .us_ma, .us_md, .us_nh, .us_ny, .us_vt, .us_wa
{ fill: #002255; }

/* Civil unions etc. */
.mx_coa, .uk_je, .us_ca, .us_co, .us_de, .us_hi, .us_il, .us_me, .us_nj, .us_nv, .us_or, .us_ri, .us_wi, .ve_l
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.bq
{ fill: #7fbcff; }

/* Illegal, large penalty */
.id_ac
{ fill: #ec8028; }

/* Illegal, death penalty */
.ng_sharia, .so_shabaab
{ fill: #8c201f; }</style><path d="m58.816 178.55c0 6.331 5.1066 11.446 11.457 11.446h548.41c6.3298 0 11.458-5.1147 11.458-11.446v-119.23c0-6.3232-5.1284-11.449-11.458-11.449h-548.41c-6.3507 0-11.457 5.1263-11.457 11.449v119.23z" fill="#fff" fill-rule="evenodd" stroke="#000" stroke-miterlimit="4" stroke-width="1.6127"/><path d="m196.7 185.79v-133.68h-126.47c-3.9924 0-7.2248 3.2364-7.2248 7.2248v119.23c0 3.9922 3.2324 7.2249 7.2248 7.2249h126.47z" fill="#003f87" fill-rule="evenodd"/><path d="m539.94 185.79h78.759c3.9834 0 7.2208-3.2326 7.2208-7.2249v-119.23c0-3.9884-3.2375-7.2248-7.2208-7.2248h-78.759-338.53v133.68h338.53z" fill="#003f87" fill-rule="evenodd"/><path d="m196.2 139.03-47.05 7.2091c-6.2919-5.2247-11.328-11.934-14.544-19.615l-4.7522-9.3472 28.998-4.0474 5.8508 7.5676 11.934-1.4845c4.5708 8.2247 11.363 15.068 19.564 19.718zm-49.696 26.832v-16.875l6.0121-0.94503v9.4649l5.2957-0.75958v-9.5362l18.375-2.8742v9.7685l5.1421-0.73217v-9.8156l7.2878-1.1498v16.273l-42.113 7.1813zm-83.273-12.973 3.8939-0.36608 3.5711-0.83457 2.9844-0.91762 2.8938-0.86602 2.9018-0.83094 2.2206-1.2006 1.4371-1.2285 0.54335-1.0708-0.15748-1.1458-0.77957-1.2087-0.83078-0.46446-0.75986-0.52775-0.315-0.91359 0.46461-0.75595 1-0.77934 1.3072-0.75998 1.5119-0.67733 1.3859-0.39349 2.3427-0.36609 1.9883-0.23625h2.7482 6.6578l2.7444-0.44108 1.7519-0.55113 2.0634-0.8386 1.4329-1.2285 0.70474-1.193-0.0746-0.92125-0.31489-0.70475-0.91762-0.51969-0.83054-0.15766-1.3075-0.23222-1.2833-0.0553-1.0673-0.075-1.3897-0.0786-1.303-0.2439-0.75998-0.22862-0.23626-0.91318 0.31892-0.99221 0.90956-0.91359 1.3071-0.60234 1.3583-0.54711 1.8309-0.20884h1.9292l7.237 0.0746h3.7362l-6.2484 0.60274-6.2601 0.38584-0.52776 0.60637 0.0786 0.60234 0.92166 0.23223 1.118 0.51969 1.622 1.0749 1.1498 1.2285 0.59831 1.3071v1.5905l-0.31083 1.2011-1.0708 0.99624-1.7482 0.78336-1.9961 0.75595-2.0595 0.51969-2.4291 0.39753-1.9844 0.28345-2.063 0.15765-1.8272 0.23223-1.307 0.15763-1.7521 0.31489-1.3072 0.13385-0.90952 0.15363-1.283