<svg width="178.53" height="45.464" version="1.1" viewBox="82.992 45.607 522.97 146.64" xmlns="http://www.w3.org/2000/svg"><style type="text/css">/*
 * Below are Cascading Style Sheet (CSS) definitions in use in this file,
 * which allow easily changing how countries are displayed.
 *
 */

/*
 * Circles around small countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.circlexx
{
   opacity:1;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * Smaller circles around French DOMs and Chinese SARs
 *
 * Change opacity to 1 to display all subnational circles.
 *
 */
.subxx
{
   opacity:1;
   stroke-width:0.3;
}

/*
 * Circles around small, unrecognized countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.unxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.3;
}

/*
 * Circles around small countries, but with no permanent residents 
 *
 * Change opacity to 1 to display all circles.
 *
 */
.noxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * land
 */
.landxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.5;
   fill-rule:evenodd;
}

/*
 * Styles for coastlines of islands with no borders
 */
.coastxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.3;
   fill-rule:evenodd;
}

/*
 * Styles for nations with limited recognition
 */
.limitxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Styles for nations with no permanent population.
 */
.antxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Ocean
 */
.oceanxx
{
   opacity: 1;
   color: #000000;
   fill:#ffffff;
   stroke:#000;
   stroke-width:0.5;
   stroke-miterlimit:1;
}

/*
 * Additional style rules
 *
 * The following are examples of colouring countries.  You can substitute these with your own styles to colour the countries on the map.
 *
 * Color a few countries:
 *
 * .gb, .au, .nc
 * {
 *    fill:       #ff0000;
 * }
 *
 * Color a few small country circles (and the countries):
 *
 * .ms, .ky
 * {
 *    opacity:    1;
 *    fill:       #ff0000;
 * }
 *
 */

/* Same-sex marriage */
.ar, .be, .ca, .dk, .es, .is, .nl, .no, .pt, .se, .za
{ fill: #002255; }

/* Civil unions etc. */
.ad, .at, .au, .bl, .br, .ch, .co, .cz, .de, .ec, .fi, .fr, .gb, .gf, .gl, .hr, .hu, .ie, .il, .im, .je, .li, .lu, .mf, .nc, .nf, .nz, .pm, .re, .si, .uy, .wf
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.aw, .cw, .sx, .mx
{ fill: #7fbcff; }

/* Legal but no recognition */
.ai, .al, .am, .as, .az, .ba, .bg, .bf, .by, .bj, .bm, .bo, .bs, .cd, .cg, .cf, .ci, .cl, .cn, .cr, .cu, .cv, .cy, .dj, .do, .ee, .fk, .fj, .fm, .fo, .ga, .ge, .gg, .gi, .gq, .gr, .gs, .gt, .gu, .gw, .hn, .ht, .id, .in, .iq, .it, .jo, .jp, .kg, .kh, .kp, .kr, .ky, .kz, .la, .lk, .lt, .lv, .mc, .md, .me, .mg, .mh, .mk, .ml, .mn, .mp, .mt, .ms, .mz, .ne, .ni, .np, .pa, .pe, .pf, .ph, .pl, .pn, .pr, .py, .ro, .rs, .ru, .rw, .sh, .sk, .sm, .sr, .st, .sv, .tc, .td, .th, .tj, .tk, .tl, .tr, .tw, .ua, .us, .va, .ve, .vg, .vi, .vn, .vu, .xk, .ps_west_bank
{ fill: #cccccc; }

/* Illegal, minimal penalty */
.bt, .lb, .lr
{ fill: #f9dc36; }

/* Illegal, large penalty */
.ag, .ao, .bh, .bi, .bn, .bw, .bz, .cm, .ck, .dm, .dz, .eg, .eh, .er, .et, .gd, .gh, .gm, .gn, .jm, .ke, .ki, .km, .kn, .kw, .lc, .ls, .ly, .ma, .mu, .mv, .mw, .my, .na, .ng, .nr, .nu, .om, .pg, .pw, .qa, .sb, .sc, .sg, .sn, .so, .ss, .sy, .sz, .tg, .tm, .tn, .to, .tt, .tv, .uz, .vc, .ws, .zm, .zw, .xc, .ps_gaza_strip
{ fill: #ec8028; }

/* Illegal, life imprisonment */
.bb, .bd, .gy, .mm, .pk, .sl, .tz, .ug
{ fill: #e73e21; }

/* Illegal, death penalty */
.ae, .af, .ir, .mr, .sa, .sd, .ye
{ fill: #8c201f; }

/* SUB-NATIONAL UNITS */

/* Same-sex marriage */
.br_al, .mx_dif, .us_ct, .us_dc, .us_ia, .us_ma, .us_md, .us_nh, .us_ny, .us_vt, .us_wa
{ fill: #002255; }

/* Civil unions etc. */
.mx_coa, .uk_je, .us_ca, .us_co, .us_de, .us_hi, .us_il, .us_me, .us_nj, .us_nv, .us_or, .us_ri, .us_wi, .ve_l
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.bq
{ fill: #7fbcff; }

/* Illegal, large penalty */
.id_ac
{ fill: #ec8028; }

/* Illegal, death penalty */
.ng_sharia, .so_shabaab
{ fill: #8c201f; }</style><path d="m58.816 178.54c0 6.3351 5.1066 11.446 11.457 11.446h548.4c6.3338 0 11.462-5.1106 11.462-11.446v-119.23c0-6.3272-5.1284-11.446-11.462-11.446h-548.4c-6.3507 0-11.457 5.1184-11.457 11.446v119.23z" fill="#fff" fill-rule="evenodd" stroke="#000" stroke-miterlimit="4" stroke-width="1.6127"/><path d="m196.74 185.75v-133.68h-126.47c-3.9884 0-7.2248 3.2285-7.2248 7.2248v119.23c0 3.9886 3.2364 7.2249 7.2248 7.2249h126.47z" fill="#003f87" fill-rule="evenodd"/><path d="m539.94 185.79h78.759c3.9753 0 7.2168-3.2246 7.2168-7.2249v-119.23c0-3.9923-3.2415-7.2288-7.2168-7.2288h-78.759-338.53v133.68h338.53z" fill="#003f87" fill-rule="evenodd"/><path d="m319.19 128.99h7.595l3.0827 4.3506h-6.6302l-4.0475-4.3506zm-98.943-43.687v-8.9336h6.0867c1.8744 0 3.3822 1.1812 3.3822 4.5081 0 2.7325-1.1692 4.0121-3.0476 4.4255h-6.4213zm-5.0397 21.789h5.134v-16.761h4.453l4.8111 16.761h5.2525l-5.0751-17.651c3.1181-1.5119 4.8389-3.9095 4.8389-8.7759 0-7.0004-4.9139-9.032-7.091-9.2328h-12.323v35.66zm29.604-5.3508-0.18101-0.26368c-0.54348-0.82288-1.4526-2.8033-1.4526-7.9413 0-1.6421 0.16531-3.0673 0.6729-5.0989 0.93738-3.8348 2.1066-4.1616 3.0911-4.1616 0.93294 0 1.984 0.47244 2.6496 2.9295 0.51969 1.9135 0.94867 5.1655 0.94867 6.9922 0 8.036-2.7206 8.9927-3.7205 8.9927-0.47655 0-1.1458-0.20871-2.0082-1.4489zm-2.9174 3.6736 0.32295 0.31083c1.5159 1.5236 3.323 2.1969 4.7756 2.1969 2.0792 0 3.6028-1.0749 4.9768-2.4803 1.5159-1.5474 3.4177-5.2206 3.4177-11.217 0-11.304-5.4453-14.694-8.5634-14.694-2.3428 0-5.6069 1.8938-7.2172 6.3311-0.61806 1.6774-1.1615 4.2009-1.1615 8.335 0 6.1423 1.6498 9.3273 3.4491 11.217zm29.62 1.6929h4.5236v-26.785h-4.5079v18.324c0 3.2326-1.9372 4.7525-3.6225 4.7525-1.7361 0-3.2637-1.382-3.3032-3.7248v-19.351h-4.445v19.832c0 6.4567 5.2876 7.7404 6.7088 7.7404 1.957 0 3.3903-1.0317 4.6304-2.4098l0.0158 1.6224zm20.852-1.2482 0.74788-4.4174-0.37414 0.35843c-0.65354 0.62572-1.4252 1.2599-2.3388 1.2639-1.1337 0-2.0118-0.68539-2.059-2.6618v-16.261h4.8429v-