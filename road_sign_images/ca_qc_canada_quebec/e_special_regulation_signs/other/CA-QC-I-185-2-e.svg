<svg width="360.66" height="90.771" version="1.1" viewBox="82.992 45.607 1056.5 292.77" xmlns="http://www.w3.org/2000/svg"><style type="text/css">/*
 * Below are Cascading Style Sheet (CSS) definitions in use in this file,
 * which allow easily changing how countries are displayed.
 *
 */

/*
 * Circles around small countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.circlexx
{
   opacity:1;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * Smaller circles around French DOMs and Chinese SARs
 *
 * Change opacity to 1 to display all subnational circles.
 *
 */
.subxx
{
   opacity:1;
   stroke-width:0.3;
}

/*
 * Circles around small, unrecognized countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.unxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.3;
}

/*
 * Circles around small countries, but with no permanent residents 
 *
 * Change opacity to 1 to display all circles.
 *
 */
.noxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * land
 */
.landxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.5;
   fill-rule:evenodd;
}

/*
 * Styles for coastlines of islands with no borders
 */
.coastxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.3;
   fill-rule:evenodd;
}

/*
 * Styles for nations with limited recognition
 */
.limitxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Styles for nations with no permanent population.
 */
.antxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Ocean
 */
.oceanxx
{
   opacity: 1;
   color: #000000;
   fill:#ffffff;
   stroke:#000;
   stroke-width:0.5;
   stroke-miterlimit:1;
}

/*
 * Additional style rules
 *
 * The following are examples of colouring countries.  You can substitute these with your own styles to colour the countries on the map.
 *
 * Color a few countries:
 *
 * .gb, .au, .nc
 * {
 *    fill:       #ff0000;
 * }
 *
 * Color a few small country circles (and the countries):
 *
 * .ms, .ky
 * {
 *    opacity:    1;
 *    fill:       #ff0000;
 * }
 *
 */

/* Same-sex marriage */
.ar, .be, .ca, .dk, .es, .is, .nl, .no, .pt, .se, .za
{ fill: #002255; }

/* Civil unions etc. */
.ad, .at, .au, .bl, .br, .ch, .co, .cz, .de, .ec, .fi, .fr, .gb, .gf, .gl, .hr, .hu, .ie, .il, .im, .je, .li, .lu, .mf, .nc, .nf, .nz, .pm, .re, .si, .uy, .wf
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.aw, .cw, .sx, .mx
{ fill: #7fbcff; }

/* Legal but no recognition */
.ai, .al, .am, .as, .az, .ba, .bg, .bf, .by, .bj, .bm, .bo, .bs, .cd, .cg, .cf, .ci, .cl, .cn, .cr, .cu, .cv, .cy, .dj, .do, .ee, .fk, .fj, .fm, .fo, .ga, .ge, .gg, .gi, .gq, .gr, .gs, .gt, .gu, .gw, .hn, .ht, .id, .in, .iq, .it, .jo, .jp, .kg, .kh, .kp, .kr, .ky, .kz, .la, .lk, .lt, .lv, .mc, .md, .me, .mg, .mh, .mk, .ml, .mn, .mp, .mt, .ms, .mz, .ne, .ni, .np, .pa, .pe, .pf, .ph, .pl, .pn, .pr, .py, .ro, .rs, .ru, .rw, .sh, .sk, .sm, .sr, .st, .sv, .tc, .td, .th, .tj, .tk, .tl, .tr, .tw, .ua, .us, .va, .ve, .vg, .vi, .vn, .vu, .xk, .ps_west_bank
{ fill: #cccccc; }

/* Illegal, minimal penalty */
.bt, .lb, .lr
{ fill: #f9dc36; }

/* Illegal, large penalty */
.ag, .ao, .bh, .bi, .bn, .bw, .bz, .cm, .ck, .dm, .dz, .eg, .eh, .er, .et, .gd, .gh, .gm, .gn, .jm, .ke, .ki, .km, .kn, .kw, .lc, .ls, .ly, .ma, .mu, .mv, .mw, .my, .na, .ng, .nr, .nu, .om, .pg, .pw, .qa, .sb, .sc, .sg, .sn, .so, .ss, .sy, .sz, .tg, .tm, .tn, .to, .tt, .tv, .uz, .vc, .ws, .zm, .zw, .xc, .ps_gaza_strip
{ fill: #ec8028; }

/* Illegal, life imprisonment */
.bb, .bd, .gy, .mm, .pk, .sl, .tz, .ug
{ fill: #e73e21; }

/* Illegal, death penalty */
.ae, .af, .ir, .mr, .sa, .sd, .ye
{ fill: #8c201f; }

/* SUB-NATIONAL UNITS */

/* Same-sex marriage */
.br_al, .mx_dif, .us_ct, .us_dc, .us_ia, .us_ma, .us_md, .us_nh, .us_ny, .us_vt, .us_wa
{ fill: #002255; }

/* Civil unions etc. */
.mx_coa, .uk_je, .us_ca, .us_co, .us_de, .us_hi, .us_il, .us_me, .us_nj, .us_nv, .us_or, .us_ri, .us_wi, .ve_l
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.bq
{ fill: #7fbcff; }

/* Illegal, large penalty */
.id_ac
{ fill: #ec8028; }

/* Illegal, death penalty */
.ng_sharia, .so_shabaab
{ fill: #8c201f; }</style><path d="m31.851 312.91c0 12.839 10.359 23.214 23.23 23.214h1112.3c12.829 0 23.231-10.375 23.231-23.214v-241.82c0-12.828-10.402-23.226-23.231-23.226h-1112.3c-12.871 0-23.23 10.398-23.23 23.226v241.82z" fill="#fff" fill-rule="evenodd" stroke="#000" stroke-miterlimit="4" stroke-width="2.5803"/><path d="m311.59 327.52v-271.13h-256.5c-8.1028 0-14.654 6.5673-14.654 14.654v241.82c0 8.103 6.5516 14.655 14.654 14.655h256.5z" fill="#003f87" fill-rule="evenodd"/><path d="m1007.6 327.48h159.74c8.0837 0 14.647-6.5516 14.647-14.654v-241.82c0-8.0871-6.5636-14.654-14.647-14.654h-159.74-686.58v271.13h686.58z" fill="#003f87" fill-rule="evenodd"/><path d="m359.26 123.66v-18.135h12.331c3.7955 0 6.8548 2.4057 6.8548 9.1504 0 5.5396-2.3703 8.1264-6.1657 8.9847h-13.02zm-10.229 44.176h10.41v-33.982h9.0323l9.7564 33.982h10.662l-10.3-35.797c6.3234-3.0593 9.8076-7.9296 9.8076-17.808 0-14.182-9.9648-18.304-14.379-18.718h-24.989v72.323zm60.039-10.843-0.36244-0.54347c-1.11-1.6695-2.9605-5.6815-2.9605-16.103 0-3.327 0.33867-6.229 1.366-10.339 1.9098-7.776 4.2801-8.4493 6.2762-8.4493 1.8977 0 4.0237 0.96479 5.3662 5.9452 1.0555 3.8822 1.9215 10.473 1.9215 14.198 0 16.285-5.5122 18.217-7.5321 18.217-0.98013 0-2.3308-0.40922-4.0749-2.925zm-5.9097 7.4333 0.65356 0.65355c3.071 3.071 6.7326 4.449 9.6814 4.449 4.2091 0 7.3039-2.1852 10.083-5.0276 3.0867-3.1419 6.9298-10.603 6.9298-22.765 0-22.911-11.04-29.793-17.351-29.793-4.7603 0-11.387 3.8467-14.639 12.839-1.2482 3.3979-2.3586 8.5243-2.3586 16.918 0 12.45 3.3391 18.906 7.0007 22.726zm60.061 3.4492h9.1802v-54.334h-9.1399v37.175c0 6.5439-3.9309 9.6225-7.3498 9.6225-3.5197 0-6.6282-2.7912-6.6846-7.5555v-39.242h-9.0351v40.223c0 13.107 10.728 15.706 13.611 15.706 3.9834 0 6.8701-2.0909 9.3859-4.8982l0.0323 3.3036zm42.297-2.5396 1.52-8.9613-0.76199 0.72853c-1.3264 1.268-2.9028 2.563-4.7494 2.5751-2.2981 0-4.0841-1.3902-4.1728-5.4058v-32.971h9.8334v-7.8349h-9.652v-18.171l-9.1399 5.6577v12.442h-6.5274v7.8704h6.4548v35.148c0 8.0122 