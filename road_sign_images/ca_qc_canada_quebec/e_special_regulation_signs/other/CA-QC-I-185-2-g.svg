<svg width="180.83" height="46.037" version="1.1" viewBox="82.992 45.607 529.71 148.49" xmlns="http://www.w3.org/2000/svg"><style type="text/css">/*
 * Below are Cascading Style Sheet (CSS) definitions in use in this file,
 * which allow easily changing how countries are displayed.
 *
 */

/*
 * Circles around small countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.circlexx
{
   opacity:1;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * Smaller circles around French DOMs and Chinese SARs
 *
 * Change opacity to 1 to display all subnational circles.
 *
 */
.subxx
{
   opacity:1;
   stroke-width:0.3;
}

/*
 * Circles around small, unrecognized countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.unxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.3;
}

/*
 * Circles around small countries, but with no permanent residents 
 *
 * Change opacity to 1 to display all circles.
 *
 */
.noxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * land
 */
.landxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.5;
   fill-rule:evenodd;
}

/*
 * Styles for coastlines of islands with no borders
 */
.coastxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.3;
   fill-rule:evenodd;
}

/*
 * Styles for nations with limited recognition
 */
.limitxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Styles for nations with no permanent population.
 */
.antxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Ocean
 */
.oceanxx
{
   opacity: 1;
   color: #000000;
   fill:#ffffff;
   stroke:#000;
   stroke-width:0.5;
   stroke-miterlimit:1;
}

/*
 * Additional style rules
 *
 * The following are examples of colouring countries.  You can substitute these with your own styles to colour the countries on the map.
 *
 * Color a few countries:
 *
 * .gb, .au, .nc
 * {
 *    fill:       #ff0000;
 * }
 *
 * Color a few small country circles (and the countries):
 *
 * .ms, .ky
 * {
 *    opacity:    1;
 *    fill:       #ff0000;
 * }
 *
 */

/* Same-sex marriage */
.ar, .be, .ca, .dk, .es, .is, .nl, .no, .pt, .se, .za
{ fill: #002255; }

/* Civil unions etc. */
.ad, .at, .au, .bl, .br, .ch, .co, .cz, .de, .ec, .fi, .fr, .gb, .gf, .gl, .hr, .hu, .ie, .il, .im, .je, .li, .lu, .mf, .nc, .nf, .nz, .pm, .re, .si, .uy, .wf
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.aw, .cw, .sx, .mx
{ fill: #7fbcff; }

/* Legal but no recognition */
.ai, .al, .am, .as, .az, .ba, .bg, .bf, .by, .bj, .bm, .bo, .bs, .cd, .cg, .cf, .ci, .cl, .cn, .cr, .cu, .cv, .cy, .dj, .do, .ee, .fk, .fj, .fm, .fo, .ga, .ge, .gg, .gi, .gq, .gr, .gs, .gt, .gu, .gw, .hn, .ht, .id, .in, .iq, .it, .jo, .jp, .kg, .kh, .kp, .kr, .ky, .kz, .la, .lk, .lt, .lv, .mc, .md, .me, .mg, .mh, .mk, .ml, .mn, .mp, .mt, .ms, .mz, .ne, .ni, .np, .pa, .pe, .pf, .ph, .pl, .pn, .pr, .py, .ro, .rs, .ru, .rw, .sh, .sk, .sm, .sr, .st, .sv, .tc, .td, .th, .tj, .tk, .tl, .tr, .tw, .ua, .us, .va, .ve, .vg, .vi, .vn, .vu, .xk, .ps_west_bank
{ fill: #cccccc; }

/* Illegal, minimal penalty */
.bt, .lb, .lr
{ fill: #f9dc36; }

/* Illegal, large penalty */
.ag, .ao, .bh, .bi, .bn, .bw, .bz, .cm, .ck, .dm, .dz, .eg, .eh, .er, .et, .gd, .gh, .gm, .gn, .jm, .ke, .ki, .km, .kn, .kw, .lc, .ls, .ly, .ma, .mu, .mv, .mw, .my, .na, .ng, .nr, .nu, .om, .pg, .pw, .qa, .sb, .sc, .sg, .sn, .so, .ss, .sy, .sz, .tg, .tm, .tn, .to, .tt, .tv, .uz, .vc, .ws, .zm, .zw, .xc, .ps_gaza_strip
{ fill: #ec8028; }

/* Illegal, life imprisonment */
.bb, .bd, .gy, .mm, .pk, .sl, .tz, .ug
{ fill: #e73e21; }

/* Illegal, death penalty */
.ae, .af, .ir, .mr, .sa, .sd, .ye
{ fill: #8c201f; }

/* SUB-NATIONAL UNITS */

/* Same-sex marriage */
.br_al, .mx_dif, .us_ct, .us_dc, .us_ia, .us_ma, .us_md, .us_nh, .us_ny, .us_vt, .us_wa
{ fill: #002255; }

/* Civil unions etc. */
.mx_coa, .uk_je, .us_ca, .us_co, .us_de, .us_hi, .us_il, .us_me, .us_nj, .us_nv, .us_or, .us_ri, .us_wi, .ve_l
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.bq
{ fill: #7fbcff; }

/* Illegal, large penalty */
.id_ac
{ fill: #ec8028; }

/* Illegal, death penalty */
.ng_sharia, .so_shabaab
{ fill: #8c201f; }</style><path d="m58.476 180.24c0 6.4137 5.1775 11.595 11.607 11.595h555.53c6.4104 0 11.603-5.1812 11.603-11.595v-120.78c0-6.4059-5.1929-11.599-11.603-11.599h-555.53c-6.4295 0-11.607 5.1932-11.607 11.599v120.78z" fill="#fff" fill-rule="evenodd" stroke="#000" stroke-miterlimit="4" stroke-width="1.6127"/><path d="m198.15 187.58v-135.42h-128.11c-4.0436 0-7.3154 3.2797-7.3154 7.3193v120.78c0 4.0438 3.2718 7.3196 7.3154 7.3196h128.11z" fill="#003f87" fill-rule="evenodd"/><path d="m545.85 187.58h79.783c4.0317 0 7.3136-3.2758 7.3136-7.3196v-120.78c0-4.0396-3.2818-7.3193-7.3136-7.3193h-79.783-342.92v135.42h342.92z" fill="#003f87" fill-rule="evenodd"/><path d="m147.19 134.35c6.7169 0 12.198 5.4727 12.198 12.194 0 6.7209-5.4807 12.194-12.198 12.194-6.7209 0-12.194-5.4727-12.194-12.194 0-6.7209 5.4727-12.194 12.194-12.194zm-27.179 0c6.7249 0 12.198 5.4727 12.198 12.194 0 6.7209-5.4728 12.194-12.198 12.194-6.7169 0-12.19-5.4727-12.19-12.194 0-6.7209 5.4727-12.194 12.19-12.194zm40.16-23.246c6.7209 0 12.19 5.469 12.19 12.19 0 6.7209-5.469 12.194-12.19 12.194-6.7209 0-12.19-5.4727-12.19-12.194 0-6.7209 5.4686-12.19 12.19-12.19zm-26.564 0c6.7169 0 12.19 5.469 12.19 12.19 0 6.7209-5.4727 12.194-12.19 12.194-6.725 0-12.198-5.4727-12.198-12.194 0-6.7209 5.4727-12.19 12.198-12.19zm-26.632 0c6.7169 0 12.186 5.469 12.186 12.19 0 6.7209-5.469 12.194-12.186 12.194-6.7249 0-12.194-5.4727-12.194-12.194 0-6.7209 5.4686-12.19 12.194-12.19zm21.438-36.979c0.16933-0.81893 0.24796-1.6694 0.24796-2.5238 0-2.6262-0.49993-5.0436-1.8901-7.0792-5.0473 6.0594-8.5553 14.166-8.5553 22.659 0 9.3746 3.3504 18.017 9.3548 24.313-4.0277-3.689-10.576-5.9492-16.462-5.9492-11.056 0-20.281 7.9534-22.324 18.41-0.11023-0.941-0.19291-1.8385-0.19291-2.74 0-11.08 9.0556-20.151 20.143-20.151 2.5122 0 4.6067 0.42535 6.7918 1.2168-2.0985-4.3903-3.26-9.2606-3.26-14.442 0-12.158 6.146-24.249 15.835-30.088 1.189 2.1852 2.2917 6.1224 2.2917 8.7564 0 2.7758-0.68136 5.4098-1.9805 7.6186zm93.568 41.66v-9.0597h6