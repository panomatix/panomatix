<svg width="180.77" height="46.04" version="1.1" viewBox="82.992 45.607 529.52 148.5" xmlns="http://www.w3.org/2000/svg"><style type="text/css">/*
 * Below are Cascading Style Sheet (CSS) definitions in use in this file,
 * which allow easily changing how countries are displayed.
 *
 */

/*
 * Circles around small countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.circlexx
{
   opacity:1;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * Smaller circles around French DOMs and Chinese SARs
 *
 * Change opacity to 1 to display all subnational circles.
 *
 */
.subxx
{
   opacity:1;
   stroke-width:0.3;
}

/*
 * Circles around small, unrecognized countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.unxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.3;
}

/*
 * Circles around small countries, but with no permanent residents 
 *
 * Change opacity to 1 to display all circles.
 *
 */
.noxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * land
 */
.landxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.5;
   fill-rule:evenodd;
}

/*
 * Styles for coastlines of islands with no borders
 */
.coastxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.3;
   fill-rule:evenodd;
}

/*
 * Styles for nations with limited recognition
 */
.limitxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Styles for nations with no permanent population.
 */
.antxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Ocean
 */
.oceanxx
{
   opacity: 1;
   color: #000000;
   fill:#ffffff;
   stroke:#000;
   stroke-width:0.5;
   stroke-miterlimit:1;
}

/*
 * Additional style rules
 *
 * The following are examples of colouring countries.  You can substitute these with your own styles to colour the countries on the map.
 *
 * Color a few countries:
 *
 * .gb, .au, .nc
 * {
 *    fill:       #ff0000;
 * }
 *
 * Color a few small country circles (and the countries):
 *
 * .ms, .ky
 * {
 *    opacity:    1;
 *    fill:       #ff0000;
 * }
 *
 */

/* Same-sex marriage */
.ar, .be, .ca, .dk, .es, .is, .nl, .no, .pt, .se, .za
{ fill: #002255; }

/* Civil unions etc. */
.ad, .at, .au, .bl, .br, .ch, .co, .cz, .de, .ec, .fi, .fr, .gb, .gf, .gl, .hr, .hu, .ie, .il, .im, .je, .li, .lu, .mf, .nc, .nf, .nz, .pm, .re, .si, .uy, .wf
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.aw, .cw, .sx, .mx
{ fill: #7fbcff; }

/* Legal but no recognition */
.ai, .al, .am, .as, .az, .ba, .bg, .bf, .by, .bj, .bm, .bo, .bs, .cd, .cg, .cf, .ci, .cl, .cn, .cr, .cu, .cv, .cy, .dj, .do, .ee, .fk, .fj, .fm, .fo, .ga, .ge, .gg, .gi, .gq, .gr, .gs, .gt, .gu, .gw, .hn, .ht, .id, .in, .iq, .it, .jo, .jp, .kg, .kh, .kp, .kr, .ky, .kz, .la, .lk, .lt, .lv, .mc, .md, .me, .mg, .mh, .mk, .ml, .mn, .mp, .mt, .ms, .mz, .ne, .ni, .np, .pa, .pe, .pf, .ph, .pl, .pn, .pr, .py, .ro, .rs, .ru, .rw, .sh, .sk, .sm, .sr, .st, .sv, .tc, .td, .th, .tj, .tk, .tl, .tr, .tw, .ua, .us, .va, .ve, .vg, .vi, .vn, .vu, .xk, .ps_west_bank
{ fill: #cccccc; }

/* Illegal, minimal penalty */
.bt, .lb, .lr
{ fill: #f9dc36; }

/* Illegal, large penalty */
.ag, .ao, .bh, .bi, .bn, .bw, .bz, .cm, .ck, .dm, .dz, .eg, .eh, .er, .et, .gd, .gh, .gm, .gn, .jm, .ke, .ki, .km, .kn, .kw, .lc, .ls, .ly, .ma, .mu, .mv, .mw, .my, .na, .ng, .nr, .nu, .om, .pg, .pw, .qa, .sb, .sc, .sg, .sn, .so, .ss, .sy, .sz, .tg, .tm, .tn, .to, .tt, .tv, .uz, .vc, .ws, .zm, .zw, .xc, .ps_gaza_strip
{ fill: #ec8028; }

/* Illegal, life imprisonment */
.bb, .bd, .gy, .mm, .pk, .sl, .tz, .ug
{ fill: #e73e21; }

/* Illegal, death penalty */
.ae, .af, .ir, .mr, .sa, .sd, .ye
{ fill: #8c201f; }

/* SUB-NATIONAL UNITS */

/* Same-sex marriage */
.br_al, .mx_dif, .us_ct, .us_dc, .us_ia, .us_ma, .us_md, .us_nh, .us_ny, .us_vt, .us_wa
{ fill: #002255; }

/* Civil unions etc. */
.mx_coa, .uk_je, .us_ca, .us_co, .us_de, .us_hi, .us_il, .us_me, .us_nj, .us_nv, .us_or, .us_ri, .us_wi, .ve_l
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.bq
{ fill: #7fbcff; }

/* Illegal, large penalty */
.id_ac
{ fill: #ec8028; }

/* Illegal, death penalty */
.ng_sharia, .so_shabaab
{ fill: #8c201f; }</style><path d="m58.485 180.23c0 6.3863 5.2247 11.611 11.611 11.611h555.31c6.3863 0 11.611-5.2247 11.611-11.611v-120.76c0-6.3862-5.2251-11.611-11.611-11.611h-555.31c-6.3862 0-11.611 5.2247-11.611 11.611v120.76z" fill="#fff" fill-rule="evenodd" stroke="#000" stroke-miterlimit="4" stroke-width="1.6127"/><path d="m198.11 187.49v-135.27h-128.02c-4.0632 0-7.2563 3.1931-7.2563 7.2563v120.76c0 4.0632 3.1931 7.2563 7.2563 7.2563h128.02z" fill="#003f87" fill-rule="evenodd"/><path d="m545.58 187.49h79.83c3.7737 0 7.2571-3.1931 7.2571-7.2563v-120.76c0-4.0632-3.4834-7.2563-7.2571-7.2563h-79.83-342.53v135.27h342.53z" fill="#003f87" fill-rule="evenodd"/><path d="m124.67 124.5v3.7757c-0.57855 0.57895-1.449 1.1575-1.7401 1.453-0.87005 0.86602-2.902 2.319-5.5202 3.7717-3.7676 2.0316-15.383 4.9336-19.446 5.5162-1.7442 0.29151-5.5161 0.87005-9.2919 1.1615-1.4489 0-3.7718 0-5.2247 0.29109-2.8978 0.57896-6.0909 0.87045-6.3823 1.7405-0.58271 1.7401 4.0593 3.1931 6.0948 3.7717 3.4845 0.87004 8.9966 3.1931 16.544 4.6462 9.2881 2.0316 13.938 2.9016 24.966 4.9332v11.319l-7.8348-0.86601h-9.2919l-8.7095-4.0672c0.29148 0-4.9373-2.0316-9.5792-4.6462-2.6104-1.4486-6.0948-3.1891-9.0006-4.9332-2.6104-1.449-3.7718-2.0316-6.3822-3.7717-1.4529-1.1615-1.4529-1.453-2.9057-2.3231l-2.6143-2.3231c-3.7719-3.1931 2.6143-4.6417 5.2286-5.2247 3.1931-0.87005 18.867-2.3231 22.06-2.6102 3.4845-0.58298 15.674-3.7761 19.159-4.9377 1.7401-0.87004 3.7717-1.7441 5.2284-3.1927 1.449-1.449 2.902-2.6146 4.6421-3.4846zm0-36.577v6.6818c-0.57855-0.58299-0.87408-0.87408-1.1615-1.1615-2.0316-1.453-1.4486-2.6146-3.7717-3.7757l-2.0316-1.1615h-1.7441c-0.28748 0-1.449 0.87005-2.319 1.4486-0.58299 0.87408-2.0356 2.3271-2.3271 2.6146l-0.57855 1.4526-2.0316 0.58299c-1.1615 0-1.453-1.1615-1.453-1.4571-0.57895-0.57855-1.1615-1.1575-1.7401-1.4486h-1.7445c-0.57871 0-2.9018 1.1611-2.9018 1.7441l-0.29109 0.86602c0 0.87408 2.0316 2.9057 3.1929 2.9057 0.58299 0 0.29148 1.1615 0.87408 1.1615 1.449 0 2.6105 1.453 4.0636 1.1