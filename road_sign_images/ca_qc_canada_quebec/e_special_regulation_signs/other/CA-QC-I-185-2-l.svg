<svg width="393.47" height="98.933" version="1.1" viewBox="82.992 45.607 1152.6 319.1" xmlns="http://www.w3.org/2000/svg"><style type="text/css">/*
 * Below are Cascading Style Sheet (CSS) definitions in use in this file,
 * which allow easily changing how countries are displayed.
 *
 */

/*
 * Circles around small countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.circlexx
{
   opacity:1;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * Smaller circles around French DOMs and Chinese SARs
 *
 * Change opacity to 1 to display all subnational circles.
 *
 */
.subxx
{
   opacity:1;
   stroke-width:0.3;
}

/*
 * Circles around small, unrecognized countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.unxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.3;
}

/*
 * Circles around small countries, but with no permanent residents 
 *
 * Change opacity to 1 to display all circles.
 *
 */
.noxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * land
 */
.landxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.5;
   fill-rule:evenodd;
}

/*
 * Styles for coastlines of islands with no borders
 */
.coastxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.3;
   fill-rule:evenodd;
}

/*
 * Styles for nations with limited recognition
 */
.limitxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Styles for nations with no permanent population.
 */
.antxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Ocean
 */
.oceanxx
{
   opacity: 1;
   color: #000000;
   fill:#ffffff;
   stroke:#000;
   stroke-width:0.5;
   stroke-miterlimit:1;
}

/*
 * Additional style rules
 *
 * The following are examples of colouring countries.  You can substitute these with your own styles to colour the countries on the map.
 *
 * Color a few countries:
 *
 * .gb, .au, .nc
 * {
 *    fill:       #ff0000;
 * }
 *
 * Color a few small country circles (and the countries):
 *
 * .ms, .ky
 * {
 *    opacity:    1;
 *    fill:       #ff0000;
 * }
 *
 */

/* Same-sex marriage */
.ar, .be, .ca, .dk, .es, .is, .nl, .no, .pt, .se, .za
{ fill: #002255; }

/* Civil unions etc. */
.ad, .at, .au, .bl, .br, .ch, .co, .cz, .de, .ec, .fi, .fr, .gb, .gf, .gl, .hr, .hu, .ie, .il, .im, .je, .li, .lu, .mf, .nc, .nf, .nz, .pm, .re, .si, .uy, .wf
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.aw, .cw, .sx, .mx
{ fill: #7fbcff; }

/* Legal but no recognition */
.ai, .al, .am, .as, .az, .ba, .bg, .bf, .by, .bj, .bm, .bo, .bs, .cd, .cg, .cf, .ci, .cl, .cn, .cr, .cu, .cv, .cy, .dj, .do, .ee, .fk, .fj, .fm, .fo, .ga, .ge, .gg, .gi, .gq, .gr, .gs, .gt, .gu, .gw, .hn, .ht, .id, .in, .iq, .it, .jo, .jp, .kg, .kh, .kp, .kr, .ky, .kz, .la, .lk, .lt, .lv, .mc, .md, .me, .mg, .mh, .mk, .ml, .mn, .mp, .mt, .ms, .mz, .ne, .ni, .np, .pa, .pe, .pf, .ph, .pl, .pn, .pr, .py, .ro, .rs, .ru, .rw, .sh, .sk, .sm, .sr, .st, .sv, .tc, .td, .th, .tj, .tk, .tl, .tr, .tw, .ua, .us, .va, .ve, .vg, .vi, .vn, .vu, .xk, .ps_west_bank
{ fill: #cccccc; }

/* Illegal, minimal penalty */
.bt, .lb, .lr
{ fill: #f9dc36; }

/* Illegal, large penalty */
.ag, .ao, .bh, .bi, .bn, .bw, .bz, .cm, .ck, .dm, .dz, .eg, .eh, .er, .et, .gd, .gh, .gm, .gn, .jm, .ke, .ki, .km, .kn, .kw, .lc, .ls, .ly, .ma, .mu, .mv, .mw, .my, .na, .ng, .nr, .nu, .om, .pg, .pw, .qa, .sb, .sc, .sg, .sn, .so, .ss, .sy, .sz, .tg, .tm, .tn, .to, .tt, .tv, .uz, .vc, .ws, .zm, .zw, .xc, .ps_gaza_strip
{ fill: #ec8028; }

/* Illegal, life imprisonment */
.bb, .bd, .gy, .mm, .pk, .sl, .tz, .ug
{ fill: #e73e21; }

/* Illegal, death penalty */
.ae, .af, .ir, .mr, .sa, .sd, .ye
{ fill: #8c201f; }

/* SUB-NATIONAL UNITS */

/* Same-sex marriage */
.br_al, .mx_dif, .us_ct, .us_dc, .us_ia, .us_ma, .us_md, .us_nh, .us_ny, .us_vt, .us_wa
{ fill: #002255; }

/* Civil unions etc. */
.mx_coa, .uk_je, .us_ca, .us_co, .us_de, .us_hi, .us_il, .us_me, .us_nj, .us_nv, .us_or, .us_ri, .us_wi, .ve_l
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.bq
{ fill: #7fbcff; }

/* Illegal, large penalty */
.id_ac
{ fill: #ec8028; }

/* Illegal, death penalty */
.ng_sharia, .so_shabaab
{ fill: #8c201f; }</style><path d="m26.992 337.11c0 14.013 11.308 25.332 25.364 25.332h1213.9c14.014 0 25.364-11.319 25.364-25.332v-263.91c0-14.005-11.349-25.34-25.364-25.34h-1213.9c-14.056 0-25.364 11.335-25.364 25.34v263.91z" fill="#fff" fill-rule="evenodd" stroke="#000" stroke-miterlimit="4" stroke-width="2.5803"/><path d="m332.23 353.11v-295.9h-279.93c-8.8391 0-15.993 7.1579-15.993 15.985v263.91c0 8.8392 7.1539 16.001 15.993 16.001h279.93z" fill="#003f87" fill-rule="evenodd"/><path d="m1091.9 353.11h174.33c8.8134 0 15.978-7.162 15.978-16.001v-263.91c0-8.8273-7.1643-15.985-15.978-15.985h-174.33-749.31v295.9h749.31z" fill="#003f87" fill-rule="evenodd"/><path d="m184.56 272.58c4.7288 1.0632 9.7528 2.5081 15.147 3.2048 8.0868 1.122 16.162 3.9019 24.45 4.0596 0.0826 0 0.12618 0.11009 0.24797 0.11009h0.0907c39.002 5.6146 65.752 1.4962 50.857-18.076-9.3355-12.288 48.223-11.063 52.023-21.757 5.5279-15.611-12.969-25.336-29.502-25.502-4.3587-0.0548 3.8035 7.7526-1.4292 11.127-5.5674 3.4685-26.58 7.0555-32.022 8.5557-6.2798 1.7558-6.5713 3.7362-7.5792 7.5357-1.7518 6.5754-18.115 11.382-28.458 12.981-16.662 2.5751-29.765-2.7718-45.546-2.7718-5.1066 0-9.8273-1.0749-14.859-1.2797-18.879-0.80312-36.577-2.571-50.479-2.2521-14.355 0.32294-42.861 6.5794-30.931 13.961 6.2367 3.7918 12.135 4.9651 19.001 6.0359 3.2246 0.48058 7.8667 3.2641 11.091 4.2208 19.631 5.7758 35.75-7.5321 67.898-0.15363z" fill="#fff" fill-rule="evenodd"/><path d="m200.24 142.73 10.555 1.1813 2.1892 10.209 4.1144-9.5399 9.8628 1.0906-7.4414-6.7048 3.9059-9.1347-8.6739 4.8627-7.3902-6.6499 2.063 9.6423-9.1855 5.0433z" fill="#fff" fill-rule="evenodd"/><path d="m188.68 232.25c-2.1183-3.0552-4.1813-6.7326-5.6698-10.154-1.3857-3.1145-2.6456-6.3076-3.7483-9.5358 1.3664 0.0472 2.7444-0.0158 4.095-0.22858-1.8586-3.2677-3.5161-6.658-4.9651-10.115-1.4055-3.3149-2.5513-6.7523-3.4173-10.252 1.2285 0.10202 2.4686 0.0786 3.685-0.1024-3.4923-5.205-6.1814-10.918-8.6263-16.726-2.4134 5.8077-5.1223 11.521-8.6186 16.726 1.2164 