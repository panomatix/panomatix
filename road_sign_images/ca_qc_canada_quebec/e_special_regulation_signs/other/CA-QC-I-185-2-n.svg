<svg width="532.9" height="133.92" version="1.1" viewBox="82.992 45.607 1561 431.94" xmlns="http://www.w3.org/2000/svg"><style type="text/css">/*
 * Below are Cascading Style Sheet (CSS) definitions in use in this file,
 * which allow easily changing how countries are displayed.
 *
 */

/*
 * Circles around small countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.circlexx
{
   opacity:1;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * Smaller circles around French DOMs and Chinese SARs
 *
 * Change opacity to 1 to display all subnational circles.
 *
 */
.subxx
{
   opacity:1;
   stroke-width:0.3;
}

/*
 * Circles around small, unrecognized countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.unxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.3;
}

/*
 * Circles around small countries, but with no permanent residents 
 *
 * Change opacity to 1 to display all circles.
 *
 */
.noxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * land
 */
.landxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.5;
   fill-rule:evenodd;
}

/*
 * Styles for coastlines of islands with no borders
 */
.coastxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.3;
   fill-rule:evenodd;
}

/*
 * Styles for nations with limited recognition
 */
.limitxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Styles for nations with no permanent population.
 */
.antxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Ocean
 */
.oceanxx
{
   opacity: 1;
   color: #000000;
   fill:#ffffff;
   stroke:#000;
   stroke-width:0.5;
   stroke-miterlimit:1;
}

/*
 * Additional style rules
 *
 * The following are examples of colouring countries.  You can substitute these with your own styles to colour the countries on the map.
 *
 * Color a few countries:
 *
 * .gb, .au, .nc
 * {
 *    fill:       #ff0000;
 * }
 *
 * Color a few small country circles (and the countries):
 *
 * .ms, .ky
 * {
 *    opacity:    1;
 *    fill:       #ff0000;
 * }
 *
 */

/* Same-sex marriage */
.ar, .be, .ca, .dk, .es, .is, .nl, .no, .pt, .se, .za
{ fill: #002255; }

/* Civil unions etc. */
.ad, .at, .au, .bl, .br, .ch, .co, .cz, .de, .ec, .fi, .fr, .gb, .gf, .gl, .hr, .hu, .ie, .il, .im, .je, .li, .lu, .mf, .nc, .nf, .nz, .pm, .re, .si, .uy, .wf
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.aw, .cw, .sx, .mx
{ fill: #7fbcff; }

/* Legal but no recognition */
.ai, .al, .am, .as, .az, .ba, .bg, .bf, .by, .bj, .bm, .bo, .bs, .cd, .cg, .cf, .ci, .cl, .cn, .cr, .cu, .cv, .cy, .dj, .do, .ee, .fk, .fj, .fm, .fo, .ga, .ge, .gg, .gi, .gq, .gr, .gs, .gt, .gu, .gw, .hn, .ht, .id, .in, .iq, .it, .jo, .jp, .kg, .kh, .kp, .kr, .ky, .kz, .la, .lk, .lt, .lv, .mc, .md, .me, .mg, .mh, .mk, .ml, .mn, .mp, .mt, .ms, .mz, .ne, .ni, .np, .pa, .pe, .pf, .ph, .pl, .pn, .pr, .py, .ro, .rs, .ru, .rw, .sh, .sk, .sm, .sr, .st, .sv, .tc, .td, .th, .tj, .tk, .tl, .tr, .tw, .ua, .us, .va, .ve, .vg, .vi, .vn, .vu, .xk, .ps_west_bank
{ fill: #cccccc; }

/* Illegal, minimal penalty */
.bt, .lb, .lr
{ fill: #f9dc36; }

/* Illegal, large penalty */
.ag, .ao, .bh, .bi, .bn, .bw, .bz, .cm, .ck, .dm, .dz, .eg, .eh, .er, .et, .gd, .gh, .gm, .gn, .jm, .ke, .ki, .km, .kn, .kw, .lc, .ls, .ly, .ma, .mu, .mv, .mw, .my, .na, .ng, .nr, .nu, .om, .pg, .pw, .qa, .sb, .sc, .sg, .sn, .so, .ss, .sy, .sz, .tg, .tm, .tn, .to, .tt, .tv, .uz, .vc, .ws, .zm, .zw, .xc, .ps_gaza_strip
{ fill: #ec8028; }

/* Illegal, life imprisonment */
.bb, .bd, .gy, .mm, .pk, .sl, .tz, .ug
{ fill: #e73e21; }

/* Illegal, death penalty */
.ae, .af, .ir, .mr, .sa, .sd, .ye
{ fill: #8c201f; }

/* SUB-NATIONAL UNITS */

/* Same-sex marriage */
.br_al, .mx_dif, .us_ct, .us_dc, .us_ia, .us_ma, .us_md, .us_nh, .us_ny, .us_vt, .us_wa
{ fill: #002255; }

/* Civil unions etc. */
.mx_coa, .uk_je, .us_ca, .us_co, .us_de, .us_hi, .us_il, .us_me, .us_nj, .us_nv, .us_or, .us_ri, .us_wi, .ve_l
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.bq
{ fill: #7fbcff; }

/* Illegal, large penalty */
.id_ac
{ fill: #ec8028; }

/* Illegal, death penalty */
.ng_sharia, .so_shabaab
{ fill: #8c201f; }</style><path d="m6.3496 445.72c1.9765 14.294 12.41 25.893 26.084 29.574h1661.8c15.212-4.0962 26.408-17.998 26.408-34.504v-357.21c0-19.726-15.99-35.711-35.713-35.711h-1643.2c-18.052 0-32.986 13.387-35.388 30.781v367.07z" fill="#fff" fill-rule="evenodd" stroke="#000" stroke-miterlimit="4" stroke-width="2.5803"/><path d="m434.99 64.952h1249.9c5.1243 0 9.5027 1.815 13.131 5.4373 3.6205 3.6262 5.4307 8.0005 5.4307 13.131v357.21c0 5.13-1.8142 9.5125-5.4388 13.141-3.6245 3.6286-7.9989 5.4428-13.123 5.4428h-1249.9v-394.37z" fill="#003f87" fill-rule="evenodd"/><path d="m417.69 64.952h-375.97c-5.1302 0-9.5123 1.815-13.142 5.4413-3.6301 3.6262-5.4413 8.0004-5.4413 13.127v357.21c0 5.1259 1.815 9.5044 5.4452 13.133 3.6301 3.6326 8.0123 5.4509 13.139 5.4509h375.97v-394.37z" fill="#003f87" fill-rule="evenodd"/><path d="m226.62 201.02-8e-3 -73.792c-1.5631 1.3071-13.45 12.725-13.45 28.088 0 16.453 5.9573 20.28 7.7329 27.962 1.6534 7.6817 2.138 17.43 2.138 17.43h-4.1539s1.6534-28.813-18.206-28.813c-11.8 0-13.454 10.079-13.454 15.969 0 12.843 13.091 12.843 13.091 12.843s-2.2562-11.536 5.8351-11.536c7.9808 0 7.2563 11.536 7.2563 11.536v11.993c-13.934-6.225-26.305-8.0477-40.837-8.0477-17.726 0-35.573 2.4017-56.035 20.647 10.591-6.9531 24.616-5.8589 35.333-5.8589 20.462 0 58.799 10.568 74.631 35.282 0 23.289 0.11814 25.356-0.60275 26.419-26.545-30.848-67.468-46.944-97.352-46.944-21.549 0-52.361 14.757-73.308 35.557 14.532-8.6537 36.171-13.331 52.483-13.331 42.613 0 73.666 27.36 118.78 68.776 0 24.501 0.11814 26.537-0.7245 27.506-78.064-45.149-82.458-70.351-147.34-70.351-15.351 0-31.628 3.583-47.818 11.871 0.55517 6.7721 1.5001 13.41 2.7482 20.017 6.772-1.4252 13.214-2.2719 18.808-2.2719 84.261 0 122.57 85.135 203.01 85.135 31.533 0 65.212-13.45 94.49-44.542h47.609c6.3584-15.186 10.63-30.624 12.95-46.727l-183.61-0.48825v-23.167h165.99v-34.829h-165.99v-21.982h115.92v-24.352h-115.92z" fill="#fff" fill-rule="evenodd"/><path d="m481.42 314.87h15.373v-50.196h13.337l14.426 50