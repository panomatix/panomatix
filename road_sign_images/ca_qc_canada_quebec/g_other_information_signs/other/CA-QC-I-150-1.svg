<svg width="180.41" height="45.68" version="1.1" viewBox="82.992 45.607 528.47 147.33" xmlns="http://www.w3.org/2000/svg"><style type="text/css">/*
 * Below are Cascading Style Sheet (CSS) definitions in use in this file,
 * which allow easily changing how countries are displayed.
 *
 */

/*
 * Circles around small countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.circlexx
{
   opacity:1;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * Smaller circles around French DOMs and Chinese SARs
 *
 * Change opacity to 1 to display all subnational circles.
 *
 */
.subxx
{
   opacity:1;
   stroke-width:0.3;
}

/*
 * Circles around small, unrecognized countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.unxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.3;
}

/*
 * Circles around small countries, but with no permanent residents 
 *
 * Change opacity to 1 to display all circles.
 *
 */
.noxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * land
 */
.landxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.5;
   fill-rule:evenodd;
}

/*
 * Styles for coastlines of islands with no borders
 */
.coastxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.3;
   fill-rule:evenodd;
}

/*
 * Styles for nations with limited recognition
 */
.limitxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Styles for nations with no permanent population.
 */
.antxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Ocean
 */
.oceanxx
{
   opacity: 1;
   color: #000000;
   fill:#ffffff;
   stroke:#000;
   stroke-width:0.5;
   stroke-miterlimit:1;
}

/*
 * Additional style rules
 *
 * The following are examples of colouring countries.  You can substitute these with your own styles to colour the countries on the map.
 *
 * Color a few countries:
 *
 * .gb, .au, .nc
 * {
 *    fill:       #ff0000;
 * }
 *
 * Color a few small country circles (and the countries):
 *
 * .ms, .ky
 * {
 *    opacity:    1;
 *    fill:       #ff0000;
 * }
 *
 */

/* Same-sex marriage */
.ar, .be, .ca, .dk, .es, .is, .nl, .no, .pt, .se, .za
{ fill: #002255; }

/* Civil unions etc. */
.ad, .at, .au, .bl, .br, .ch, .co, .cz, .de, .ec, .fi, .fr, .gb, .gf, .gl, .hr, .hu, .ie, .il, .im, .je, .li, .lu, .mf, .nc, .nf, .nz, .pm, .re, .si, .uy, .wf
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.aw, .cw, .sx, .mx
{ fill: #7fbcff; }

/* Legal but no recognition */
.ai, .al, .am, .as, .az, .ba, .bg, .bf, .by, .bj, .bm, .bo, .bs, .cd, .cg, .cf, .ci, .cl, .cn, .cr, .cu, .cv, .cy, .dj, .do, .ee, .fk, .fj, .fm, .fo, .ga, .ge, .gg, .gi, .gq, .gr, .gs, .gt, .gu, .gw, .hn, .ht, .id, .in, .iq, .it, .jo, .jp, .kg, .kh, .kp, .kr, .ky, .kz, .la, .lk, .lt, .lv, .mc, .md, .me, .mg, .mh, .mk, .ml, .mn, .mp, .mt, .ms, .mz, .ne, .ni, .np, .pa, .pe, .pf, .ph, .pl, .pn, .pr, .py, .ro, .rs, .ru, .rw, .sh, .sk, .sm, .sr, .st, .sv, .tc, .td, .th, .tj, .tk, .tl, .tr, .tw, .ua, .us, .va, .ve, .vg, .vi, .vn, .vu, .xk, .ps_west_bank
{ fill: #cccccc; }

/* Illegal, minimal penalty */
.bt, .lb, .lr
{ fill: #f9dc36; }

/* Illegal, large penalty */
.ag, .ao, .bh, .bi, .bn, .bw, .bz, .cm, .ck, .dm, .dz, .eg, .eh, .er, .et, .gd, .gh, .gm, .gn, .jm, .ke, .ki, .km, .kn, .kw, .lc, .ls, .ly, .ma, .mu, .mv, .mw, .my, .na, .ng, .nr, .nu, .om, .pg, .pw, .qa, .sb, .sc, .sg, .sn, .so, .ss, .sy, .sz, .tg, .tm, .tn, .to, .tt, .tv, .uz, .vc, .ws, .zm, .zw, .xc, .ps_gaza_strip
{ fill: #ec8028; }

/* Illegal, life imprisonment */
.bb, .bd, .gy, .mm, .pk, .sl, .tz, .ug
{ fill: #e73e21; }

/* Illegal, death penalty */
.ae, .af, .ir, .mr, .sa, .sd, .ye
{ fill: #8c201f; }

/* SUB-NATIONAL UNITS */

/* Same-sex marriage */
.br_al, .mx_dif, .us_ct, .us_dc, .us_ia, .us_ma, .us_md, .us_nh, .us_ny, .us_vt, .us_wa
{ fill: #002255; }

/* Civil unions etc. */
.mx_coa, .uk_je, .us_ca, .us_co, .us_de, .us_hi, .us_il, .us_me, .us_nj, .us_nv, .us_or, .us_ri, .us_wi, .ve_l
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.bq
{ fill: #7fbcff; }

/* Illegal, large penalty */
.id_ac
{ fill: #ec8028; }

/* Illegal, death penalty */
.ng_sharia, .so_shabaab
{ fill: #8c201f; }</style><path d="m58.538 167.75v-96.663c0-12.772 10.158-23.222 22.934-23.222h531.51c12.773 0 22.932 10.449 22.932 23.222v96.663c0 12.773-10.16 22.934-22.932 22.934h-531.51c-12.776 0-22.934-10.162-22.934-22.934z" fill="#fff" fill-rule="evenodd" stroke="#000" stroke-miterlimit="4" stroke-width="1.9352"/><path d="m202.39 54.141v130.75h410.66c9.3778 0 16.978-7.599 16.978-16.977v-96.793c0-9.3745-7.5998-16.977-16.978-16.977h-410.66z" fill="#008460" fill-rule="evenodd"/><path d="m195.26 184.89v-130.75h-113.75c-9.3824 0-16.969 7.6028-16.969 16.977v96.793c0 9.3782 7.5871 16.977 16.969 16.977h113.75z" fill="#008460" fill-rule="evenodd"/><path d="m78.858 170.65v-102.22h102.22v102.22h-102.22z" fill="#fff" fill-rule="evenodd"/><path d="m134.01 142.5 15.497 0.12176 0.075-7.1144-9.296 0.0786c-0.0197-1.3502 0.14149-2.7126 0.48018-4.0237 0.29954-1.1813 0.74425-2.3074 1.3152-3.3742 0.92125-1.6458 2.3465-2.9375 4.0829-3.6814 1.7401-0.74829 3.6773-0.89786 5.5162-0.43301 1.9566 0.64952 3.6024 1.9997 4.6184 3.7874 1.0394 1.8191 1.3543 3.9491 0.88577 5.9807 3.4846-1.2402 6.2996-3.8822 7.772-7.2801 1.2442-2.8859 1.4252-6.1339 0.51969-9.15-1.2281-3.5591-3.8543-6.4728-7.2837-8.0396-2.8347-1.2994-6.0278-1.5909-9.0516-0.83497-2.6734 0.84666-5.0909 2.3586-7.0124 4.3942-1.7873 1.8937-3.1105 4.1772-3.8543 6.6655-0.89786 2.4727-1.5433 5.028-1.957 7.6264-0.43704 2.7444-0.58258 5.5279-0.45276 8.3078l-3.465-0.0633c-0.0984-2.24-0.0669-4.4805 0.0867-6.7088 0.16166-2.39 0.46486-4.772 0.90956-7.1305 0.63795-2.5198 1.4374-4.9885 2.4018-7.3981 1.0039-2.5315 2.1852-4.9764 3.5278-7.3466 1.3192-2.4884 2.13-5.2171 2.3662-8.0203 0.23223-2.5827-0.0316-5.1933-0.76361-7.6776-0.54347-1.6022-1.2365-3.1496-2.0792-4.6103-0.84626-1.4728-1.8425-2.8664-2.9528-4.1421-1.0156-1.2363-2.0473-2.4568-3.0751-3.6774-0.96076-1.1182-1.9252-2.2324-2.89-3.3348-0.82287 1.1142-1.697 2.0434-2.5827 3.1025-1.1144 1.3426-2.3465 2.5435-3.4649 4.0475-1.1103 1.4844-2.1614 2.5553-3.0081 3.9922-0.85432 1.453-1.5353 2.9964-2.03