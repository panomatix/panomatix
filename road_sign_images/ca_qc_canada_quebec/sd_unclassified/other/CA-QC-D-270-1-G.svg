<svg width="245.27" height="245.26" version="1.1" viewBox="82.992 45.607 718.46 791.06" xmlns="http://www.w3.org/2000/svg"><style type="text/css">/*
 * Below are Cascading Style Sheet (CSS) definitions in use in this file,
 * which allow easily changing how countries are displayed.
 *
 */

/*
 * Circles around small countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.circlexx
{
   opacity:1;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * Smaller circles around French DOMs and Chinese SARs
 *
 * Change opacity to 1 to display all subnational circles.
 *
 */
.subxx
{
   opacity:1;
   stroke-width:0.3;
}

/*
 * Circles around small, unrecognized countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.unxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.3;
}

/*
 * Circles around small countries, but with no permanent residents 
 *
 * Change opacity to 1 to display all circles.
 *
 */
.noxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * land
 */
.landxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.5;
   fill-rule:evenodd;
}

/*
 * Styles for coastlines of islands with no borders
 */
.coastxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.3;
   fill-rule:evenodd;
}

/*
 * Styles for nations with limited recognition
 */
.limitxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Styles for nations with no permanent population.
 */
.antxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Ocean
 */
.oceanxx
{
   opacity: 1;
   color: #000000;
   fill:#ffffff;
   stroke:#000;
   stroke-width:0.5;
   stroke-miterlimit:1;
}

/*
 * Additional style rules
 *
 * The following are examples of colouring countries.  You can substitute these with your own styles to colour the countries on the map.
 *
 * Color a few countries:
 *
 * .gb, .au, .nc
 * {
 *    fill:       #ff0000;
 * }
 *
 * Color a few small country circles (and the countries):
 *
 * .ms, .ky
 * {
 *    opacity:    1;
 *    fill:       #ff0000;
 * }
 *
 */

/* Same-sex marriage */
.ar, .be, .ca, .dk, .es, .is, .nl, .no, .pt, .se, .za
{ fill: #002255; }

/* Civil unions etc. */
.ad, .at, .au, .bl, .br, .ch, .co, .cz, .de, .ec, .fi, .fr, .gb, .gf, .gl, .hr, .hu, .ie, .il, .im, .je, .li, .lu, .mf, .nc, .nf, .nz, .pm, .re, .si, .uy, .wf
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.aw, .cw, .sx, .mx
{ fill: #7fbcff; }

/* Legal but no recognition */
.ai, .al, .am, .as, .az, .ba, .bg, .bf, .by, .bj, .bm, .bo, .bs, .cd, .cg, .cf, .ci, .cl, .cn, .cr, .cu, .cv, .cy, .dj, .do, .ee, .fk, .fj, .fm, .fo, .ga, .ge, .gg, .gi, .gq, .gr, .gs, .gt, .gu, .gw, .hn, .ht, .id, .in, .iq, .it, .jo, .jp, .kg, .kh, .kp, .kr, .ky, .kz, .la, .lk, .lt, .lv, .mc, .md, .me, .mg, .mh, .mk, .ml, .mn, .mp, .mt, .ms, .mz, .ne, .ni, .np, .pa, .pe, .pf, .ph, .pl, .pn, .pr, .py, .ro, .rs, .ru, .rw, .sh, .sk, .sm, .sr, .st, .sv, .tc, .td, .th, .tj, .tk, .tl, .tr, .tw, .ua, .us, .va, .ve, .vg, .vi, .vn, .vu, .xk, .ps_west_bank
{ fill: #cccccc; }

/* Illegal, minimal penalty */
.bt, .lb, .lr
{ fill: #f9dc36; }

/* Illegal, large penalty */
.ag, .ao, .bh, .bi, .bn, .bw, .bz, .cm, .ck, .dm, .dz, .eg, .eh, .er, .et, .gd, .gh, .gm, .gn, .jm, .ke, .ki, .km, .kn, .kw, .lc, .ls, .ly, .ma, .mu, .mv, .mw, .my, .na, .ng, .nr, .nu, .om, .pg, .pw, .qa, .sb, .sc, .sg, .sn, .so, .ss, .sy, .sz, .tg, .tm, .tn, .to, .tt, .tv, .uz, .vc, .ws, .zm, .zw, .xc, .ps_gaza_strip
{ fill: #ec8028; }

/* Illegal, life imprisonment */
.bb, .bd, .gy, .mm, .pk, .sl, .tz, .ug
{ fill: #e73e21; }

/* Illegal, death penalty */
.ae, .af, .ir, .mr, .sa, .sd, .ye
{ fill: #8c201f; }

/* SUB-NATIONAL UNITS */

/* Same-sex marriage */
.br_al, .mx_dif, .us_ct, .us_dc, .us_ia, .us_ma, .us_md, .us_nh, .us_ny, .us_vt, .us_wa
{ fill: #002255; }

/* Civil unions etc. */
.mx_coa, .uk_je, .us_ca, .us_co, .us_de, .us_hi, .us_il, .us_me, .us_nj, .us_nv, .us_or, .us_ri, .us_wi, .ve_l
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.bq
{ fill: #7fbcff; }

/* Illegal, large penalty */
.id_ac
{ fill: #ec8028; }

/* Illegal, death penalty */
.ng_sharia, .so_shabaab
{ fill: #8c201f; }</style><path d="m464.16 826.92 363.86-363.86c12.131-12.095 12.131-31.746 0-43.873l-363.86-363.86c-12.095-12.095-31.779-12.095-43.874 0l-363.86 363.86c-12.128 12.127-12.128 31.778 0 43.873l363.86 363.86c12.131 12.127 31.747 12.127 43.874 0z" fill="#cdff00" fill-rule="evenodd"/><path d="m459.58 822.41c-9.6068 9.6036-25.114 9.6036-34.719 0l-363.9-363.9c-9.5794-9.5806-9.6076-25.143 0-34.746l363.87-363.88c9.581-9.5793 25.199-9.5793 34.779 0l363.88 363.88c9.6029 9.6032 9.5793 25.165 0 34.746l-363.9 363.9z" fill="#000" fill-rule="evenodd"/><path d="m451.53 814.35 363.9-363.9c5.1105-5.1122 5.1381-13.476 0-18.622l-363.9-363.9c-5.1106-5.1105-13.481-5.1105-18.614 0l-363.9 363.9c-5.1404 5.1461-5.1404 13.51 0 18.622l363.9 363.9c5.1328 5.1485 13.48 5.1485 18.614 0z" fill="#cdff00" fill-rule="evenodd"/><path d="m432.64 571.25c4.2337 8.4344 0.46768 18.651-8.2328 22.324-7.8377 3.306-16.865 0.032-20.772-7.5071l-94.778-171.67h-11.378c-1.5844 4.8623-6.1161 8.134-11.244 8.1659-5.2251-0.0322-9.8213-3.4374-11.309-8.4299h-36.245v-47.987h16.272l50.433-72.126c3.1084-4.4962 6.6443-9.9531 12.635-9.7209l41.801 1.6224c2.6085 0.29512 5.1566 1.1575 7.4063 2.5432 2.0521 1.2599 3.8019 2.9412 5.1566 4.9256l39.85 62.771 35.088 30.289c5.4924 4.5671 6.0202 12.733 1.2914 17.989-4.3349 4.7684-11.576 5.4296-16.696 1.5595l-37.41-31.187-22.485-32.907v113.87l60.617 115.48z" fill="#000" fill-rule="evenodd"/><path d="m643.97 570.96c3.5713 7.9748 0.29954 17.365-7.4764 21.4-8.1344 4.2293-18.186 0.9556-22.356-7.2813l-43.022-90.214h-30.459l-39.652 89.758c-3.5044 8.261-13.095 12.103-21.363 8.5271-8.2014-3.5722-11.973-13.095-8.4336-21.296l34.427-76.958h-18.387l28.474-103.31-8.4336 0.12611c-1.953 3.8386-5.9847 6.1855-10.284 6.1222-4.264-0.10192-8.1384-2.5158-10.02-6.3153h-26.588v-45.274h17.23l31.45-58.334c1.3861-1.886 3.1064-3.4766 5.1223-4.6655 2.1497-1.2914 4.5635-2.0513 7.1148-2.3469l37.266 0.88981c2.2517 0.16572 4.4018 0.89786 6.3189 2.0513 1.953 1.1575 3.6068 2.8428 4.7917 4.8272l39.026 64.59 2