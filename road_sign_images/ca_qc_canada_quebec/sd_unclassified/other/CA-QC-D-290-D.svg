<svg width="59.663" height="179.75" version="1.1" viewBox="82.992 45.607 174.77 579.77" xmlns="http://www.w3.org/2000/svg"><style type="text/css">/*
 * Below are Cascading Style Sheet (CSS) definitions in use in this file,
 * which allow easily changing how countries are displayed.
 *
 */

/*
 * Circles around small countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.circlexx
{
   opacity:1;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * Smaller circles around French DOMs and Chinese SARs
 *
 * Change opacity to 1 to display all subnational circles.
 *
 */
.subxx
{
   opacity:1;
   stroke-width:0.3;
}

/*
 * Circles around small, unrecognized countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.unxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.3;
}

/*
 * Circles around small countries, but with no permanent residents 
 *
 * Change opacity to 1 to display all circles.
 *
 */
.noxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * land
 */
.landxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.5;
   fill-rule:evenodd;
}

/*
 * Styles for coastlines of islands with no borders
 */
.coastxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.3;
   fill-rule:evenodd;
}

/*
 * Styles for nations with limited recognition
 */
.limitxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Styles for nations with no permanent population.
 */
.antxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Ocean
 */
.oceanxx
{
   opacity: 1;
   color: #000000;
   fill:#ffffff;
   stroke:#000;
   stroke-width:0.5;
   stroke-miterlimit:1;
}

/*
 * Additional style rules
 *
 * The following are examples of colouring countries.  You can substitute these with your own styles to colour the countries on the map.
 *
 * Color a few countries:
 *
 * .gb, .au, .nc
 * {
 *    fill:       #ff0000;
 * }
 *
 * Color a few small country circles (and the countries):
 *
 * .ms, .ky
 * {
 *    opacity:    1;
 *    fill:       #ff0000;
 * }
 *
 */

/* Same-sex marriage */
.ar, .be, .ca, .dk, .es, .is, .nl, .no, .pt, .se, .za
{ fill: #002255; }

/* Civil unions etc. */
.ad, .at, .au, .bl, .br, .ch, .co, .cz, .de, .ec, .fi, .fr, .gb, .gf, .gl, .hr, .hu, .ie, .il, .im, .je, .li, .lu, .mf, .nc, .nf, .nz, .pm, .re, .si, .uy, .wf
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.aw, .cw, .sx, .mx
{ fill: #7fbcff; }

/* Legal but no recognition */
.ai, .al, .am, .as, .az, .ba, .bg, .bf, .by, .bj, .bm, .bo, .bs, .cd, .cg, .cf, .ci, .cl, .cn, .cr, .cu, .cv, .cy, .dj, .do, .ee, .fk, .fj, .fm, .fo, .ga, .ge, .gg, .gi, .gq, .gr, .gs, .gt, .gu, .gw, .hn, .ht, .id, .in, .iq, .it, .jo, .jp, .kg, .kh, .kp, .kr, .ky, .kz, .la, .lk, .lt, .lv, .mc, .md, .me, .mg, .mh, .mk, .ml, .mn, .mp, .mt, .ms, .mz, .ne, .ni, .np, .pa, .pe, .pf, .ph, .pl, .pn, .pr, .py, .ro, .rs, .ru, .rw, .sh, .sk, .sm, .sr, .st, .sv, .tc, .td, .th, .tj, .tk, .tl, .tr, .tw, .ua, .us, .va, .ve, .vg, .vi, .vn, .vu, .xk, .ps_west_bank
{ fill: #cccccc; }

/* Illegal, minimal penalty */
.bt, .lb, .lr
{ fill: #f9dc36; }

/* Illegal, large penalty */
.ag, .ao, .bh, .bi, .bn, .bw, .bz, .cm, .ck, .dm, .dz, .eg, .eh, .er, .et, .gd, .gh, .gm, .gn, .jm, .ke, .ki, .km, .kn, .kw, .lc, .ls, .ly, .ma, .mu, .mv, .mw, .my, .na, .ng, .nr, .nu, .om, .pg, .pw, .qa, .sb, .sc, .sg, .sn, .so, .ss, .sy, .sz, .tg, .tm, .tn, .to, .tt, .tv, .uz, .vc, .ws, .zm, .zw, .xc, .ps_gaza_strip
{ fill: #ec8028; }

/* Illegal, life imprisonment */
.bb, .bd, .gy, .mm, .pk, .sl, .tz, .ug
{ fill: #e73e21; }

/* Illegal, death penalty */
.ae, .af, .ir, .mr, .sa, .sd, .ye
{ fill: #8c201f; }

/* SUB-NATIONAL UNITS */

/* Same-sex marriage */
.br_al, .mx_dif, .us_ct, .us_dc, .us_ia, .us_ma, .us_md, .us_nh, .us_ny, .us_vt, .us_wa
{ fill: #002255; }

/* Civil unions etc. */
.mx_coa, .uk_je, .us_ca, .us_co, .us_de, .us_hi, .us_il, .us_me, .us_nj, .us_nv, .us_or, .us_ri, .us_wi, .ve_l
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.bq
{ fill: #7fbcff; }

/* Illegal, large penalty */
.id_ac
{ fill: #ec8028; }

/* Illegal, death penalty */
.ng_sharia, .so_shabaab
{ fill: #8c201f; }</style><path d="m265.63 609.88v-548.74c0-8.0359-6.5082-14.572-14.544-14.572h-161.4c-8.032 0-14.552 6.5358-14.552 14.572v548.74c0 8.0312 6.5121 14.526 14.552 14.526h161.4c8.0359 0 14.544-6.4951 14.544-14.526z" fill="#ffd520" fill-rule="evenodd"/><path d="m75.236 528.48v-97.175l190.5-190.51v97.191l-190.5 190.5z" fill="#000" fill-rule="evenodd"/><path d="m262.01 51.201c2.3191 2.5828 3.7207 5.9807 3.7207 9.7368v83.737l-190.5 190.46v-97.171l186.77-186.76z" fill="#000" fill-rule="evenodd"/><path d="m172.61 624.16h-82.84c-3.9765 0-7.5869-1.5885-10.197-4.1688l186.16-186.16v97.192l-93.12 93.137z" fill="#000" fill-rule="evenodd"/><path d="m170.84 46.575-95.651 95.651v-81.079c0-8.0359 6.504-14.572 14.54-14.572h81.111z" fill="#000" fill-rule="evenodd"/><path d="m265.63 609.88v-548.74c0-8.0358-6.5082-14.572-14.544-14.572h-161.4c-8.032 0-14.552 6.5359-14.552 14.572v548.74c0 8.0312 6.5121 14.526 14.552 14.526h161.4c8.0359 0 14.544-6.4951 14.544-14.526z" fill="none" stroke="#000" stroke-miterlimit="4" stroke-width=".64508"/></svg>
