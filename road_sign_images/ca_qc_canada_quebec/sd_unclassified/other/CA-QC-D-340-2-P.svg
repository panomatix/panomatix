<svg width="180.22" height="180.22" version="1.1" viewBox="82.992 45.607 527.91 581.28" xmlns="http://www.w3.org/2000/svg"><style type="text/css">/*
 * Below are Cascading Style Sheet (CSS) definitions in use in this file,
 * which allow easily changing how countries are displayed.
 *
 */

/*
 * Circles around small countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.circlexx
{
   opacity:1;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * Smaller circles around French DOMs and Chinese SARs
 *
 * Change opacity to 1 to display all subnational circles.
 *
 */
.subxx
{
   opacity:1;
   stroke-width:0.3;
}

/*
 * Circles around small, unrecognized countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.unxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.3;
}

/*
 * Circles around small countries, but with no permanent residents 
 *
 * Change opacity to 1 to display all circles.
 *
 */
.noxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * land
 */
.landxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.5;
   fill-rule:evenodd;
}

/*
 * Styles for coastlines of islands with no borders
 */
.coastxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.3;
   fill-rule:evenodd;
}

/*
 * Styles for nations with limited recognition
 */
.limitxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Styles for nations with no permanent population.
 */
.antxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Ocean
 */
.oceanxx
{
   opacity: 1;
   color: #000000;
   fill:#ffffff;
   stroke:#000;
   stroke-width:0.5;
   stroke-miterlimit:1;
}

/*
 * Additional style rules
 *
 * The following are examples of colouring countries.  You can substitute these with your own styles to colour the countries on the map.
 *
 * Color a few countries:
 *
 * .gb, .au, .nc
 * {
 *    fill:       #ff0000;
 * }
 *
 * Color a few small country circles (and the countries):
 *
 * .ms, .ky
 * {
 *    opacity:    1;
 *    fill:       #ff0000;
 * }
 *
 */

/* Same-sex marriage */
.ar, .be, .ca, .dk, .es, .is, .nl, .no, .pt, .se, .za
{ fill: #002255; }

/* Civil unions etc. */
.ad, .at, .au, .bl, .br, .ch, .co, .cz, .de, .ec, .fi, .fr, .gb, .gf, .gl, .hr, .hu, .ie, .il, .im, .je, .li, .lu, .mf, .nc, .nf, .nz, .pm, .re, .si, .uy, .wf
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.aw, .cw, .sx, .mx
{ fill: #7fbcff; }

/* Legal but no recognition */
.ai, .al, .am, .as, .az, .ba, .bg, .bf, .by, .bj, .bm, .bo, .bs, .cd, .cg, .cf, .ci, .cl, .cn, .cr, .cu, .cv, .cy, .dj, .do, .ee, .fk, .fj, .fm, .fo, .ga, .ge, .gg, .gi, .gq, .gr, .gs, .gt, .gu, .gw, .hn, .ht, .id, .in, .iq, .it, .jo, .jp, .kg, .kh, .kp, .kr, .ky, .kz, .la, .lk, .lt, .lv, .mc, .md, .me, .mg, .mh, .mk, .ml, .mn, .mp, .mt, .ms, .mz, .ne, .ni, .np, .pa, .pe, .pf, .ph, .pl, .pn, .pr, .py, .ro, .rs, .ru, .rw, .sh, .sk, .sm, .sr, .st, .sv, .tc, .td, .th, .tj, .tk, .tl, .tr, .tw, .ua, .us, .va, .ve, .vg, .vi, .vn, .vu, .xk, .ps_west_bank
{ fill: #cccccc; }

/* Illegal, minimal penalty */
.bt, .lb, .lr
{ fill: #f9dc36; }

/* Illegal, large penalty */
.ag, .ao, .bh, .bi, .bn, .bw, .bz, .cm, .ck, .dm, .dz, .eg, .eh, .er, .et, .gd, .gh, .gm, .gn, .jm, .ke, .ki, .km, .kn, .kw, .lc, .ls, .ly, .ma, .mu, .mv, .mw, .my, .na, .ng, .nr, .nu, .om, .pg, .pw, .qa, .sb, .sc, .sg, .sn, .so, .ss, .sy, .sz, .tg, .tm, .tn, .to, .tt, .tv, .uz, .vc, .ws, .zm, .zw, .xc, .ps_gaza_strip
{ fill: #ec8028; }

/* Illegal, life imprisonment */
.bb, .bd, .gy, .mm, .pk, .sl, .tz, .ug
{ fill: #e73e21; }

/* Illegal, death penalty */
.ae, .af, .ir, .mr, .sa, .sd, .ye
{ fill: #8c201f; }

/* SUB-NATIONAL UNITS */

/* Same-sex marriage */
.br_al, .mx_dif, .us_ct, .us_dc, .us_ia, .us_ma, .us_md, .us_nh, .us_ny, .us_vt, .us_wa
{ fill: #002255; }

/* Civil unions etc. */
.mx_coa, .uk_je, .us_ca, .us_co, .us_de, .us_hi, .us_il, .us_me, .us_nj, .us_nv, .us_or, .us_ri, .us_wi, .ve_l
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.bq
{ fill: #7fbcff; }

/* Illegal, large penalty */
.id_ac
{ fill: #ec8028; }

/* Illegal, death penalty */
.ng_sharia, .so_shabaab
{ fill: #8c201f; }</style><path d="m56.954 587.59c0 21.364 17.284 38.648 38.648 38.648h502.68c21.344 0 38.664-17.284 38.664-38.648v-502.68c0-21.344-17.32-38.664-38.664-38.664h-502.68c-21.363 0-38.648 17.32-38.648 38.664v502.68z" fill="#ffd520" fill-rule="evenodd"/><path d="m64.553 587.56c0 17.163 13.898 31.069 31.065 31.069h502.66c17.151 0 31.048-13.905 31.048-31.069v-502.66c0-17.151-13.897-31.049-31.048-31.049h-502.66c-17.166 0-31.065 13.898-31.065 31.049v502.66z" fill="#000" fill-rule="evenodd"/><path d="m75.975 587.56c0 10.845 8.7997 19.643 19.643 19.643h502.66c10.825 0 19.622-8.7972 19.622-19.643v-502.66c0-10.827-8.7972-19.627-19.622-19.627h-502.66c-10.843 0-19.643 8.7997-19.643 19.627v502.66z" fill="#ffd520" fill-rule="evenodd"/><path d="m460.16 326.09 0.56042-11.891 14.325 1.4333-0.49994 7.0555c0.5967 5.469 2.7819 10.69 6.2814 14.946 2.9391 3.6108 6.7854 6.4375 11.099 8.2171l33.213 17.552c7.2692 4.8901 11.523 13.206 11.212 21.982-0.33061 8.5081-5.8178 15.446-12.103 20.741l-202.98 171.18-27.009-27.762 207.29-158.12c3.4794-2.4767 5.334-6.6697 4.8139-10.922-0.4838-4.1575-3.7334-7.0753-7.0394-9.3588l-22.271-15.237c-4.6405-3.0157-8.507-7.012-11.406-11.713-3.3463-5.4332-5.2574-11.697-5.4912-18.095zm-219.75 29.899-14.961-38.089 12.583-3.6733 13.473 30.49c3.6185 6.6894 8.7013 12.508 14.871 16.977 5.315 3.8822 11.56 6.0121 17.67 8.292l31.242 11.599c7.0358 2.2404 12.76 7.4018 15.714 14.194 2.9412 6.8193 2.823 14.552-0.36648 21.226l-30.738 62.601-26.49-22.949 21.151-44.468c1.5905-3.3463 3.4806-6.9019 2.5158-10.654-0.94464-3.768-3.6931-6.8035-7.3624-8.1146l-27.262-11.894c-4.874-2.6106-9.2601-6.0674-12.934-10.225-3.9608-4.4688-7.0789-9.6697-9.1069-15.312zm167.2-91.438 20.454-5.2404c8.7759 18.733 29.679 28.514 49.687 23.277 23.392-6.15 37.06-30.392 30.218-53.59-7.3256-23.355-32.75-35.805-55.699-27.281-17.69 6.5556-28.978 23.935-27.817 42.747l-22.411 7.1539-72.981 2.6456-18.036-11.016-1.1027-11.469 13.438-26.482-1.6849-1.1809-19.718 23.163 2.0082 21.438 23.241 14.19 80.402 1