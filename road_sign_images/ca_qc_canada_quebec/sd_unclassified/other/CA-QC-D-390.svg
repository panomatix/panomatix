<svg width="180.37" height="112.83" version="1.1" viewBox="82.992 45.607 528.36 363.93" xmlns="http://www.w3.org/2000/svg"><style type="text/css">/*
 * Below are Cascading Style Sheet (CSS) definitions in use in this file,
 * which allow easily changing how countries are displayed.
 *
 */

/*
 * Circles around small countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.circlexx
{
   opacity:1;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * Smaller circles around French DOMs and Chinese SARs
 *
 * Change opacity to 1 to display all subnational circles.
 *
 */
.subxx
{
   opacity:1;
   stroke-width:0.3;
}

/*
 * Circles around small, unrecognized countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.unxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.3;
}

/*
 * Circles around small countries, but with no permanent residents 
 *
 * Change opacity to 1 to display all circles.
 *
 */
.noxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * land
 */
.landxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.5;
   fill-rule:evenodd;
}

/*
 * Styles for coastlines of islands with no borders
 */
.coastxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.3;
   fill-rule:evenodd;
}

/*
 * Styles for nations with limited recognition
 */
.limitxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Styles for nations with no permanent population.
 */
.antxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Ocean
 */
.oceanxx
{
   opacity: 1;
   color: #000000;
   fill:#ffffff;
   stroke:#000;
   stroke-width:0.5;
   stroke-miterlimit:1;
}

/*
 * Additional style rules
 *
 * The following are examples of colouring countries.  You can substitute these with your own styles to colour the countries on the map.
 *
 * Color a few countries:
 *
 * .gb, .au, .nc
 * {
 *    fill:       #ff0000;
 * }
 *
 * Color a few small country circles (and the countries):
 *
 * .ms, .ky
 * {
 *    opacity:    1;
 *    fill:       #ff0000;
 * }
 *
 */

/* Same-sex marriage */
.ar, .be, .ca, .dk, .es, .is, .nl, .no, .pt, .se, .za
{ fill: #002255; }

/* Civil unions etc. */
.ad, .at, .au, .bl, .br, .ch, .co, .cz, .de, .ec, .fi, .fr, .gb, .gf, .gl, .hr, .hu, .ie, .il, .im, .je, .li, .lu, .mf, .nc, .nf, .nz, .pm, .re, .si, .uy, .wf
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.aw, .cw, .sx, .mx
{ fill: #7fbcff; }

/* Legal but no recognition */
.ai, .al, .am, .as, .az, .ba, .bg, .bf, .by, .bj, .bm, .bo, .bs, .cd, .cg, .cf, .ci, .cl, .cn, .cr, .cu, .cv, .cy, .dj, .do, .ee, .fk, .fj, .fm, .fo, .ga, .ge, .gg, .gi, .gq, .gr, .gs, .gt, .gu, .gw, .hn, .ht, .id, .in, .iq, .it, .jo, .jp, .kg, .kh, .kp, .kr, .ky, .kz, .la, .lk, .lt, .lv, .mc, .md, .me, .mg, .mh, .mk, .ml, .mn, .mp, .mt, .ms, .mz, .ne, .ni, .np, .pa, .pe, .pf, .ph, .pl, .pn, .pr, .py, .ro, .rs, .ru, .rw, .sh, .sk, .sm, .sr, .st, .sv, .tc, .td, .th, .tj, .tk, .tl, .tr, .tw, .ua, .us, .va, .ve, .vg, .vi, .vn, .vu, .xk, .ps_west_bank
{ fill: #cccccc; }

/* Illegal, minimal penalty */
.bt, .lb, .lr
{ fill: #f9dc36; }

/* Illegal, large penalty */
.ag, .ao, .bh, .bi, .bn, .bw, .bz, .cm, .ck, .dm, .dz, .eg, .eh, .er, .et, .gd, .gh, .gm, .gn, .jm, .ke, .ki, .km, .kn, .kw, .lc, .ls, .ly, .ma, .mu, .mv, .mw, .my, .na, .ng, .nr, .nu, .om, .pg, .pw, .qa, .sb, .sc, .sg, .sn, .so, .ss, .sy, .sz, .tg, .tm, .tn, .to, .tt, .tv, .uz, .vc, .ws, .zm, .zw, .xc, .ps_gaza_strip
{ fill: #ec8028; }

/* Illegal, life imprisonment */
.bb, .bd, .gy, .mm, .pk, .sl, .tz, .ug
{ fill: #e73e21; }

/* Illegal, death penalty */
.ae, .af, .ir, .mr, .sa, .sd, .ye
{ fill: #8c201f; }

/* SUB-NATIONAL UNITS */

/* Same-sex marriage */
.br_al, .mx_dif, .us_ct, .us_dc, .us_ia, .us_ma, .us_md, .us_nh, .us_ny, .us_vt, .us_wa
{ fill: #002255; }

/* Civil unions etc. */
.mx_coa, .uk_je, .us_ca, .us_co, .us_de, .us_hi, .us_il, .us_me, .us_nj, .us_nv, .us_or, .us_ri, .us_wi, .ve_l
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.bq
{ fill: #7fbcff; }

/* Illegal, large penalty */
.id_ac
{ fill: #ec8028; }

/* Illegal, death penalty */
.ng_sharia, .so_shabaab
{ fill: #8c201f; }</style><path d="m56.931 397.05v-338.92c0-6.5634 5.2641-11.883 11.843-11.883h556.79c6.5798 0 11.845 5.3192 11.845 11.883v338.92c0 6.5475-5.2654 11.843-11.845 11.843h-556.79c-6.5791 0-11.843-5.2957-11.843-11.843z" fill="#ffd520" fill-rule="evenodd"/><path d="m59.55 397.04c0 5.1143 4.142 9.2327 9.2486 9.2327h556.78c5.088 0 9.2327-4.1184 9.2327-9.2327v-338.93c0-5.1027-4.1446-9.2328-9.2327-9.2328h-556.78c-5.1066 0-9.2486 4.1301-9.2486 9.2328v338.93z" fill="#000" fill-rule="evenodd"/><path d="m65.262 397.02v-338.91c0-1.9371 1.5631-3.5199 3.5317-3.5199h556.79c1.9473 0 3.5278 1.5828 3.5278 3.5199v338.91c0 1.9489-1.5804 3.5358-3.5278 3.5358h-556.79c-1.9686 0-3.5317-1.5869-3.5317-3.5358z" fill="#ffd520" fill-rule="evenodd"/><path d="m492.12 236.12-136.93 136.93c-4.7167 4.7171-12.394 4.7522-17.119 0.0161l-136.92-136.95c-4.7401-4.7248-4.7401-12.398 0-17.111l136.92-136.93c4.7248-4.7286 12.402-4.7168 17.119 0l136.93 136.93c4.7373 4.7328 4.7373 12.379 0 17.111z" fill="#000" fill-rule="evenodd"/><path d="m343.12 368.02-136.94-136.94c-1.9175-1.9256-1.9292-5.0752 0-7.0124l136.94-136.94c1.9368-1.9252 5.0828-1.9252 7.008 0l136.95 136.94c1.9272 1.9372 1.9272 5.0868 0 7.0124l-136.95 136.94c-1.9368 1.9372-5.0711 1.9372-7.008 0z" fill="#ffd520" fill-rule="evenodd"/><path d="m336.54 243.42c-0.24432 0.86642-0.37817 1.7796-0.37817 2.7363 0 5.4453 4.4297 9.8709 9.8588 9.8709 5.4255 0 9.8592-4.4256 9.8592-9.8709 0-1.3583-0.2798-2.6537-0.77207-3.8148 0.88617-0.30722 1.7405-0.67733 2.5674-1.087 0.6733 1.5474 1.0434 3.256 1.0313 5.0437h51.247c-0.079-7.1027 5.6654-12.934 12.768-12.942 7.1063 0 12.863 5.7484 12.843 12.859l26.003-0.1653-1.6369-6.5282-0.71765-0.0194-3.2536-14.478-24.324-2.1183-15.686-16.375-47.641 0.0592-4.1777 3.8269c-3.689-4.5042-9.2996-7.3587-15.564-7.3587-1.961 0-3.843 0.26368-5.6226 0.77974-1.3071-8.1816-8.4174-14.454-16.966-14.454-3.9136 0-7.5043 1.2954-10.37 3.4923-4.4454-8.0909-13.024-13.58-22.915-13.58-10.942 0-20.305 6.7366-24.19 16.285-2.7642-1.8506-6.098