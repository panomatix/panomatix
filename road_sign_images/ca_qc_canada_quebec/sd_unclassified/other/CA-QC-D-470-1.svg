<svg width="180.86" height="142.06" version="1.1" viewBox="82.992 45.607 529.79 458.2" xmlns="http://www.w3.org/2000/svg"><style type="text/css">/*
 * Below are Cascading Style Sheet (CSS) definitions in use in this file,
 * which allow easily changing how countries are displayed.
 *
 */

/*
 * Circles around small countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.circlexx
{
   opacity:1;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * Smaller circles around French DOMs and Chinese SARs
 *
 * Change opacity to 1 to display all subnational circles.
 *
 */
.subxx
{
   opacity:1;
   stroke-width:0.3;
}

/*
 * Circles around small, unrecognized countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.unxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.3;
}

/*
 * Circles around small countries, but with no permanent residents 
 *
 * Change opacity to 1 to display all circles.
 *
 */
.noxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * land
 */
.landxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.5;
   fill-rule:evenodd;
}

/*
 * Styles for coastlines of islands with no borders
 */
.coastxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.3;
   fill-rule:evenodd;
}

/*
 * Styles for nations with limited recognition
 */
.limitxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Styles for nations with no permanent population.
 */
.antxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Ocean
 */
.oceanxx
{
   opacity: 1;
   color: #000000;
   fill:#ffffff;
   stroke:#000;
   stroke-width:0.5;
   stroke-miterlimit:1;
}

/*
 * Additional style rules
 *
 * The following are examples of colouring countries.  You can substitute these with your own styles to colour the countries on the map.
 *
 * Color a few countries:
 *
 * .gb, .au, .nc
 * {
 *    fill:       #ff0000;
 * }
 *
 * Color a few small country circles (and the countries):
 *
 * .ms, .ky
 * {
 *    opacity:    1;
 *    fill:       #ff0000;
 * }
 *
 */

/* Same-sex marriage */
.ar, .be, .ca, .dk, .es, .is, .nl, .no, .pt, .se, .za
{ fill: #002255; }

/* Civil unions etc. */
.ad, .at, .au, .bl, .br, .ch, .co, .cz, .de, .ec, .fi, .fr, .gb, .gf, .gl, .hr, .hu, .ie, .il, .im, .je, .li, .lu, .mf, .nc, .nf, .nz, .pm, .re, .si, .uy, .wf
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.aw, .cw, .sx, .mx
{ fill: #7fbcff; }

/* Legal but no recognition */
.ai, .al, .am, .as, .az, .ba, .bg, .bf, .by, .bj, .bm, .bo, .bs, .cd, .cg, .cf, .ci, .cl, .cn, .cr, .cu, .cv, .cy, .dj, .do, .ee, .fk, .fj, .fm, .fo, .ga, .ge, .gg, .gi, .gq, .gr, .gs, .gt, .gu, .gw, .hn, .ht, .id, .in, .iq, .it, .jo, .jp, .kg, .kh, .kp, .kr, .ky, .kz, .la, .lk, .lt, .lv, .mc, .md, .me, .mg, .mh, .mk, .ml, .mn, .mp, .mt, .ms, .mz, .ne, .ni, .np, .pa, .pe, .pf, .ph, .pl, .pn, .pr, .py, .ro, .rs, .ru, .rw, .sh, .sk, .sm, .sr, .st, .sv, .tc, .td, .th, .tj, .tk, .tl, .tr, .tw, .ua, .us, .va, .ve, .vg, .vi, .vn, .vu, .xk, .ps_west_bank
{ fill: #cccccc; }

/* Illegal, minimal penalty */
.bt, .lb, .lr
{ fill: #f9dc36; }

/* Illegal, large penalty */
.ag, .ao, .bh, .bi, .bn, .bw, .bz, .cm, .ck, .dm, .dz, .eg, .eh, .er, .et, .gd, .gh, .gm, .gn, .jm, .ke, .ki, .km, .kn, .kw, .lc, .ls, .ly, .ma, .mu, .mv, .mw, .my, .na, .ng, .nr, .nu, .om, .pg, .pw, .qa, .sb, .sc, .sg, .sn, .so, .ss, .sy, .sz, .tg, .tm, .tn, .to, .tt, .tv, .uz, .vc, .ws, .zm, .zw, .xc, .ps_gaza_strip
{ fill: #ec8028; }

/* Illegal, life imprisonment */
.bb, .bd, .gy, .mm, .pk, .sl, .tz, .ug
{ fill: #e73e21; }

/* Illegal, death penalty */
.ae, .af, .ir, .mr, .sa, .sd, .ye
{ fill: #8c201f; }

/* SUB-NATIONAL UNITS */

/* Same-sex marriage */
.br_al, .mx_dif, .us_ct, .us_dc, .us_ia, .us_ma, .us_md, .us_nh, .us_ny, .us_vt, .us_wa
{ fill: #002255; }

/* Civil unions etc. */
.mx_coa, .uk_je, .us_ca, .us_co, .us_de, .us_hi, .us_il, .us_me, .us_nj, .us_nv, .us_or, .us_ri, .us_wi, .ve_l
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.bq
{ fill: #7fbcff; }

/* Illegal, large penalty */
.id_ac
{ fill: #ec8028; }

/* Illegal, death penalty */
.ng_sharia, .so_shabaab
{ fill: #8c201f; }</style><path d="m56.214 503.81h583.34v-458.2h-583.34z" fill="#ffd520" fill-rule="evenodd"/><path d="m62.665 451.08v-352.77c0-25.541 20.686-46.258 46.251-46.258h477.94c25.529 0 46.252 20.718 46.252 46.258v352.77c0 25.558-20.723 46.273-46.252 46.273h-477.94c-25.565 0-46.251-20.715-46.251-46.273z" fill="#000" fill-rule="evenodd"/><path d="m70.949 408.96v42.13c0 20.997 16.989 37.995 37.978 37.995h477.91c20.973 0 37.999-16.998 37.999-37.995v-42.13h-553.89z" fill="#ffd520" fill-rule="evenodd"/><path d="m71.197 401.04h314.14v-340.37h-276.16c-20.997 0-37.975 17.009-37.975 37.998v302.38z" fill="#ffd520" fill-rule="evenodd"/><path d="m222.14 361.14c3.2838 3.2794 8.5872 3.2794 11.871 0l130.65-130.67c3.2875-3.2718 3.2955-8.6029 0.0116-11.879l-130.65-130.66c-3.2758-3.2678-8.6227-3.2678-11.894 0l-130.66 130.66c-3.2797 3.2758-3.2601 8.6069 0 11.879l130.67 130.67z" fill="#000" fill-rule="evenodd"/><path d="m226.91 356.55c0.64588 0.66161 1.6772 0.66161 2.3231 0l130.86-130.85c0.64588-0.63379 0.64588-1.6889 0-2.3307l-130.86-130.86c-0.63379-0.63379-1.6893-0.64145-2.3348 0l-130.85 130.86c-0.64568 0.64185-0.62996 1.697 0 2.3307l130.85 130.85h0.0116z" fill="#ffd520" fill-rule="evenodd"/><path d="m393.38 60.444v340.37h231.47v-302.39c0-20.986-17.006-37.983-37.991-37.983h-193.48z" fill="#ffd520" fill-rule="evenodd"/><path d="m408.96 118.68h200.8l-0.0129 94.25c-0.35882 3.181-1.5482 6.3113-3.1044 9.398-1.7135 3.4177-4.0317 6.7366-7.0112 9.8943-3.4471 3.6499-7.624 7.02-12.341 10.135-5.459 3.6028-11.648 6.7681-18.393 9.5322-8.4989 3.4766-17.421 6.6616-26.751 9.4096-10.015 2.973-20.461 5.4928-31.189 7.4809l-1.524 0.31125-1.6691-0.31125c-10.728-1.988-21.175-4.5079-31.189-7.4809-9.3294-2.748-18.25-5.9331-26.751-9.4096-6.7447-2.7642-12.934-5.9295-18.395-9.5322-4.7171-3.1145-8.8904-6.4846-12.34-10.135-2.9843-3.1576-5.2993-6.4766-7.012-9.8943-1.5554-3.0867-2.7444-6.2169-3.1028-9.398l-0.0129-94.25z" fill="#fff" fill-rule="evenodd"/><path d="m606.09 163.3h-193.64v49.531c0.49633 2.9843