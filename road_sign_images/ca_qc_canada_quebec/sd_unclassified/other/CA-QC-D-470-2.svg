<svg width="180.93" height="142.12" version="1.1" viewBox="82.992 45.607 530 458.38" xmlns="http://www.w3.org/2000/svg"><style type="text/css">/*
 * Below are Cascading Style Sheet (CSS) definitions in use in this file,
 * which allow easily changing how countries are displayed.
 *
 */

/*
 * Circles around small countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.circlexx
{
   opacity:1;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * Smaller circles around French DOMs and Chinese SARs
 *
 * Change opacity to 1 to display all subnational circles.
 *
 */
.subxx
{
   opacity:1;
   stroke-width:0.3;
}

/*
 * Circles around small, unrecognized countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.unxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.3;
}

/*
 * Circles around small countries, but with no permanent residents 
 *
 * Change opacity to 1 to display all circles.
 *
 */
.noxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * land
 */
.landxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.5;
   fill-rule:evenodd;
}

/*
 * Styles for coastlines of islands with no borders
 */
.coastxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.3;
   fill-rule:evenodd;
}

/*
 * Styles for nations with limited recognition
 */
.limitxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Styles for nations with no permanent population.
 */
.antxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Ocean
 */
.oceanxx
{
   opacity: 1;
   color: #000000;
   fill:#ffffff;
   stroke:#000;
   stroke-width:0.5;
   stroke-miterlimit:1;
}

/*
 * Additional style rules
 *
 * The following are examples of colouring countries.  You can substitute these with your own styles to colour the countries on the map.
 *
 * Color a few countries:
 *
 * .gb, .au, .nc
 * {
 *    fill:       #ff0000;
 * }
 *
 * Color a few small country circles (and the countries):
 *
 * .ms, .ky
 * {
 *    opacity:    1;
 *    fill:       #ff0000;
 * }
 *
 */

/* Same-sex marriage */
.ar, .be, .ca, .dk, .es, .is, .nl, .no, .pt, .se, .za
{ fill: #002255; }

/* Civil unions etc. */
.ad, .at, .au, .bl, .br, .ch, .co, .cz, .de, .ec, .fi, .fr, .gb, .gf, .gl, .hr, .hu, .ie, .il, .im, .je, .li, .lu, .mf, .nc, .nf, .nz, .pm, .re, .si, .uy, .wf
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.aw, .cw, .sx, .mx
{ fill: #7fbcff; }

/* Legal but no recognition */
.ai, .al, .am, .as, .az, .ba, .bg, .bf, .by, .bj, .bm, .bo, .bs, .cd, .cg, .cf, .ci, .cl, .cn, .cr, .cu, .cv, .cy, .dj, .do, .ee, .fk, .fj, .fm, .fo, .ga, .ge, .gg, .gi, .gq, .gr, .gs, .gt, .gu, .gw, .hn, .ht, .id, .in, .iq, .it, .jo, .jp, .kg, .kh, .kp, .kr, .ky, .kz, .la, .lk, .lt, .lv, .mc, .md, .me, .mg, .mh, .mk, .ml, .mn, .mp, .mt, .ms, .mz, .ne, .ni, .np, .pa, .pe, .pf, .ph, .pl, .pn, .pr, .py, .ro, .rs, .ru, .rw, .sh, .sk, .sm, .sr, .st, .sv, .tc, .td, .th, .tj, .tk, .tl, .tr, .tw, .ua, .us, .va, .ve, .vg, .vi, .vn, .vu, .xk, .ps_west_bank
{ fill: #cccccc; }

/* Illegal, minimal penalty */
.bt, .lb, .lr
{ fill: #f9dc36; }

/* Illegal, large penalty */
.ag, .ao, .bh, .bi, .bn, .bw, .bz, .cm, .ck, .dm, .dz, .eg, .eh, .er, .et, .gd, .gh, .gm, .gn, .jm, .ke, .ki, .km, .kn, .kw, .lc, .ls, .ly, .ma, .mu, .mv, .mw, .my, .na, .ng, .nr, .nu, .om, .pg, .pw, .qa, .sb, .sc, .sg, .sn, .so, .ss, .sy, .sz, .tg, .tm, .tn, .to, .tt, .tv, .uz, .vc, .ws, .zm, .zw, .xc, .ps_gaza_strip
{ fill: #ec8028; }

/* Illegal, life imprisonment */
.bb, .bd, .gy, .mm, .pk, .sl, .tz, .ug
{ fill: #e73e21; }

/* Illegal, death penalty */
.ae, .af, .ir, .mr, .sa, .sd, .ye
{ fill: #8c201f; }

/* SUB-NATIONAL UNITS */

/* Same-sex marriage */
.br_al, .mx_dif, .us_ct, .us_dc, .us_ia, .us_ma, .us_md, .us_nh, .us_ny, .us_vt, .us_wa
{ fill: #002255; }

/* Civil unions etc. */
.mx_coa, .uk_je, .us_ca, .us_co, .us_de, .us_hi, .us_il, .us_me, .us_nj, .us_nv, .us_or, .us_ri, .us_wi, .ve_l
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.bq
{ fill: #7fbcff; }

/* Illegal, large penalty */
.id_ac
{ fill: #ec8028; }

/* Illegal, death penalty */
.ng_sharia, .so_shabaab
{ fill: #8c201f; }</style><path d="m56.203 503.99h583.58v-458.38h-583.58z" fill="#ffd520" fill-rule="evenodd"/><path d="m62.654 451.24v-352.91c0-25.553 20.69-46.279 46.271-46.279h478.13c25.541 0 46.272 20.726 46.272 46.279v352.91c0 25.568-20.731 46.295-46.272 46.295h-478.13c-25.58 0-46.271-20.727-46.271-46.295z" fill="#000" fill-rule="evenodd"/><path d="m70.938 409.11v42.142c0 21.005 16.997 38.011 37.994 38.011h478.11c20.977 0 38.011-17.006 38.011-38.011v-42.142h-554.12z" fill="#ffd520" fill-rule="evenodd"/><path d="m70.899 400.65h314.26v-340.52h-276.28c-21.001 0-37.982 17.013-37.982 38.014v302.5z" fill="#ffd520" fill-rule="evenodd"/><path d="m222.12 361.04c3.2879 3.2758 8.5912 3.2758 11.879 0l130.7-130.72c3.2875-3.2758 3.2955-8.6065 0.0158-11.886l-130.71-130.71c-3.2758-3.268-8.6227-3.268-11.894 0l-130.71 130.71c-3.2836 3.2798-3.2679 8.6106 0 11.886l130.72 130.72z" fill="#000" fill-rule="evenodd"/><path d="m226.9 356.44c0.64588 0.66161 1.6812 0.66161 2.3271 0l130.91-130.9c0.64952-0.62975 0.64952-1.6889 0-2.3267l-130.91-130.92c-0.6342-0.62976-1.6933-0.64588-2.3348 0l-130.91 130.92c-0.64572 0.63782-0.62601 1.697 0 2.3267l130.91 130.9h8e-3z" fill="#ffd520" fill-rule="evenodd"/><path d="m393.66 60.338v340.52h231.57v-302.52c0-20.997-17.01-38.002-38.003-38.002h-193.56z" fill="#ffd520" fill-rule="evenodd"/><path d="m408.91 118.51h200.88l-0.0129 94.289c-0.35479 3.1851-1.5482 6.3113-3.1044 9.406-1.7135 3.4096-4.0277 6.7366-7.0152 9.8983-3.4471 3.6459-7.628 7.02-12.345 10.134-5.463 3.6068-11.656 6.7681-18.401 9.5399-8.4949 3.4729-17.429 6.658-26.759 9.4141-10.023 2.9649-20.469 5.4924-31.206 7.4768l-1.524 0.31083-1.6691-0.31083c-10.736-1.9844-21.183-4.5119-31.206-7.4768-9.3294-2.7561-18.258-5.9412-26.758-9.4141-6.7443-2.7718-12.938-5.9331-18.399-9.5399-4.7207-3.1141-8.898-6.4883-12.347-10.134-2.9883-3.1617-5.2993-6.4887-7.016-9.8983-1.555-3.0948-2.748-6.221-3.1024-9.406l-0.0129-94.289z" fill="#fff" fill-rule="evenodd"/><path d="m606.08 163.19h-193.72v49.55c0.49632 2.9847 1.507