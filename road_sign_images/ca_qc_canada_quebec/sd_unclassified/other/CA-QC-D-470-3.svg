<svg width="180.93" height="142.12" version="1.1" viewBox="82.992 45.607 530 458.39" xmlns="http://www.w3.org/2000/svg"><style type="text/css">/*
 * Below are Cascading Style Sheet (CSS) definitions in use in this file,
 * which allow easily changing how countries are displayed.
 *
 */

/*
 * Circles around small countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.circlexx
{
   opacity:1;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * Smaller circles around French DOMs and Chinese SARs
 *
 * Change opacity to 1 to display all subnational circles.
 *
 */
.subxx
{
   opacity:1;
   stroke-width:0.3;
}

/*
 * Circles around small, unrecognized countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.unxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.3;
}

/*
 * Circles around small countries, but with no permanent residents 
 *
 * Change opacity to 1 to display all circles.
 *
 */
.noxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * land
 */
.landxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.5;
   fill-rule:evenodd;
}

/*
 * Styles for coastlines of islands with no borders
 */
.coastxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.3;
   fill-rule:evenodd;
}

/*
 * Styles for nations with limited recognition
 */
.limitxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Styles for nations with no permanent population.
 */
.antxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Ocean
 */
.oceanxx
{
   opacity: 1;
   color: #000000;
   fill:#ffffff;
   stroke:#000;
   stroke-width:0.5;
   stroke-miterlimit:1;
}

/*
 * Additional style rules
 *
 * The following are examples of colouring countries.  You can substitute these with your own styles to colour the countries on the map.
 *
 * Color a few countries:
 *
 * .gb, .au, .nc
 * {
 *    fill:       #ff0000;
 * }
 *
 * Color a few small country circles (and the countries):
 *
 * .ms, .ky
 * {
 *    opacity:    1;
 *    fill:       #ff0000;
 * }
 *
 */

/* Same-sex marriage */
.ar, .be, .ca, .dk, .es, .is, .nl, .no, .pt, .se, .za
{ fill: #002255; }

/* Civil unions etc. */
.ad, .at, .au, .bl, .br, .ch, .co, .cz, .de, .ec, .fi, .fr, .gb, .gf, .gl, .hr, .hu, .ie, .il, .im, .je, .li, .lu, .mf, .nc, .nf, .nz, .pm, .re, .si, .uy, .wf
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.aw, .cw, .sx, .mx
{ fill: #7fbcff; }

/* Legal but no recognition */
.ai, .al, .am, .as, .az, .ba, .bg, .bf, .by, .bj, .bm, .bo, .bs, .cd, .cg, .cf, .ci, .cl, .cn, .cr, .cu, .cv, .cy, .dj, .do, .ee, .fk, .fj, .fm, .fo, .ga, .ge, .gg, .gi, .gq, .gr, .gs, .gt, .gu, .gw, .hn, .ht, .id, .in, .iq, .it, .jo, .jp, .kg, .kh, .kp, .kr, .ky, .kz, .la, .lk, .lt, .lv, .mc, .md, .me, .mg, .mh, .mk, .ml, .mn, .mp, .mt, .ms, .mz, .ne, .ni, .np, .pa, .pe, .pf, .ph, .pl, .pn, .pr, .py, .ro, .rs, .ru, .rw, .sh, .sk, .sm, .sr, .st, .sv, .tc, .td, .th, .tj, .tk, .tl, .tr, .tw, .ua, .us, .va, .ve, .vg, .vi, .vn, .vu, .xk, .ps_west_bank
{ fill: #cccccc; }

/* Illegal, minimal penalty */
.bt, .lb, .lr
{ fill: #f9dc36; }

/* Illegal, large penalty */
.ag, .ao, .bh, .bi, .bn, .bw, .bz, .cm, .ck, .dm, .dz, .eg, .eh, .er, .et, .gd, .gh, .gm, .gn, .jm, .ke, .ki, .km, .kn, .kw, .lc, .ls, .ly, .ma, .mu, .mv, .mw, .my, .na, .ng, .nr, .nu, .om, .pg, .pw, .qa, .sb, .sc, .sg, .sn, .so, .ss, .sy, .sz, .tg, .tm, .tn, .to, .tt, .tv, .uz, .vc, .ws, .zm, .zw, .xc, .ps_gaza_strip
{ fill: #ec8028; }

/* Illegal, life imprisonment */
.bb, .bd, .gy, .mm, .pk, .sl, .tz, .ug
{ fill: #e73e21; }

/* Illegal, death penalty */
.ae, .af, .ir, .mr, .sa, .sd, .ye
{ fill: #8c201f; }

/* SUB-NATIONAL UNITS */

/* Same-sex marriage */
.br_al, .mx_dif, .us_ct, .us_dc, .us_ia, .us_ma, .us_md, .us_nh, .us_ny, .us_vt, .us_wa
{ fill: #002255; }

/* Civil unions etc. */
.mx_coa, .uk_je, .us_ca, .us_co, .us_de, .us_hi, .us_il, .us_me, .us_nj, .us_nv, .us_or, .us_ri, .us_wi, .ve_l
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.bq
{ fill: #7fbcff; }

/* Illegal, large penalty */
.id_ac
{ fill: #ec8028; }

/* Illegal, death penalty */
.ng_sharia, .so_shabaab
{ fill: #8c201f; }</style><path d="m56.203 503.99h583.58v-458.39h-583.58z" fill="#ffd520" fill-rule="evenodd"/><path d="m62.654 451.25v-352.91c0-25.557 20.69-46.282 46.271-46.282h478.13c25.541 0 46.272 20.726 46.272 46.282v352.91c0 25.569-20.731 46.296-46.272 46.296h-478.13c-25.58 0-46.271-20.727-46.271-46.296z" fill="#000" fill-rule="evenodd"/><path d="m70.938 409.11v42.146c0 21.005 16.997 38.007 37.994 38.007h478.11c20.977 0 38.011-17.002 38.011-38.007v-42.146h-554.12z" fill="#ffd520" fill-rule="evenodd"/><path d="m70.899 400.65h314.26v-340.52h-276.28c-21.001 0-37.982 17.017-37.982 38.018v302.5z" fill="#ffd520" fill-rule="evenodd"/><path d="m222.12 361.04c3.2879 3.2798 8.5912 3.2798 11.879 0l130.7-130.72c3.2875-3.2758 3.2955-8.6069 0.0158-11.883l-130.71-130.71c-3.2758-3.2718-8.6227-3.2718-11.894 0l-130.71 130.71c-3.2836 3.2758-3.2679 8.6069 0 11.883l130.72 130.72z" fill="#000" fill-rule="evenodd"/><path d="m226.9 356.45c0.64588 0.66161 1.6812 0.66161 2.3271 0l130.91-130.9c0.64952-0.6342 0.64952-1.6893 0-2.3312l-130.91-130.91c-0.6342-0.63379-1.6933-0.64548-2.3348 0l-130.91 130.91c-0.64572 0.64185-0.62601 1.697 0 2.3312l130.91 130.9h8e-3z" fill="#ffd520" fill-rule="evenodd"/><path d="m393.66 60.338v340.52h231.57v-302.51c0-20.997-17.01-38.006-38.003-38.006h-193.56z" fill="#ffd520" fill-rule="evenodd"/><path d="m584.64 118.44-6e-3 94.368c-0.38704 3.2008-1.1692 6.3701-2.3384 9.4609-1.2861 3.4137-3.0238 6.7564-5.2654 9.914-2.5884 3.6419-5.7251 7.0241-9.2649 10.135-4.0922 3.5947-8.7327 6.7721-13.793 9.5242-6.3742 3.4806-13.059 6.6697-20.062 9.4258-7.5071 2.9569-15.341 5.4767-23.384 7.4728l-1.0966 0.31124-1.2498-0.31124c-8.0514-1.9961-15.885-4.516-23.392-7.4728-6.9991-2.7561-13.688-5.9452-20.062-9.4258-5.0586-2.7521-9.7007-5.9295-13.791-9.5242-3.5395-3.1105-6.6778-6.4927-9.2605-10.135-2.2481-3.1576-3.9845-6.5004-5.2719-9.914-1.1692-3.0907-1.9489-6.2601-2.3388-9.4609l-6e-3 -94.368h150.59z" fill="#fff" fill-rule="evenodd"/><path d="m581.68 162.32h-144.62v50.31c0.37012 3.027