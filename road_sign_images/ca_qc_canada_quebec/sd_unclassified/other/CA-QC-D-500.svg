<svg width="358.11" height="158.31" version="1.1" viewBox="82.992 45.607 1049 510.6" xmlns="http://www.w3.org/2000/svg"><style type="text/css">/*
 * Below are Cascading Style Sheet (CSS) definitions in use in this file,
 * which allow easily changing how countries are displayed.
 *
 */

/*
 * Circles around small countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.circlexx
{
   opacity:1;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * Smaller circles around French DOMs and Chinese SARs
 *
 * Change opacity to 1 to display all subnational circles.
 *
 */
.subxx
{
   opacity:1;
   stroke-width:0.3;
}

/*
 * Circles around small, unrecognized countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.unxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.3;
}

/*
 * Circles around small countries, but with no permanent residents 
 *
 * Change opacity to 1 to display all circles.
 *
 */
.noxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * land
 */
.landxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.5;
   fill-rule:evenodd;
}

/*
 * Styles for coastlines of islands with no borders
 */
.coastxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.3;
   fill-rule:evenodd;
}

/*
 * Styles for nations with limited recognition
 */
.limitxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Styles for nations with no permanent population.
 */
.antxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Ocean
 */
.oceanxx
{
   opacity: 1;
   color: #000000;
   fill:#ffffff;
   stroke:#000;
   stroke-width:0.5;
   stroke-miterlimit:1;
}

/*
 * Additional style rules
 *
 * The following are examples of colouring countries.  You can substitute these with your own styles to colour the countries on the map.
 *
 * Color a few countries:
 *
 * .gb, .au, .nc
 * {
 *    fill:       #ff0000;
 * }
 *
 * Color a few small country circles (and the countries):
 *
 * .ms, .ky
 * {
 *    opacity:    1;
 *    fill:       #ff0000;
 * }
 *
 */

/* Same-sex marriage */
.ar, .be, .ca, .dk, .es, .is, .nl, .no, .pt, .se, .za
{ fill: #002255; }

/* Civil unions etc. */
.ad, .at, .au, .bl, .br, .ch, .co, .cz, .de, .ec, .fi, .fr, .gb, .gf, .gl, .hr, .hu, .ie, .il, .im, .je, .li, .lu, .mf, .nc, .nf, .nz, .pm, .re, .si, .uy, .wf
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.aw, .cw, .sx, .mx
{ fill: #7fbcff; }

/* Legal but no recognition */
.ai, .al, .am, .as, .az, .ba, .bg, .bf, .by, .bj, .bm, .bo, .bs, .cd, .cg, .cf, .ci, .cl, .cn, .cr, .cu, .cv, .cy, .dj, .do, .ee, .fk, .fj, .fm, .fo, .ga, .ge, .gg, .gi, .gq, .gr, .gs, .gt, .gu, .gw, .hn, .ht, .id, .in, .iq, .it, .jo, .jp, .kg, .kh, .kp, .kr, .ky, .kz, .la, .lk, .lt, .lv, .mc, .md, .me, .mg, .mh, .mk, .ml, .mn, .mp, .mt, .ms, .mz, .ne, .ni, .np, .pa, .pe, .pf, .ph, .pl, .pn, .pr, .py, .ro, .rs, .ru, .rw, .sh, .sk, .sm, .sr, .st, .sv, .tc, .td, .th, .tj, .tk, .tl, .tr, .tw, .ua, .us, .va, .ve, .vg, .vi, .vn, .vu, .xk, .ps_west_bank
{ fill: #cccccc; }

/* Illegal, minimal penalty */
.bt, .lb, .lr
{ fill: #f9dc36; }

/* Illegal, large penalty */
.ag, .ao, .bh, .bi, .bn, .bw, .bz, .cm, .ck, .dm, .dz, .eg, .eh, .er, .et, .gd, .gh, .gm, .gn, .jm, .ke, .ki, .km, .kn, .kw, .lc, .ls, .ly, .ma, .mu, .mv, .mw, .my, .na, .ng, .nr, .nu, .om, .pg, .pw, .qa, .sb, .sc, .sg, .sn, .so, .ss, .sy, .sz, .tg, .tm, .tn, .to, .tt, .tv, .uz, .vc, .ws, .zm, .zw, .xc, .ps_gaza_strip
{ fill: #ec8028; }

/* Illegal, life imprisonment */
.bb, .bd, .gy, .mm, .pk, .sl, .tz, .ug
{ fill: #e73e21; }

/* Illegal, death penalty */
.ae, .af, .ir, .mr, .sa, .sd, .ye
{ fill: #8c201f; }

/* SUB-NATIONAL UNITS */

/* Same-sex marriage */
.br_al, .mx_dif, .us_ct, .us_dc, .us_ia, .us_ma, .us_md, .us_nh, .us_ny, .us_vt, .us_wa
{ fill: #002255; }

/* Civil unions etc. */
.mx_coa, .uk_je, .us_ca, .us_co, .us_de, .us_hi, .us_il, .us_me, .us_nj, .us_nv, .us_or, .us_ri, .us_wi, .ve_l
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.bq
{ fill: #7fbcff; }

/* Illegal, large penalty */
.id_ac
{ fill: #ec8028; }

/* Illegal, death penalty */
.ng_sharia, .so_shabaab
{ fill: #8c201f; }</style><path d="m29.97 556.21h1155.1v-510.6h-1155.1z" fill="#ffd520" fill-rule="evenodd"/><path d="m42.872 499.67c0 24.11 19.552 43.639 43.64 43.639h1042c24.09 0 43.619-19.53 43.619-43.639v-397.51c0-24.124-19.53-43.648-43.619-43.648h-1042c-24.088 0-43.64 19.525-43.64 43.648v397.51z" fill="#000" fill-rule="evenodd"/><path d="m55.329 499.67c0 17.228 13.989 31.173 31.183 31.173h1042c17.203 0 31.157-13.946 31.157-31.173v-397.51c0-17.237-13.954-31.183-31.157-31.183h-1042c-17.194 0-31.183 13.946-31.183 31.183v397.51z" fill="#ffd520" fill-rule="evenodd"/><path d="m661.64 355.32-0.0565-51.644-78.957 0.0746-56.944 51.57h135.96zm97.318-0.78337-19.602-51.452-61.593 0.0355-0.0522 51.503 81.247-0.0867zm189.42 92.608-103.29 0.66927c0.11676-28.194-22.747-51.086-50.925-51.046-28.267 0.0787-51.062 23.175-50.732 51.436h-203.52c0.22158-28.415-23.287-50.519-51.586-50.164-27.762 0.3822-50.038 23.064-49.86 50.842l-66.458-0.49226-3.3391-24.273 2.2719-2.496 6.0714-52.094 44.707-6.5713 85.173-7.3156 71.172-65.133 189.19-0.28745 62.258 65.075 96.536 8.3864 12.938 57.535 2.8787 0.0194 6.5112 25.911z" fill="#000" fill-rule="evenodd"/><path d="m368.12 371.26-232.49-54.098c-14.973 0.0669-28.147 7.7131-37.006 18.737-9.0948 11.217-16.418 30.088-16.418 51.066 0 18.599 5.4174 35.049 12.941 46.211 8.7054 12.875 22.903 21.949 39.38 22.013l227.25-38.857 6.3391-45.073z" fill="#fff" fill-rule="evenodd"/><path d="m1094.9 442.94c14.857-0.18868 28.678-15.958 34.762-39.998 1.9715-7.9651 3.1125-16.682 3.1125-25.872 0-9.15-1.141-17.902-3.1125-25.816-6.0758-24.001-19.848-39.778-34.693-39.994l-159.85 53.507 10.22 42.227 149.56 35.947z" fill="#c0111e" fill-rule="evenodd"/><path d="m205.38 202.34c5.5989-0.0197 11.06-2.7323 15.485-10.229 2.5908-4.5002 4.4966-10.945 4.4966-18.671 0-14.154-8.0086-27.619-20.32-27.619-4.3268 0-8.646 1.7598-12.627 6.1694-3.7681 4.2644-7.4019 12.914-7.4019 22.635 0 11.06 5.6106 27.549 20.367 27.714zm0.0355 18.541c-23.458 0-39.376-22.088-39.376-46.704 0-14.576 5.7642-28