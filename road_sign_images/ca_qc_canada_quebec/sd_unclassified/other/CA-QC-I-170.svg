<svg width="180.51" height="240.62" version="1.1" viewBox="82.992 45.607 528.76 776.1" xmlns="http://www.w3.org/2000/svg"><style type="text/css">/*
 * Below are Cascading Style Sheet (CSS) definitions in use in this file,
 * which allow easily changing how countries are displayed.
 *
 */

/*
 * Circles around small countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.circlexx
{
   opacity:1;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * Smaller circles around French DOMs and Chinese SARs
 *
 * Change opacity to 1 to display all subnational circles.
 *
 */
.subxx
{
   opacity:1;
   stroke-width:0.3;
}

/*
 * Circles around small, unrecognized countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.unxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.3;
}

/*
 * Circles around small countries, but with no permanent residents 
 *
 * Change opacity to 1 to display all circles.
 *
 */
.noxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * land
 */
.landxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.5;
   fill-rule:evenodd;
}

/*
 * Styles for coastlines of islands with no borders
 */
.coastxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.3;
   fill-rule:evenodd;
}

/*
 * Styles for nations with limited recognition
 */
.limitxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Styles for nations with no permanent population.
 */
.antxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Ocean
 */
.oceanxx
{
   opacity: 1;
   color: #000000;
   fill:#ffffff;
   stroke:#000;
   stroke-width:0.5;
   stroke-miterlimit:1;
}

/*
 * Additional style rules
 *
 * The following are examples of colouring countries.  You can substitute these with your own styles to colour the countries on the map.
 *
 * Color a few countries:
 *
 * .gb, .au, .nc
 * {
 *    fill:       #ff0000;
 * }
 *
 * Color a few small country circles (and the countries):
 *
 * .ms, .ky
 * {
 *    opacity:    1;
 *    fill:       #ff0000;
 * }
 *
 */

/* Same-sex marriage */
.ar, .be, .ca, .dk, .es, .is, .nl, .no, .pt, .se, .za
{ fill: #002255; }

/* Civil unions etc. */
.ad, .at, .au, .bl, .br, .ch, .co, .cz, .de, .ec, .fi, .fr, .gb, .gf, .gl, .hr, .hu, .ie, .il, .im, .je, .li, .lu, .mf, .nc, .nf, .nz, .pm, .re, .si, .uy, .wf
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.aw, .cw, .sx, .mx
{ fill: #7fbcff; }

/* Legal but no recognition */
.ai, .al, .am, .as, .az, .ba, .bg, .bf, .by, .bj, .bm, .bo, .bs, .cd, .cg, .cf, .ci, .cl, .cn, .cr, .cu, .cv, .cy, .dj, .do, .ee, .fk, .fj, .fm, .fo, .ga, .ge, .gg, .gi, .gq, .gr, .gs, .gt, .gu, .gw, .hn, .ht, .id, .in, .iq, .it, .jo, .jp, .kg, .kh, .kp, .kr, .ky, .kz, .la, .lk, .lt, .lv, .mc, .md, .me, .mg, .mh, .mk, .ml, .mn, .mp, .mt, .ms, .mz, .ne, .ni, .np, .pa, .pe, .pf, .ph, .pl, .pn, .pr, .py, .ro, .rs, .ru, .rw, .sh, .sk, .sm, .sr, .st, .sv, .tc, .td, .th, .tj, .tk, .tl, .tr, .tw, .ua, .us, .va, .ve, .vg, .vi, .vn, .vu, .xk, .ps_west_bank
{ fill: #cccccc; }

/* Illegal, minimal penalty */
.bt, .lb, .lr
{ fill: #f9dc36; }

/* Illegal, large penalty */
.ag, .ao, .bh, .bi, .bn, .bw, .bz, .cm, .ck, .dm, .dz, .eg, .eh, .er, .et, .gd, .gh, .gm, .gn, .jm, .ke, .ki, .km, .kn, .kw, .lc, .ls, .ly, .ma, .mu, .mv, .mw, .my, .na, .ng, .nr, .nu, .om, .pg, .pw, .qa, .sb, .sc, .sg, .sn, .so, .ss, .sy, .sz, .tg, .tm, .tn, .to, .tt, .tv, .uz, .vc, .ws, .zm, .zw, .xc, .ps_gaza_strip
{ fill: #ec8028; }

/* Illegal, life imprisonment */
.bb, .bd, .gy, .mm, .pk, .sl, .tz, .ug
{ fill: #e73e21; }

/* Illegal, death penalty */
.ae, .af, .ir, .mr, .sa, .sd, .ye
{ fill: #8c201f; }

/* SUB-NATIONAL UNITS */

/* Same-sex marriage */
.br_al, .mx_dif, .us_ct, .us_dc, .us_ia, .us_ma, .us_md, .us_nh, .us_ny, .us_vt, .us_wa
{ fill: #002255; }

/* Civil unions etc. */
.mx_coa, .uk_je, .us_ca, .us_co, .us_de, .us_hi, .us_il, .us_me, .us_nj, .us_nv, .us_or, .us_ri, .us_wi, .ve_l
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.bq
{ fill: #7fbcff; }

/* Illegal, large penalty */
.id_ac
{ fill: #ec8028; }

/* Illegal, death penalty */
.ng_sharia, .so_shabaab
{ fill: #8c201f; }</style><path d="m58.524 777.99v-688.28c0-22.931 18.544-41.518 41.471-41.518h494.73c22.908 0 41.491 18.588 41.491 41.518v688.28c0 22.928-18.582 41.466-41.491 41.466h-494.73c-22.927 0-41.471-18.538-41.471-41.466z" fill="#fff" fill-rule="evenodd" stroke="#000" stroke-miterlimit="4" stroke-width="2.5803"/><path d="m622.67 182.09h-550.29v595.85c0 15.365 12.41 27.819 27.765 27.819h494.73c15.337 0 27.791-12.454 27.791-27.819v-595.85z" fill="#008460" fill-rule="evenodd"/><path d="m72.387 122.83h550.29v-33.195c0-15.312-12.454-27.789-27.791-27.789h-494.73c-15.355 0-27.765 12.477-27.765 27.789v33.195z" fill="#008460" fill-rule="evenodd"/><path d="m338.28 676.73c1.2676-4.1003 1.7558-8.39 1.4607-12.639-0.24029-3.3665-0.92528-6.6362-2.0945-9.8052-1.4176-3.7535-2.39-7.6563-2.9295-11.611-0.97245-7.3136-0.43704-14.732 1.5631-21.808 3.1694-5.5114 1.5119-12.486-3.76-15.998-5.5594-3.7092-13.072-2.1933-16.729 3.3625-2.1973 6.1-5.8549 11.519-10.686 15.861-4.3902 3.9511-9.658 6.8741-15.367 8.5311-3.658 0.93133-7.1737 2.536-10.296 4.6849-3.7088 2.536-6.8269 5.8097-9.1698 9.6116-4.1498-3.2657-8.8783-5.8017-13.953-7.366-4.4414-1.3668-9.0714-2.0522-13.757-1.9514-8.5872 0.29447-17.17-1.27-25.08-4.6365-7.7054-3.2657-14.635-8.1441-20.293-14.341-4.5357-4.5841-10.001-8.1481-16.001-10.438-7.0241-2.6851-14.584-3.564-22.001-2.5884 3.2205-2.3424 6.3391-4.7332 9.3665-7.2692 3.658-3.0278 7.2172-6.1968 10.634-9.5149 2.2445-3.3665 5.2683-6.1 8.8315-7.9949 3.756-1.9594 7.9018-2.9351 12.146-2.7859 5.9528-1.7094 9.7092-7.5111 8.8783-13.611-0.83094-6.0032-5.8037-10.539-11.855-10.732-6.4375 0.33867-12.831-0.77812-18.781-3.3141-5.7089-2.4432-10.78-6.0557-14.93-10.64-3.4645-3.7092-7.268-7.12-11.367-10.099-4.8784-3.556-10.146-6.5354-15.71-8.9262-6.583-4.6365-12.198-10.438-16.54-17.224-4.5829-7.12-7.6579-15.123-9.0202-23.513 9.658 6.4427 22.832 3.2254 28.391-6.9749 4.878-8.9746 2.1969-20.151-6.2448-25.905-3.8543-4.2442-6.5354-9.4141-7.8074-15.025-1.3152-5.7602-1.118-11.757 0.63782-17.418 0.63419