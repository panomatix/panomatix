<svg width="178.37" height="178.37" version="1.1" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"><style type="text/css">.marriage		{ fill: #002255; }	/* Same-sex marriages */
