<svg width="5410" height="3250" version="1.1" viewBox="82.992 45.607 15847 10482" xmlns="http://www.w3.org/2000/svg"><style type="text/css">/*
 * Below are Cascading Style Sheet (CSS) definitions in use in this file,
 * which allow easily changing how countries are displayed.
 *
 */

/*
 * Circles around small countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.circlexx
{
   opacity:1;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * Smaller circles around French DOMs and Chinese SARs
 *
 * Change opacity to 1 to display all subnational circles.
 *
 */
.subxx
{
   opacity:1;
   stroke-width:0.3;
}

/*
 * Circles around small, unrecognized countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.unxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.3;
}

/*
 * Circles around small countries, but with no permanent residents 
 *
 * Change opacity to 1 to display all circles.
 *
 */
.noxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * land
 */
.landxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.5;
   fill-rule:evenodd;
}

/*
 * Styles for coastlines of islands with no borders
 */
.coastxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.3;
   fill-rule:evenodd;
}

/*
 * Styles for nations with limited recognition
 */
.limitxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Styles for nations with no permanent population.
 */
.antxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Ocean
 */
.oceanxx
{
   opacity: 1;
   color: #000000;
   fill:#ffffff;
   stroke:#000;
   stroke-width:0.5;
   stroke-miterlimit:1;
}

/*
 * Additional style rules
 *
 * The following are examples of colouring countries.  You can substitute these with your own styles to colour the countries on the map.
 *
 * Color a few countries:
 *
 * .gb, .au, .nc
 * {
 *    fill:       #ff0000;
 * }
 *
 * Color a few small country circles (and the countries):
 *
 * .ms, .ky
 * {
 *    opacity:    1;
 *    fill:       #ff0000;
 * }
 *
 */

/* Same-sex marriage */
.ar, .be, .ca, .dk, .es, .is, .nl, .no, .pt, .se, .za
{ fill: #002255; }

/* Civil unions etc. */
.ad, .at, .au, .bl, .br, .ch, .co, .cz, .de, .ec, .fi, .fr, .gb, .gf, .gl, .hr, .hu, .ie, .il, .im, .je, .li, .lu, .mf, .nc, .nf, .nz, .pm, .re, .si, .uy, .wf
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.aw, .cw, .sx, .mx
{ fill: #7fbcff; }

/* Legal but no recognition */
.ai, .al, .am, .as, .az, .ba, .bg, .bf, .by, .bj, .bm, .bo, .bs, .cd, .cg, .cf, .ci, .cl, .cn, .cr, .cu, .cv, .cy, .dj, .do, .ee, .fk, .fj, .fm, .fo, .ga, .ge, .gg, .gi, .gq, .gr, .gs, .gt, .gu, .gw, .hn, .ht, .id, .in, .iq, .it, .jo, .jp, .kg, .kh, .kp, .kr, .ky, .kz, .la, .lk, .lt, .lv, .mc, .md, .me, .mg, .mh, .mk, .ml, .mn, .mp, .mt, .ms, .mz, .ne, .ni, .np, .pa, .pe, .pf, .ph, .pl, .pn, .pr, .py, .ro, .rs, .ru, .rw, .sh, .sk, .sm, .sr, .st, .sv, .tc, .td, .th, .tj, .tk, .tl, .tr, .tw, .ua, .us, .va, .ve, .vg, .vi, .vn, .vu, .xk, .ps_west_bank
{ fill: #cccccc; }

/* Illegal, minimal penalty */
.bt, .lb, .lr
{ fill: #f9dc36; }

/* Illegal, large penalty */
.ag, .ao, .bh, .bi, .bn, .bw, .bz, .cm, .ck, .dm, .dz, .eg, .eh, .er, .et, .gd, .gh, .gm, .gn, .jm, .ke, .ki, .km, .kn, .kw, .lc, .ls, .ly, .ma, .mu, .mv, .mw, .my, .na, .ng, .nr, .nu, .om, .pg, .pw, .qa, .sb, .sc, .sg, .sn, .so, .ss, .sy, .sz, .tg, .tm, .tn, .to, .tt, .tv, .uz, .vc, .ws, .zm, .zw, .xc, .ps_gaza_strip
{ fill: #ec8028; }

/* Illegal, life imprisonment */
.bb, .bd, .gy, .mm, .pk, .sl, .tz, .ug
{ fill: #e73e21; }

/* Illegal, death penalty */
.ae, .af, .ir, .mr, .sa, .sd, .ye
{ fill: #8c201f; }

/* SUB-NATIONAL UNITS */

/* Same-sex marriage */
.br_al, .mx_dif, .us_ct, .us_dc, .us_ia, .us_ma, .us_md, .us_nh, .us_ny, .us_vt, .us_wa
{ fill: #002255; }

/* Civil unions etc. */
.mx_coa, .uk_je, .us_ca, .us_co, .us_de, .us_hi, .us_il, .us_me, .us_nj, .us_nv, .us_or, .us_ri, .us_wi, .ve_l
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.bq
{ fill: #7fbcff; }

/* Illegal, large penalty */
.id_ac
{ fill: #ec8028; }

/* Illegal, death penalty */
.ng_sharia, .so_shabaab
{ fill: #8c201f; }</style><path d="m16715 9858.8c0 360.72-292.42 653.14-653.14 653.14h-16111c-360.72 0-653.14-292.42-653.14-653.14v-9144c0-360.72 292.42-653.14 653.14-653.14h16111c360.72 0 653.14 292.42 653.14 653.14v9144z" fill="#fff" fill-rule="nonzero" stroke="#000" stroke-linecap="butt" stroke-linejoin="miter" stroke-miterlimit="4" stroke-width="32.254"/><path d="m-48.747 10331c-260.11 0-471.71-211.62-471.71-471.71v-9144c0-260.1 211.61-471.71 471.71-471.71h16111c260.09 0 471.71 211.61 471.71 471.71v9144c0 260.09-211.62 471.71-471.71 471.71h-16111z" fill="#000" fill-rule="nonzero"/><path d="m-48.747 10077c-120.05 0-217.71-97.648-217.71-217.71v-9144c0-120.04 97.665-217.71 217.71-217.71h16111c120.06 0 217.71 97.669 217.71 217.71v9144c0 120.06-97.648 217.71-217.71 217.71h-16111z" fill="#fff" fill-rule="nonzero"/><path d="m11314 7924.9-142.96 584.64h293.07l-150.1-584.64zm364.55 1425.9-142.96-556.14h-436.03l-135.83 556.14h-293.07l507.51-2032h285.93l507.51 2032h-293.07z" fill="#000" fill-rule="nonzero"/><path d="m13988 9350.8v-2032h958.14v285.2h-664.99v513.32h421.92v278.07h-421.92v670.19h743.65v285.2h-1036.8z" fill="#000" fill-rule="nonzero"/><path d="m4394.4 9101.3c-78.78 178.24-243.48 285.16-451.07 285.16-243.48 0-422.44-121.19-522.67-349.35-64.467-149.74-107.42-434.9-107.42-698.74 0-285.16 21.465-491.95 93.068-684.43 71.604-213.92 279.24-370.76 515.54-370.76 293.55 0 515.5 213.88 529.81 513.32h-293.55c-7.1764-135.47-100.23-228.16-243.44-228.16-100.23 0-179.01 49.913-229.12 149.74-57.25 99.825-93.052 327.98-93.052 570.37 0 171.15 14.313 349.39 42.938 506.22 42.978 199.65 143.21 306.61 300.73 306.61 150.34 0 221.95-99.825 221.95-313.75v-135.43h-229.12v-285.2h522.67v420.63c0 142.6-14.313 228.16-57.251 313.75z" fill="#000" fill-rule="nonzero"/><path d="m5786.1 9350.8v-919.76h-555.01v919.76h-291.7v-2032h291.7v827.07h555.01v-827.07h291.74v2032h-291.74z" fill="#000" fill-rule="nonzero"/><path d="m2541.1 9350.8v-2032h284.47v2032h-284.47z" fill="#000" fill-rule="nonzero"/><p