<svg width="6490" height="1630" version="1.1" viewBox="82.992 45.607 19011 5257.4" xmlns="http://www.w3.org/2000/svg"><style type="text/css">/*
 * Below are Cascading Style Sheet (CSS) definitions in use in this file,
 * which allow easily changing how countries are displayed.
 *
 */

/*
 * Circles around small countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.circlexx
{
   opacity:1;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * Smaller circles around French DOMs and Chinese SARs
 *
 * Change opacity to 1 to display all subnational circles.
 *
 */
.subxx
{
   opacity:1;
   stroke-width:0.3;
}

/*
 * Circles around small, unrecognized countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.unxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.3;
}

/*
 * Circles around small countries, but with no permanent residents 
 *
 * Change opacity to 1 to display all circles.
 *
 */
.noxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * land
 */
.landxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.5;
   fill-rule:evenodd;
}

/*
 * Styles for coastlines of islands with no borders
 */
.coastxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.3;
   fill-rule:evenodd;
}

/*
 * Styles for nations with limited recognition
 */
.limitxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Styles for nations with no permanent population.
 */
.antxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Ocean
 */
.oceanxx
{
   opacity: 1;
   color: #000000;
   fill:#ffffff;
   stroke:#000;
   stroke-width:0.5;
   stroke-miterlimit:1;
}

/*
 * Additional style rules
 *
 * The following are examples of colouring countries.  You can substitute these with your own styles to colour the countries on the map.
 *
 * Color a few countries:
 *
 * .gb, .au, .nc
 * {
 *    fill:       #ff0000;
 * }
 *
 * Color a few small country circles (and the countries):
 *
 * .ms, .ky
 * {
 *    opacity:    1;
 *    fill:       #ff0000;
 * }
 *
 */

/* Same-sex marriage */
.ar, .be, .ca, .dk, .es, .is, .nl, .no, .pt, .se, .za
{ fill: #002255; }

/* Civil unions etc. */
.ad, .at, .au, .bl, .br, .ch, .co, .cz, .de, .ec, .fi, .fr, .gb, .gf, .gl, .hr, .hu, .ie, .il, .im, .je, .li, .lu, .mf, .nc, .nf, .nz, .pm, .re, .si, .uy, .wf
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.aw, .cw, .sx, .mx
{ fill: #7fbcff; }

/* Legal but no recognition */
.ai, .al, .am, .as, .az, .ba, .bg, .bf, .by, .bj, .bm, .bo, .bs, .cd, .cg, .cf, .ci, .cl, .cn, .cr, .cu, .cv, .cy, .dj, .do, .ee, .fk, .fj, .fm, .fo, .ga, .ge, .gg, .gi, .gq, .gr, .gs, .gt, .gu, .gw, .hn, .ht, .id, .in, .iq, .it, .jo, .jp, .kg, .kh, .kp, .kr, .ky, .kz, .la, .lk, .lt, .lv, .mc, .md, .me, .mg, .mh, .mk, .ml, .mn, .mp, .mt, .ms, .mz, .ne, .ni, .np, .pa, .pe, .pf, .ph, .pl, .pn, .pr, .py, .ro, .rs, .ru, .rw, .sh, .sk, .sm, .sr, .st, .sv, .tc, .td, .th, .tj, .tk, .tl, .tr, .tw, .ua, .us, .va, .ve, .vg, .vi, .vn, .vu, .xk, .ps_west_bank
{ fill: #cccccc; }

/* Illegal, minimal penalty */
.bt, .lb, .lr
{ fill: #f9dc36; }

/* Illegal, large penalty */
.ag, .ao, .bh, .bi, .bn, .bw, .bz, .cm, .ck, .dm, .dz, .eg, .eh, .er, .et, .gd, .gh, .gm, .gn, .jm, .ke, .ki, .km, .kn, .kw, .lc, .ls, .ly, .ma, .mu, .mv, .mw, .my, .na, .ng, .nr, .nu, .om, .pg, .pw, .qa, .sb, .sc, .sg, .sn, .so, .ss, .sy, .sz, .tg, .tm, .tn, .to, .tt, .tv, .uz, .vc, .ws, .zm, .zw, .xc, .ps_gaza_strip
{ fill: #ec8028; }

/* Illegal, life imprisonment */
.bb, .bd, .gy, .mm, .pk, .sl, .tz, .ug
{ fill: #e73e21; }

/* Illegal, death penalty */
.ae, .af, .ir, .mr, .sa, .sd, .ye
{ fill: #8c201f; }

/* SUB-NATIONAL UNITS */

/* Same-sex marriage */
.br_al, .mx_dif, .us_ct, .us_dc, .us_ia, .us_ma, .us_md, .us_nh, .us_ny, .us_vt, .us_wa
{ fill: #002255; }

/* Civil unions etc. */
.mx_coa, .uk_je, .us_ca, .us_co, .us_de, .us_hi, .us_il, .us_me, .us_nj, .us_nv, .us_or, .us_ri, .us_wi, .ve_l
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.bq
{ fill: #7fbcff; }

/* Illegal, large penalty */
.id_ac
{ fill: #ec8028; }

/* Illegal, death penalty */
.ng_sharia, .so_shabaab
{ fill: #8c201f; }</style><path d="m20039 4851.4c0 240.49-194.94 435.43-435.43 435.43h-20030c-240.48 0-435.43-194.93-435.43-435.43v-4354.3c0-240.48 194.94-435.43 435.43-435.43h20030c240.49 0 435.43 194.95 435.43 435.43v4354.3z" fill="#fff" fill-rule="nonzero" stroke="#000" stroke-linejoin="miter" stroke-miterlimit="4" stroke-width="32.254"/><path d="m19748 4851.4c0 80.03-65.112 145.14-145.14 145.14h-20030c-80.032 0-145.14-65.112-145.14-145.14v-4354.3c0-80.032 65.11-145.14 145.14-145.14h20030c80.03 0 145.14 65.11 145.14 145.14v4354.3zm-145.14-4680.8h-20030c-180.07 0-326.57 146.5-326.57 326.57v4354.3c0 180.06 146.5 326.57 326.57 326.57h20030c180.06 0 326.57-146.51 326.57-326.57v-4354.3c0-180.07-146.51-326.57-326.57-326.57z" fill="#000" fill-rule="nonzero"/><path d="m1179.7 2205.8-163.39 668.17h334.96l-171.57-668.17zm416.64 1629.7-163.39-635.57h-498.33l-155.22 635.57h-334.95l580.02-2322.3h326.79l580.02 2322.3h-334.95z" fill="#000" fill-rule="nonzero"/><path d="m2256.5 3835.4v-2322.3h335.05v2012.6h849.89v309.64h-1184.9z" fill="#000" fill-rule="nonzero"/><path d="m3766.5 3835.4v-2322.3h335.04v2012.6h849.89v309.64h-1184.9z" fill="#000" fill-rule="nonzero"/><path d="m12615 3835.4-715.59-1556.3v1556.3h-333.38v-2322.3h333.38l634.27 1393.4v-1393.4h333.38v2322.3h-252.06z" fill="#000" fill-rule="nonzero"/><path d="m10545 1839.1h-341.53v586.68h341.53c195.14 0 300.85-105.93 300.85-293.34 0-179.26-121.96-293.34-300.85-293.34zm284.6 1996.4-308.99-1091.9h-317.14v1091.9h-333.42v-2322.3h691.2c365.92 0 609.88 244.45 609.88 619.27 0 277.04-113.86 480.75-333.38 562.24l333.38 1140.8h-341.53z" fill="#000" fill-rule="nonzero"/><path d="m13923 2763c-100.47-65.088-198.04-130.4-260.33-174.23-187.19-131.79-286.37-309.63-286.37-513.35 0-334.08 261.86-602.97 597.34-602.97 327.3 0 580.97 252.6 589.16 602.97h-319.15c-8.144-162.96-122.73-268.89-270-268.89-155.46 0-278.23 114.08-278.23 268.89 0 114.09 49.107 179.27 220.94 277.06 450.06 260.74 646.45 513.34 646.45 847.42 0 374.83-286.41 676.32-646.45 