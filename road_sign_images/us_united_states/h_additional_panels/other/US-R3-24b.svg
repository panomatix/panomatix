<svg width="6490" height="1630" version="1.1" viewBox="82.992 45.607 19011 5257.4" xmlns="http://www.w3.org/2000/svg"><style type="text/css">/*
 * Below are Cascading Style Sheet (CSS) definitions in use in this file,
 * which allow easily changing how countries are displayed.
 *
 */

/*
 * Circles around small countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.circlexx
{
   opacity:1;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * Smaller circles around French DOMs and Chinese SARs
 *
 * Change opacity to 1 to display all subnational circles.
 *
 */
.subxx
{
   opacity:1;
   stroke-width:0.3;
}

/*
 * Circles around small, unrecognized countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.unxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.3;
}

/*
 * Circles around small countries, but with no permanent residents 
 *
 * Change opacity to 1 to display all circles.
 *
 */
.noxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * land
 */
.landxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.5;
   fill-rule:evenodd;
}

/*
 * Styles for coastlines of islands with no borders
 */
.coastxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.3;
   fill-rule:evenodd;
}

/*
 * Styles for nations with limited recognition
 */
.limitxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Styles for nations with no permanent population.
 */
.antxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Ocean
 */
.oceanxx
{
   opacity: 1;
   color: #000000;
   fill:#ffffff;
   stroke:#000;
   stroke-width:0.5;
   stroke-miterlimit:1;
}

/*
 * Additional style rules
 *
 * The following are examples of colouring countries.  You can substitute these with your own styles to colour the countries on the map.
 *
 * Color a few countries:
 *
 * .gb, .au, .nc
 * {
 *    fill:       #ff0000;
 * }
 *
 * Color a few small country circles (and the countries):
 *
 * .ms, .ky
 * {
 *    opacity:    1;
 *    fill:       #ff0000;
 * }
 *
 */

/* Same-sex marriage */
.ar, .be, .ca, .dk, .es, .is, .nl, .no, .pt, .se, .za
{ fill: #002255; }

/* Civil unions etc. */
.ad, .at, .au, .bl, .br, .ch, .co, .cz, .de, .ec, .fi, .fr, .gb, .gf, .gl, .hr, .hu, .ie, .il, .im, .je, .li, .lu, .mf, .nc, .nf, .nz, .pm, .re, .si, .uy, .wf
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.aw, .cw, .sx, .mx
{ fill: #7fbcff; }

/* Legal but no recognition */
.ai, .al, .am, .as, .az, .ba, .bg, .bf, .by, .bj, .bm, .bo, .bs, .cd, .cg, .cf, .ci, .cl, .cn, .cr, .cu, .cv, .cy, .dj, .do, .ee, .fk, .fj, .fm, .fo, .ga, .ge, .gg, .gi, .gq, .gr, .gs, .gt, .gu, .gw, .hn, .ht, .id, .in, .iq, .it, .jo, .jp, .kg, .kh, .kp, .kr, .ky, .kz, .la, .lk, .lt, .lv, .mc, .md, .me, .mg, .mh, .mk, .ml, .mn, .mp, .mt, .ms, .mz, .ne, .ni, .np, .pa, .pe, .pf, .ph, .pl, .pn, .pr, .py, .ro, .rs, .ru, .rw, .sh, .sk, .sm, .sr, .st, .sv, .tc, .td, .th, .tj, .tk, .tl, .tr, .tw, .ua, .us, .va, .ve, .vg, .vi, .vn, .vu, .xk, .ps_west_bank
{ fill: #cccccc; }

/* Illegal, minimal penalty */
.bt, .lb, .lr
{ fill: #f9dc36; }

/* Illegal, large penalty */
.ag, .ao, .bh, .bi, .bn, .bw, .bz, .cm, .ck, .dm, .dz, .eg, .eh, .er, .et, .gd, .gh, .gm, .gn, .jm, .ke, .ki, .km, .kn, .kw, .lc, .ls, .ly, .ma, .mu, .mv, .mw, .my, .na, .ng, .nr, .nu, .om, .pg, .pw, .qa, .sb, .sc, .sg, .sn, .so, .ss, .sy, .sz, .tg, .tm, .tn, .to, .tt, .tv, .uz, .vc, .ws, .zm, .zw, .xc, .ps_gaza_strip
{ fill: #ec8028; }

/* Illegal, life imprisonment */
.bb, .bd, .gy, .mm, .pk, .sl, .tz, .ug
{ fill: #e73e21; }

/* Illegal, death penalty */
.ae, .af, .ir, .mr, .sa, .sd, .ye
{ fill: #8c201f; }

/* SUB-NATIONAL UNITS */

/* Same-sex marriage */
.br_al, .mx_dif, .us_ct, .us_dc, .us_ia, .us_ma, .us_md, .us_nh, .us_ny, .us_vt, .us_wa
{ fill: #002255; }

/* Civil unions etc. */
.mx_coa, .uk_je, .us_ca, .us_co, .us_de, .us_hi, .us_il, .us_me, .us_nj, .us_nv, .us_or, .us_ri, .us_wi, .ve_l
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.bq
{ fill: #7fbcff; }

/* Illegal, large penalty */
.id_ac
{ fill: #ec8028; }

/* Illegal, death penalty */
.ng_sharia, .so_shabaab
{ fill: #8c201f; }</style><path d="m20039 4851.4c0 240.49-194.93 435.43-435.43 435.43h-20030c-240.48 0-435.43-194.93-435.43-435.43v-4354.3c0-240.48 194.94-435.43 435.43-435.43h20030c240.49 0 435.43 194.95 435.43 435.43v4354.3z" fill="#fff" fill-rule="nonzero" stroke="#000" stroke-linejoin="miter" stroke-miterlimit="4" stroke-width="32.254"/><path d="m19748 4851.4c0 80.03-65.113 145.14-145.14 145.14h-20030c-80.032 0-145.14-65.112-145.14-145.14v-4354.3c0-80.032 65.11-145.14 145.14-145.14h20030c80.03 0 145.14 65.11 145.14 145.14v4354.3zm-145.14-4680.8h-20030c-180.07 0-326.57 146.5-326.57 326.57v4354.3c0 180.06 146.5 326.57 326.57 326.57h20030c180.06 0 326.57-146.51 326.57-326.57v-4354.3c0-180.07-146.51-326.57-326.57-326.57z" fill="#000" fill-rule="nonzero"/><path d="m12605 3835.4-888.23-1572.6v1572.6h-366.68v-2322.3h366.68l847.47 1483v-1483h366.73v2322.3h-325.96z" fill="#000" fill-rule="nonzero"/><path d="m8710.9 3485.1c-122.24 228.16-399.3 391.12-684.51 391.12-285.2 0-562.31-162.97-684.51-391.12-65.193-138.51-105.95-301.48-105.95-480.75v-1491.1h366.69v1491.1c0 301.5 171.15 497.05 423.78 497.05s423.73-195.56 423.73-497.05v-1491.1h366.69v1491.1c0 179.27-40.72 342.24-105.91 480.75z" fill="#000" fill-rule="nonzero"/><path d="m6347.5 1839.1v1996.3h-368.22v-1996.3h-531.99v-325.94h1440.4v325.94h-540.17z" fill="#000" fill-rule="nonzero"/><path d="m10393 1920.6c-57.009-32.601-89.625-40.745-211.87-40.745h-440.06v570.38h440.06c114.1 0 154.86-8.1441 211.87-40.729 89.666-48.901 146.72-146.68 146.72-244.45 0-97.786-57.049-195.57-146.72-244.46zm163 1914.9-374.87-1010.4h-440.06v1010.4h-366.65v-2322.3h765.95c179.29 0 301.53 16.3 415.63 73.341 203.72 97.786 350.4 342.23 350.4 578.54 0 244.45-146.68 488.89-358.54 586.68l407.45 1083.7h-399.3z" fill="#000" fill-rule="nonzero"/><path d="m2183.9 3876.2c-548.29 0-941.1-407.41-941.1-977.8v-1385.2h417.36v1385.2c0 138.53 16.369 211.86 73.652 301.49 90.016 154.82 261.87 252.6 450.09 252.6s360.07-97.778 450.09-252.6c57.291-89.634 73.656-171.11 73