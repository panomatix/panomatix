<svg width="5410" height="2170" version="1.1" viewBox="82.992 45.607 15847 6999.1" xmlns="http://www.w3.org/2000/svg"><style type="text/css">/*
 * Below are Cascading Style Sheet (CSS) definitions in use in this file,
 * which allow easily changing how countries are displayed.
 *
 */

/*
 * Circles around small countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.circlexx
{
   opacity:1;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * Smaller circles around French DOMs and Chinese SARs
 *
 * Change opacity to 1 to display all subnational circles.
 *
 */
.subxx
{
   opacity:1;
   stroke-width:0.3;
}

/*
 * Circles around small, unrecognized countries
 *
 * Change opacity to 1 to display all circles.
 *
 */
.unxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.3;
}

/*
 * Circles around small countries, but with no permanent residents 
 *
 * Change opacity to 1 to display all circles.
 *
 */
.noxx
{
   opacity:0;
   fill:#e0e0e0;
   stroke:#000000;
   stroke-width:0.5;
}

/*
 * land
 */
.landxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.5;
   fill-rule:evenodd;
}

/*
 * Styles for coastlines of islands with no borders
 */
.coastxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0.3;
   fill-rule:evenodd;
}

/*
 * Styles for nations with limited recognition
 */
.limitxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Styles for nations with no permanent population.
 */
.antxx
{
   fill: #e0e0e0;
   stroke:#ffffff;
   stroke-width:0;
   fill-rule:evenodd;
}

/*
 * Ocean
 */
.oceanxx
{
   opacity: 1;
   color: #000000;
   fill:#ffffff;
   stroke:#000;
   stroke-width:0.5;
   stroke-miterlimit:1;
}

/*
 * Additional style rules
 *
 * The following are examples of colouring countries.  You can substitute these with your own styles to colour the countries on the map.
 *
 * Color a few countries:
 *
 * .gb, .au, .nc
 * {
 *    fill:       #ff0000;
 * }
 *
 * Color a few small country circles (and the countries):
 *
 * .ms, .ky
 * {
 *    opacity:    1;
 *    fill:       #ff0000;
 * }
 *
 */

/* Same-sex marriage */
.ar, .be, .ca, .dk, .es, .is, .nl, .no, .pt, .se, .za
{ fill: #002255; }

/* Civil unions etc. */
.ad, .at, .au, .bl, .br, .ch, .co, .cz, .de, .ec, .fi, .fr, .gb, .gf, .gl, .hr, .hu, .ie, .il, .im, .je, .li, .lu, .mf, .nc, .nf, .nz, .pm, .re, .si, .uy, .wf
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.aw, .cw, .sx, .mx
{ fill: #7fbcff; }

/* Legal but no recognition */
.ai, .al, .am, .as, .az, .ba, .bg, .bf, .by, .bj, .bm, .bo, .bs, .cd, .cg, .cf, .ci, .cl, .cn, .cr, .cu, .cv, .cy, .dj, .do, .ee, .fk, .fj, .fm, .fo, .ga, .ge, .gg, .gi, .gq, .gr, .gs, .gt, .gu, .gw, .hn, .ht, .id, .in, .iq, .it, .jo, .jp, .kg, .kh, .kp, .kr, .ky, .kz, .la, .lk, .lt, .lv, .mc, .md, .me, .mg, .mh, .mk, .ml, .mn, .mp, .mt, .ms, .mz, .ne, .ni, .np, .pa, .pe, .pf, .ph, .pl, .pn, .pr, .py, .ro, .rs, .ru, .rw, .sh, .sk, .sm, .sr, .st, .sv, .tc, .td, .th, .tj, .tk, .tl, .tr, .tw, .ua, .us, .va, .ve, .vg, .vi, .vn, .vu, .xk, .ps_west_bank
{ fill: #cccccc; }

/* Illegal, minimal penalty */
.bt, .lb, .lr
{ fill: #f9dc36; }

/* Illegal, large penalty */
.ag, .ao, .bh, .bi, .bn, .bw, .bz, .cm, .ck, .dm, .dz, .eg, .eh, .er, .et, .gd, .gh, .gm, .gn, .jm, .ke, .ki, .km, .kn, .kw, .lc, .ls, .ly, .ma, .mu, .mv, .mw, .my, .na, .ng, .nr, .nu, .om, .pg, .pw, .qa, .sb, .sc, .sg, .sn, .so, .ss, .sy, .sz, .tg, .tm, .tn, .to, .tt, .tv, .uz, .vc, .ws, .zm, .zw, .xc, .ps_gaza_strip
{ fill: #ec8028; }

/* Illegal, life imprisonment */
.bb, .bd, .gy, .mm, .pk, .sl, .tz, .ug
{ fill: #e73e21; }

/* Illegal, death penalty */
.ae, .af, .ir, .mr, .sa, .sd, .ye
{ fill: #8c201f; }

/* SUB-NATIONAL UNITS */

/* Same-sex marriage */
.br_al, .mx_dif, .us_ct, .us_dc, .us_ia, .us_ma, .us_md, .us_nh, .us_ny, .us_vt, .us_wa
{ fill: #002255; }

/* Civil unions etc. */
.mx_coa, .uk_je, .us_ca, .us_co, .us_de, .us_hi, .us_il, .us_me, .us_nj, .us_nv, .us_or, .us_ri, .us_wi, .ve_l
{ fill: #0066ff; }

/* Recognition of foreign marriages */
.bq
{ fill: #7fbcff; }

/* Illegal, large penalty */
.id_ac
{ fill: #ec8028; }

/* Illegal, death penalty */
.ng_sharia, .so_shabaab
{ fill: #8c201f; }</style><path d="m16715 6593.1c0 240.49-194.94 435.43-435.43 435.43h-16546c-240.48 0-435.43-194.93-435.43-435.43v-6096c0-240.48 194.94-435.43 435.43-435.43h16546c240.49 0 435.43 194.95 435.43 435.43v6096z" fill="#fff" fill-rule="nonzero" stroke="#000" stroke-linejoin="miter" stroke-miterlimit="4" stroke-width="32.254"/><path d="m-266.44 6919.7c-180.07 0-326.57-146.51-326.57-326.57v-6096c0-180.07 146.5-326.57 326.57-326.57h16546c180.06 0 326.57 146.5 326.57 326.57v6096c0 180.06-146.51 326.57-326.57 326.57h-16546z" fill="#000" fill-rule="nonzero"/><path d="m-266.44 6738.3c-80.032 0-145.14-65.112-145.14-145.14v-6096c0-80.032 65.11-145.14 145.14-145.14h16546c80.03 0 145.14 65.11 145.14 145.14v6096c0 80.03-65.112 145.14-145.14 145.14h-16546z" fill="#fff" fill-rule="nonzero"/><path d="m8180 5722.3-536.7-1167.3v1167.3h-250.05v-1741.7h250.05l475.7 1045v-1045h250.05v1741.7h-189.05z" fill="#000" fill-rule="nonzero"/><path d="m6627.5 4225h-256.14v440.02h256.14c146.39 0 225.66-79.465 225.66-220.01 0-134.46-91.48-220.01-225.66-220.01zm213.48 1497.3-231.74-818.92h-237.87v818.92h-250.05v-1741.7h518.4c274.44 0 457.4 183.33 457.4 464.46 0 207.8-85.392 360.56-250.05 421.68l250.05 855.57h-256.14z" fill="#000" fill-rule="nonzero"/><path d="m9161.1 4917.9c-75.353-48.824-148.53-97.81-195.22-130.71-140.43-98.818-214.81-232.23-214.81-384.99 0-250.57 196.39-452.24 448.01-452.24 245.49 0 435.71 189.45 441.88 452.24h-239.36c-6.1283-122.24-92.044-201.67-202.51-201.67-116.6 0-208.64 85.553-208.64 201.67 0 85.553 36.81 134.46 165.66 207.8 337.54 195.54 484.86 384.99 484.86 635.56 0 281.09-214.81 507.23-484.86 507.23-306.86 0-490.94-256.66-490.94-543.92h245.49c0 146.67 73.619 299.48 245.45 299.48 135.02 0 245.49-122.24 245.49-262.79 0-109.14-45.115-201.06-240.49-327.66z" fill="#000" fill-rule="nonzero"/><path d="m4199.8 4212.8v1509.5h-251.3v-1509.5h-318.71v-232.23h888.71v232.23h-318.71z" fill="#000" fill-rule="nonzero"/><path d="m5671.1 5508.4c-85.392 140.55-250.05 244.44-414.7 